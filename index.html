98/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> of one draw. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>S</mi><mi>n</mi></msub><annotation encoding=\"application/x-tex\">S_n</annotation></semantics></math> is the sum of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n</mi><annotation encoding=\"application/x-tex\">n</annotation></semantics></math> independent draws and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mover><mi>X</mi><mo accent=\"true\">‾</mo></mover><annotation encoding=\"application/x-tex\">\\bar X</annotation></semantics></math> their mean. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>K</mi><annotation encoding=\"application/x-tex\">K</annotation></semantics></math> counts successes, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>p</mi><annotation encoding=\"application/x-tex\">p</annotation></semantics></math> is the success probability and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mover><mi>p</mi><mo accent=\"true\">̂</mo></mover><annotation encoding=\"application/x-tex\">\\hat p</annotation></semantics></math> the observed proportion. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SE}</annotation></semantics></math> is standard error.</p> <p><strong>One draw</strong><br/> <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>μ</mi><mo>=</mo><munder><mo>∑</mo><mi>j</mi></munder><msub><mi>p</mi><mi>j</mi></msub><msub><mi>x</mi><mi>j</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\mu=\\sum_jp_jx_j</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>σ</mi><mn>2</mn></msup><mo>=</mo><munder><mo>∑</mo><mi>j</mi></munder><msub><mi>p</mi><mi>j</mi></msub><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><msub><mi>x</mi><mi>j</mi></msub><mo>−</mo><mi>μ</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mn>2</mn></msup><mo>=</mo><munder><mo>∑</mo><mi>j</mi></munder><msub><mi>p</mi><mi>j</mi></msub><msubsup><mi>x</mi><mi>j</mi><mn>2</mn></msubsup><mo>−</mo><msup><mi>μ</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">\\sigma^2=\\sum_jp_j(x_j-\\mu)^2=\\sum_jp_jx_j^2-\\mu^2</annotation></semantics></math>. The chance error is the observed value minus the expected value.</p> <p><strong>Independent draws</strong><br/> <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><msub><mi>S</mi><mi>n</mi></msub><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mo>=</mo><mi>n</mi><mi>μ</mi></mrow><annotation encoding=\"application/x-tex\">E(S_n)=n\\mu</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>S</mi><mi>E</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><msub><mi>S</mi><mi>n</mi></msub><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mo>=</mo><msqrt><mi>n</mi></msqrt><mi>σ</mi></mrow><annotation encoding=\"application/x-tex\">SE(S_n)=\\sqrt n\\sigma</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mover><mi>X</mi><mo accent=\"true\">‾</mo></mover><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mo>=</mo><mi>μ</mi></mrow><annotation encoding=\"application/x-tex\">E(\\bar X)=\\mu</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>S</mi><mi>E</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mover><mi>X</mi><mo accent=\"true\">‾</mo></mover><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mo>=</mo><mfrac><mi>σ</mi><msqrt><mi>n</mi></msqrt></mfrac></mrow><annotation encoding=\"application/x-tex\">SE(\\bar X)=\\frac{\\sigma}{\\sqrt n}</annotation></semantics></math>. When draws are independent, the variance of their sum is the sum of their variances.</p> <p><strong>Binary box</strong><br/> <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>μ</mi><mo>=</mo><mi>p</mi></mrow><annotation encoding=\"application/x-tex\">\\mu=p</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>σ</mi><mo>=</mo><msqrt><mrow><mi>p</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mn>1</mn><mo>−</mo><mi>p</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow></msqrt></mrow><annotation encoding=\"application/x-tex\">\\sigma=\\sqrt{p(1-p)}</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>S</mi><mi>E</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>K</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mo>=</mo><msqrt><mrow><mi>n</mi><mi>p</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mn>1</mn><mo>−</mo><mi>p</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow></msqrt></mrow><annotation encoding=\"application/x-tex\">SE(K)=\\sqrt{np(1-p)}</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>S</mi><mi>E</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mover><mi>p</mi><mo accent=\"true\">̂</mo></mover><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mo>=</mo><msqrt><mfrac><mrow><mi>p</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mn>1</mn><mo>−</mo><mi>p</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><mi>n</mi></mfrac></msqrt></mrow><annotation encoding=\"application/x-tex\">SE(\\hat p)=\\sqrt{\\frac{p(1-p)}{n}}</annotation></semantics></math>. To approximate the chance that a whole-number count is anywhere from a to <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>b</mi><annotation encoding=\"application/x-tex\">b</annotation></semantics></math> inclusive, find the normal area between the boundaries <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>−</mo><mn>0.5</mn><mo>,</mo><mi>b</mi><mo>+</mo><mn>0.5</mn></mrow><annotation encoding=\"application/x-tex\">a-0.5,b+0.5</annotation></semantics></math>.</p>","<p><strong>Notation.</strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n</mi><annotation encoding=\"application/x-tex\">n</annotation></semantics></math> is the number of independent draws. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>μ</mi><annotation encoding=\"application/x-tex\">\\mu</annotation></semantics></math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>σ</mi><annotation encoding=\"application/x-tex\">\\sigma</annotation></semantics></math> describe one draw. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mover><mi>X</mi><mo accent=\"true\">‾</mo></mover><annotation encoding=\"application/x-tex\">\\bar X</annotation></semantics></math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>S</mi><mi>n</mi></msub><annotation encoding=\"application/x-tex\">S_n</annotation></semantics></math> are the sample mean and total. For binary draws <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>K</mi><annotation encoding=\"application/x-tex\">K</annotation></semantics></math> counts successes, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>p</mi><annotation encoding=\"application/x-tex\">p</annotation></semantics></math> is their true probability and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mover><mi>p</mi><mo accent=\"true\">̂</mo></mover><annotation encoding=\"application/x-tex\">\\hat p</annotation></semantics></math> is the sample proportion. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>Z</mi><annotation encoding=\"application/x-tex\">Z</annotation></semantics></math> is the distance of a result from its expected value, measured in standard errors.</p> <p><strong>CLT for means and totals</strong><br/> <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Z</mi><mo>=</mo><mfrac><mrow><mover><mi>X</mi><mo accent=\"true\">‾</mo></mover><mo>−</mo><mi>μ</mi></mrow><mfrac><mi>σ</mi><msqrt><mi>n</mi></msqrt></mfrac></mfrac><mo>=</mo><mfrac><mrow><msub><mi>S</mi><mi>n</mi></msub><mo>−</mo><mi>n</mi><mi>μ</mi></mrow><mrow><msqrt><mi>n</mi></msqrt><mi>σ</mi></mrow></mfrac><mspace width=\"0.222em\"></mspace><mover><mo>∼</mo><mo accent=\"true\">̇</mo></mover><mspace width=\"0.222em\"></mspace><mi>N</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mn>0</mn><mo>,</mo><mn>1</mn><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">Z=\\frac{\\bar X-\\mu}{\\frac{\\sigma}{\\sqrt n}}=\\frac{S_n-n\\mu}{\\sqrt n\\sigma}\\ \\mathrel{\\dot\\sim}\\ N(0,1)</annotation></semantics></math>. This needs independent draws from the same distribution, with a variance that is finite and not zero. How good the approximation is depends on the sample size and on the shape of that distribution.</p> <p><strong>Counts and proportions</strong><br/> <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Z</mi><mo>=</mo><mfrac><mrow><mi>K</mi><mo>−</mo><mi>n</mi><mi>p</mi></mrow><msqrt><mrow><mi>n</mi><mi>p</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mn>1</mn><mo>−</mo><mi>p</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow></msqrt></mfrac><mo>=</mo><mfrac><mrow><mover><mi>p</mi><mo accent=\"true\">̂</mo></mover><mo>−</mo><mi>p</mi></mrow><msqrt><mfrac><mrow><mi>p</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mn>1</mn><mo>−</mo><mi>p</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><mi>n</mi></mfrac></msqrt></mfrac></mrow><annotation encoding=\"application/x-tex\">Z=\\frac{K-np}{\\sqrt{np(1-p)}}=\\frac{\\hat p-p}{\\sqrt{\\frac{p(1-p)}{n}}}</annotation></semantics></math>. Before relying on the normal approximation, check that the expected numbers of successes and failures are both large enough.</p> <p><strong>Long-run behaviour</strong><br/> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mover><mi>p</mi><mo accent=\"true\">̂</mo></mover><mi>n</mi></msub><mo>=</mo><mfrac><msub><mi>K</mi><mi>n</mi></msub><mi>n</mi></mfrac><mo>→</mo><mi>p</mi></mrow><annotation encoding=\"application/x-tex\">\\hat p_n=\\frac{K_n}{n}\\to p</annotation></semantics></math>. The <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SE}</annotation></semantics></math> of the count grows in proportion to <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msqrt><mi>n</mi></msqrt><annotation encoding=\"application/x-tex\">\\sqrt n</annotation></semantics></math>, while the <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SE}</annotation></semantics></math> of the proportion shrinks in proportion to <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mn>1</mn><msqrt><mi>n</mi></msqrt></mfrac><annotation encoding=\"application/x-tex\">\\frac{1}{\\sqrt n}</annotation></semantics></math>.</p>","<p><strong>Notation.</strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>α</mi><annotation encoding=\"application/x-tex\">\\alpha</annotation></semantics></math> is the total probability left outside the interval, counting both tails. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msup><mi>z</mi><mo>*</mo></msup><annotation encoding=\"application/x-tex\">z^*</annotation></semantics></math> is the positive cutoff that leaves half of that probability in each tail. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n</mi><annotation encoding=\"application/x-tex\">n</annotation></semantics></math> is the sample size, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>p</mi><annotation encoding=\"application/x-tex\">p</annotation></semantics></math> is a possible value of the population proportion, and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mover><mi>p</mi><mo accent=\"true\">̂</mo></mover><annotation encoding=\"application/x-tex\">\\hat p</annotation></semantics></math> is the sample proportion. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>D</mi><annotation encoding=\"application/x-tex\">D</annotation></semantics></math> is the denominator and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>C</mi><annotation encoding=\"application/x-tex\">C</annotation></semantics></math> is the centre of the Wilson interval. For an interval for a mean, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>σ</mi><annotation encoding=\"application/x-tex\">\\sigma</annotation></semantics></math> is the known population <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M</mi><annotation encoding=\"application/x-tex\">M</annotation></semantics></math> is the margin of error you want.</p> <p><strong>Prediction and confidence</strong><br/> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>z</mi><mo>*</mo></msup><mo>=</mo><msup><mi>Φ</mi><mrow><mi>−</mi><mn>1</mn></mrow></msup><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mn>1</mn><mo>−</mo><mfrac><mi>α</mi><mn>2</mn></mfrac><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">z^*=\\Phi^{-1}(1-\\frac{\\alpha}{2})</annotation></semantics></math>. When <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>p</mi><annotation encoding=\"application/x-tex\">p</annotation></semantics></math> is known, a future sample proportion is likely to fall in <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>±</mo><msup><mi>z</mi><mo>*</mo></msup><msqrt><mfrac><mrow><mi>p</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mn>1</mn><mo>−</mo><mi>p</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><mi>n</mi></mfrac></msqrt></mrow><annotation encoding=\"application/x-tex\">p\\pm z^*\\sqrt{\\frac{p(1-p)}{n}}</annotation></semantics></math>. When the population <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> is known, a confidence interval for the mean is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover><mi>x</mi><mo accent=\"true\">‾</mo></mover><mo>±</mo><msup><mi>z</mi><mo>*</mo></msup><mfrac><mi>σ</mi><msqrt><mi>n</mi></msqrt></mfrac></mrow><annotation encoding=\"application/x-tex\">\\bar x\\pm z^*\\frac{\\sigma}{\\sqrt n}</annotation></semantics></math>.</p> <p><strong>Wilson score interval</strong><br/> <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>D</mi><mo>=</mo><mn>1</mn><mo>+</mo><mfrac><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><msup><mi>z</mi><mo>*</mo></msup><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mn>2</mn></msup><mi>n</mi></mfrac></mrow><annotation encoding=\"application/x-tex\">D=1+\\frac{(z^*)^2}{n}</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C</mi><mo>=</mo><mfrac><mrow><mover><mi>p</mi><mo accent=\"true\">̂</mo></mover><mo>+</mo><mfrac><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><msup><mi>z</mi><mo>*</mo></msup><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mn>2</mn></msup><mrow><mn>2</mn><mi>n</mi></mrow></mfrac></mrow><mi>D</mi></mfrac></mrow><annotation encoding=\"application/x-tex\">C=\\frac{\\hat p+\\frac{(z^*)^2}{2n}}{D}</annotation></semantics></math>. The endpoints are <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C</mi><mo>±</mo><mfrac><msup><mi>z</mi><mo>*</mo></msup><mi>D</mi></mfrac><msqrt><mrow><mfrac><mrow><mover><mi>p</mi><mo accent=\"true\">̂</mo></mover><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mn>1</mn><mo>−</mo><mover><mi>p</mi><mo accent=\"true\">̂</mo></mover><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><mi>n</mi></mfrac><mo>+</mo><mfrac><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><msup><mi>z</mi><mo>*</mo></msup><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mn>2</mn></msup><mrow><mn>4</mn><msup><mi>n</mi><mn>2</mn></msup></mrow></mfrac></mrow></msqrt></mrow><annotation encoding=\"application/x-tex\">C\\pm\\frac{z^*}{D}\\sqrt{\\frac{\\hat p(1-\\hat p)}{n}+\\frac{(z^*)^2}{4n^2}}</annotation></semantics></math>. The same interval is the set of values of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>p</mi><annotation encoding=\"application/x-tex\">p</annotation></semantics></math> whose prediction interval contains the observed proportion.</p> <p><strong>Planning and coverage</strong><br/> <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>n</mi><mo>min</mo></msub><mo>=</mo><mo form=\"prefix\" stretchy=\"false\">⌈</mo><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mfrac><mrow><msup><mi>z</mi><mo>*</mo></msup><mi>σ</mi></mrow><mi>M</mi></mfrac><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mn>2</mn></msup><mo form=\"postfix\" stretchy=\"false\">⌉</mo></mrow><annotation encoding=\"application/x-tex\">n_{\\min}=\\lceil(\\frac{z^*\\sigma}{M})^2\\rceil</annotation></semantics></math> This is the smallest sample size that gives the mean a margin of error of at most <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>M</mi><annotation encoding=\"application/x-tex\">M</annotation></semantics></math>. The full width of the interval is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mi>M</mi></mrow><annotation encoding=\"application/x-tex\">2M</annotation></semantics></math>. The estimated coverage is the proportion of simulated intervals that contain the true parameter.</p>","<p><strong>Notation.</strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>p</mi><mn>0</mn></msub><annotation encoding=\"application/x-tex\">p_0</annotation></semantics></math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>μ</mi><mn>0</mn></msub><annotation encoding=\"application/x-tex\">\\mu_0</annotation></semantics></math> denote the proportion or mean claimed under the null. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mover><mi>p</mi><mo accent=\"true\">̂</mo></mover><annotation encoding=\"application/x-tex\">\\hat p</annotation></semantics></math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mover><mi>x</mi><mo accent=\"true\">‾</mo></mover><annotation encoding=\"application/x-tex\">\\bar x</annotation></semantics></math> are the sample estimates; <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>σ</mi><annotation encoding=\"application/x-tex\">\\sigma</annotation></semantics></math> is the known population <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> for a mean <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>Z</mi><annotation encoding=\"application/x-tex\">Z</annotation></semantics></math>-test. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n</mi><annotation encoding=\"application/x-tex\">n</annotation></semantics></math> is the sample size, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>Φ</mi><annotation encoding=\"application/x-tex\">\\Phi</annotation></semantics></math> gives the area to the left under the standard normal curve, and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>α</mi><annotation encoding=\"application/x-tex\">\\alpha</annotation></semantics></math> is the significance level. A <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>p</mi><annotation encoding=\"application/x-tex\">p</annotation></semantics></math>-value is a tail probability worked out assuming the null is true.</p> <p><strong>Null standardisation</strong><br/> <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>Z</mi><mi>p</mi></msub><mo>=</mo><mfrac><mrow><mover><mi>p</mi><mo accent=\"true\">̂</mo></mover><mo>−</mo><msub><mi>p</mi><mn>0</mn></msub></mrow><msqrt><mfrac><mrow><msub><mi>p</mi><mn>0</mn></msub><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mn>1</mn><mo>−</mo><msub><mi>p</mi><mn>0</mn></msub><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><mi>n</mi></mfrac></msqrt></mfrac></mrow><annotation encoding=\"application/x-tex\">Z_p=\\frac{\\hat p-p_0}{\\sqrt{\\frac{p_0(1-p_0)}{n}}}</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>Z</mi><mi>μ</mi></msub><mo>=</mo><mfrac><mrow><mover><mi>x</mi><mo accent=\"true\">‾</mo></mover><mo>−</mo><msub><mi>μ</mi><mn>0</mn></msub></mrow><mfrac><mi>σ</mi><msqrt><mi>n</mi></msqrt></mfrac></mfrac></mrow><annotation encoding=\"application/x-tex\">Z_\\mu=\\frac{\\bar x-\\mu_0}{\\frac{\\sigma}{\\sqrt n}}</annotation></semantics></math>. For a proportion, the standard error is worked out from the null value of the proportion. For a mean, it uses the known population <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math>.</p> <p><strong>Alternative and tail</strong><br/> <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>p</mi><mrow><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">t</mi></mrow></msub><mo>=</mo><mi>Φ</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>z</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">p_{\\mathrm{left}}=\\Phi(z)</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>p</mi><mrow><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">h</mi><mi mathvariant=\"normal\">t</mi></mrow></msub><mo>=</mo><mn>1</mn><mo>−</mo><mi>Φ</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>z</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">p_{\\mathrm{right}}=1-\\Phi(z)</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>p</mi><mrow><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">w</mi><mi mathvariant=\"normal\">o</mi></mrow></msub><mo>=</mo><mn>2</mn><mi>Φ</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>−</mi><mrow><mo form=\"prefix\" stretchy=\"true\">|</mo><mi>z</mi><mo form=\"postfix\" stretchy=\"true\">|</mo></mrow><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">p_{\\mathrm{two}}=2\\Phi(-|z|)</annotation></semantics></math>. Reject when the <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>p</mi><annotation encoding=\"application/x-tex\">p</annotation></semantics></math>-value is at most the chosen significance level.</p> <p><strong>Count threshold</strong><br/> For a right-tail test, compare the count with <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><msub><mi>p</mi><mn>0</mn></msub><mo>+</mo><msub><mi>z</mi><mrow><mn>1</mn><mo>−</mo><mi>α</mi></mrow></msub><msqrt><mrow><mi>n</mi><msub><mi>p</mi><mn>0</mn></msub><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mn>1</mn><mo>−</mo><msub><mi>p</mi><mn>0</mn></msub><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow></msqrt></mrow><annotation encoding=\"application/x-tex\">np_0+z_{1-\\alpha}\\sqrt{np_0(1-p_0)}</annotation></semantics></math>. Counts are whole numbers, so the test rejects from the first whole number in the rejection region upwards. A two-sided test and a confidence interval give matching answers when both use the same null model and the same level.</p>","<p><strong>Notation.</strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mover><mi>x</mi><mo accent=\"true\">‾</mo></mover><annotation encoding=\"application/x-tex\">\\bar x</annotation></semantics></math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>s</mi><annotation encoding=\"application/x-tex\">s</annotation></semantics></math> are the sample mean and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> from <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n</mi><annotation encoding=\"application/x-tex\">n</annotation></semantics></math> observations. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>μ</mi><mn>0</mn></msub><annotation encoding=\"application/x-tex\">\\mu_0</annotation></semantics></math> is the null mean. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SE}</annotation></semantics></math> is the standard error of the mean, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">f</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{df}</annotation></semantics></math> stands for degrees of freedom, and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>F</mi><annotation encoding=\"application/x-tex\">F</annotation></semantics></math> with a <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">f</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{df}</annotation></semantics></math> subscript gives the area to the left under the <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>t</mi><annotation encoding=\"application/x-tex\">t</annotation></semantics></math> curve. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>B</mi><annotation encoding=\"application/x-tex\">B</annotation></semantics></math> is the number of resamples and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>b</mi><annotation encoding=\"application/x-tex\">b</annotation></semantics></math> labels one of them. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>L</mi><annotation encoding=\"application/x-tex\">L</annotation></semantics></math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>U</mi><annotation encoding=\"application/x-tex\">U</annotation></semantics></math> are the studentised bootstrap distribution’<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>s</mi><annotation encoding=\"application/x-tex\">s</annotation></semantics></math> lower and upper quantiles.</p> <p><strong>One-sample <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>t</mi><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></strong><br/> <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover><mrow><mi>S</mi><mi>E</mi></mrow><mo accent=\"true\">̂</mo></mover><mo>=</mo><mfrac><mi>s</mi><msqrt><mi>n</mi></msqrt></mfrac></mrow><annotation encoding=\"application/x-tex\">\\widehat{SE}=\\frac{s}{\\sqrt n}</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>=</mo><mfrac><mrow><mover><mi>x</mi><mo accent=\"true\">‾</mo></mover><mo>−</mo><msub><mi>μ</mi><mn>0</mn></msub></mrow><mover><mrow><mi>S</mi><mi>E</mi></mrow><mo accent=\"true\">̂</mo></mover></mfrac></mrow><annotation encoding=\"application/x-tex\">t=\\frac{\\bar x-\\mu_0}{\\widehat{SE}}</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi><mi>f</mi><mo>=</mo><mi>n</mi><mo>−</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">df=n-1</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C</mi><mi>I</mi><mo>=</mo><mover><mi>x</mi><mo accent=\"true\">‾</mo></mover><mo>±</mo><msub><mi>t</mi><mrow><mn>1</mn><mo>−</mo><mfrac><mi>α</mi><mn>2</mn></mfrac><mo>,</mo><mi>d</mi><mi>f</mi></mrow></msub><mover><mrow><mi>S</mi><mi>E</mi></mrow><mo accent=\"true\">̂</mo></mover></mrow><annotation encoding=\"application/x-tex\">CI=\\bar x\\pm t_{1-\\frac{\\alpha}{2},df}\\widehat{SE}</annotation></semantics></math>. These results are exact when the observations are independent and come from a normal population.</p> <p><strong>Tails</strong><br/> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>p</mi><mrow><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">w</mi><mi mathvariant=\"normal\">o</mi></mrow></msub><mo>=</mo><mn>2</mn><msub><mi>F</mi><mrow><mi>d</mi><mi>f</mi></mrow></msub><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>−</mi><mrow><mo form=\"prefix\" stretchy=\"true\">|</mo><mi>t</mi><mo form=\"postfix\" stretchy=\"true\">|</mo></mrow><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">p_{\\mathrm{two}}=2F_{df}(-|t|)</annotation></semantics></math>. For a left-sided alternative use <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>F</mi><mrow><mi>d</mi><mi>f</mi></mrow></msub><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>t</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">F_{df}(t)</annotation></semantics></math>, and for a right-sided alternative use <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mo>−</mo><msub><mi>F</mi><mrow><mi>d</mi><mi>f</mi></mrow></msub><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>t</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">1-F_{df}(t)</annotation></semantics></math>. In R, qt returns a cutoff and pt returns a tail area.</p> <p><strong>Studentised bootstrap</strong><br/> <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msubsup><mi>T</mi><mi>b</mi><mo>*</mo></msubsup><mo>=</mo><mfrac><mrow><msubsup><mover><mi>x</mi><mo accent=\"true\">‾</mo></mover><mi>b</mi><mo>*</mo></msubsup><mo>−</mo><mover><mi>x</mi><mo accent=\"true\">‾</mo></mover></mrow><mfrac><msubsup><mi>s</mi><mi>b</mi><mo>*</mo></msubsup><msqrt><mi>n</mi></msqrt></mfrac></mfrac></mrow><annotation encoding=\"application/x-tex\">T_b^*=\\frac{\\bar x_b^*-\\bar x}{\\frac{s_b^*}{\\sqrt n}}</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mover><mi>p</mi><mo accent=\"true\">̂</mo></mover><mrow><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">w</mi><mi mathvariant=\"normal\">o</mi></mrow></msub><mo>=</mo><mfrac><mrow><mi>#</mi><mo form=\"prefix\" stretchy=\"false\">{</mo><mrow><mo form=\"prefix\" stretchy=\"true\">|</mo><msubsup><mi>T</mi><mi>b</mi><mo>*</mo></msubsup><mo form=\"postfix\" stretchy=\"true\">|</mo></mrow><mo>≥</mo><mrow><mo form=\"prefix\" stretchy=\"true\">|</mo><msub><mi>t</mi><mrow><mi>o</mi><mi>b</mi><mi>s</mi></mrow></msub><mo form=\"postfix\" stretchy=\"true\">|</mo></mrow><mo form=\"postfix\" stretchy=\"false\">}</mo></mrow><mi>B</mi></mfrac></mrow><annotation encoding=\"application/x-tex\">\\hat p_{\\mathrm{two}}=\\frac{\\#\\{|T_b^*|\\ge |t_{obs}|\\}}{B}</annotation></semantics></math>. If the lower and upper quantiles of the bootstrap statistics are <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>L</mi><annotation encoding=\"application/x-tex\">L</annotation></semantics></math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>U</mi><annotation encoding=\"application/x-tex\">U</annotation></semantics></math>, the interval is <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo form=\"prefix\" stretchy=\"true\">[</mo><mover><mi>x</mi><mo accent=\"true\">‾</mo></mover><mo>−</mo><mi>U</mi><mover><mrow><mi>S</mi><mi>E</mi></mrow><mo accent=\"true\">̂</mo></mover><mo>,</mo><mover><mi>x</mi><mo accent=\"true\">‾</mo></mover><mo>−</mo><mi>L</mi><mover><mrow><mi>S</mi><mi>E</mi></mrow><mo accent=\"true\">̂</mo></mover><mo form=\"postfix\" stretchy=\"true\">]</mo></mrow><annotation encoding=\"application/x-tex\">[\\bar x-U\\widehat{SE},\\bar x-L\\widehat{SE}]</annotation></semantics></math>.</p>","<p><strong>Notation.</strong> Group 1 has <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>n</mi><mn>1</mn></msub><annotation encoding=\"application/x-tex\">n_1</annotation></semantics></math> observations and group 2 has <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>n</mi><mn>2</mn></msub><annotation encoding=\"application/x-tex\">n_2</annotation></semantics></math>. The difference between the two sample means is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>d</mi><annotation encoding=\"application/x-tex\">d</annotation></semantics></math>, and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>Δ</mi><mn>0</mn></msub><annotation encoding=\"application/x-tex\">\\Delta_0</annotation></semantics></math> is the difference between the population means claimed by the null. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>s</mi><mn>1</mn></msub><annotation encoding=\"application/x-tex\">s_1</annotation></semantics></math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>s</mi><mn>2</mn></msub><annotation encoding=\"application/x-tex\">s_2</annotation></semantics></math> are the SDs of the two groups, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>s</mi><mi>p</mi></msub><annotation encoding=\"application/x-tex\">s_p</annotation></semantics></math> is the pooled <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math>, and a and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>b</mi><annotation encoding=\"application/x-tex\">b</annotation></semantics></math> are the two groups’ contributions to the variance in Welch’<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>s</mi><annotation encoding=\"application/x-tex\">s</annotation></semantics></math> calculation. In the paired design, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n</mi><annotation encoding=\"application/x-tex\">n</annotation></semantics></math> is the number of pairs, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>D</mi><mi>i</mi></msub><annotation encoding=\"application/x-tex\">D_i</annotation></semantics></math> is the difference within a pair and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>s</mi><mi>D</mi></msub><annotation encoding=\"application/x-tex\">s_D</annotation></semantics></math> is the sample <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> of those differences.</p> <p><strong>Independent groups</strong><br/> <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi><mo>=</mo><msub><mover><mi>x</mi><mo accent=\"true\">‾</mo></mover><mn>1</mn></msub><mo>−</mo><msub><mover><mi>x</mi><mo accent=\"true\">‾</mo></mover><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">d=\\bar x_1-\\bar x_2</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi><mo>=</mo><mfrac><mrow><mi>d</mi><mo>−</mo><msub><mi>Δ</mi><mn>0</mn></msub></mrow><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">T=\\frac{d-\\Delta_0}{\\mathrm{SE}}</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C</mi><mi>I</mi><mo>=</mo><mi>d</mi><mo>±</mo><msup><mi>t</mi><mo>*</mo></msup><mi>S</mi><mi>E</mi></mrow><annotation encoding=\"application/x-tex\">CI=d\\pm t^*SE</annotation></semantics></math>. When both population variances are known, use <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>S</mi><mi>E</mi><mo>=</mo><msqrt><mrow><mfrac><msubsup><mi>σ</mi><mn>1</mn><mn>2</mn></msubsup><msub><mi>n</mi><mn>1</mn></msub></mfrac><mo>+</mo><mfrac><msubsup><mi>σ</mi><mn>2</mn><mn>2</mn></msubsup><msub><mi>n</mi><mn>2</mn></msub></mfrac></mrow></msqrt></mrow><annotation encoding=\"application/x-tex\">SE=\\sqrt{\\frac{\\sigma_1^2}{n_1}+\\frac{\\sigma_2^2}{n_2}}</annotation></semantics></math> and take the cutoff from the normal curve.</p> <p><strong>Pooled <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>t</mi><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></strong><br/> <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msubsup><mi>s</mi><mi>p</mi><mn>2</mn></msubsup><mo>=</mo><mfrac><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>n</mi><mn>1</mn></msub><mo>−</mo><mn>1</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><msubsup><mi>s</mi><mn>1</mn><mn>2</mn></msubsup><mo>+</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>n</mi><mn>2</mn></msub><mo>−</mo><mn>1</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><msubsup><mi>s</mi><mn>2</mn><mn>2</mn></msubsup></mrow><mrow><msub><mi>n</mi><mn>1</mn></msub><mo>+</mo><msub><mi>n</mi><mn>2</mn></msub><mo>−</mo><mn>2</mn></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">s_p^2=\\frac{(n_1-1)s_1^2+(n_2-1)s_2^2}{n_1+n_2-2}</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>S</mi><mi>E</mi><mo>=</mo><msub><mi>s</mi><mi>p</mi></msub><msqrt><mrow><mfrac><mn>1</mn><msub><mi>n</mi><mn>1</mn></msub></mfrac><mo>+</mo><mfrac><mn>1</mn><msub><mi>n</mi><mn>2</mn></msub></mfrac></mrow></msqrt></mrow><annotation encoding=\"application/x-tex\">SE=s_p\\sqrt{\\frac{1}{n_1}+\\frac{1}{n_2}}</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi><mi>f</mi><mo>=</mo><msub><mi>n</mi><mn>1</mn></msub><mo>+</mo><msub><mi>n</mi><mn>2</mn></msub><mo>−</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">df=n_1+n_2-2</annotation></semantics></math>. This test assumes that the two populations have the same variance.</p> <p><strong>Welch <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>t</mi><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></strong><br/> <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>=</mo><mfrac><msubsup><mi>s</mi><mn>1</mn><mn>2</mn></msubsup><msub><mi>n</mi><mn>1</mn></msub></mfrac></mrow><annotation encoding=\"application/x-tex\">a=\\frac{s_1^2}{n_1}</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>b</mi><mo>=</mo><mfrac><msubsup><mi>s</mi><mn>2</mn><mn>2</mn></msubsup><msub><mi>n</mi><mn>2</mn></msub></mfrac></mrow><annotation encoding=\"application/x-tex\">b=\\frac{s_2^2}{n_2}</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>S</mi><mi>E</mi><mo>=</mo><msqrt><mrow><mi>a</mi><mo>+</mo><mi>b</mi></mrow></msqrt></mrow><annotation encoding=\"application/x-tex\">SE=\\sqrt{a+b}</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi><mi>f</mi><mo>=</mo><mfrac><msup><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>a</mi><mo>+</mo><mi>b</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mn>2</mn></msup><mrow><mfrac><msup><mi>a</mi><mn>2</mn></msup><mrow><msub><mi>n</mi><mn>1</mn></msub><mo>−</mo><mn>1</mn></mrow></mfrac><mo>+</mo><mfrac><msup><mi>b</mi><mn>2</mn></msup><mrow><msub><mi>n</mi><mn>2</mn></msub><mo>−</mo><mn>1</mn></mrow></mfrac></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">df=\\frac{(a+b)^2}{\\frac{a^2}{n_1-1}+\\frac{b^2}{n_2-1}}</annotation></semantics></math>. R works out this approximate <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">f</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{df}</annotation></semantics></math> for you. To simulate the null, first subtract each group’s own mean from its values, then resample within each group.</p> <p><strong>Paired <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>t</mi><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></strong><br/> <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>D</mi><mi>i</mi></msub><mo>=</mo><msub><mi>X</mi><mi>i</mi></msub><mo>−</mo><msub><mi>Y</mi><mi>i</mi></msub></mrow><annotation encoding=\"application/x-tex\">D_i=X_i-Y_i</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>=</mo><mfrac><mrow><mover><mi>D</mi><mo accent=\"true\">‾</mo></mover><mo>−</mo><msub><mi>Δ</mi><mn>0</mn></msub></mrow><mfrac><msub><mi>s</mi><mi>D</mi></msub><msqrt><mi>n</mi></msqrt></mfrac></mfrac></mrow><annotation encoding=\"application/x-tex\">t=\\frac{\\bar D-\\Delta_0}{\\frac{s_D}{\\sqrt n}}</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C</mi><mi>I</mi><mo>=</mo><mover><mi>D</mi><mo accent=\"true\">‾</mo></mover><mo>±</mo><msup><mi>t</mi><mo>*</mo></msup><mfrac><msub><mi>s</mi><mi>D</mi></msub><msqrt><mi>n</mi></msqrt></mfrac></mrow><annotation encoding=\"application/x-tex\">CI=\\bar D\\pm t^*\\frac{s_D}{\\sqrt n}</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi><mi>f</mi><mo>=</mo><mi>n</mi><mo>−</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">df=n-1</annotation></semantics></math>. The sampling unit is a pair, so each pair gives one difference.</p>","<p><strong>Notation.</strong> O is an observed count and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>E</mi><annotation encoding=\"application/x-tex\">E</annotation></semantics></math> is the count expected under the null. In a goodness-of-fit test, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>k</mi><annotation encoding=\"application/x-tex\">k</annotation></semantics></math> is the number of categories, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>h</mi><annotation encoding=\"application/x-tex\">h</annotation></semantics></math> is the number of parameters of the null that had to be estimated from the data, and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>p</mi><mrow><mn>0</mn><mi>i</mi></mrow></msub><annotation encoding=\"application/x-tex\">p_{0i}</annotation></semantics></math> is the probability the null gives to category <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>i</mi><annotation encoding=\"application/x-tex\">i</annotation></semantics></math>. In an <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>r</mi><annotation encoding=\"application/x-tex\">r</annotation></semantics></math>-by-<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>c</mi><annotation encoding=\"application/x-tex\">c</annotation></semantics></math> table <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>R</mi><mi>i</mi></msub><annotation encoding=\"application/x-tex\">R_i</annotation></semantics></math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>C</mi><mi>j</mi></msub><annotation encoding=\"application/x-tex\">C_j</annotation></semantics></math> are row and column totals and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>N</mi><annotation encoding=\"application/x-tex\">N</annotation></semantics></math> is the grand total.</p> <p><strong>Pearson test</strong><br/> <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>X</mi><mn>2</mn></msup><mo>=</mo><mo>∑</mo><mfrac><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>O</mi><mo>−</mo><mi>E</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mn>2</mn></msup><mi>E</mi></mfrac></mrow><annotation encoding=\"application/x-tex\">X^2=\\sum\\frac{(O-E)^2}{E}</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>=</mo><mi>P</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><msubsup><mi>χ</mi><mrow><mi>d</mi><mi>f</mi></mrow><mn>2</mn></msubsup><mo>≥</mo><msubsup><mi>X</mi><mrow><mi>o</mi><mi>b</mi><mi>s</mi></mrow><mn>2</mn></msubsup><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">p=P(\\chi^2_{df}\\ge X^2_{obs})</annotation></semantics></math>. The Pearson residual of a cell is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mrow><mi>O</mi><mo>−</mo><mi>E</mi></mrow><msqrt><mi>E</mi></msqrt></mfrac><annotation encoding=\"application/x-tex\">\\frac{O-E}{\\sqrt E}</annotation></semantics></math>, and it keeps the sign of the difference. Its square is that cell’<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>s</mi><annotation encoding=\"application/x-tex\">s</annotation></semantics></math> contribution to the statistic.</p> <p><strong>Goodness of fit</strong><br/> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><mi>i</mi></msub><mo>=</mo><mi>n</mi><msub><mi>p</mi><mrow><mn>0</mn><mi>i</mi></mrow></msub><mo>,</mo><mspace width=\"1.0em\"></mspace><mi>d</mi><mi>f</mi><mo>=</mo><mi>k</mi><mo>−</mo><mn>1</mn><mo>−</mo><mi>h</mi></mrow><annotation encoding=\"application/x-tex\">E_i=np_{0i},\\quad df=k-1-h</annotation></semantics></math> This applies when there are <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>k</mi><annotation encoding=\"application/x-tex\">k</annotation></semantics></math> categories and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>h</mi><annotation encoding=\"application/x-tex\">h</annotation></semantics></math> parameters estimated under the null, if the usual conditions hold. With two categories and stated probabilities, the uncorrected statistic is the square of the test statistic for a proportion, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>X</mi><mn>2</mn></msup><mo>=</mo><msup><mi>Z</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">X^2=Z^2</annotation></semantics></math>.</p> <p><strong>Independence</strong><br/> <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><mrow><mi>i</mi><mi>j</mi></mrow></msub><mo>=</mo><mfrac><mrow><msub><mi>R</mi><mi>i</mi></msub><msub><mi>C</mi><mi>j</mi></msub></mrow><mi>N</mi></mfrac><mo>,</mo><mspace width=\"1.0em\"></mspace><mi>d</mi><mi>f</mi><mo>=</mo><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>r</mi><mo>−</mo><mn>1</mn><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>c</mi><mo>−</mo><mn>1</mn><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">E_{ij}=\\frac{R_i C_j}{N},\\quad df=(r-1)(c-1)</annotation></semantics></math>. Check that the expected counts are not too small. For a two-by-two table R may use Yates’ correction. Add correct=FALSE to get the uncorrected statistic that you would compute by hand. When the null is simulated for a table, the row and column totals are kept fixed.</p>","<p><strong>Notation.</strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>Y</mi><mi>i</mi></msub><annotation encoding=\"application/x-tex\">Y_i</annotation></semantics></math> is the response for observation <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>i</mi><annotation encoding=\"application/x-tex\">i</annotation></semantics></math>; <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>x</mi><mrow><mi>i</mi><mi>j</mi></mrow></msub><annotation encoding=\"application/x-tex\">x_{ij}</annotation></semantics></math> is its value of predictor <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>j</mi><annotation encoding=\"application/x-tex\">j</annotation></semantics></math>. There are <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n</mi><annotation encoding=\"application/x-tex\">n</annotation></semantics></math> observations and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>p</mi><annotation encoding=\"application/x-tex\">p</annotation></semantics></math> slopes. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>β</mi><mn>0</mn></msub><annotation encoding=\"application/x-tex\">\\beta_0</annotation></semantics></math> is the intercept, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>β</mi><mi>j</mi></msub><annotation encoding=\"application/x-tex\">\\beta_j</annotation></semantics></math> a population slope and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>ϵ</mi><mi>i</mi></msub><annotation encoding=\"application/x-tex\">\\epsilon_i</annotation></semantics></math> an error. A hat denotes an estimate. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>S</mi><mrow><mi>x</mi><mi>x</mi></mrow></msub><annotation encoding=\"application/x-tex\">S_{xx}</annotation></semantics></math> measures how spread out the predictor values are. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>b</mi><mrow><mi>j</mi><mo>,</mo><mn>0</mn></mrow></msub><annotation encoding=\"application/x-tex\">b_{j,0}</annotation></semantics></math> is the value of the coefficient claimed by the null, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>d</mi><annotation encoding=\"application/x-tex\">d</annotation></semantics></math> is a change in that coefficient’s predictor, and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>α</mi><annotation encoding=\"application/x-tex\">\\alpha</annotation></semantics></math> is the probability left outside a confidence interval. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SSE}</annotation></semantics></math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">T</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SST}</annotation></semantics></math> are the residual and total sums of squares.</p><div class=\"regression-reference\"><p><strong>Regression model</strong></p> <p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>Y</mi><mi>i</mi></msub><mo>=</mo><msub><mi>β</mi><mn>0</mn></msub><mo>+</mo><munderover><mo>∑</mo><mrow><mi>j</mi><mo>=</mo><mn>1</mn></mrow><mi>p</mi></munderover><msub><mi>β</mi><mi>j</mi></msub><msub><mi>x</mi><mrow><mi>i</mi><mi>j</mi></mrow></msub><mo>+</mo><msub><mi>ϵ</mi><mi>i</mi></msub></mrow><annotation encoding=\"application/x-tex\">Y_i=\\beta_0+\\sum_{j=1}^{p}\\beta_j x_{ij}+\\epsilon_i</annotation></semantics></math></p> <p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">f</mi></mrow><mo>=</mo><mi>n</mi><mo>−</mo><mi>p</mi><mo>−</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">\\mathrm{df}=n-p-1</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover><mi>σ</mi><mo accent=\"true\">̂</mo></mover><mo>=</mo><msqrt><mfrac><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow><mrow><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">f</mi></mrow></mfrac></msqrt></mrow><annotation encoding=\"application/x-tex\">\\hat\\sigma=\\sqrt{\\frac{\\mathrm{SSE}}{\\mathrm{df}}}</annotation></semantics></math></p> <p>Each slope is the change in the fitted response when its predictor goes up by one unit and the other predictors are held fixed.</p> <p><strong>Simple-regression slope</strong></p> <p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>S</mi><mrow><mi>x</mi><mi>x</mi></mrow></msub><mo>=</mo><munder><mo>∑</mo><mi>i</mi></munder><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><msub><mi>x</mi><mi>i</mi></msub><mo>−</mo><mover><mi>x</mi><mo accent=\"true\">‾</mo></mover><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">S_{xx}=\\sum_i (x_i-\\bar x)^2</annotation></semantics></math></p> <p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mover><mi>b</mi><mo accent=\"true\">̂</mo></mover><mn>1</mn></msub><mo>=</mo><mfrac><mrow><munder><mo>∑</mo><mi>i</mi></munder><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><msub><mi>x</mi><mi>i</mi></msub><mo>−</mo><mover><mi>x</mi><mo accent=\"true\">‾</mo></mover><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><msub><mi>y</mi><mi>i</mi></msub></mrow><msub><mi>S</mi><mrow><mi>x</mi><mi>x</mi></mrow></msub></mfrac></mrow><annotation encoding=\"application/x-tex\">\\hat b_1=\\frac{\\sum_i(x_i-\\bar x)y_i}{S_{xx}}</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>SE</mo><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><msub><mover><mi>b</mi><mo accent=\"true\">̂</mo></mover><mn>1</mn></msub><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mo>=</mo><mfrac><mover><mi>σ</mi><mo accent=\"true\">̂</mo></mover><msqrt><msub><mi>S</mi><mrow><mi>x</mi><mi>x</mi></mrow></msub></msqrt></mfrac></mrow><annotation encoding=\"application/x-tex\">\\operatorname{SE}(\\hat b_1)=\\frac{\\hat\\sigma}{\\sqrt{S_{xx}}}</annotation></semantics></math></p> <p>The weight of observation <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>i</mi><annotation encoding=\"application/x-tex\">i</annotation></semantics></math> is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>w</mi><mi>i</mi></msub><mo>=</mo><mfrac><mrow><msub><mi>x</mi><mi>i</mi></msub><mo>−</mo><mover><mi>x</mi><mo accent=\"true\">‾</mo></mover></mrow><msub><mi>S</mi><mrow><mi>x</mi><mi>x</mi></mrow></msub></mfrac></mrow><annotation encoding=\"application/x-tex\">w_i=\\frac{x_i-\\bar x}{S_{xx}}</annotation></semantics></math>. Under the simple regression assumptions, <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>Var</mo><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><msub><mover><mi>b</mi><mo accent=\"true\">̂</mo></mover><mn>1</mn></msub><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mo>=</mo><mfrac><msup><mi>σ</mi><mn>2</mn></msup><msub><mi>S</mi><mrow><mi>x</mi><mi>x</mi></mrow></msub></mfrac></mrow><annotation encoding=\"application/x-tex\">\\operatorname{Var}(\\hat b_1)=\\frac{\\sigma^2}{S_{xx}}</annotation></semantics></math>.</p> <p><strong>Coefficient inference</strong></p> <p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>=</mo><mfrac><mrow><msub><mover><mi>b</mi><mo accent=\"true\">̂</mo></mover><mi>j</mi></msub><mo>−</mo><msub><mi>b</mi><mrow><mi>j</mi><mo>,</mo><mn>0</mn></mrow></msub></mrow><mrow><mo>SE</mo><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><msub><mover><mi>b</mi><mo accent=\"true\">̂</mo></mover><mi>j</mi></msub><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">t=\\frac{\\hat b_j-b_{j,0}}{\\operatorname{SE}(\\hat b_j)}</annotation></semantics></math></p> <p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mrow><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>1</mn><mo>−</mo><mi>α</mi></mrow></msub><mo>=</mo><msub><mover><mi>b</mi><mo accent=\"true\">̂</mo></mover><mi>j</mi></msub><mo>±</mo><msub><mi>t</mi><mrow><mn>1</mn><mo>−</mo><mfrac><mi>α</mi><mn>2</mn></mfrac><mo>,</mo><mspace width=\"0.167em\"></mspace><mrow><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">f</mi></mrow></mrow></msub><mo>SE</mo><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><msub><mover><mi>b</mi><mo accent=\"true\">̂</mo></mover><mi>j</mi></msub><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\\mathrm{CI}_{1-\\alpha}=\\hat b_j\\pm t_{1-\\frac{\\alpha}{2},\\,\\mathrm{df}}\\operatorname{SE}(\\hat b_j)</annotation></semantics></math></p> <p>Read each coefficient’s <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SE}</annotation></semantics></math> from its own row of the output. The residual <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> is the typical size of a residual, in the units of the response.</p> <p><strong>Log response and fit</strong></p> <p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext mathvariant=\"normal\">Fitted ratio</mtext><mo>=</mo><msup><mi>e</mi><mrow><msub><mi>b</mi><mi>j</mi></msub><mi>d</mi></mrow></msup></mrow><annotation encoding=\"application/x-tex\">\\text{Fitted ratio}=e^{b_jd}</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>%</mi><mrow><mspace width=\"0.333em\"></mspace><mtext mathvariant=\"normal\"> change</mtext></mrow><mo>=</mo><mn>100</mn><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><msup><mi>e</mi><mrow><msub><mi>b</mi><mi>j</mi></msub><mi>d</mi></mrow></msup><mo>−</mo><mn>1</mn><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\\%\\text{ change}=100(e^{b_jd}-1)</annotation></semantics></math></p> <p><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>R</mi><mn>2</mn></msup><mo>=</mo><mn>1</mn><mo>−</mo><mfrac><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">T</mi></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">R^2=1-\\frac{\\mathrm{SSE}}{\\mathrm{SST}}</annotation></semantics></math></p> <p>Strongly correlated predictors can make the SEs of their individual slopes large. Check the residual plot for a curve and for changing spread, check the Q–Q plot against its line, and think about how the data were collected.</p> </div>","<p><strong>Notation.</strong> The subscripts R and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>F</mi><annotation encoding=\"application/x-tex\">F</annotation></semantics></math> mark the reduced model and the full model. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{RSS}</annotation></semantics></math> is residual sum of squares; <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">f</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{df}</annotation></semantics></math> is residual degrees of freedom. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>q</mi><annotation encoding=\"application/x-tex\">q</annotation></semantics></math> is the number of slopes added, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>p</mi><annotation encoding=\"application/x-tex\">p</annotation></semantics></math> is the number of slopes in the full model and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n</mi><annotation encoding=\"application/x-tex\">n</annotation></semantics></math> is the number of observations. As a statistic, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>F</mi><annotation encoding=\"application/x-tex\">F</annotation></semantics></math> compares the improvement in fit per added slope with the residual variance of the full model.</p> <p><strong>Nested comparisons</strong><br/> <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>F</mi><mo>=</mo><mfrac><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi></mrow><mi>R</mi></msub><mo>−</mo><msub><mrow><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi></mrow><mi>F</mi></msub></mrow><mi>q</mi></mfrac><mfrac><msub><mrow><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi></mrow><mi>F</mi></msub><mrow><mi>d</mi><msub><mi>f</mi><mi>F</mi></msub></mrow></mfrac></mfrac></mrow><annotation encoding=\"application/x-tex\">F=\\frac{\\frac{\\mathrm{RSS}_R-\\mathrm{RSS}_F}{q}}{\\frac{\\mathrm{RSS}_F}{df_F}}</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>q</mi><mo>=</mo><mi>d</mi><msub><mi>f</mi><mi>R</mi></msub><mo>−</mo><mi>d</mi><msub><mi>f</mi><mi>F</mi></msub></mrow><annotation encoding=\"application/x-tex\">q=df_R-df_F</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>=</mo><mi>P</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><msub><mi>F</mi><mrow><mi>q</mi><mo>,</mo><mi>d</mi><msub><mi>f</mi><mi>F</mi></msub></mrow></msub><mo>≥</mo><msub><mi>F</mi><mrow><mi>o</mi><mi>b</mi><mi>s</mi></mrow></msub><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">p=P(F_{q,df_F}\\ge F_{obs})</annotation></semantics></math>. Both models must be fitted to the same observations and the same response. When only one slope is added, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>F</mi><mo>=</mo><msup><mi>t</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">F=t^2</annotation></semantics></math>.</p> <p><strong>Overall and partial tests</strong><br/> In the overall test, the null says that all the slopes are zero. In a partial test, the null says that the added slopes are zero. In both tests, the alternative is that at least one of the slopes being tested is not zero.</p> <p><strong>Adjusted fit</strong><br/> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msubsup><mi>R</mi><mrow><mi>a</mi><mi>d</mi><mi>j</mi></mrow><mn>2</mn></msubsup><mo>=</mo><mn>1</mn><mo>−</mo><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mn>1</mn><mo>−</mo><msup><mi>R</mi><mn>2</mn></msup><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mfrac><mrow><mi>n</mi><mo>−</mo><mn>1</mn></mrow><mrow><mi>n</mi><mo>−</mo><mi>p</mi><mo>−</mo><mn>1</mn></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">R^2_{adj}=1-(1-R^2)\\frac{n-1}{n-p-1}</annotation></semantics></math>. Ordinary <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msup><mi>R</mi><mn>2</mn></msup><annotation encoding=\"application/x-tex\">R^2</annotation></semantics></math> cannot go down when predictors are added. In forward or backward selection, add or remove one term, refit the model, and then look at the tests again, because each test depends on which other terms are in the model.</p>","<p><strong>Notation.</strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>p</mi><annotation encoding=\"application/x-tex\">p</annotation></semantics></math> is the probability that the response is the category coded 1. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>o</mi><annotation encoding=\"application/x-tex\">o</annotation></semantics></math> is the odds and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>η</mi><annotation encoding=\"application/x-tex\">\\eta</annotation></semantics></math> is the linear predictor. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>β</mi><mn>0</mn></msub><annotation encoding=\"application/x-tex\">\\beta_0</annotation></semantics></math> is the intercept and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>β</mi><mi>j</mi></msub><annotation encoding=\"application/x-tex\">\\beta_j</annotation></semantics></math> the population slope for predictor <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>x</mi><mi>j</mi></msub><annotation encoding=\"application/x-tex\">x_j</annotation></semantics></math>. OR is the odds ratio for a change of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>d</mi><annotation encoding=\"application/x-tex\">d</annotation></semantics></math> units in a predictor. A hat marks an estimated coefficient, and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SE}</annotation></semantics></math> is the standard error of that estimate. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>Φ</mi><annotation encoding=\"application/x-tex\">\\Phi</annotation></semantics></math> gives the area to the left under the standard normal curve.</p> <p><strong>Link and inverse</strong><br/> <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>o</mi><mo>=</mo><mfrac><mi>p</mi><mrow><mn>1</mn><mo>−</mo><mi>p</mi></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">o=\\frac{p}{1-p}</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>η</mi><mo>=</mo><mo>log</mo><mi>o</mi><mo>=</mo><msub><mi>β</mi><mn>0</mn></msub><mo>+</mo><munder><mo>∑</mo><mi>j</mi></munder><msub><mi>β</mi><mi>j</mi></msub><msub><mi>x</mi><mi>j</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\eta=\\log o=\\beta_0+\\sum_j\\beta_j x_j</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>=</mo><mfrac><msup><mi>e</mi><mi>η</mi></msup><mrow><mn>1</mn><mo>+</mo><msup><mi>e</mi><mi>η</mi></msup></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">p=\\frac{e^\\eta}{1+e^\\eta}</annotation></semantics></math>. When the data are grouped, the response records the numbers of successes and failures in each group. When each row is one individual, the response is 0 or 1.</p> <p><strong>Effect on odds</strong><br/> <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>O</mi><mi>R</mi><mo>=</mo><msup><mi>e</mi><mrow><msub><mi>b</mi><mi>j</mi></msub><mi>d</mi></mrow></msup></mrow><annotation encoding=\"application/x-tex\">OR=e^{b_jd}</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>%</mi><mi>Δ</mi><mi>o</mi><mo>=</mo><mn>100</mn><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>O</mi><mi>R</mi><mo>−</mo><mn>1</mn><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\\%\\Delta o=100(OR-1)</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>p</mi><mrow><mi>n</mi><mi>e</mi><mi>w</mi></mrow></msub><mo>=</mo><mfrac><mrow><mrow><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">R</mi></mrow><mspace width=\"0.167em\"></mspace><msub><mi>p</mi><mrow><mi>o</mi><mi>l</mi><mi>d</mi></mrow></msub></mrow><mrow><mn>1</mn><mo>−</mo><msub><mi>p</mi><mrow><mi>o</mi><mi>l</mi><mi>d</mi></mrow></msub><mo>+</mo><mrow><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">R</mi></mrow><mspace width=\"0.167em\"></mspace><msub><mi>p</mi><mrow><mi>o</mi><mi>l</mi><mi>d</mi></mrow></msub></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">p_{new}=\\frac{\\mathrm{OR}\\,p_{old}}{1-p_{old}+\\mathrm{OR}\\,p_{old}}</annotation></semantics></math>. These formulas hold the other predictors fixed. The same odds ratio can change the probability by different amounts, depending on where it starts.</p> <p><strong>Wald inference and fit</strong><br/> <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>z</mi><mo>=</mo><mfrac><mrow><msub><mover><mi>b</mi><mo accent=\"true\">̂</mo></mover><mi>j</mi></msub><mo>−</mo><msub><mi>b</mi><mrow><mi>j</mi><mo>,</mo><mn>0</mn></mrow></msub></mrow><mrow><mo>SE</mo><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><msub><mover><mi>b</mi><mo accent=\"true\">̂</mo></mover><mi>j</mi></msub><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">z=\\frac{\\hat b_j-b_{j,0}}{\\operatorname{SE}(\\hat b_j)}</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>p</mi><mrow><mi>t</mi><mi>w</mi><mi>o</mi></mrow></msub><mo>=</mo><mn>2</mn><mi>Φ</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>−</mi><mrow><mo form=\"prefix\" stretchy=\"true\">|</mo><mi>z</mi><mo form=\"postfix\" stretchy=\"true\">|</mo></mrow><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">p_{two}=2\\Phi(-|z|)</annotation></semantics></math>. The coefficients are fitted by maximum likelihood. Compare the null deviance with the residual deviance only when both come from the same data. Add type=‘response’ when predicting to get the probability of the event.</p>"];const typeset={"SE(b̂₁)=residual SD / √Σ(xᵢ−x̄)²": "<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>SE</mo><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><msub><mover><mi>b</mi><mo accent=\"true\">̂</mo></mover><mn>1</mn></msub><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mo>=</mo><mfrac><mover><mi>σ</mi><mo accent=\"true\">̂</mo></mover><msqrt><mrow><munder><mo>∑</mo><mi>i</mi></munder><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><msub><mi>x</mi><m
