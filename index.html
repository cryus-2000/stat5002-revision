explanationNote":"The value 0.64 divides the sum of products by n = 5 where n − 1 = 4 is needed; it also happens to equal r². The value 1.60 divides by 5 and leaves out the SDs, and 3.20 divides by the SDs but not by n − 1. No correlation can exceed 1."},{"id":"exam-4-6","w":4,"g":"Exam-format questions","t":"Why the sign of r follows the cloud","q":"A scatter plot is divided into four quadrants by a vertical line at the mean of x and a horizontal line at the mean of y. Most points lie in the upper-left and lower-right quadrants. What does this say about r?","o":["r is positive, because most points are far from the centre.","r is negative, because in those quadrants one deviation is positive and the other negative, so their products are negative.","r is close to zero, because the two quadrants cancel each other.","Nothing, because r depends only on the slope of the regression line."],"answer":"r is negative, because in those quadrants one deviation is positive and the other negative, so their products are negative.","pairs":[],"why":"r averages the products of the two standard units. In the upper-left quadrant x is below its mean and y is above; in the lower-right it is the other way round. Either way the product is negative.","explanationNote":"Points in the upper-right and lower-left quadrants give positive products. r is positive when those dominate, and near zero when the four quadrants balance."},{"id":"exam-4-7","w":4,"g":"Exam-format questions","t":"What a correlation does and does not say","q":"Select the correct statement.","o":["Multiplying every x value by −2 changes the sign of r and leaves its size unchanged.","r = 0.8 means that 80% of the points lie on the regression line.","A relationship with r = 0.8 is twice as strong as one with r = 0.4.","r = 0.97 shows that the relationship is a straight line."],"answer":"Multiplying every x value by −2 changes the sign of r and leaves its size unchanged.","pairs":[],"why":"r has no units and is unchanged by shifting or by multiplying by a positive number. Multiplying one variable by a negative number reverses the direction of the association, so the sign of r flips.","explanationNote":"r is not a percentage of points and is not on a scale where 0.8 is “twice” 0.4. A curve can have a very high r: y = x² for x = 1 to 20 gives r = 0.97. Always look at the scatter plot."},{"id":"exam-8-6","w":8,"g":"Exam-format questions","t":"What makes a prediction interval wide","q":"For which box and sample size is the 95% prediction interval for the sample proportion widest?","o":["p = 0.9 with n = 400","p = 0.2 with n = 100","p = 0.5 with n = 400","p = 0.5 with n = 100"],"answer":"p = 0.5 with n = 100","pairs":[],"why":"The half-width is 1.96 × √(p(1 − p)/n). The product p(1 − p) is largest at p = 0.5, and a smaller n gives a larger standard error. With p = 0.5 and n = 100 the half-width is 0.098.","explanationNote":"The other half-widths are 0.078, 0.049 and 0.029. Quadrupling the sample size halves the width. Moving p away from 0.5 also narrows the interval."},{"id":"exam-8-7","w":8,"g":"Exam-format questions","t":"Prediction interval for a sum","q":"A fair die is rolled 100 times. A single roll has mean 3.5 and SD 1.71. Which is the 95% prediction interval for the sum of the rolls?","o":["[3.17, 3.83]","[346.7, 353.3]","[316.5, 383.5]","[15, 685]"],"answer":"[316.5, 383.5]","pairs":[],"why":"The sum has expected value 100 × 3.5 = 350 and standard error √100 × 1.71 = 17.1. The interval is 350 ± 1.96 × 17.1 = 350 ± 33.5.","explanationNote":"The interval [346.7, 353.3] uses the SD of one roll as the standard error of the sum. The interval [3.17, 3.83] is for the average of the rolls. The widest interval multiplies the SD by 100 where √100 is needed. Its upper end is above 600, the largest total that 100 rolls can give."},{"id":"exam-9-5","w":9,"g":"Exam-format questions","t":"Wording a conclusion","q":"A test of H₀: p = 0.5 against H₁: p ≠ 0.5 gives a p-value of 0.21. Which conclusion is worded correctly at the 5% level?","o":["H₀ is true: the proportion is 0.5.","The data are consistent with H₀: there is insufficient evidence that p differs from 0.5.","There is a 21% chance that H₀ is true.","H₀ is rejected, because 0.21 is greater than 0.05."],"answer":"The data are consistent with H₀: there is insufficient evidence that p differs from 0.5.","pairs":[],"why":"A p-value above the significance level means the data could reasonably have arisen under H₀. That is a statement about the evidence, which is not strong enough to reject, and not a proof that H₀ holds.","explanationNote":"A p-value is calculated assuming H₀, so it cannot be the probability that H₀ is true. The significance level is the false alarm rate: the chance of rejecting H₀ when it is in fact true."},{"id":"exam-10-10","w":10,"g":"Exam-format questions","t":"Reading a simulation loop","q":"The sample is stored in x and the observed statistic in t.obs. What does the last line of the code return?","r":"> T.sim = numeric(10000)\n> for (i in 1:10000) {\n+   s = sample(x, replace = TRUE)\n+   T.sim[i] = (mean(s) - mean(x)) / (sd(s) / sqrt(length(s)))\n+ }\n> mean(abs(T.sim) >= abs(t.obs))","o":["The two-sided simulated p-value: the proportion of resampled statistics at least as far from zero as the observed one.","The average of the 10,000 resampled statistics.","The one-sided simulated p-value for the alternative “greater than”.","The number of resampled statistics that exceed the observed one."],"answer":"The two-sided simulated p-value: the proportion of resampled statistics at least as far from zero as the observed one.","pairs":[],"why":"Each pass of the loop draws a resample, computes its t statistic centred on the sample mean, and stores it. The comparison gives TRUE or FALSE for each of the 10,000 statistics, and mean() turns those into a proportion. abs() counts both tails.","explanationNote":"Without abs(), mean(T.sim >= t.obs) would give a one-sided p-value. sum() in place of mean() would give a count."},{"id":"exam-13-9","w":13,"g":"Exam-format questions","t":"A small coefficient on the log scale","q":"A regression of log ozone concentration on temperature and other predictors gives a temperature coefficient of 0.068. Which reading is correct?","r":"> exp(0.068)\n[1] 1.070365","o":["Temperature explains 6.8% of the variation in ozone.","Holding the other predictors fixed, each extra degree is associated with ozone 0.068 units higher.","Holding the other predictors fixed, each extra degree is associated with ozone 68% higher.","Holding the other predictors fixed, each extra degree is associated with ozone about 7% higher."],"answer":"Holding the other predictors fixed, each extra degree is associated with ozone about 7% higher.","pairs":[],"why":"The coefficient is a change in log ozone. On the original scale ozone is multiplied by exp(0.068) = 1.070, an increase of 7.0%. For a small coefficient this is close to the coefficient itself read as a percentage, 6.8%.","explanationNote":"The shortcut “b × 100%” only works when b is small. A coefficient of 1.63 means multiplying by exp(1.63) = 5.1, not an increase of 163%."},{"id":"exam-13-10","w":13,"g":"Exam-format questions","t":"Reading a correlation matrix","q":"Before fitting a regression of y on x1, x2 and x3, an analyst prints the correlation matrix. Select the correct statement.","r":"> round(cor(dat), 2)\n       y    x1    x2    x3\ny   1.00  0.82 -0.55  0.78\nx1  0.82  1.00 -0.30  0.93\nx2 -0.55 -0.30  1.00 -0.25\nx3  0.78  0.93 -0.25  1.00","o":["x1 and x3 are both strongly related to y, so both will certainly be significant in the regression.","x2 has the strongest association with y, because its correlation is the only negative one.","x1 has the strongest association with y on its own, and x1 and x3 are so highly correlated that their separate coefficients are likely to be imprecise.","The R² of the regression will be 0.82² + 0.55² + 0.78²."],"answer":"x1 has the strongest association with y on its own, and x1 and x3 are so highly correlated that their separate coefficients are likely to be imprecise.","pairs":[],"why":"In the y row, x1 has the largest correlation in size, 0.82. Among the predictors, x1 and x3 are correlated at 0.93, so they carry much the same information. This is multicollinearity.","explanationNote":"Size, not sign, measures strength. Two predictors that duplicate each other often both come out non-significant. Multiple R² is not the sum of squared pairwise correlations, which here would exceed 1."},{"id":"exam-13-11","w":13,"g":"Exam-format questions","t":"Statements about a fitted regression","q":"A simple linear regression of exam mark on hours studied gives the fitted line: predicted mark = 42 + 3.5 × hours. Select the correct statement.","o":["The intercept, 42, is the average mark of all students.","The intercept, 42, is the predicted mark for a student who studies 0 hours.","If the residual plot shows a clear curve, the p-value for the slope can still be trusted.","The slope, 3.5, is the correlation between marks and hours."],"answer":"The intercept, 42, is the predicted mark for a student who studies 0 hours.","pairs":[],"why":"The intercept is the predicted response when the predictor equals zero. Whether that prediction is meaningful depends on whether 0 hours lies within the range of the data.","explanationNote":"Linearity is checked first: if the residual plot is curved, the straight-line model is wrong and the tests built on it are not reliable. The slope has units of marks per hour, whereas a correlation has no units."},{"id":"exam-15-5","w":15,"g":"Exam-format questions","t":"Odds in words","q":"The probability that a customer renews is 0.6. Select the correct statement.","o":["The odds of renewing are 1.5, or “3 to 2”: for every 3 customers who renew, 2 do not.","The odds of renewing are 0.6.","The odds of renewing are 0.4, the probability of not renewing.","The odds of renewing are 6 to 10."],"answer":"The odds of renewing are 1.5, or “3 to 2”: for every 3 customers who renew, 2 do not.","pairs":[],"why":"Odds = p ÷ (1 − p) = 0.6 ÷ 0.4 = 1.5. Odds above 1 mean the event is more likely than not. Odds of exactly 1 mean a probability of one half.","explanationNote":"To go back, probability = odds ÷ (1 + odds) = 1.5 ÷ 2.5 = 0.6. Odds can be any positive number, which is one reason logistic regression models the log of the odds and not the probability directly."},{"id":"written-1-1","w":10,"g":"Extended-answer practice","t":"Battery life 1 · Hypotheses","q":"State the null and alternative hypotheses, where μ is the population mean battery life in hours.","o":["H₀: μ = 40 against H₁: μ < 40","H₀: μ = 40 against H₁: μ ≠ 40","H₀: x̄ = 40 against H₁: x̄ < 40","H₀: μ = 38.2 against H₁: μ < 40"],"answer":"H₀: μ = 40 against H₁: μ < 40","pairs":[],"why":"Define the parameter first: μ is the mean life of all batteries of this type. The null takes the claimed value, 40 hours. The group’s suspicion, formed before testing, is that the mean is lower, so the alternative is one-sided.","explanationNote":"In a written answer, give the parameter in words and then both hypotheses. The sample mean 38.2 is data and never appears in a hypothesis.","bg":"A manufacturer claims that its batteries last 40 hours on average. A consumer group suspects that the true mean is lower. Battery life is assumed to be normally distributed with unknown standard deviation. The group tests a random sample of batteries.","bgr":"> length(life)\n[1] 25\n> mean(life)\n[1] 38.2\n> sd(life)\n[1] 4.5","model":"Let μ be the population mean battery life in hours. H₀: μ = 40 against H₁: μ < 40."},{"id":"written-1-2","w":10,"g":"Extended-answer practice","t":"Battery life 2 · Procedure","q":"Which testing procedure should be used, and why?","o":["Chi-squared goodness-of-fit test: the observed lives are compared with the expected life.","One-sample Z-test: the sample size of 25 is large enough to treat the sample SD as the population SD.","Paired t-test: each battery is compared with the claimed value of 40 hours.","One-sample t-test: one sample from a normal population whose SD is unknown and estimated by the sample SD."],"answer":"One-sample t-test: one sample from a normal population whose SD is unknown and estimated by the sample SD.","pairs":[],"why":"There is one sample of measurements and one claimed mean. The population SD is unknown, so the standard error uses the sample SD and the statistic follows a t distribution with n − 1 df when the population is normal.","explanationNote":"A Z-test needs a known population SD. A paired test needs two measurements on each unit. A written answer should name the test and give both reasons: SD unknown, normal population.","bg":"A manufacturer claims that its batteries last 40 hours on average. A consumer group suspects that the true mean is lower. Battery life is assumed to be normally distributed with unknown standard deviation. The group tests a random sample of batteries.","bgr":"> length(life)\n[1] 25\n> mean(life)\n[1] 38.2\n> sd(life)\n[1] 4.5","model":"Use a one-sample t-test. There is one sample from a normal population, and the population SD is unknown and estimated by the sample SD, so the statistic follows a t distribution with n − 1 = 24 df."},{"id":"written-1-3","w":10,"g":"Extended-answer practice","t":"Battery life 3 · Test statistic","q":"Compute the observed test statistic.","o":["−10.00","−0.40","−2.00","2.00"],"answer":"−2.00","pairs":[],"why":"The standard error is 4.5 ÷ √25 = 0.9 hours. T = (38.2 − 40) ÷ 0.9 = −2.00.","explanationNote":"The sample mean is two standard errors below the claimed mean. The value −0.40 divides by the SD of single batteries, and −10.00 divides the SD by n where √n is needed.","bg":"A manufacturer claims that its batteries last 40 hours on average. A consumer group suspects that the true mean is lower. Battery life is assumed to be normally distributed with unknown standard deviation. The group tests a random sample of batteries.","bgr":"> length(life)\n[1] 25\n> mean(life)\n[1] 38.2\n> sd(life)\n[1] 4.5","model":"SE = 4.5 ÷ √25 = 0.9. T = (38.2 − 40) ÷ 0.9 = −2.00."},{"id":"written-1-4","w":10,"g":"Extended-answer practice","t":"Battery life 4 · Decision","q":"The observed statistic is −2.00. At a significance level of 0.05, is there sufficient evidence to reject the null hypothesis?","o":["No. The statistic 2.00 in absolute value is below 2.064.","Yes. Small values argue against H₀, and −2.00 is below −1.711.","Yes. Any negative statistic supports the alternative.","No. The statistic −2.00 is below 1.711."],"answer":"Yes. Small values argue against H₀, and −2.00 is below −1.711.","pairs":[],"why":"The alternative is μ < 40, so only small (negative) values of T count against H₀. With 24 df the lower 5% cutoff is −1.711, by symmetry with the printed 0.95 quantile. Since −2.00 < −1.711, reject H₀: the data support a mean life below 40 hours.","explanationNote":"The cutoff 2.064 is the 0.975 quantile and belongs to a two-sided test at 5%. Choose the row with n − 1 = 24 df. A negative statistic alone is not enough, because sampling variation produces negative values half the time under H₀.","bg":"A manufacturer claims that its batteries last 40 hours on average. A consumer group suspects that the true mean is lower. Battery life is assumed to be normally distributed with unknown standard deviation. The group tests a random sample of batteries.","bgr":"> length(life)\n[1] 25\n> mean(life)\n[1] 38.2\n> sd(life)\n[1] 4.5\n> round(qt(c(0.95, 0.975), 23), 3)\n[1] 1.714 2.069\n> round(qt(c(0.95, 0.975), 24), 3)\n[1] 1.711 2.064\n> round(qt(c(0.95, 0.975), 25), 3)\n[1] 1.708 2.060","model":"The test is one-sided, so small values of T argue against H₀. The 5% cutoff from the t distribution with 24 df is −1.711. Since −2.00 < −1.711, reject H₀. There is evidence that the mean battery life is below 40 hours."},{"id":"written-2-1","w":12,"g":"Extended-answer practice","t":"Bakery mix 1 · Hypotheses","q":"State the null and alternative hypotheses, where p₁, p₂, p₃ and p₄ are the population proportions of this store’s sales for the four loaf types.","o":["H₀: p₁ = 0.4, p₂ = 0.3, p₃ = 0.2, p₄ = 0.1 against H₁: at least one proportion differs from its stated value","H₀: p₁ = p₂ = p₃ = p₄ = 0.25 against H₁: at least one proportion differs from 0.25","H₀: the four observed counts are 80, 60, 40 and 20 against H₁: they are not","H₀: loaf type and store are independent against H₁: they are dependent"],"answer":"H₀: p₁ = 0.4, p₂ = 0.3, p₃ = 0.2, p₄ = 0.1 against H₁: at least one proportion differs from its stated value","pairs":[],"why":"A goodness-of-fit test has one categorical variable and a fully specified set of null probabilities. Here they are head office’s mix. The alternative is that the mix is something else, without saying which type differs.","explanationNote":"Equal proportions would be the null only if head office expected an even mix. Hypotheses describe population proportions, not the counts observed this week.","bg":"Head office expects four loaf types to make up 40%, 30%, 20% and 10% of sales. One store sold 200 loaves in a week. Managers want to know whether this store’s sales follow the expected mix.","bgr":"             White  Wholemeal  Sourdough  Rye  Total\nLoaves sold     70         62         40   28    200","model":"Let p₁, p₂, p₃ and p₄ be the proportions of this store’s sales that are white, wholemeal, sourdough and rye. H₀: p₁ = 0.4, p₂ = 0.3, p₃ = 0.2, p₄ = 0.1. H₁: at least one proportion differs from its stated value."},{"id":"written-2-2","w":12,"g":"Extended-answer practice","t":"Bakery mix 2 · Expected counts","q":"Find the expected count for each loaf type under the null hypothesis.","o":["0.4, 0.3, 0.2, 0.1","50, 50, 50, 50","70, 62, 40, 28","80, 60, 40, 20"],"answer":"80, 60, 40, 20","pairs":[],"why":"Multiply the total, 200, by each null proportion: 200 × 0.4 = 80, 200 × 0.3 = 60, 200 × 0.2 = 40 and 200 × 0.1 = 20. The expected counts add to 200.","explanationNote":"Expected counts come from the null and the sample size only. The option 70, 62, 40, 28 repeats the observed counts.","bg":"Head office expects four loaf types to make up 40%, 30%, 20% and 10% of sales. One store sold 200 loaves in a week. Managers want to know whether this store’s sales follow the expected mix.","bgr":"             White  Wholemeal  Sourdough  Rye  Total\nLoaves sold     70         62         40   28    200","model":"Expected count = 200 × null proportion, giving 80, 60, 40 and 20."},{"id":"written-2-3","w":12,"g":"Extended-answer practice","t":"Bakery mix 3 · Assumptions","q":"What assumptions does the chi-squared goodness-of-fit test need, and are they reasonable here?","o":["Every observed count is at least 30, so the central limit theorem applies to each type.","The observed counts are normally distributed with equal variances across the four types.","Sales are independent of one another and every expected count is at least 5. The smallest expected count is 20, so the second condition holds.","The four population proportions are equal."],"answer":"Sales are independent of one another and every expected count is at least 5. The smallest expected count is 20, so the second condition holds.","pairs":[],"why":"The chi-squared distribution is an approximation that works when no expected count is small. The usual rule is at least 5 in every category. Independence means one sale does not determine another.","explanationNote":"Independence deserves a comment in a written answer. One customer buying ten loaves of the same type for an event would produce dependent sales.","bg":"Head office expects four loaf types to make up 40%, 30%, 20% and 10% of sales. One store sold 200 loaves in a week. Managers want to know whether this store’s sales follow the expected mix.","bgr":"             White  Wholemeal  Sourdough  Rye  Total\nLoaves sold     70         62         40   28    200","model":"The sales should be independent, and every expected count should be at least 5. The smallest expected count is 20, so the chi-squared approximation is reasonable. Independence is plausible if customers buy separately."},{"id":"written-2-4","w":12,"g":"Extended-answer practice","t":"Bakery mix 4 · Statistic and decision","q":"Compute the test statistic, state its distribution under H₀, and decide at a significance level of 0.05.","o":["χ² = 4.52 on 4 df. Since 4.52 < 9.488, do not reject H₀.","χ² = 4.52 on 3 df. Since 4.52 < 7.815, do not reject H₀.","χ² = 4.52 on 3 df. Since 4.52 > 3.841, reject H₀.","χ² = 168 on 3 df. Since 168 > 7.815, reject H₀."],"answer":"χ² = 4.52 on 3 df. Since 4.52 < 7.815, do not reject H₀.","pairs":[],"why":"The contributions (O − E)²/E are 100/80 = 1.25, 4/60 = 0.067, 0/40 = 0 and 64/20 = 3.2, with sum 4.52. Four categories with specified probabilities give 3 df. The 5% cutoff is 7.815, so the sales are consistent with head office’s mix.","explanationNote":"The printed vector lists cutoffs for 1 to 5 df in order, so the third entry is needed. The value 168 adds the squared differences without dividing by the expected counts.","bg":"Head office expects four loaf types to make up 40%, 30%, 20% and 10% of sales. One store sold 200 loaves in a week. Managers want to know whether this store’s sales follow the expected mix.","bgr":"             White  Wholemeal  Sourdough  Rye  Total\nLoaves sold     70         62         40   28    200\n\n> round(qchisq(0.95, 1:5), 3)\n[1]  3.841  5.991  7.815  9.488 11.070","model":"χ² = (70 − 80)²/80 + (62 − 60)²/60 + (40 − 40)²/40 + (28 − 20)²/20 = 1.25 + 0.067 + 0 + 3.2 = 4.52. Under H₀ it follows a chi-squared distribution with 4 − 1 = 3 df. The 5% cutoff is 7.815. Since 4.52 < 7.815, do not reject H₀. The sales are consistent with the expected mix."},{"id":"written-2-5","w":12,"g":"Extended-answer practice","t":"Bakery mix 5 · Largest contribution","q":"Which loaf type contributes most to the test statistic, and what does that say in context?","o":["Rye, with 3.2. The store sold 28 against an expected 20, the largest departure relative to what was expected.","White, with 1.25. It has the largest difference between observed and expected counts.","Sourdough, with 0. It matches its expected count exactly.","Wholemeal, with 62. It is the count closest to the largest expected value."],"answer":"Rye, with 3.2. The store sold 28 against an expected 20, the largest departure relative to what was expected.","pairs":[],"why":"Contributions are 1.25, 0.067, 0 and 3.2. Rye is 8 above an expected 20. White is 10 below an expected 80, a larger raw difference but a smaller one relative to its expected count.","explanationNote":"Dividing by the expected count is what makes a difference of 8 in a small category weigh more than a difference of 10 in a large one. The overall test was not significant, so this is a description of where the mix differs most and not evidence of a real change.","bg":"Head office expects four loaf types to make up 40%, 30%, 20% and 10% of sales. One store sold 200 loaves in a week. Managers want to know whether this store’s sales follow the expected mix.","bgr":"             White  Wholemeal  Sourdough  Rye  Total\nLoaves sold     70         62         40   28    200","model":"Rye contributes most: 3.2 of the total 4.52. The store sold 28 rye loaves where 20 were expected, the largest departure relative to its expected count. The overall test was not significant, so this only describes where the mix differs most."},{"id":"written-3-1","w":11,"g":"Extended-answer practice","t":"Two samples 1 · Hypotheses","q":"State the null and alternative hypotheses, where μₓ and μᵧ are the two population means.","o":["H₀: μₓ − μᵧ = 3 against H₁: μₓ − μᵧ ≠ 3","H₀: μₓ − μᵧ = 0 against H₁: μₓ − μᵧ > 0","H₀: x̄ − ȳ = 0 against H₁: x̄ − ȳ ≠ 0","H₀: μₓ − μᵧ = 0 against H₁: μₓ − μᵧ ≠ 0"],"answer":"H₀: μₓ − μᵧ = 0 against H₁: μₓ − μᵧ ≠ 0","pairs":[],"why":"The question is whether the means differ, with no direction stated in advance, so the alternative is two-sided. Hypotheses are written with the population means.","explanationNote":"Choosing “greater than” after noticing that the x mean is larger would use the data to pick the alternative. The observed difference of 3 is data and does not belong in H₀.","bg":"Two samples are drawn independently from two normal populations with unknown variances. We wish to test whether the two population means differ.","bgr":"            n   mean   SD\nSample x   16   24.0  3.0\nSample y    8   21.0  5.0","model":"Let μₓ and μᵧ be the two population means. H₀: μₓ − μᵧ = 0 against H₁: μₓ − μᵧ ≠ 0."},{"id":"written-3-2","w":11,"g":"Extended-answer practice","t":"Two samples 2 · Choice of test","q":"Which test is appropriate, and why?","o":["A two-sample Z-test: the populations are normal.","A paired t-test: both samples measure the same quantity.","A two-sample t-test: independent samples from normal populations with unknown variances. The classical version also assumes equal population variances; otherwise use Welch.","A chi-squared test of independence: there are two groups."],"answer":"A two-sample t-test: independent samples from normal populations with unknown variances. The classical version also assumes equal population variances; otherwise use Welch.","pairs":[],"why":"The samples are independent and the variances are unknown and estimated, which leads to a t statistic. Whether to pool depends on whether a common variance is plausible. Sample SDs of 3.0 and 5.0 from small samples do not settle that, so stating the assumption is part of the answer.","explanationNote":"Pairing needs a natural one-to-one link between observations, which samples of 16 and 8 cannot have. A Z-test needs known population variances.","bg":"Two samples are drawn independently from two normal populations with unknown variances. We wish to test whether the two population means differ.","bgr":"            n   mean   SD\nSample x   16   24.0  3.0\nSample y    8   21.0  5.0","model":"A two-sample t-test, because the samples are independent, the populations are normal and the variances are unknown. If the two population variances can be assumed equal, use the classical (pooled) test. Otherwise use the Welch test."},{"id":"written-3-3","w":11,"g":"Extended-answer practice","t":"Two samples 3 · Pooled SD and SE","q":"For the classical two-sample t-test, calculate the pooled standard deviation and the estimated standard error of the difference in sample means.","o":["4.00 and 1.73","3.75 and 1.63","4.12 and 1.92","3.75 and 0.77"],"answer":"3.75 and 1.63","pairs":[],"why":"Pooled variance = (15 × 3.0² + 7 × 5.0²) ÷ 22 = (135 + 175) ÷ 22 = 14.09, so the pooled SD is 3.75. The standard error is 3.75 × √(1/16 + 1/8) = 3.75 × 0.433 = 1.63.","explanationNote":"The weights are the degrees of freedom, 15 and 7, so the larger sample counts for more. Averaging the SDs gives 4.00. The value 0.77 divides the pooled SD by √24, which is the formula for one sample of 24.","bg":"Two samples are drawn independently from two normal populations with unknown variances. We wish to test whether the two population means differ.","bgr":"            n   mean   SD\nSample x   16   24.0  3.0\nSample y    8   21.0  5.0","model":"Pooled variance = (15 × 3.0² + 7 × 5.0²) ÷ 22 = 14.09, so the pooled SD is 3.75. SE = 3.75 × √(1/16 + 1/8) = 1.63."},{"id":"written-3-4","w":11,"g":"Extended-answer practice","t":"Two samples 4 · Completing the test","q":"Using a 5% significance level, complete the classical two-sample t-test.","o":["t = 1.85 on 22 df. Since 1.85 < 2.074, do not reject H₀.","t = 1.85 on 22 df. Since 1.85 > 1.717, reject H₀.","t = 1.85 on 24 df. Since 1.85 > 1.711, reject H₀.","t = 0.80 on 22 df. Since 0.80 < 2.074, do not reject H₀."],"answer":"t = 1.85 on 22 df. Since 1.85 < 2.074, do not reject H₀.","pairs":[],"why":"t = (24.0 − 21.0) ÷ 1.63 = 1.85. The df are 16 + 8 − 2 = 22. A two-sided test at 5% uses the 0.975 quantile, 2.074. The statistic is inside ±2.074, so the data are consistent with equal means.","explanationNote":"The cutoff 1.717 is the 0.95 quantile and would apply to a one-sided alternative. The value 0.80 divides the difference by the pooled SD and leaves out the sample sizes.","bg":"Two samples are drawn independently from two normal populations with unknown variances. We wish to test whether the two population means differ.","bgr":"            n   mean   SD\nSample x   16   24.0  3.0\nSample y    8   21.0  5.0\n\n> round(qt(c(0.95, 0.975), 22), 3)\n[1] 1.717 2.074\n> round(qt(c(0.95, 0.975), 23), 3)\n[1] 1.714 2.069\n> round(qt(c(0.95, 0.975), 24), 3)\n[1] 1.711 2.064","model":"T = (24.0 − 21.0) ÷ 1.63 = 1.85 with 16 + 8 − 2 = 22 df. The two-sided 5% cutoff is 2.074. Since 1.85 < 2.074, do not reject H₀. There is insufficient evidence that the population means differ."},{"id":"written-3-5","w":11,"g":"Extended-answer practice","t":"Two samples 5 · A larger study","q":"A second study collects four times as many observations in each group (64 and 32) and happens to obtain the same sample means and SDs. Without redoing the full calculation, find its test statistic and conclusion at the 5% level. Take the first study’s statistic as 1.85.","o":["t ≈ 0.92. Do not reject H₀. More data make the test more conservative.","t ≈ 7.4. Reject H₀. The statistic grows in proportion to the sample size.","t ≈ 1.85. Do not reject H₀. The means and SDs are unchanged.","t ≈ 3.7. Reject H₀. The same estimated difference is now significant because the standard error has roughly halved."],"answer":"t ≈ 3.7. Reject H₀. The same estimated difference is now significant because the standard error has roughly halved.","pairs":[],"why":"With the same SDs, the standard error is proportional to 1 ÷ √n. Four times the data roughly halve it, so the statistic roughly doubles, to about 3.7, well beyond the cutoff 1.986 for 94 df.","explanationNote":"Comparing the studies shows how to read the first result. Failing to reject with 16 and 8 observations means the evidence was too weak to detect a difference of 3. It does not show that the means are equal.","bg":"Two samples are drawn independently from two normal populations with unknown variances. We wish to test whether the two population means differ.","bgr":"            n   mean   SD\nSample x   16   24.0  3.0\nSample y    8   21.0  5.0\n\n> round(qt(0.975, c(22, 94)), 3)\n[1] 2.074 1.986","model":"With four times the data and the same SDs, the SE roughly halves, so T roughly doubles, to about 3.7. This exceeds 1.986, so H₀ is rejected. The first study failed to reject because it was small. A non-significant result is not evidence that the means are equal."},{"id":"written-4-1","w":13,"g":"Extended-answer practice","t":"Rent model 1 · Fitted model","q":"Write down the fitted model and interpret its slopes.","o":["Predicted Rent = 45 + 0.7 × Area + 5 × Dist. Each extra square metre adds $0.70 to predicted weekly rent.","Predicted Rent = 210 + 4.2 × Area − 12.5 × Dist. Each extra square metre adds $4.20 to rent whatever happens to distance, and moving a flat 1 km further out causes its rent to fall by $12.50.","Predicted Rent = 210 + 4.2 × Area − 12.5 × Dist. At a fixed distance, each extra square metre adds $4.20 to predicted weekly rent. At a fixed area, each extra km lowers it by $12.50.","Predicted Rent = 210 − 4.2 × Area + 12.5 × Dist. Larger flats have lower predicted rent."],"answer":"Predicted Rent = 210 + 4.2 × Area − 12.5 × Dist. At a fixed distance, each extra square metre adds $4.20 to predicted weekly rent. At a fixed area, each extra km lowers it by $12.50.","pairs":[],"why":"The fitted model uses the Estimate column. In multiple regression each slope describes the change in the predicted response for a one-unit change in that predictor while the other predictor is held fixed.","explanationNote":"The interpretation is about predicted rent across flats in this data set. Observational data do not show what would happen to one flat if it were moved. The Std. Error column measures the precision of each estimate.","bg":"Weekly rent (Rent, in dollars) for 15 flats is modelled using floor area (Area, in square metres) and distance to the city centre (Dist, in km). Parts of the output are masked by #####. Assume the conditions for a linear regression model hold.","bgr":"> Model = lm(Rent ~ Area + Dist, data = flats)\n> summary(Model)\n\nCoefficients:\n            Estimate Std. Error t value Pr(>|t|)\n(Intercept)  210.000     45.000   #####    #####\nArea           4.200      0.700   #####    #####\nDist         -12.500      5.000   #####    #####\n\nResidual standard error: 38.5 on 12 degrees of freedom\nMultiple R-squared:  0.842,\tAdjusted R-squared:  0.816\nF-statistic: 31.97 on 2 and 12 DF,  p-value: 1.556e-05","model":"Predicted Rent = 210 + 4.2 × Area − 12.5 × Dist. Holding distance fixed, each extra square metre increases predicted weekly rent by $4.20. Holding area fixed, each extra km from the centre decreases it by $12.50."},{"id":"written-4-2","w":13,"g":"Extended-answer practice","t":"Rent model 2 · Testing a slope","q":"After adjusting for floor area, is distance significant in explaining rent at the 2% level of significance?","o":["t = −2.50. Compare with 2.303, the 0.98 quantile on 12 df. Since 2.50 > 2.303, reject H₀: distance is significant at 2%.","t = −2.50. Compare with 2.681, the 0.99 quantile on 12 df. Since 2.50 < 2.681, do not reject H₀: distance is not significant at 2%.","t = −2.50. Compare with 2.602, the 0.99 quantile on 15 df. Since 2.50 < 2.602, do not reject H₀.","t = −0.40. Compare with 2.681. Since 0.40 < 2.681, do not reject H₀."],"answer":"t = −2.50. Compare with 2.681, the 0.99 quantile on 12 df. Since 2.50 < 2.681, do not reject H₀: distance is not significant at 2%.","pairs":[],"why":"The hypotheses are H₀: the Dist coefficient is 0 against H₁: it is not 0. The statistic is −12.500 ÷ 5.000 = −2.50. A two-sided test at 2% leaves 1% in each tail, so use the 0.99 quantile with the residual df, 12.","explanationNote":"The residual df are printed in the output: 15 flats minus 3 estimated coefficients. Using the 0.98 quantile would put the whole 2% in one tail. At the 5% level the cutoff is 2.179 and the same slope would be significant, so the conclusion depends on the chosen level.","bg":"Weekly rent (Rent, in dollars) for 15 flats is modelled using floor area (Area, in square metres) and distance to the city centre (Dist, in km). Parts of the output are masked by #####. Assume the conditions for a linear regression model hold.","bgr":"> Model = lm(Rent ~ Area + Dist, data = flats)\n> summary(Model)\n\nCoefficients:\n            Estimate Std. Error t value Pr(>|t|)\n(Intercept)  210.000     45.000   #####    #####\nArea           4.200      0.700   #####    #####\nDist         -12.500      5.000   #####    #####\n\nResidual standard error: 38.5 on 12 degrees of freedom\nMultiple R-squared:  0.842,\tAdjusted R-squared:  0.816\nF-statistic: 31.97 on 2 and 12 DF,  p-value: 1.556e-05\n\n> round(qt(c(0.98, 0.99, 0.995), 12), 3)\n[1] 2.303 2.681 3.055\n> round(qt(c(0.98, 0.99, 0.995), 13), 3)\n[1] 2.282 2.650 3.012\n> round(qt(c(0.98, 0.99, 0.995), 15), 3)\n[1] 2.249 2.602 2.947","model":"H₀: the coefficient of Dist is 0. H₁: it is not 0. T = −12.5 ÷ 5.0 = −2.50 on 12 residual df. A two-sided 2% test uses the 0.99 quantile, 2.681. Since 2.50 < 2.681, do not reject H₀. After adjusting for area, distance is not significant at the 2% level."},{"id":"written-4-3","w":13,"g":"Extended-answer practice","t":"Rent model 3 · Which predictor matters more?","q":"A colleague argues that distance matters more than floor area because its coefficient is larger in size (12.5 against 4.2). Do you agree?","o":["No. Coefficients depend on units. The t values are 6.00 for Area and −2.50 for Dist, so the evidence for Area is stronger.","Yes. The predictor with the larger coefficient in absolute value has the larger effect.","No. Area matters more because its coefficient is positive.","Yes. Distance has the larger standard error, so it explains more variation."],"answer":"No. Coefficients depend on units. The t values are 6.00 for Area and −2.50 for Dist, so the evidence for Area is stronger.","pairs":[],"why":"One km and one square metre are different units, so their coefficients cannot be compared directly. Measuring distance in metres would make its coefficient −0.0125 with no change to the model. The t values, 4.200 ÷ 0.700 and −12.500 ÷ 5.000, are free of units.","explanationNote":"A written answer should state the disagreement, give the units argument, and quote both t values from the output.","bg":"Weekly rent (Rent, in dollars) for 15 flats is modelled using floor area (Area, in square metres) and distance to the city centre (Dist, in km). Parts of the output are masked by #####. Assume the conditions for a linear regression model hold.","bgr":"> Model = lm(Rent ~ Area + Dist, data = flats)\n> summary(Model)\n\nCoefficients:\n            Estimate Std. Error t value Pr(>|t|)\n(Intercept)  210.000     45.000   #####    #####\nArea           4.200      0.700   #####    #####\nDist         -12.500      5.000   #####    #####\n\nResidual standard error: 38.5 on 12 degrees of freedom\nMultiple R-squared:  0.842,\tAdjusted R-squared:  0.816\nF-statistic: 31.97 on 2 and 12 DF,  p-value: 1.556e-05","model":"No. The coefficients are in different units, dollars per km and dollars per square metre, so their sizes cannot be compared. The t values are 4.2 ÷ 0.7 = 6.00 for Area and −2.50 for Dist, so the evidence is stronger for Area."},{"id":"written-4-4","w":13,"g":"Extended-answer practice","t":"Rent model 4 · Fitted value and residual","q":"One flat has an area of 60 square metres, is 8 km from the centre and rents for $400 a week. Compute its fitted value and residual. Did the model overestimate or underestimate, and is this flat unusually poorly fitted?","o":["Fitted value 562, residual −162. The model overestimates. The fit is unusually poor.","Fitted value 362, residual −38. The model overestimates. The fit is not unusual.","Fitted value 362, residual 38. The model underestimates. The fit is unusually poor because the residual is close to 38.5.","Fitted value 362, residual 38. The model underestimates. The residual is about one residual standard error, so the fit is not unusual."],"answer":"Fitted value 362, residual 38. The model underestimates. The residual is about one residual standard error, so the fit is not unusual.","pairs":[],"why":"Fitted value = 210 + 4.2 × 60 − 12.5 × 8 = 210 + 252 − 100 = 362. Residual = observed − fitted = 400 − 362 = 38. A positive residual means the actual rent is above the prediction.","explanationNote":"The residual standard error, 38.5, is the typical distance of a rent from its fitted value. A residual of that size is ordinary. One beyond about two residual standard errors, here roughly 77, would stand out.","bg":"Weekly rent (Rent, in dollars) for 15 flats is modelled using floor area (Area, in square metres) and distance to the city centre (Dist, in km). Parts of the output are masked by #####. Assume the conditions for a linear regression model hold.","bgr":"> Model = lm(Rent ~ Area + Dist, data = flats)\n> summary(Model)\n\nCoefficients:\n            Estimate Std. Error t value Pr(>|t|)\n(Intercept)  210.000     45.000   #####    #####\nArea           4.200      0.700   #####    #####\nDist         -12.500      5.000   #####    #####\n\nResidual standard error: 38.5 on 12 degrees of freedom\nMultiple R-squared:  0.842,\tAdjusted R-squared:  0.816\nF-statistic: 31.97 on 2 and 12 DF,  p-value: 1.556e-05","model":"Fitted value = 210 + 4.2 × 60 − 12.5 × 8 = 362. Residual = 400 − 362 = 38. The residual is positive, so the model underestimates the rent. It is about one residual standard error (38.5), well inside two, so this flat is not unusually poorly fitted."},{"id":"written-5-1","w":9,"g":"Extended-answer practice","t":"Trial subscriptions 1 · Hypotheses","q":"State the null and alternative hypotheses, where p is the proportion of all trial users who subscribe.","o":["H₀: p̂ = 0.555 against H₁: p̂ < 0.60","H₀: p = 0.60 against H₁: p ≠ 0.60","H₀: p = 0.60 against H₁: p < 0.60","H₀: p < 0.60 against H₁: p = 0.60"],"answer":"H₀: p = 0.60 against H₁: p < 0.60","pairs":[],"why":"The parameter is the proportion of all trial users who subscribe. The null takes the stated value, 0.60. The analyst suspected a lower proportion before looking at the data, so the alternative is one-sided.","explanationNote":"The sample proportion 0.555 is data and does not appear in a hypothesis. The null always carries the equals sign.","bg":"A streaming service states that 60% of people who take a free trial go on to subscribe. An analyst suspects the true proportion is lower. In a random sample of 400 trial users, 222 subscribed.","bgr":"> 222 / 400\n[1] 0.555","model":"Let p be the proportion of all trial users who subscribe. H₀: p = 0.60 against H₁: p < 0.60."},{"id":"written-5-2","w":9,"g":"Extended-answer practice","t":"Trial subscriptions 2 · Assumptions","q":"What assumptions does the Z-test for a proportion need, and are they reasonable here?","o":["The number of subscribers is normally distributed in the population, and the population SD is known.","The 400 users are an independent random sample, and the sample is large enough for a normal approximation: under H₀ the expected counts are 240 subscribers and 160 non-subscribers.","At least 30 users subscribed, so the central limit theorem applies to each user.","The sample proportion equals the population proportion."],"answer":"The 400 users are an independent random sample, and the sample is large enough for a normal approximation: under H₀ the expected counts are 240 subscribers and 160 non-subscribers.","pairs":[],"why":"Each user either subscribes or does not, so the count is a sum of independent 0–1 draws. The normal approximation is good when both expected counts, 400 × 0.60 and 400 × 0.40, are large.","explanationNote":"Check the expected counts under the null value, because the test statistic is calculated assuming H₀. Random sampling is what justifies independence.","bg":"A streaming service states that 60% of people who take a free trial go on to subscribe. An analyst suspects the true proportion is lower. In a random sample of 400 trial users, 222 subscribed.","bgr":"> 222 / 400\n[1] 0.555","model":"The users must be an independent random sample of trial users. Under H₀ the expected counts are 400 × 0.60 = 240 and 400 × 0.40 = 160, both large, so the sample proportion is approximately normal."},{"id":"written-5-3","w":9,"g":"Extended-answer practice","t":"Trial subscriptions 3 · Test statistic","q":"Compute the observed test statistic.","o":["−1.84","−1.81","1.84","−0.09"],"answer":"−1.84","pairs":[],"why":"Under H₀ the standard error is √(0.60 × 0.40 ÷ 400) = 0.0245. Z = (0.555 − 0.60) ÷ 0.0245 = −1.84.","explanationNote":"The value −1.81 uses the sample proportion 0.555 in the standard error. A test statistic is worked out as if H₀ were true, so use 0.60. The value −0.09 divides by the SD of a single user, 0.49, and leaves out the sample size.","bg":"A streaming service states that 60% of people who take a free trial go on to subscribe. An analyst suspects the true proportion is lower. In a random sample of 400 trial users, 222 subscribed.","bgr":"> 222 / 400\n[1] 0.555","model":"SE under H₀ = √(0.60 × 0.40 ÷ 400) = 0.0245. Z = (0.555 − 0.60) ÷ 0.0245 = −1.84."},{"id":"written-5-4","w":9,"g":"Extended-answer practice","t":"Trial subscriptions 4 · p-value and conclusion","q":"The observed statistic is −1.84. Find the p-value and state the conclusion at the 5% level.","o":["p-value ≈ 0.033. Do not reject H₀, because the statistic is negative.","p-value ≈ 0.066. Do not reject H₀.","p-value ≈ 0.967. Do not reject H₀.","p-value ≈ 0.033. Reject H₀: there is evidence that fewer than 60% of trial users subscribe."],"answer":"p-value ≈ 0.033. Reject H₀: there is evidence that fewer than 60% of trial users subscribe.","pairs":[],"why":"The alternative is p < 0.60, so the p-value is the area below −1.84, which pnorm(-1.84) gives directly: 0.033. This is below 0.05, so H₀ is rejected.","explanationNote":"The value 0.967 is the area below +1.84. A negative statistic is exactly what the alternative predicts here, so it counts as evidence against H₀.","bg":"A streaming service states that 60% of people who take a free trial go on to subscribe. An analyst suspects the true proportion is lower. In a random sample of 400 trial users, 222 subscribed.","bgr":"> 222 / 400\n[1] 0.555\n> pnorm(c(-1.84, 1.84))\n[1] 0.03288412 0.96711588","model":"The test is lower-tailed, so the p-value is P(Z ≤ −1.84) = 0.033. Since 0.033 < 0.05, reject H₀. The data give evidence that the proportion of trial users who subscribe is below 60%."},{"id":"written-5-5","w":9,"g":"Extended-answer practice","t":"Trial subscriptions 5 · A two-sided question","q":"Suppose the analyst had instead asked, before seeing the data, whether the proportion differs from 60% in either direction. What changes?","o":["The p-value halves to about 0.016, so the evidence is stronger.","Nothing changes: the statistic and the conclusion are the same.","The p-value doubles to about 0.066, so H₀ would not be rejected at the 5% level.","The statistic becomes +1.84 and H₀ is rejected."],"answer":"The p-value doubles to about 0.066, so H₀ would not be rejected at the 5% level.","pairs":[],"why":"A two-sided alternative counts both tails: 2 × 0.033 = 0.066, which is above 0.05. The same data lead to a different decision.","explanationNote":"This is why the alternative must be chosen before looking at the data. Picking the one-sided direction after seeing that the sample proportion came out low would understate the p-value.","bg":"A streaming service states that 60% of people who take a free trial go on to subscribe. An analyst suspects the true proportion is lower. In a random sample of 400 trial users, 222 subscribed.","bgr":"> 222 / 400\n[1] 0.555\n> pnorm(c(-1.84, 1.84))\n[1] 0.03288412 0.96711588","model":"With a two-sided alternative the p-value is 2 × 0.033 = 0.066, which exceeds 0.05, so H₀ would not be rejected. The choice between a one-sided and a two-sided alternative has to be made before seeing the data."},{"id":"written-5-6","w":9,"g":"Extended-answer practice","t":"Trial subscriptions 6 · The box model","q":"Describe the box model behind this test. The service has several million trial users, and the 400 were drawn without replacement.","o":["A box with exactly 100 tickets, 60 marked 1 and 40 marked 0. Because the real population has millions of users, such a box cannot represent it.","One ticket per trial user, marked with the number of months subscribed. The sample is 222 draws.","One ticket per trial user, marked 1 for a subscriber and 0 otherwise. The sample is 400 draws. Drawing without replacement hardly matters, because 400 is a tiny fraction of the box.","One ticket per trial user, marked 1 or 0. The model cannot be used, because the draws were made without replacement."],"answer":"One ticket per trial user, marked 1 for a subscriber and 0 otherwise. The sample is 400 draws. Drawing without replacement hardly matters, because 400 is a tiny fraction of the box.","pairs":[],"why":"A proportion is the mean of a 0–1 box: each ticket is a person, and 1 marks the outcome being counted. The sample proportion is the average of 400 draws. When the box is very large compared with the sample, draws without replacement behave almost exactly like draws with replacement.","explanationNote":"A box with 60 ones and 40 zeros has the right proportions under H₀ and gives the same expected value and standard error for draws with replacement. What matters is the proportion of ones, not the number of tickets. The sample must still be drawn at random for the model to apply.","model":"The box has one ticket for each trial user: 1 if the user subscribes and 0 if not. The proportion of 1s is p. The sample is 400 random draws, and the sample proportion is the average of the draws. Because 400 is a tiny fraction of several million, drawing without replacement makes no practical difference to the standard error.","bg":"A streaming service states that 60% of people who take a free trial go on to subscribe. An analyst suspects the true proportion is lower. In a random sample of 400 trial users, 222 subscribed.","bgr":"> 222 / 400\n[1] 0.555"},{"id":"written-6-1","w":11,"g":"Extended-answer practice","t":"Keyboards 1 · Choice of test","q":"Which procedure should be used to compare the two keyboards, and why?","o":["A Welch two-sample t-test: the two keyboards form two groups of ten speeds.","A paired t-test: each typist is measured on both keyboards, so the two speeds from one typist are dependent.","A classical two-sample t-test with 18 df: the sample sizes are equal.","A Z-test: ten differences are enough for the central limit theorem."],"answer":"A paired t-test: each typist is measured on both keyboards, so the two speeds from one typist are dependent.","pairs":[],"why":"A fast typist is fast on both keyboards, so the two columns are not independent samples. Taking one difference per typist removes the variation between typists and leaves a single sample of ten differences.","explanationNote":"Both two-sample tests assume the groups are independent. The population SD of the differences is unknown and the sample is small, so a t distribution is needed.","bg":"Ten typists each type the same passage on two keyboards, A and B, in random order. Typing speed is recorded in words per minute. There was no prior expectation about which keyboard is faster. The analysis uses the ten differences, B minus A, which look approximately normal.","bgr":"> d = speedB - speedA\n> length(d)\n[1] 10\n> mean(d)\n[1] 2.6\n> sd(d)\n[1] 3.2","model":"Use a paired t-test. Each typist gives two measurements, which are dependent, so the analysis is a one-sample t-test on the ten differences, assuming the differences are approximately normal."},{"id":"written-6-2","w":11,"g":"Extended-answer practice","t":"Keyboards 2 · Hypotheses","q":"State the hypotheses, where μ is the population mean of the differences, B minus A.","o":["H₀: μ = 0 against H₁: μ ≠ 0","H₀: μ = 0 against H₁: μ > 0","H₀: d̄ = 0 against H₁: d̄ ≠ 0","H₀: μ = 2.6 against H₁: μ ≠ 2.6"],"answer":"H₀: μ = 0 against H₁: μ ≠ 0","pairs":[],"why":"No direction was specified in advance, so the alternative is two-sided. The null says the keyboards give the same mean speed, which is a mean difference of zero.","explanationNote":"Choosing “greater than” because the sample mean came out positive would use the data to pick the alternative.","bg":"Ten typists each type the same passage on two keyboards, A and B, in random order. Typing speed is recorded in words per minute. There was no prior expectation about which keyboard is faster. The analysis uses the ten differences, B minus A, which look approximately normal.","bgr":"> d = speedB - speedA\n> length(d)\n[1] 10\n> mean(d)\n[1] 2.6\n> sd(d)\n[1] 3.2","model":"Let μ be the population mean difference in typing speed, B minus A. H₀: μ = 0 against H₁: μ ≠ 0."},{"id":"written-6-3","w":11,"g":"Extended-answer practice","t":"Keyboards 3 · Test statistic","q":"Compute the test statistic and state its distribution under H₀.","o":["t = 8.13 on 9 df","t = 2.57 on 18 df","t = 0.81 on 9 df","t = 2.57 on 9 df"],"answer":"t = 2.57 on 9 df","pairs":[],"why":"The standard error of the mean difference is 3.2 ÷ √10 = 1.012. t = 2.6 ÷ 1.012 = 2.57. There are ten differences, so the df are 9.","explanationNote":"The option with 18 df treats the data as two independent groups of ten. The value 0.81 divides by the SD of the differences, and 8.13 divides the SD by n where √n is needed.","bg":"Ten typists each type the same passage on two keyboards, A and B, in random order. Typing speed is recorded in words per minute. There was no prior expectation about which keyboard is faster. The analysis uses the ten differences, B minus A, which look approximately normal.","bgr":"> d = speedB - speedA\n> length(d)\n[1] 10\n> mean(d)\n[1] 2.6\n> sd(d)\n[1] 3.2","model":"SE = 3.2 ÷ √10 = 1.012. T = (2.6 − 0) ÷ 1.012 = 2.57, which follows a t distribution with 10 − 1 = 9 df under H₀."},{"id":"written-6-4","w":11,"g":"Extended-answer practice","t":"Keyboards 4 · Decision","q":"For the two-sided test, the statistic is 2.57. At the 5% level, what is the conclusion?","o":["Reject H₀, because 2.57 > 1.833.","Do not reject H₀, because 2.57 is not greater than 2.262 × 2.","Reject H₀, because 2.57 > 2.262: there is evidence that mean typing speed differs between the keyboards.","Do not reject H₀, because 2.57 > 2.101."],"answer":"Reject H₀, because 2.57 > 2.262: there is evidence that mean typing speed differs between the keyboards.","pairs":[],"why":"A two-sided test at 5% uses the 0.975 quantile on 9 df, which is 2.262. The statistic lies beyond it.","explanationNote":"The value 1.833 is the 0.95 quantile and belongs to a one-sided test. The value 2.101 is for 18 df. Here the conclusion happens to be the same with 1.833, but the reasoning would be wrong.","bg":"Ten typists each type the same passage on two keyboards, A and B, in random order. Typing speed is recorded in words per minute. There was no prior expectation about which keyboard is faster. The analysis uses the ten differences, B minus A, which look approximately normal.","bgr":"> d = speedB - speedA\n> length(d)\n[1] 10\n> mean(d)\n[1] 2.6\n> sd(d)\n[1] 3.2\n> round(qt(c(0.95, 0.975), 9), 3)\n[1] 1.833 2.262\n> round(qt(c(0.95, 0.975), 10), 3)\n[1] 1.812 2.228\n> round(qt(c(0.95, 0.975), 18), 3)\n[1] 1.734 2.101","model":"The two-sided 5% cutoff from the t distribution with 9 df is 2.262. Since 2.57 > 2.262, reject H₀. There is evidence that the mean typing speed differs between the keyboards, with B faster in this sample."},{"id":"written-6-5","w":11,"g":"Extended-answer practice","t":"Keyboards 5 · Confidence interval","q":"Give a 95% confidence interval for the mean difference and say how it relates to the test.","o":["[0.62, 4.58]. It excludes 0, which agrees with rejecting H₀ at the 5% level.","[0.31, 4.89]. It excludes 0, which agrees with rejecting H₀ at the 5% level.","[−4.64, 9.84]. It includes 0, so H₀ should not have been rejected.","[0.31, 4.89]. It shows that 95% of typists are faster on keyboard B."],"answer":"[0.31, 4.89]. It excludes 0, which agrees with rejecting H₀ at the 5% level.","pairs":[],"why":"The margin is 2.262 × 1.012 = 2.29, so the interval is 2.6 ± 2.29. A two-sided test at 5% rejects exactly when the 95% interval excludes the null value.","explanationNote":"The interval [0.62, 4.58] uses the normal cutoff 1.96. The wide interval multiplies the cutoff by the SD without dividing by √10. The interval is about the mean difference, not about individual typists.","bg":"Ten typists each type the same passage on two keyboards, A and B, in random order. Typing speed is recorded in words per minute. There was no prior expectation about which keyboard is faster. The analysis uses the ten differences, B minus A, which look approximately normal.","bgr":"> d = speedB - speedA\n> length(d)\n[1] 10\n> mean(d)\n[1] 2.6\n> sd(d)\n[1] 3.2\n> round(qt(c(0.95, 0.975), 9), 3)\n[1] 1.833 2.262","model":"2.6 ± 2.262 × 1.012 = [0.31, 4.89] words per minute. The interval does not contain 0, which agrees with the test: keyboard B is estimated to be between about 0.3 and 4.9 words per minute faster on average."},{"id":"written-7-1","w":12,"g":"Extended-answer practice","t":"Class format 1 · Hypotheses","q":"State the null and alternative hypotheses.","o":["H₀: preferred format is independent of study mode. H₁: preferred format and study mode are related.","H₀: the three formats are equally popular. H₁: they are not equally popular.","H₀: the observed counts equal the expected counts. H₁: they do not.","H₀: full-time and part-time students are equally numerous. H₁: they are not."],"answer":"H₀: preferred format is independent of study mode. H₁: preferred format and study mode are related.","pairs":[],"why":"There are two categorical variables measured on each student, so this is a test of independence. Under H₀ the distribution of preferred format is the same for full-time and part-time students.","explanationNote":"“Equally popular” would be a goodness-of-fit question about one variable. Hypotheses describe the population, not the counts in this sample.","bg":"A university asks 200 randomly chosen students which class format they prefer. The table shows the answers by study mode. The question is whether preferred format is related to study mode.","bgr":"            Lecture  Online  Mixed  Total\nFull-time        50      30     40    120\nPart-time        20      40     20     80\nTotal            70      70     60    200","model":"H₀: preferred class format is independent of study mode. H₁: preferred format and study mode are not independent."},{"id":"written-7-2","w":12,"g":"Extended-answer practice","t":"Class format 2 · Expected count","q":"Under H₀, what is the expected number of part-time students who prefer online classes?","o":["33.3","40","35","28"],"answer":"28","pairs":[],"why":"Expected count = row total × column total ÷ grand total = 80 × 70 ÷ 200 = 28.","explanationNote":"Under independence, 70 of 200 students (35%) prefer online, and that share is applied to the 80 part-time students. The value 40 is the observed count.","bg":"A university asks 200 randomly chosen students which class format they prefer. The table shows the answers by study mode. The question is whether preferred format is related to study mode.","bgr":"            Lecture  Online  Mixed  Total\nFull-time        50      30     40    120\nPart-time        20      40     20     80\nTotal            70      70     60    200","model":"Expected count = 80 × 70 ÷ 200 = 28."},{"id":"written-7-3","w":12,"g":"Extended-answer practice","t":"Class format 3 · Degrees of freedom and conditions","q":"State the degrees of freedom and check the condition for using the chi-squared distribution.","o":["2 df. The smallest observed count is 20, so the approximation is reasonable.","5 df. The smallest expected count is 24, so the approximation is reasonable.","2 df. The smallest expected count is 24, well above 5, so the approximation is reasonable.","6 df. Every cell has at least 5 students."],"answer":"2 df. The smallest expected count is 24, well above 5, so the approximation is reasonable.","pairs":[],"why":"df = (rows − 1) × (columns − 1) = 1 × 2 = 2. The condition concerns expected counts, and the smallest is 80 × 60 ÷ 200 = 24.","explanationNote":"Six is the number of cells, and five would be the df for a goodness-of-fit test with six categories. The totals row and column are not counted.","bg":"A university asks 200 randomly chosen students which class format they prefer. The table shows the answers by study mode. The question is whether preferred format is related to study mode.","bgr":"            Lecture  Online  Mixed  Total\nFull-time        50      30     40    120\nPart-time        20      40     20     80\nTotal            70      70     60    200","model":"df = (2 − 1)(3 − 1) = 2. The expected counts are 42, 42, 36, 28, 28 and 24, all at least 5, and the students were sampled independently, so the chi-squared approximation is appropriate."},{"id":"written-7-4","w":12,"g":"Extended-answer practice","t":"Class format 4 · Statistic and decision","q":"Use the output to give the test statistic and the conclusion at the 5% level.","o":["χ² = 13.49 on 2 df. Since 13.49 > 5.991, do not reject H₀.","χ² = 13.49 on 2 df. Since 13.49 > 5.991, reject H₀: preferred format is related to study mode.","χ² = 13.49 on 6 df. Since 13.49 > 12.592, reject H₀.","χ² = 5.14 on 2 df. Since 5.14 < 5.991, do not reject H₀."],"answer":"χ² = 13.49 on 2 df. Since 13.49 > 5.991, reject H₀: preferred format is related to study mode.","pairs":[],"why":"The statistic is the sum of the six contributions, 13.49. Large values are evidence against independence. The 5% cutoff on 2 df is the second entry of the printed vector, 5.991.","explanationNote":"The value 5.14 is the largest single contribution, not the total. Exceeding the cutoff leads to rejection, because the test is upper-tailed.","bg":"A university asks 200 randomly chosen students which class format they prefer. The table shows the answers by study mode. The question is whether preferred format is related to study mode.","bgr":"            Lecture  Online  Mixed  Total\nFull-time        50      30     40    120\nPart-time        20      40     20     80\nTotal            70      70     60    200\n\n> round((O - E)^2 / E, 3)\n          Lecture Online Mixed\nFull-time   1.524  3.429 0.444\nPart-time   2.286  5.143 0.667\n> sum((O - E)^2 / E)\n[1] 13.49206\n> round(qchisq(0.95, 1:6), 3)\n[1]  3.841  5.991  7.815  9.488 11.070 12.592","model":"χ² = 13.49, which follows a chi-squared distribution with 2 df under H₀. The 5% cutoff is 5.991. Since 13.49 > 5.991, reject H₀. There is evidence that preferred class format depends on study mode."},{"id":"written-7-5","w":12,"g":"Extended-answer practice","t":"Class format 5 · Where the difference lies","q":"Which cell contributes most to the statistic, and what does that say in context?","o":["Part-time, online (5.14): 40 part-time students chose online where 28 were expected.","Full-time, lecture (1.52): it has the largest observed count, 50.","Full-time, online (3.43): full-time students chose online more often than expected.","Part-time, mixed (0.67): it has the smallest expected count."],"answer":"Part-time, online (5.14): 40 part-time students chose online where 28 were expected.","pairs":[],"why":"The largest contribution is 5.143 for part-time students preferring online classes. The observed count, 40, is well above the expected 28.","explanationNote":"Full-time students chose online less often than expected, 30 against 42, which is the second largest contribution. Together the two online cells account for most of the statistic.","bg":"A university asks 200 randomly chosen students which class format they prefer. The table shows the answers by study mode. The question is whether preferred format is related to study mode.","bgr":"            Lecture  Online  Mixed  Total\nFull-time        50      30     40    120\nPart-time        20      40     20     80\nTotal            70      70     60    200\n\n> round((O - E)^2 / E, 3)\n          Lecture Online Mixed\nFull-time   1.524  3.429 0.444\nPart-time   2.286  5.143 0.667","model":"The part-time, online cell contributes most, 5.14 of 13.49. Forty part-time students preferred online classes where 28 were expected under independence, so part-time students favour online classes more than full-time students do."},{"id":"written-8-1","w":13,"g":"Extended-answer practice","t":"Advertising 1 · Interpreting the line","q":"Write down the fitted line and interpret its slope.","o":["Predicted Advert = 25 + 1.8 × Sales. Each extra $1,000 of sales needs $180 more advertising.","Predicted Sales = 25 + 1.8 × Advert. Each extra $1 of advertising is associated with $1.80 more sales.","Predicted Sales = 6 + 0.6 × Advert. Each extra $100 of advertising is associated with $600 more predicted sales.","Predicted Sales = 25 + 1.8 × Advert. Each extra $100 of weekly advertising is associated with $1,800 more predicted weekly sales."],"answer":"Predicted Sales = 25 + 1.8 × Advert. Each extra $100 of weekly advertising is associated with $1,800 more predicted weekly sales.","pairs":[],"why":"The Estimate column gives the line. Advert is measured in hundreds of dollars and Sales in thousands, so one unit of Advert is $100 and 1.8 units of Sales is $1,800.","explanationNote":"Always carry the units through. The Std. Error column measures the precision of the estimates and does not define the line.","bg":"A retail chain models weekly sales (Sales, in thousands of dollars) for 20 shops using weekly advertising spending (Advert, in hundreds of dollars). Parts of the output are masked by #####.","bgr":"> fit = lm(Sales ~ Advert, data = shops)\n> summary(fit)\n\nCoefficients:\n            Estimate Std. Error t value Pr(>|t|)\n(Intercept)   25.000      6.000   #####    #####\nAdvert         1.800      0.600   #####    #####\n\nResidual standard error: 8.5 on 18 degrees of freedom\nMultiple R-squared:  0.3333","model":"Predicted Sales = 25 + 1.8 × Advert. For each additional $100 of weekly advertising, predicted weekly sales are $1,800 higher. The intercept, $25,000, is the predicted sales of a shop that spends nothing on advertising."},{"id":"written-8-2","w":13,"g":"Extended-answer practice","t":"Advertising 2 · Testing the slope","q":"Is advertising spending a significant predictor of sales at the 5% level?","o":["No. t = 0.33 on 18 df, and 0.33 < 2.101.","Yes. t = 3.00 on 20 df, and 3.00 > 2.086.","Yes. t = 3.00 on 18 df, and 3.00 > 2.101.","No. t = 3.00 on 18 df, and 3.00 > 1.734."],"answer":"Yes. t = 3.00 on 18 df, and 3.00 > 2.101.","pairs":[],"why":"t = Estimate ÷ Std. Error = 1.800 ÷ 0.600 = 3.00. The residual df, 18, are printed in the output. The two-sided 5% cutoff is 2.101.","explanationNote":"With 20 shops and two estimated coefficients the df are 20 − 2 = 18. The value 0.33 turns the ratio upside down.","bg":"A retail chain models weekly sales (Sales, in thousands of dollars) for 20 shops using weekly advertising spending (Advert, in hundreds of dollars). Parts of the output are masked by #####.","bgr":"> fit = lm(Sales ~ Advert, data = shops)\n> summary(fit)\n\nCoefficients:\n            Estimate Std. Error t value Pr(>|t|)\n(Intercept)   25.000      6.000   #####    #####\nAdvert         1.800      0.600   #####    #####\n\nResidual standard error: 8.5 on 18 degrees of freedom\nMultiple R-squared:  0.3333\n\n> round(qt(c(0.95, 0.975), 18), 3)\n[1] 1.734 2.101\n> round(qt(c(0.95, 0.975), 19), 3)\n[1] 1.729 2.093\n> round(qt(c(0.95, 0.975), 20), 3)\n[1] 1.725 2.086","model":"H₀: the slope is 0. H₁: the slope is not 0. T = 1.800 ÷ 0.600 = 3.00 on 18 df. The two-sided 5% cutoff is 2.101. Since 3.00 > 2.101, reject H₀: advertising spending is a significant predictor of sales."},{"id":"written-8-3","w":13,"g":"Extended-answer practice","t":"Advertising 3 · Interval for the slope","q":"Give a 95% confidence interval for the slope.","o":["[0.62, 2.98]","[0.54, 3.06]","[1.20, 2.40]","[−16.06, 19.66]"],"answer":"[0.54, 3.06]","pairs":[],"why":"Estimate ± cutoff × standard error = 1.8 ± 2.101 × 0.6 = 1.8 ± 1.26.","explanationNote":"The interval [0.62, 2.98] uses the normal cutoff 1.96. The interval [1.20, 2.40] is one standard error either side. The widest option uses the residual standard error, 8.5, in place of the slope’s standard error.","bg":"A retail chain models weekly sales (Sales, in thousands of dollars) for 20 shops using weekly advertising spending (Advert, in hundreds of dollars). Parts of the output are masked by #####.","bgr":"> fit = lm(Sales ~ Advert, data = shops)\n> summary(fit)\n\nCoefficients:\n            Estimate Std. Error t value Pr(>|t|)\n(Intercept)   25.000      6.000   #####    #####\nAdvert         1.800      0.600   #####    #####\n\nResidual standard error: 8.5 on 18 degrees of freedom\nMultiple R-squared:  0.3333\n\n> round(qt(c(0.95, 0.975), 18), 3)\n[1] 1.734 2.101","model":"1.8 ± 2.101 × 0.6 = [0.54, 3.06]. Each extra $100 of advertising is associated with between $540 and $3,060 more weekly sales, with 95% confidence. The interval excludes 0, in agreement with the test."},{"id":"written-8-4","w":13,"g":"Extended-answer practice","t":"Advertising 4 · Strength of the relationship","q":"What is the correlation between advertising and sales, and how much of the variation in sales does the line explain?","o":["r = 0.58, and the line explains about 33% of the variation in sales.","r = 0.33, and the line explains about 33% of the variation in sales.","r = −0.58, and the line explains about 33% of the variation in sales.","r = 0.58, and the line explains about 58% of the variation in sales."],"answer":"r = 0.58, and the line explains about 33% of the variation in sales.","pairs":[],"why":"With one predictor, R² = r². So r = √0.3333 = 0.58 in size, and it is positive because the slope is positive. R² itself is the proportion of variation explained.","explanationNote":"A significant slope does not mean a strong relationship: two thirds of the variation in sales is left unexplained by advertising.","bg":"A retail chain models weekly sales (Sales, in thousands of dollars) for 20 shops using weekly advertising spending (Advert, in hundreds of dollars). Parts of the output are masked by #####.","bgr":"> fit = lm(Sales ~ Advert, data = shops)\n> summary(fit)\n\nCoefficients:\n            Estimate Std. Error t value Pr(>|t|)\n(Intercept)   25.000      6.000   #####    #####\nAdvert         1.800      0.600   #####    #####\n\nResidual standard error: 8.5 on 18 degrees of freedom\nMultiple R-squared:  0.3333","model":"R² = 0.333, so the line explains about 33% of the variation in weekly sales. The correlation is r = +√0.333 = 0.58, positive because the slope is positive."},{"id":"written-8-5","w":13,"g":"Extended-answer practice","t":"Advertising 5 · Checking the model","q":"A plot of residuals against fitted values shows points scattered evenly around zero for low fitted values and much more widely for high fitted values. Which assumption is in doubt, and why does it matter?","o":["Normality of sales. The response should be normally distributed.","Linearity. The fitted line has the wrong slope.","Independence of the shops. The shops should be resampled.","Constant variance of the errors. The standard errors, and so the t-test and the interval, may not be reliable."],"answer":"Constant variance of the errors. The standard errors, and so the t-test and the interval, may not be reliable.","pairs":[],"why":"A spread that widens with the fitted value is a funnel shape, the sign of non-constant variance. The usual formulas for standard errors assume the same error variance everywhere.","explanationNote":"A curved band would point to non-linearity. Independence comes from how the shops were chosen and cannot be read from this plot. Normality concerns the errors and is checked with a Q–Q plot of the residuals.","bg":"A retail chain models weekly sales (Sales, in thousands of dollars) for 20 shops using weekly advertising spending (Advert, in hundreds of dollars). Parts of the output are masked by #####.","bgr":"> fit = lm(Sales ~ Advert, data = shops)\n> summary(fit)\n\nCoefficients:\n            Estimate Std. Error t value Pr(>|t|)\n(Intercept)   25.000      6.000   #####    #####\nAdvert         1.800      0.600   #####    #####\n\nResidual standard error: 8.5 on 18 degrees of freedom\nMultiple R-squared:  0.3333","model":"The widening spread suggests the errors do not have constant variance (heteroscedasticity). The estimated line is still usable for prediction, but the standard errors, t-test and confidence interval rely on constant variance and may be unreliable. A transformation such as the log of sales could be tried."},{"id":"written-9-1","w":14,"g":"Extended-answer practice","t":"House prices 1 · Hypotheses","q":"State the hypotheses tested by anova(reduced, full).","o":["H₀: the coefficients of Rooms and Age are equal. H₁: they are different.","H₀: the coefficients of Area, Rooms and Age are all zero. H₁: at least one is not zero.","H₀: the coefficients of Rooms and Age are both zero. H₁: at least one of them is not zero.","H₀: the reduced model fits perfectly. H₁: it does not."],"answer":"H₀: the coefficients of Rooms and Age are both zero. H₁: at least one of them is not zero.","pairs":[],"why":"The test concerns exactly the terms that are in the full model and not in the reduced one. Area is in both models, so its coefficient is not being tested.","explanationNote":"The alternative is “at least one”, not “both”: one useful extra predictor is enough to make the full model better.","bg":"House prices (in thousands of dollars) for 49 houses are modelled in two ways. The reduced model uses floor area only. The full model adds the number of rooms and the age of the house. The total sum of squares of price is 10,000.","bgr":"> anova(reduced, full)\nModel 1: Price ~ Area\nModel 2: Price ~ Area + Rooms + Age\n  Res.Df  RSS Df Sum of Sq    F Pr(>F)\n1     47 5200\n2     45 4300  2       900 ####   ####","model":"H₀: the coefficients of Rooms and Age are both zero, given that Area is in the model. H₁: at least one of the two coefficients is not zero."},{"id":"written-9-2","w":14,"g":"Extended-answer practice","t":"House prices 2 · F statistic","q":"Compute the masked F statistic.","o":["9.42","4.71","4.07","0.21"],"answer":"4.71","pairs":[],"why":"The two added predictors reduce the residual sum of squares by 900, which is 450 per predictor. The full model’s residual variance is 4300 ÷ 45 = 95.56. F = 450 ÷ 95.56 = 4.71.","explanationNote":"The value 9.42 does not divide the reduction by the two added terms. The value 4.07 uses the reduced model’s residual variance, 5200 ÷ 47, in the denominator.","bg":"House prices (in thousands of dollars) for 49 houses are modelled in two ways. The reduced model uses floor area only. The full model adds the number of rooms and the age of the house. The total sum of squares of price is 10,000.","bgr":"> anova(reduced, full)\nModel 1: Price ~ Area\nModel 2: Price ~ Area + Rooms + Age\n  Res.Df  RSS Df Sum of Sq    F Pr(>F)\n1     47 5200\n2     45 4300  2       900 ####   ####","model":"F = [(5200 − 4300) ÷ 2] ÷ (4300 ÷ 45) = 450 ÷ 95.56 = 4.71, on 2 and 45 df.","scope":"formula"},{"id":"written-9-3","w":14,"g":"Extended-answer practice","t":"House prices 3 · Decision","q":"Using F = 4.71, what is the conclusion at the 5% level?","o":["Reject H₀, because 4.71 > 3.204: adding Rooms and Age improves the model.","Do not reject H₀, because 4.71 > 3.204.","Reject H₀, because 4.71 > 3.195, using 2 and 47 df.","Do not reject H₀, because 4.71 < 45."],"answer":"Reject H₀, because 4.71 > 3.204: adding Rooms and Age improves the model.","pairs":[],"why":"The F statistic has 2 and 45 df: the number of added terms, and the residual df of the full model. The 5% cutoff is 3.204, and large values of F are evidence against H₀.","explanationNote":"The denominator df come from the full model, so the first printed cutoff applies. Using 47 gives the same decision here, but it is the wrong reference distribution.","bg":"House prices (in thousands of dollars) for 49 houses are modelled in two ways. The reduced model uses floor area only. The full model adds the number of rooms and the age of the house. The total sum of squares of price is 10,000.","bgr":"> anova(reduced, full)\nModel 1: Price ~ Area\nModel 2: Price ~ Area + Rooms + Age\n  Res.Df  RSS Df Sum of Sq    F Pr(>F)\n1     47 5200\n2     45 4300  2       900 ####   ####\n\n> qf(0.95, df1 = 2, df2 = c(45, 47))\n[1] 3.204317 3.195056","model":"Under H₀, F follows an F distribution with 2 and 45 df. The 5% cutoff is 3.204. Since 4.71 > 3.204, reject H₀: Rooms and Age together significantly improve the fit, so the full model is preferred."},{"id":"written-9-4","w":14,"g":"Extended-answer practice","t":"House prices 4 · Adjusted R²","q":"Compare R² and adjusted R² for the two models. The total sum of squares is 10,000 on 48 df.","o":["R² and adjusted R² are both 0.57 for the full model.","R² rises from 0.48 to 0.57 but adjusted R² falls from 0.541 to 0.469, so the reduced model is better.","R² falls from 0.57 to 0.48 because more predictors leave fewer degrees of freedom.","R² rises from 0.48 to 0.57 and adjusted R² rises from 0.469 to 0.541, which agrees with the F-test."],"answer":"R² rises from 0.48 to 0.57 and adjusted R² rises from 0.469 to 0.541, which agrees with the F-test.","pairs":[],"why":"R² = 1 − RSS ÷ SST: 1 − 0.52 = 0.48 and 1 − 0.43 = 0.57. Adjusted R² uses mean squares: 1 − (5200/47) ÷ (10000/48) = 0.469 and 1 − (4300/45) ÷ (10000/48) = 0.541.","explanationNote":"R² can never fall when predictors are added. Adjusted R² penalises the extra terms and rises only if they help enough, which they do here.","bg":"House prices (in thousands of dollars) for 49 houses are modelled in two ways. The reduced model uses floor area only. The full model adds the number of rooms and the age of the house. The total sum of squares of price is 10,000.","bgr":"> anova(reduced, full)\nModel 1: Price ~ Area\nModel 2: Price ~ Area + Rooms + Age\n  Res.Df  RSS Df Sum of Sq    F Pr(>F)\n1     47 5200\n2     45 4300  2       900 ####   ####","model":"Reduced: R² = 1 − 5200/10000 = 0.48, adjusted R² = 1 − (5200/47)/(10000/48) = 0.469. Full: R² = 0.57, adjusted R² = 1 − (4300/45)/(10000/48) = 0.541. Adjusted R² increases, which supports the full model and agrees with the F-test.","scope":"formula"},{"id":"written-9-5","w":14,"g":"Extended-answer practice","t":"House prices 5 · A backward step","q":"Starting from the full model, backward selection uses F-tests at the 5% level. What is the next step?","o":["Remove Area, because it has the largest F value.","Remove Rooms and Age together, because the model with Area alone is simpler.","Remove Age, refit the model, and test the remaining terms again.","Stop: the F-test showed that the full model is better."],"answer":"Remove Age, refit the model, and test the remaining terms again.","pairs":[],"why":"Each row tests whether that term can be dropped while the others stay. Age has the largest p-value, 0.379, above 0.05, so it is removed. Then the model is refitted, because the tests for Area and Rooms change.","explanationNote":"The earlier F-test showed that Rooms and Age together help. It did not show that each one helps. Here Rooms carries the improvement and Age adds little once Rooms is in the model.","bg":"House prices (in thousands of dollars) for 49 houses are modelled in two ways. The reduced model uses floor area only. The full model adds the number of rooms and the age of the house. The total sum of squares of price is 10,000.","bgr":"> anova(reduced, full)\nModel 1: Price ~ Area\nModel 2: Price ~ Area + Rooms + Age\n  Res.Df  RSS Df Sum of Sq    F Pr(>F)\n1     47 5200\n2     45 4300  2       900 ####   ####\n\n> drop1(full, test = \"F\")\nSingle term deletions\n\nModel:\nPrice ~ Area + Rooms + Age\n       Df Sum of Sq    RSS    AIC F value    Pr(>F)\n<none>              4300.0 227.25\nArea    1    2600.0 6900.0 248.43 27.2093 4.463e-06\nRooms   1     650.0 4950.0 232.15  6.8023   0.01231\nAge     1      75.5 4375.5 226.11  0.7901   0.37879","model":"In the full model Age has the largest p-value (0.379 > 0.05), so remove Age and refit Price ~ Area + Rooms. Then test the remaining terms again, and stop when every remaining term is significant."},{"id":"written-10-1","w":15,"g":"Extended-answer practice","t":"Loan defaults 1 · Fitted model","q":"Write down the fitted model.","o":["probability of default = −1.2 − 0.03 × Income + 0.7 × Late","log-odds of default = −1.2 − 0.03 × Income + 0.7 × Late","odds of default = −1.2 − 0.03 × Income + 0.7 × Late","log-odds of default = 0.5 + 0.01 × Income + 0.2 × Late"],"answer":"log-odds of default = −1.2 − 0.03 × Income + 0.7 × Late","pairs":[],"why":"Logistic regression models the log-odds of the event coded 1 as a linear function of the predictors. The coefficients come from the Estimate column.","explanationNote":"A probability must lie between 0 and 1 and odds must be positive, but this linear expression can take any value, which is why it describes the log-odds.","bg":"A lender models whether a loan defaults (1 = default, 0 = repaid) for 500 loans, using the borrower’s income (Income, in thousands of dollars) and
