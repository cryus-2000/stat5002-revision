ea is in the right tail.","Each independent game has mean net profit −.2 and SD 2. For 100 games, use the CLT and pnorm(1)=.8413. Estimate the chance of a positive total.":"Each independent game has mean net profit −0.2 and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> 2. For 100 games, use the CLT and <code>pnorm(1)</code>=0.8413. Estimate the chance of a positive total.","The population SD is 15. Find the smallest n giving a two-sided 95% mean interval with total width at most 5, using 1.96.":"The population <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> is 15. Find the smallest <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n</mi><annotation encoding=\"application/x-tex\">n</annotation></semantics></math> giving a two-sided 95% mean interval with total width at most 5, using 1.96.","Here p is the per-item probability of an alarm event and n is the number of independent items. An alarm tests p=.10 versus p>.10 using n=100 and critical z=1.645. Ignore continuity correction. What is the smallest count that triggers the alarm?":"Here <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>p</mi><annotation encoding=\"application/x-tex\">p</annotation></semantics></math> is the per-item probability of an alarm event and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n</mi><annotation encoding=\"application/x-tex\">n</annotation></semantics></math> is the number of independent items. An alarm tests <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>=</mo><mn>0.10</mn></mrow><annotation encoding=\"application/x-tex\">p=0.10</annotation></semantics></math> versus <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>&gt;</mo><mn>0.10</mn></mrow><annotation encoding=\"application/x-tex\">p&gt;0.10</annotation></semantics></math> using <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mo>=</mo><mn>100</mn></mrow><annotation encoding=\"application/x-tex\">n=100</annotation></semantics></math> and critical <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>z</mi><mo>=</mo><mn>1.645</mn></mrow><annotation encoding=\"application/x-tex\">z=1.645</annotation></semantics></math>. Ignore continuity correction. What is the smallest count that triggers the alarm?","Under the null the count has mean 10 and SD 3. The continuous cutoff is 14.935. The first integer above that cutoff is 15.":"Under the null the count has mean 10 and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> 3. The continuous cutoff is 14.935. The first integer above that cutoff is 15.","From a known-SD mean test, z=−2.40 and pnorm(−2.40)=.0082. For a two-sided alternative, which decision is correct?":"From a known-<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> mean test, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>z</mi><mo>=</mo><mi>−</mi><mn>2.40</mn></mrow><annotation encoding=\"application/x-tex\">z=-2.40</annotation></semantics></math> and <code>pnorm(−2.40)</code>=0.0082. For a two-sided alternative, which decision is correct?","The observed t is −2.1. Among 5,000 null bootstrap pivots, 145 are at most −2.1 and 65 are at least +2.1. Using the lecture's absolute-statistic rule, find the two-sided p-value.":"The observed <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>t</mi><annotation encoding=\"application/x-tex\">t</annotation></semantics></math> is −2.1. Among 5,000 null bootstrap pivots, 145 are at most −2.1 and 65 are at least +2.1. Using the lecture&#x27;<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>s</mi><annotation encoding=\"application/x-tex\">s</annotation></semantics></math> absolute-statistic rule, find the two-sided <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>p</mi><annotation encoding=\"application/x-tex\">p</annotation></semantics></math>-value.","Checking a small-sample t model":"Checking a small-sample <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>t</mi><annotation encoding=\"application/x-tex\">t</annotation></semantics></math> model","Nine independent observations have a strongly right-skewed Q–Q plot with one extreme upper point. Which assessment of the one-sample t interval is defensible?":"Nine independent observations have a strongly right-skewed Q–Q plot with one extreme upper point. Which assessment of the one-sample <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>t</mi><annotation encoding=\"application/x-tex\">t</annotation></semantics></math> interval is defensible?","Using 8 df guarantees exact 95% coverage for any population":"Using 8 <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">f</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{df}</annotation></semantics></math> guarantees exact 95% coverage for any population","Twelve independent pairs have mean change 2.4 and SD of the changes 3.0. R gives qt(.975,11)=2.201. Which 95% interval fits?":"Twelve independent pairs have mean change 2.4 and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> of the changes 3.0. R gives <code>qt(.975,11)</code>=2.201. Which 95% interval fits?","Use the SD of the twelve differences. The SE is about .866 and the margin is 1.906. The endpoints are changes on the original measurement scale.":"Use the <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> of the twelve differences. The <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SE}</annotation></semantics></math> is about 0.866 and the margin is 1.906. The endpoints are changes on the original measurement scale.","Counts are grouped into six categories. One distribution parameter is estimated from the same counts under the null. Under the usual regularity conditions, how many goodness-of-fit df remain?":"Counts are grouped into six categories. One distribution parameter is estimated from the same counts under the null. Under the usual regularity conditions, how many goodness-of-fit <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">f</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{df}</annotation></semantics></math> remain?","Here tab stores the four observed counts. For a 2 by 2 table, R's default chisq.test gives a smaller statistic than a hand Pearson calculation. Which call reproduces the uncorrected Pearson test?":"Here tab stores the four observed counts. For a 2 by 2 table, R&#x27;<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>s</mi><annotation encoding=\"application/x-tex\">s</annotation></semantics></math> default chisq.test gives a smaller statistic than a hand Pearson calculation. Which call reproduces the uncorrected Pearson test?","chisq.test(tab, correct=FALSE)":"<code>chisq.test(tab, correct=FALSE)</code>","chisq.test(tab/100)":"<code>chisq.test(tab/100)</code>","chisq.test(tab, correct=TRUE)":"<code>chisq.test(tab, correct=TRUE)</code>","An R fit reports a slope .040, Std. Error .018, and residual standard error .40 on 40 df. Use qt(.975,40)=2.021. Which slope interval follows?":"An R fit reports a slope 0.040, Std. Error 0.018, and residual standard error 0.40 on 40 <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">f</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{df}</annotation></semantics></math>. Use <code>qt(.975,40)</code>=2.021. Which slope interval follows?","Both predictors have statistically significant coefficients because the model explains 82% of the variation.":"High <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msup><mi>R</mi><mn>2</mn></msup><annotation encoding=\"application/x-tex\">R^2</annotation></semantics></math> makes both slopes significant","On the same observations, adding a predictor changes R² from .650 to .651 and adjusted R² from .630 to .622. What follows?":"On the same observations, adding a predictor changes <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msup><mi>R</mi><mn>2</mn></msup><annotation encoding=\"application/x-tex\">R^2</annotation></semantics></math> from 0.650 to 0.651 and adjusted <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msup><mi>R</mi><mn>2</mn></msup><annotation encoding=\"application/x-tex\">R^2</annotation></semantics></math> from 0.630 to 0.622. What follows?","RSS increased":"<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{RSS}</annotation></semantics></math> increased","RSS fell, but the improvement did not offset the extra parameter in adjusted R²":"<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{RSS}</annotation></semantics></math> fell, but the improvement did not offset the extra parameter in adjusted <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msup><mi>R</mi><mn>2</mn></msup><annotation encoding=\"application/x-tex\">R^2</annotation></semantics></math>","A and B are candidate predictors. Each reported p-value tests the new predictor given the terms already selected. At a 5% entry level, add1 reports p=.018 for A and .041 for B. After adding the first term and refitting, the other has p=.11. What is the selected model?":"A and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>B</mi><annotation encoding=\"application/x-tex\">B</annotation></semantics></math> are candidate predictors. Each reported <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>p</mi><annotation encoding=\"application/x-tex\">p</annotation></semantics></math>-value tests the new predictor given the terms already selected. At a 5% entry level, add1 reports <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>=</mo><mn>0.018</mn></mrow><annotation encoding=\"application/x-tex\">p=0.018</annotation></semantics></math> for A and 0.041 for <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>B</mi><annotation encoding=\"application/x-tex\">B</annotation></semantics></math>. After adding the first term and refitting, the other has <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>=</mo><mn>0.11</mn></mrow><annotation encoding=\"application/x-tex\">p=0.11</annotation></semantics></math>. What is the selected model?","B only":"<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>B</mi><annotation encoding=\"application/x-tex\">B</annotation></semantics></math> only","A and B":"A and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>B</mi><annotation encoding=\"application/x-tex\">B</annotation></semantics></math>","Nested least-squares models differ by one slope. Its t statistic in the full fit is −2.4. What partial F compares them?":"Nested least-squares models differ by one slope. Its <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>t</mi><annotation encoding=\"application/x-tex\">t</annotation></semantics></math> statistic in the full fit is −2.4. What partial <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>F</mi><annotation encoding=\"application/x-tex\">F</annotation></semantics></math> compares them?","Here fit models the chance that the response equals 1, and newdata supplies predictor values for one new case. predict(fit,newdata) from a binomial logit glm gives −1.3863. What does type='response' return approximately?":"Here fit models the chance that the response equals 1, and newdata supplies predictor values for one new case. <code>predict(fit,newdata)</code> from a binomial logit glm gives −1.3863. What does type=&#x27;response&#x27; return approximately?","A logistic slope is .035 per year at fixed glucose and BMI. Which describes a ten-year difference?":"A logistic slope is 0.035 per year at fixed glucose and BMI. R gives <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>exp</mo><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mn>0.35</mn><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mo>≈</mo><mn>1.419</mn></mrow><annotation encoding=\"application/x-tex\">\\exp(0.35)\\approx1.419</annotation></semantics></math>. Which describes a ten-year difference?","On a density histogram the area of a bar is the fraction of observations in its bin. Multiply the height by the bin width: 0.04 × 5.":"On a density histogram the area of a bar is the fraction of observations in its bin. Multiply the height by the bin width: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.04</mn><mo>×</mo><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">0.04 \\times  5</annotation></semantics></math>.","B has 20 crashes per thousand trips, compared with 10 in A. The raw counts do not allow for the number of trips.":"<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>B</mi><annotation encoding=\"application/x-tex\">B</annotation></semantics></math> has 20 crashes per thousand trips, compared with 10 in A. The raw counts do not allow for the number of trips.","Put the mean through the formula: 5−2×3. The SD is multiplied by the size of the multiplier, 2, ignoring its sign.":"Put the mean through the formula: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5</mn><mo>−</mo><mn>2</mn><mo>×</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">5-2\\times 3</annotation></semantics></math>. The <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> is multiplied by the size of the multiplier, 2, ignoring its sign.","Subtract the mean, then divide by the SD. A negative z-score means the score lies below the mean.":"Subtract the mean, then divide by the <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math>. A negative z-score means the score lies below the mean.","IQR=8. The upper fence is 18+1.5×8=30. The answer must be above 30, not equal to it.":"<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi><mi>Q</mi><mi>R</mi><mo>=</mo><mn>8</mn></mrow><annotation encoding=\"application/x-tex\">IQR=8</annotation></semantics></math>. The upper fence is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>18</mn><mo>+</mo><mn>1.5</mn><mo>×</mo><mn>8</mn><mo>=</mo><mn>30</mn></mrow><annotation encoding=\"application/x-tex\">18+1.5\\times 8=30</annotation></semantics></math>. The answer must be above 30, not equal to it.","Variance is measured in squared units. SD and quantiles keep the units of x.":"Variance is measured in squared units. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> and quantiles keep the units of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x</mi><annotation encoding=\"application/x-tex\">x</annotation></semantics></math>.","Average the squared deviations, dividing by n, then take the square root of that average.":"Average the squared deviations, dividing by <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n</mi><annotation encoding=\"application/x-tex\">n</annotation></semantics></math>, then take the square root of that average.","Standardise each endpoint as (x−μ)/σ, then subtract the left-tail probability at the lower endpoint from the one at the upper endpoint.":"Standardise each endpoint as <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mrow><mi>x</mi><mo>−</mo><mi>μ</mi></mrow><mi>σ</mi></mfrac><annotation encoding=\"application/x-tex\">\\frac{x-\\mu}{\\sigma}</annotation></semantics></math>, then subtract the left-tail probability at the lower endpoint from the one at the upper endpoint.","Convert the standard score back to the original units: 50+8×1.2816.":"Convert the standard score back to the original units: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>50</mn><mo>+</mo><mn>8</mn><mo>×</mo><mn>1.2816</mn></mrow><annotation encoding=\"application/x-tex\">50+8\\times 1.2816</annotation></semantics></math>.","Multiplying height by a positive number multiplies both the covariance and the SD of height by that number, so the factor cancels in r.":"Multiplying height by a positive number multiplies both the covariance and the <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> of height by that number, so the factor cancels in <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>r</mi><annotation encoding=\"application/x-tex\">r</annotation></semantics></math>.","When x is the response, the slope is r sx/sy. Swapping the response and the predictor changes which squared errors are minimised.":"When <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x</mi><annotation encoding=\"application/x-tex\">x</annotation></semantics></math> is the response, the slope is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mrow><mi>r</mi><msub><mi>s</mi><mi>x</mi></msub></mrow><msub><mi>s</mi><mi>y</mi></msub></mfrac><annotation encoding=\"application/x-tex\">\\frac{r s_x}{s_y}</annotation></semantics></math>. Swapping the response and the predictor changes which squared errors are minimised.","For each observation, take the residual y−ŷ and square it. Least squares chooses the line that makes the sum of these squares as small as possible.":"For each observation, take the residual <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y</mi><mo>−</mo><mover><mi>y</mi><mo accent=\"true\">̂</mo></mover></mrow><annotation encoding=\"application/x-tex\">y-\\hat y</annotation></semantics></math> and square it. Least squares chooses the line that makes the sum of these squares as small as possible.","There is one fitted value and one residual for each observation. R² is a single number that summarises the whole fit.":"There is one fitted value and one residual for each observation. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msup><mi>R</mi><mn>2</mn></msup><annotation encoding=\"application/x-tex\">R^2</annotation></semantics></math> is a single number that summarises the whole fit.","A and B are events. “Given B” means that only the cases where B occurred are considered. P(A and B)=.12 and P(B)=.30. Find P(A given B).":"A and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>B</mi><annotation encoding=\"application/x-tex\">B</annotation></semantics></math> are events. “Given <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>B</mi><annotation encoding=\"application/x-tex\">B</annotation></semantics></math>” means that only the cases where B occurred are considered. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>A</mi><mo>∩</mo><mi>B</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mo>=</mo><mn>0.12</mn></mrow><annotation encoding=\"application/x-tex\">P(A\\cap B)=0.12</annotation></semantics></math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>B</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mo>=</mo><mn>0.30</mn></mrow><annotation encoding=\"application/x-tex\">P(B)=0.30</annotation></semantics></math>. Find <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>A</mi><mo>∣</mo><mi>B</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">P(A\\mid B)</annotation></semantics></math>.","Only the cases where B occurred count, so divide the probability of A and B together by P(B).":"Only the cases where <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>B</mi><annotation encoding=\"application/x-tex\">B</annotation></semantics></math> occurred count, so divide the probability of A and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>B</mi><annotation encoding=\"application/x-tex\">B</annotation></semantics></math> together by P(B).","Divide the number of times the event occurred by the number of experiments. In R this is mean(event_indicator).":"Divide the number of times the event occurred by the number of experiments. In R this is <code>mean(event_indicator)</code>.","The ticket drawn is equally likely to be 0 or 4. What are the expectation and SE of one draw?":"The ticket drawn is equally likely to be 0 or 4. What are the expectation and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SE}</annotation></semantics></math> of one draw?","The variances of independent draws add. Dividing the total by n also divides its SE by n.":"The variances of independent draws add. Dividing the total by <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n</mi><annotation encoding=\"application/x-tex\">n</annotation></semantics></math> also divides its <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SE}</annotation></semantics></math> by <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n</mi><annotation encoding=\"application/x-tex\">n</annotation></semantics></math>.","The variance is E(X²) minus E(X)², and both E(X²) and E(X) equal p here.":"The variance is E(X²) minus E(X)², and both E(X²) and E(X) equal <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>p</mi><annotation encoding=\"application/x-tex\">p</annotation></semantics></math> here.","Let S be a count taking integer values. Which lower boundary should be used to approximate P(S≥10) with a continuous curve?":"Let <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>S</mi><annotation encoding=\"application/x-tex\">S</annotation></semantics></math> be a count taking integer values. Which lower boundary should be used to approximate <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>S</mi><mo>≥</mo><mn>10</mn><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">P(S\\ge 10)</annotation></semantics></math> with a continuous curve?","Each draw has SD 5. Because the draws are independent, the SE of the total is √36×5.":"Each draw has <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> 5. Because the draws are independent, the <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SE}</annotation></semantics></math> of the total is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msqrt><mn>36</mn></msqrt><mo>×</mo><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">\\sqrt{36}\\times5</annotation></semantics></math>.","Each positive x and its negative have the same y value, so their contributions to the covariance cancel. The scatter still follows a parabola exactly.":"Each positive <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x</mi><annotation encoding=\"application/x-tex\">x</annotation></semantics></math> and its negative have the same <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>y</mi><annotation encoding=\"application/x-tex\">y</annotation></semantics></math> value, so their contributions to the covariance cancel. The scatter still follows a parabola exactly.","A fair coin is tossed 100 times. Use a normal approximation with a continuity correction to find the chance of at least 60 heads. Given pnorm(1.9)=.9713 and pnorm(2)=.9772, which answer follows?":"A fair coin is tossed 100 times. Use a normal approximation with a continuity correction to find the chance of at least 60 heads. Given <code>pnorm(1.9)</code>=0.9713 and <code>pnorm(2)</code>=0.9772, which answer follows?","The count has SD √(np(1−p)). Dividing by n gives the SD of the proportion, which shrinks as n grows.":"The count has <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msqrt><mrow><mi>n</mi><mi>p</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mn>1</mn><mo>−</mo><mi>p</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow></msqrt><annotation encoding=\"application/x-tex\">\\sqrt{np(1-p)}</annotation></semantics></math>. Dividing by <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n</mi><annotation encoding=\"application/x-tex\">n</annotation></semantics></math> gives the <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> of the proportion, which shrinks as n grows.","The fraction after trial k is the number of wins so far divided by k, so both the top and the bottom must stop at trial k.":"The fraction after trial <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>k</mi><annotation encoding=\"application/x-tex\">k</annotation></semantics></math> is the number of wins so far divided by <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>k</mi><annotation encoding=\"application/x-tex\">k</annotation></semantics></math>, so both the top and the bottom must stop at trial k.","For the total of 100 independent draws with μ=3 and σ=2, which mean and SD should be passed to pnorm?":"For the total of 100 independent draws with <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>μ</mi><mo>=</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">\\mu =3</annotation></semantics></math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>σ</mi><mo>=</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">\\sigma =2</annotation></semantics></math>, which mean and SD should be passed to pnorm?","Here p denotes the population chance of success on one trial. For known p and independent trials, which quantity is the centre of a normal prediction interval for a future sample proportion?":"Here <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>p</mi><annotation encoding=\"application/x-tex\">p</annotation></semantics></math> denotes the population chance of success on one trial. For known <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>p</mi><annotation encoding=\"application/x-tex\">p</annotation></semantics></math> and independent trials, which quantity is the centre of a normal prediction interval for a future sample proportion?","Each candidate p is tested with the SE calculated from that candidate. The endpoints are the values of p at which the score test just stops rejecting.":"Each candidate p is tested with the <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SE}</annotation></semantics></math> calculated from that candidate. The endpoints are the values of p at which the score test just stops rejecting.","Only 88 measurements go into the mean, so the SE of that mean is also based on 88.":"Only 88 measurements go into the mean, so the <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SE}</annotation></semantics></math> of that mean is also based on 88.","For a two-sided 99% interval for a mean with known SD, which R cutoff should be used?":"For a two-sided 99% interval for a mean with known <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math>, which R cutoff should be used?","The total has mean −20 and SE 20. Breaking even is one SE above the expected total, so a profit is the upper tail beyond that point.":"The total has mean −20 and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SE}</annotation></semantics></math> 20. Breaking even is one <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SE}</annotation></semantics></math> above the expected total, so a profit is the upper tail beyond that point.","In the bootstrap the observed sample plays the role of the population. Each resample draws n observations from it with replacement, so the pivot is centred on the original sample mean.":"In the bootstrap the observed sample plays the role of the population. Each resample draws <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n</mi><annotation encoding=\"application/x-tex\">n</annotation></semantics></math> observations from it with replacement, so the pivot is centred on the original sample mean.","The mean of group X is compared with the mean of an independent group Y, and the null of equal means is tested two-sided. Changing the difference from X−Y to Y−X changes the sign of t but leaves the two-sided p-value unchanged.":"The mean of group <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>X</mi><annotation encoding=\"application/x-tex\">X</annotation></semantics></math> is compared with the mean of an independent group <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>Y</mi><annotation encoding=\"application/x-tex\">Y</annotation></semantics></math>, and the null of equal means is tested two-sided. Changing the difference from <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>X</mi><mo>−</mo><mi>Y</mi></mrow><annotation encoding=\"application/x-tex\">X-Y</annotation></semantics></math> to <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Y</mi><mo>−</mo><mi>X</mi></mrow><annotation encoding=\"application/x-tex\">Y-X</annotation></semantics></math> changes the sign of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>t</mi><annotation encoding=\"application/x-tex\">t</annotation></semantics></math> but leaves the two-sided <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>p</mi><annotation encoding=\"application/x-tex\">p</annotation></semantics></math>-value unchanged.","Reversing the order changes the sign of the numerator, while the SE stays positive, so t changes sign but not size. The two-sided p-value depends only on the size of t.":"Reversing the order changes the sign of the numerator, while the <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SE}</annotation></semantics></math> stays positive, so <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>t</mi><annotation encoding=\"application/x-tex\">t</annotation></semantics></math> changes sign but not size. The two-sided p-value depends only on the size of t.","The contribution is (15−10)²/10. Dividing by the expected count puts cells of different sizes on a comparable scale.":"The contribution is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mn>15</mn><mo>−</mo><mn>10</mn><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mn>2</mn></msup><mn>10</mn></mfrac><annotation encoding=\"application/x-tex\">\\frac{(15-10)^2}{10}</annotation></semantics></math>. Dividing by the expected count puts cells of different sizes on a comparable scale.","The total count fixes the last cell once the other four are known. Large discrepancies make χ² larger, so the evidence against the null is in the right tail.":"The total count fixes the last cell once the other four are known. Large discrepancies make <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msup><mi>χ</mi><mn>2</mn></msup><annotation encoding=\"application/x-tex\">\\chi ^2</annotation></semantics></math> larger, so the evidence against the null is in the right tail.","The test compares the six observed counts with their expected counts, which are n/6 for each face.":"The test compares the six observed counts with their expected counts, which are <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mi>n</mi><mn>6</mn></mfrac><annotation encoding=\"application/x-tex\">\\frac{n}{6}</annotation></semantics></math> for each face.","The row and column proportions are estimated from the table, so the degrees of freedom are (3−1)(4−1). Expected counts are row total × column total / grand total.":"The row and column proportions are estimated from the table, so the degrees of freedom are <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mn>3</mn><mo>−</mo><mn>1</mn><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mn>4</mn><mo>−</mo><mn>1</mn><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">(3-1)(4-1)</annotation></semantics></math>. Expected counts are <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mrow><mtext mathvariant=\"normal\">row total</mtext><mo>×</mo><mtext mathvariant=\"normal\">column total</mtext></mrow><mtext mathvariant=\"normal\">grand total</mtext></mfrac><annotation encoding=\"application/x-tex\">\\frac{\\text{row total}\\times\\text{column total}}{\\text{grand total}}</annotation></semantics></math>.","For 25 paired changes, mean(after−before)=−3 and SD=6. The null is that the average change is zero. Find t.":"For 25 paired changes, <code>mean(after−before)</code>=−3 and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>S</mi><mi>D</mi><mo>=</mo><mn>6</mn></mrow><annotation encoding=\"application/x-tex\">SD=6</annotation></semantics></math>. The null is that the average change is zero. Find <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>t</mi><annotation encoding=\"application/x-tex\">t</annotation></semantics></math>.","Under independence the expected count is E=40×30/100=12. The contribution is (18−12)²/12.":"Under independence the expected count is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E</mi><mo>=</mo><mfrac><mrow><mn>40</mn><mo>×</mo><mn>30</mn></mrow><mn>100</mn></mfrac><mo>=</mo><mn>12</mn></mrow><annotation encoding=\"application/x-tex\">E=\\frac{40\\times30}{100}=12</annotation></semantics></math>. The contribution is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mn>18</mn><mo>−</mo><mn>12</mn><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mn>2</mn></msup><mn>12</mn></mfrac><annotation encoding=\"application/x-tex\">\\frac{(18-12)^2}{12}</annotation></semantics></math>.","The t interval is exact for small samples only when the population is normal. An extreme value can affect both the mean and its estimated SE. Independence is assessed from the study design.":"The <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>t</mi><annotation encoding=\"application/x-tex\">t</annotation></semantics></math> interval is exact for small samples only when the population is normal. An extreme value can affect both the mean and its estimated <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SE}</annotation></semantics></math>. Independence is assessed from the study design.","Here tab is the observed contingency table, in which each unit is counted in one cell. For the lecture's independence test using chisq.test(tab,simulate.p.value=TRUE), what is held fixed in simulated tables?":"Here tab is the observed contingency table, in which each unit is counted in one cell. For the lecture&#x27;<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>s</mi><annotation encoding=\"application/x-tex\">s</annotation></semantics></math> independence test using <code>chisq.test(tab,simulate.p.value=TRUE)</code>, what is held fixed in simulated tables?","SE(b̂₁)=residual SD / √Σ(xᵢ−x̄)². A wider spread of predictor values makes the denominator larger, so the SE is smaller.":"<math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>SE</mo><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><msub><mover><mi>b</mi><mo accent=\"true\">̂</mo></mover><mn>1</mn></msub><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mo>=</mo><mfrac><mover><mi>σ</mi><mo accent=\"true\">̂</mo></mover><msqrt><mrow><munder><mo>∑</mo><mi>i</mi></munder><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><msub><mi>x</mi><mi>i</mi></msub><mo>−</mo><mover><mi>x</mi><mo accent=\"true\">‾</mo></mover><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mn>2</mn></msup></mrow></msqrt></mfrac></mrow><annotation encoding=\"application/x-tex\">\\operatorname{SE}(\\hat b_1)=\\frac{\\hat\\sigma}{\\sqrt{\\sum_i(x_i-\\bar x)^2}}</annotation></semantics></math>. A wider spread of predictor values makes the denominator larger, so the SE is smaller.","The change bd is on the log scale. Exponentiating gives a ratio on the original scale. If the predictors are strongly correlated with each other, the SE of the slope can be inflated.":"The change <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>b</mi><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">bd</annotation></semantics></math> is on the log scale. Exponentiating gives a ratio on the original scale. If the predictors are strongly correlated with each other, the <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SE}</annotation></semantics></math> of the slope can be inflated.","The partial F-test compares the RSS saved per extra parameter with the residual variance estimated from the full model. Adjusted R² also takes the residual degrees of freedom into account.":"The partial F-test compares the <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{RSS}</annotation></semantics></math> saved per extra parameter with the residual variance estimated from the full model. Adjusted <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msup><mi>R</mi><mn>2</mn></msup><annotation encoding=\"application/x-tex\">R^2</annotation></semantics></math> also takes the residual degrees of freedom into account.","Increasing x by d adds bd to the log-odds. Exponentiating turns that addition into multiplying the odds by exp(bd).":"Increasing x by d adds <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>b</mi><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">bd</annotation></semantics></math> to the log-odds. Exponentiating turns that addition into multiplying the odds by exp(bd).","Divide the estimate by its SE. A two-sided p-value uses both normal tails. The null deviance describes the intercept-only model, and the residual deviance describes the fitted model.":"Divide the estimate by its <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SE}</annotation></semantics></math>. A two-sided <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>p</mi><annotation encoding=\"application/x-tex\">p</annotation></semantics></math>-value uses both normal tails. The null deviance describes the intercept-only model, and the residual deviance describes the fitted model.","Two nested regression models predict the same response. RSS means residual sum of squares and df denotes residual degrees of freedom. The reduced model has residual df 48 and RSS 250. The full model, fitted to the same data, has residual df 46 and RSS 184. Find F.":"Two nested regression models predict the same response. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{RSS}</annotation></semantics></math> means residual sum of squares and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">f</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{df}</annotation></semantics></math> denotes residual degrees of freedom. The reduced model has residual <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">f</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{df}</annotation></semantics></math> 48 and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{RSS}</annotation></semantics></math> 250. The full model, fitted to the same data, has residual df 46 and RSS 184. Find <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>F</mi><annotation encoding=\"application/x-tex\">F</annotation></semantics></math>.","Original odds=.20/.80=.25. Doubling gives odds of .5, and the probability is then .5/(1+.5).":"Original odds=<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mn>.20</mn><mn>.80</mn></mfrac><mo>=</mo><mn>.25</mn></mrow><annotation encoding=\"application/x-tex\">\\frac{.20}{.80}=.25</annotation></semantics></math>. Doubling gives 0odds of .5, and the probability is then <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mn>0.5</mn><mrow><mn>1</mn><mo>+</mo><mn>0.5</mn></mrow></mfrac><annotation encoding=\"application/x-tex\">\\frac{0.5}{1+0.5}</annotation></semantics></math>.","The response is log ozone concentration. Temp measures temperature and Radiation measures solar radiation. The reported t tests whether the temperature slope is zero after adjusting for radiation. A model has R²=.82, cor(Temp,Radiation)=.98 and t=1.25 for Temp. Use a two-sided cutoff of 2. Which conclusion fits all three values?":"The response is log ozone concentration. Temp measures temperature and Radiation measures solar radiation. The reported <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>t</mi><annotation encoding=\"application/x-tex\">t</annotation></semantics></math> tests whether the temperature slope is zero after adjusting for radiation. A model has <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>R</mi><mn>2</mn></msup><mo>=</mo><mn>0.82</mn></mrow><annotation encoding=\"application/x-tex\">R^2=0.82</annotation></semantics></math>, <code>cor(Temp,Radiation)</code>=0.98 and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>=</mo><mn>1.25</mn></mrow><annotation encoding=\"application/x-tex\">t=1.25</annotation></semantics></math> for Temp. Use a two-sided cutoff of 2. Which conclusion fits all three values?","Adding a coefficient can lower the RSS on the data used to fit the model. Adjusted R² penalises the loss of residual degrees of freedom. Neither summary directly measures how well the model predicts new data.":"Adding a coefficient can lower the <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{RSS}</annotation></semantics></math> on the data used to fit the model. Adjusted <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msup><mi>R</mi><mn>2</mn></msup><annotation encoding=\"application/x-tex\">R^2</annotation></semantics></math> penalises the loss of residual degrees of freedom. Neither summary directly measures how well the model predicts new data.","Mutually exclusive events cannot both happen, so the probability that both occur is zero. Independence would require it to equal P(A)P(B), which is positive.":"Mutually exclusive events cannot both happen, so the probability that both occur is zero. Independence would require it to equal <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>A</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mi>P</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>B</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">P(A)P(B)</annotation></semantics></math>, which is positive.","The centre of the Wilson interval is (p̂+z²/(2n))/(1+z²/n), which pulls the centre towards one half. The half-width is z√[p̂(1−p̂)/n+z²/(4n²)]/(1+z²/n).":"The centre of the Wilson interval is <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mrow><mover><mi>p</mi><mo accent=\"true\">̂</mo></mover><mo>+</mo><mfrac><msup><mi>z</mi><mn>2</mn></msup><mrow><mn>2</mn><mi>n</mi></mrow></mfrac></mrow><mrow><mn>1</mn><mo>+</mo><mfrac><msup><mi>z</mi><mn>2</mn></msup><mi>n</mi></mfrac></mrow></mfrac><annotation encoding=\"application/x-tex\">\\frac{\\hat p+\\frac{z^2}{2n}}{1+\\frac{z^2}{n}}</annotation></semantics></math>, which pulls the centre towards one half. The half-width is <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mi>z</mi><mrow><mn>1</mn><mo>+</mo><mfrac><msup><mi>z</mi><mn>2</mn></msup><mi>n</mi></mfrac></mrow></mfrac><msqrt><mrow><mfrac><mrow><mover><mi>p</mi><mo accent=\"true\">̂</mo></mover><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mn>1</mn><mo>−</mo><mover><mi>p</mi><mo accent=\"true\">̂</mo></mover><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><mi>n</mi></mfrac><mo>+</mo><mfrac><msup><mi>z</mi><mn>2</mn></msup><mrow><mn>4</mn><msup><mi>n</mi><mn>2</mn></msup></mrow></mfrac></mrow></msqrt></mrow><annotation encoding=\"application/x-tex\">\\frac{z}{1+\\frac{z^2}{n}}\\sqrt{\\frac{\\hat p(1-\\hat p)}{n}+\\frac{z^2}{4n^2}}</annotation></semantics></math>.","With one numerator degree of freedom the partial F is the square of the t statistic for that coefficient. The upper-tail F test gives the same p-value as the two-sided t test.":"With one numerator degree of freedom the partial <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>F</mi><annotation encoding=\"application/x-tex\">F</annotation></semantics></math> is the square of the <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>t</mi><annotation encoding=\"application/x-tex\">t</annotation></semantics></math> statistic for that coefficient. The upper-tail F test gives the same p-value as the two-sided <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>t</mi><annotation encoding=\"application/x-tex\">t</annotation></semantics></math> test."};

// R calls written inside a sentence are shown as code. Arguments must be plain ASCII, so mathematical notation such as exp(−0.06×2) stays typeset.
const rCall=/(?:\b(?:pnorm|qnorm|dnorm|qt|pt|dt|lm|glm|mean|sum|var|sd|cor|exp|sqrt|cbind|c|dim|str|head|table|prop\.table|outer|sample|replicate|length|function|fitted|resid|summary|factor|quantile|cumsum|seq_along|predict|deviance|anova|add1|boxplot|hist|chisq\.test|binom\.confint|tapply|update|rowSums|colSums|drop1|t\.test)\((?:[\x20-\x27\x2a-\x7e]|\((?:[\x20-\x27\x2a-\x7e]|\([\x20-\x27\x2a-\x7e]*\))*\))*\)|\bfit\$[\w.]+)(?:\$[\w.]+)?/g;
function prose(el,text){
  let start=0,i=0;
  while(i<text.length){
    const before=text[i-1]||'';
    const k=formulaKeys.find(k=>text.startsWith(k,i)&&(!/[a-z0-9]/i.test(k[0])||!/[a-z0-9'’]/i.test(before))&&(!/[a-z0-9]/i.test(k.at(-1))||!/[a-z0-9]/i.test(text[i+k.length]||''))&&!(k==='U'&&text.startsWith('-shaped',i+1))&&!(i===0&&/^Q\d+\. /.test(text)));
    if(!k){i++;continue}
    el.append(readable(text.slice(start,i)));el.insertAdjacentHTML('beforeend',typeset[k]);i+=k.length;start=i;
  }
  el.append(readable(text.slice(start)));
}
function formatText(el,value){
  el.replaceChildren();
  if(richText[value]){el.insertAdjacentHTML("beforeend",richText[value]);return}
  const prefix=value.match(/^(Answer: |[A-D]\. |\([a-d]\) )/)?.[0]||"";
  if(prefix){el.append(prefix);value=value.slice(prefix.length);if(richText[value]){el.insertAdjacentHTML("beforeend",richText[value]);return}}
  // Keep executable R exactly as printed.
  if(/(?:\b(?:pnorm|qnorm|qt|lm|glm|pt|mean|sum|var|sd|cbind|prop\.table|outer|sample|replicate|length|sqrt|function|fitted|resid|summary|factor|table|quantile|cumsum)\(|\bTRUE\b|\bFALSE\b|m\+c\(|m\/z\+c\()/i.test(value)&&!value.includes(' ')&&!typeset[value]){el.append(readable(value));return}
  let last=0;
  for(const m of value.matchAll(rCall)){
    if(m.index<last||formulaKeys.some(k=>k.length>m[0].length&&value.startsWith(k,m.index)))continue;
    prose(el,value.slice(last,m.index));
    const code=document.createElement('code');code.textContent=readable(m[0]);el.append(code);last=m.index+m[0].length;
  }
  prose(el,value.slice(last));
}

  t.rows.forEach((r,i)=>{out+='<tr'+(t.total&&i===t.rows.length-1?' class="sum"':'')+'>'+r.map((v,j)=>cell(v,j===0&&t.head[0]===''?'th':'td',[num(v)?'n':'',t.mark&&t.mark[0]===i&&t.mark[1]===j?'hit':'',t.total&&j===r.length-1?'sum':''].filter(Boolean).join(' '))).join('')+'</tr>'});
