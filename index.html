}
const guides=[{"terms":[["Observational unit","What one row of the data stands for: a person, a visit, a crash. Count units, not rows, when several rows belong to the same unit."],["Types of variables","A qualitative (or categorical) variable puts each unit in a category. It is nominal when the categories have no order, such as postcode, and ordinal when they do, such as injury severity. A quantitative (or numerical) variable is a number you can do arithmetic with. It is discrete when it is a count, such as the number of crashes, and continuous when it is measured on a scale, such as speed."],["Which graph for which data","Use a barplot for one qualitative variable, and a histogram or boxplot for one quantitative variable. To compare a quantitative variable across groups, draw side-by-side (comparative) boxplots. For two quantitative variables, draw a scatterplot. For two qualitative variables, use a two-way (contingency) table or a barplot split by the second variable."],["Rate and exposure","A rate is a count divided by the amount of opportunity for the event, such as the number of trips or days. The amount you divide by is called the exposure. For example, 100 crashes in 10,000 trips is a rate of 1%, and the 10,000 trips are the exposure."],["Density scale","On a density histogram the height of a bar is its proportion divided by its width, so the area of the bar is the proportion of observations in it."],["Class intervals","The bins of a histogram. An interval written [5, 10) includes its left end and excludes its right end, so the value 5 belongs to [5, 10) and not to [0, 5). In R, hist() uses this convention only when right = FALSE is given. Too few intervals hide the shape of the data, and too many show mostly noise."],["Conditional proportion","A proportion worked out inside one group only, with that group’s total as the denominator. For example, the proportion of bicycle crashes among the crashes in one region."],["Sample and population","A population is the whole group a question is about. A sample is the part that was observed. The same data can be either, depending on the question being asked."]],"q":"Bins [0, 10), [10, 20) and [20, 40) contain 20, 50 and 30 of 100 observations. Find the height of each bar on the density scale and estimate the median.","steps":["The proportions in the three bins are 0.20, 0.50 and 0.30.","Divide each proportion by its bin width: 0.20 ÷ 10 = 0.020, 0.50 ÷ 10 = 0.050 and 0.30 ÷ 20 = 0.015. The last bar is the lowest although it holds more observations than the first, because it is twice as wide.","Add areas from the left: 0.20 after the first bin and 0.70 after the second. The halfway point 0.50 is reached inside [10, 20).","We still need 0.30 from that bin, which holds 0.50, so we go 60% of the way across it. The median is about 10 + 0.6 × 10 = 16."]},{"terms":[["Median","The middle value once the data are sorted. With an even number of values, average the two middle ones."],["Combined mean","The mean of two groups taken together. Add the two totals and divide by the total number of values, so the larger group counts for more. This is also called a weighted mean."],["Interquartile range (IQR)","Q3 minus Q1, the width of the middle half of the data."],["Standard deviation (SD)","The typical distance of observations from their mean. To find it, square the deviations, average them, and take the square root. For the population SD the average divides by the number of values, and for the sample SD it divides by one fewer."],["Standard units","How many SDs an observation lies above or below the mean. Also called a z-score."],["Robust","Barely changed by a few extreme values. The median and IQR are robust; the mean and SD are not."],["Skewness","A distribution is right-skewed when its long tail is on the side of large values, and left-skewed when the long tail is on the side of small values. The mean is pulled towards the long tail, so it is above the median for right-skewed data and below it for left-skewed data."],["Lower and upper thresholds","In the lecture definition, the upper threshold is the smaller of the maximum and Q3 + 1.5 × IQR, and the lower threshold is the larger of the minimum and Q1 − 1.5 × IQR. Observations beyond them are drawn as separate points."]],"q":"For the values 2, 4, 4, 6 and 9, find the mean, the median, the population SD, the sample SD and the z-score of 9.","steps":["The mean is 25 ÷ 5 = 5. The middle value of the sorted data is 4, so the median is 4.","Deviations from the mean are −3, −1, −1, 1 and 4. Their squares are 9, 1, 1, 1 and 16, which add to 28.","Population SD: √(28 ÷ 5) = 2.37. Sample SD: √(28 ÷ 4) = 2.65. In R, sd() returns the sample version.","Using the population SD, the z-score of 9 is (9 − 5) ÷ 2.37 = 1.69. The value 9 pulls the mean above the median."]},{"terms":[["Normal curve","A symmetric bell-shaped curve that is completely described by its mean and SD. Areas under it are used as proportions."],["Standardising","Converting a value to standard units by subtracting the mean and dividing by the SD, so that the same standard normal curve can be used for every normal model."],["pnorm","An R function that takes a value in standard units and returns the area under the curve to its left."],["qnorm","The reverse of pnorm: it takes an area to the left and returns the value in standard units that has that area below it. A value found this way is called a quantile or percentile."],["68–95–99.7 rule","About 68%, 95% and 99.7% of a normal population lie within 1, 2 and 3 SDs of the mean."]],"q":"Heights follow a normal curve with mean 170 cm and SD 8 cm. Find the proportion between 162 cm and 182 cm, and the 90th percentile.","r":"> pnorm(c(-1, 1.5))\n[1] 0.1586553 0.9331928\n> qnorm(0.90)\n[1] 1.281552","steps":["Standardise both ends: (162 − 170) ÷ 8 = −1 and (182 − 170) ÷ 8 = 1.5.","Each pnorm value is an area to the left. Subtract them to keep the part in between: 0.9332 − 0.1587 = 0.7745.","For the percentile go the other way. The 90th percentile is 1.2816 SDs above the mean: 170 + 1.2816 × 8 = 180.3 cm."]},{"terms":[["Response and predictor","The response y is the variable being predicted, and the predictor x is the variable used to predict it. The slides usually call them the dependent variable and the independent (or explanatory) variable. In R the response goes on the left of the formula, as in y ~ x."],["Correlation coefficient","A number between −1 and 1, written r, measuring how closely points follow a straight line. The sign of r gives the direction of the relationship, and r has no units."],["Regression line","The line that predicts y from x with the smallest sum of squared prediction errors. Its slope is r × (SD of y) ÷ (SD of x), and it passes through the two means."],["SD line and regression effect","The SD line goes through the point of averages with slope (SD of y) ÷ (SD of x), taking the sign of r. The regression line goes through the same point with slope r × (SD of y) ÷ (SD of x), so it is flatter unless r is 1 or −1. With a positive r, a unit that is 2 SDs above average in x is predicted to be only 2r SDs above average in y. This pull towards the average is the regression effect, and it is why the SD line overpredicts at the extremes."],["Residual","Observed value minus predicted value. A residual is positive when the point lies above the line."],["Coefficient of determination","The proportion of the variation in y that the line accounts for. In simple regression it equals r squared."],["Outliers and influence","A single point far from the rest can raise or lower r sharply and pull the regression line towards itself. Always look at the scatter plot."],["Association is not causation","A strong correlation does not show that changing x would change y. Both may be driven by a third variable."],["Correlation from standard units","r is the average of the products of the two standard units, using n − 1. Points above both means or below both means give positive products; points above one mean and below the other give negative products."],["Sums of squares","SST measures the variation of y about its mean, and SSE the variation about the regression line. SSE can never exceed SST. Dividing each by n − 1 gives the variance of y and the variance of the residuals. The residual standard error printed by R is different: it divides SSE by n − 2 in simple regression before taking the square root."],["Homoscedastic and heteroscedastic","Homoscedastic means the spread of the residuals is about the same across the range of x. Heteroscedastic means the spread changes, often widening like a fan, and predictions from the line should then be treated with caution."]],"q":"Daily temperature has mean 20 °C and SD 5 °C. Daily sales have mean 300 and SD 40. The correlation is 0.75. Predict sales on a 25 °C day, and find the residual if 350 were sold.","steps":["Slope = 0.75 × 40 ÷ 5 = 6 sales per degree.","The line passes through (20, 300). A 25 °C day is 5 degrees above the mean, so the prediction is 300 + 6 × 5 = 330.","Residual = 350 − 330 = 20. The day sold more than the line predicts.","The line accounts for 0.75² = 0.5625, about 56%, of the variation in sales."]},{"terms":[["Conditional probability","The probability of one event, counting only the cases where another event has happened. To find it, divide the probability that both happen by the probability of the condition."],["Total probability","When the population splits into non-overlapping groups that together cover everyone, the overall chance of an event is the sum, over the groups, of the share of the group times the chance of the event within that group."],["Independent events","Two events are independent when knowing that one happened does not change the probability of the other. In that case the probability that both happen is the product of the two probabilities."],["Mutually exclusive events","Events that cannot both happen. For such events, the probability that one or the other happens is the sum of the two probabilities."],["Complement rule","The chance that something happens is 1 minus the chance that it does not. For “at least one success”, work out the chance of no success at all and subtract it from 1."],["With and without replacement","With replacement, the drawn ticket goes back and every draw has the same chances. Without replacement, the box changes after each draw."]],"q":"A condition affects 1% of people. A test is positive for 95% of those with the condition and for 2% of those without it. What proportion of people who test positive have the condition?","steps":["Picture 10,000 people: 100 have the condition and 9,900 do not.","Positives among those with the condition: 95% of 100 = 95. Positives among those without: 2% of 9,900 = 198.","The question asks only about people who tested positive, so the denominator is all 293 positives.","95 ÷ 293 = 0.32. Most positives are false, because people without the condition are so much more numerous."]},{"terms":[["Box model","A box of numbered tickets from which draws are made at random. It stands in for any repeated chance process."],["0–1 box","A box whose tickets are only 0s and 1s, used for counting. The sum of the draws is the number of 1s, and the average of the draws is the proportion of 1s. If a fraction p of the tickets are 1s, the box has mean p and SD √(p(1 − p))."],["Expected value","The average you would get in the long run if the chance process were repeated many times. For one draw it is the mean of the box."],["Standard error (SE)","The typical size of the gap between a random result and its expected value. For one draw it is the SD of the box."],["Chance error","The observed value minus the expected value. The SE says how big chance errors tend to be."],["Error box","A box whose tickets are deviations from the mean: it has mean zero and the same SD as the original box. Later topics describe measurement and regression errors as draws from such a box."],["Continuity correction","A count takes whole-number values, but the normal curve is continuous. The correction treats the count 8 as the interval from 7.5 to 8.5, so “8 or more” starts at 7.5. The slides mark it as non-examinable."]],"q":"A box holds the tickets 1, 2, 3 and 6. One hundred draws are made with replacement. Find the expected value and SE of the sum and of the average.","steps":["Box mean: (1 + 2 + 3 + 6) ÷ 4 = 3.","Box SD: deviations are −2, −1, 0 and 3, with squares 4, 1, 0 and 9. Their average is 3.5, and √3.5 = 1.87.","Sum of 100 draws: expected value 100 × 3 = 300, SE √100 × 1.87 = 18.7.","Average of 100 draws: divide both by 100. Expected value 3, SE 0.187. As the number of draws grows, the sum becomes more variable and the average becomes less variable."],"scope":"Scope. The slides mark the continuity correction (starting at 7.5 in place of 8 for whole-number counts) as non-examinable, and their own normal-approximation examples do not use it. The three questions here that use it are labelled “Beyond the exam”."},{"terms":[["Sampling distribution","The distribution of a statistic, such as a sample mean, across all the samples that could have been drawn."],["Law of averages","With more draws, the sample average settles closer to the box mean, even though the sum wanders further from its expected value."],["Central limit theorem","With enough independent draws, the sum and the average follow an approximately normal curve whatever the shape of the box."],["Normal approximation","Using a normal curve, with the expected value as its mean and the SE as its SD, to find the chance of a result."]],"q":"A fair die is rolled 50 times. Estimate the chance that the total is 190 or more.","r":"> pnorm(1.24)\n[1] 0.8925123","steps":["One roll has mean 3.5 and SD 1.71.","Total of 50 rolls: expected value 50 × 3.5 = 175, SE √50 × 1.71 = 12.1.","Standardise: (190 − 175) ÷ 12.1 = 1.24.","pnorm gives the area below 1.24. The chance of 190 or more is the area above: 1 − 0.8925 = 0.11."]},{"terms":[["Prediction interval","An interval that starts from a known proportion p and gives the range in which a future sample proportion is likely to fall."],["Confidence interval","An interval that starts from an observed sample and gives the range of values of p that are consistent with that sample."],["Wilson interval","A confidence interval for a proportion, made up of every value of p whose prediction interval contains the observed sample proportion. Its centre is pulled slightly towards one half."],["Confidence level","The proportion of repeated samples for which the method gives an interval that contains the true value, for example 95%."],["Margin of error","Half the width of the interval: the cutoff multiplied by the standard error."],["Point estimate","A single value computed from the sample to estimate a parameter, such as the sample proportion. An interval estimate gives a range of plausible values instead. Its width depends on the standard error and on the confidence level, and it need not be centred exactly on the point estimate."]],"q":"A sample of 400 draws from a 0–1 box contains 136 ones. At the 95% level, are p = 0.40 and p = 0.38 consistent with this sample?","steps":["The sample proportion is 136 ÷ 400 = 0.34.","If p = 0.40, the SE is √(0.40 × 0.60 ÷ 400) = 0.0245 and the prediction interval is 0.40 ± 1.96 × 0.0245 = [0.352, 0.448]. The observed 0.34 lies outside, so 0.40 is not consistent.","If p = 0.38, the SE is 0.0243 and the interval is [0.332, 0.428]. The observed 0.34 lies inside, so 0.38 is consistent.","A 95% confidence interval for p is the set of all values that pass this check. It contains 0.38 and excludes 0.40."],"more":[{"q":"A population has known SD 15. A random sample of 36 has mean 82. Give a 95% confidence interval for the population mean, and find the sample size needed for a margin of error of 3.","steps":["SE = 15 ÷ √36 = 2.5.","Margin = 1.96 × 2.5 = 4.9, so the interval is 82 ± 4.9 = [77.1, 86.9].","For a margin of 3, solve 1.96 × 15 ÷ √n = 3. This gives √n = 9.8 and n = 96.04.","Round up, because a smaller sample would give a margin slightly above 3: n = 97."]}],"scope":"Scope. The closed-form formula for the Wilson interval is not for assessment. In the course its end points come from binom.confint(), or from checking candidate values of p against their prediction intervals."},{"terms":[["Null hypothesis","The claim being tested, written H₀. It gives the parameter one specific value."],["Alternative hypothesis","What the data would support if H₀ were rejected, written H₁. It is one-sided or two-sided and is chosen before looking at the data."],["Test statistic","The distance of the observed result from the null value, measured in standard errors."],["p-value","The chance, if H₀ were true, of a statistic at least as extreme as the one observed. A small p-value is evidence against H₀."],["Significance level","The threshold, such as 0.05, below which the p-value leads to rejecting H₀. The slides also call it the false alarm rate: the chance of rejecting H₀ when it is true."],["Consistent with H₀","When H₀ is not rejected, say that the data are consistent with it. This is a weaker statement than saying H₀ is true. It means only that the evidence against H₀ was not strong enough."],["HATPC","The five steps of a test in this course: Hypotheses, Assumptions, Test statistic, P-value, Conclusion. The worked example below follows them in order."]],"q":"A coin lands heads 61 times in 100 tosses. Test whether it is fair.","r":"> pnorm(2.2)\n[1] 0.9860966","steps":["Hypotheses: H₀: p = 0.5 against H₁: p ≠ 0.5, where p is the chance of heads.","Assumptions: the tosses are independent, and 100 tosses are enough for a normal approximation.","Test statistic: under H₀ the SE is √(0.5 × 0.5 ÷ 100) = 0.05, so Z = (0.61 − 0.50) ÷ 0.05 = 2.2.","p-value: the area above 2.2 is 1 − 0.9861 = 0.0139. The alternative is two-sided, so double it: 0.028.","Conclusion: 0.028 is below 0.05, so reject H₀. The data give evidence that the coin is not fair."]},{"terms":[["t distribution","The curve used in place of the normal when the SD is estimated from the sample. Its tails are heavier than those of the normal curve, and the difference is larger for small samples."],["Degrees of freedom (df)","For one sample, the sample size minus one. The df tell you which t curve to use."],["Estimated standard error","The sample SD divided by the square root of the sample size."],["Bootstrap","Resampling the observed data with replacement many times, to see how a statistic varies without assuming a normal population."],["Q–Q plot","A plot of the sorted data against the values expected from a normal curve. If the points lie close to the reference line, a normal model is reasonable. Points that bend away from the line at the ends show skewness or heavy tails."]],"q":"Nine measurements from a normal population have mean 52 and sample SD 6. Test whether the population mean differs from 48, and give a 95% confidence interval.","r":"> qt(0.975, df = 8)\n[1] 2.306004","steps":["SE = 6 ÷ √9 = 2.","T = (52 − 48) ÷ 2 = 2.0, to be compared with a t distribution on 9 − 1 = 8 df.","The two-sided 5% cutoff is 2.306. Since 2.0 is smaller, do not reject H₀.","Interval: 52 ± 2.306 × 2 = [47.4, 56.6]. It contains 48, which agrees with the test."],"more":[{"q":"A sample has mean 20 and estimated standard error 1.5. From bootstrap resamples, the 2.5% and 97.5% points of the statistic (resample mean − 20) ÷ (resample SE) are −2.6 and 1.9. Give the 95% bootstrap-t interval for the population mean.","steps":["The bootstrap statistic plays the role of T = (sample mean − population mean) ÷ SE, so 95% of the time −2.6 ≤ (20 − μ) ÷ 1.5 ≤ 1.9.","Solve for μ. The upper point gives the lower end: 20 − 1.9 × 1.5 = 17.15.","The lower point gives the upper end: 20 − (−2.6) × 1.5 = 23.9.","The interval is [17.15, 23.9]. It is not symmetric about 20, because the bootstrap distribution is not symmetric. Using the points the wrong way round is the most common mistake."]}]},{"terms":[["Independent samples","Two separate groups of units, with no link between a unit in one group and a unit in the other."],["Paired samples","Two measurements on the same unit, or on matched units. Analyse the differences as a single sample."],["Pooled SD","One SD estimated from both samples together, used in the classical test when the two populations are assumed to share a variance."],["Welch test","The two-sample t-test that does not assume equal variances. It is the default of t.test() in R."]],"q":"Eight patients are measured before and after a treatment. The eight differences (after − before) have mean 4 and SD 5. Is there evidence of a change?","r":"> qt(0.975, df = 7)\n[1] 2.364624","steps":["Each patient gives one difference, so this is a one-sample t-test on 8 differences with H₀: mean difference = 0.","SE = 5 ÷ √8 = 1.77.","T = 4 ÷ 1.77 = 2.26 on 7 df.","The two-sided 5% cutoff is 2.365. Since 2.26 is smaller, do not reject H₀ at the 5% level, although the result is close."],"more":[{"q":"Two independent samples from normal populations with a common variance: 12 observations with mean 50 and SD 6, and 15 observations with mean 45 and SD 8. Test whether the population means differ.","r":"> qt(0.975, df = 25)\n[1] 2.059539","steps":["Pooled variance = (11 × 6² + 14 × 8²) ÷ 25 = (396 + 896) ÷ 25 = 51.68, so the pooled SD is 7.19.","SE of the difference = 7.19 × √(1/12 + 1/15) = 7.19 × 0.387 = 2.78.","T = (50 − 45) ÷ 2.78 = 1.80, with 12 + 15 − 2 = 25 df.","The two-sided 5% cutoff is 2.060. Since 1.80 is smaller, do not reject equal means.","Without the equal-variance assumption, the Welch test would use SE = √(6²/12 + 8²/15) = 2.70 and its own df."]}]},{"terms":[["Observed and expected counts","Observed counts come from the data. Expected counts are what the null hypothesis predicts for the same total."],["Pearson statistic","Work out (observed − expected)² ÷ expected for every cell and add the results. Large values mean the data are far from the null."],["Goodness-of-fit test","A test of whether the counts for one categorical variable match stated proportions. The df are the number of categories minus one."],["Test of independence","A test of whether two categorical variables in a table are related. Expected count = row total × column total ÷ grand total, and the df are (rows − 1) × (columns − 1)."],["Chi-squared distribution","The distribution of a sum of squared standard normal values. The number of terms in the sum is the degrees of freedom. It takes only positive values and is right-skewed. The test uses the upper tail because the further the observed counts are from the expected ones, the larger the statistic, so only large values are evidence against H₀. With 1 df its 5% cutoff is 3.84 = 1.96²."]],"q":"Of 50 treated patients, 32 improved. Of 50 control patients, 18 improved. Test whether improvement is independent of treatment.","r":"> pchisq(7.84, df = 1, lower.tail = FALSE)\n[1] 0.005110261","steps":["Column totals are 50 improved and 50 not improved, out of 100.","Expected count in every cell: 50 × 50 ÷ 100 = 25.","Each cell differs from 25 by 7, so each contributes 49 ÷ 25 = 1.96. The statistic is 4 × 1.96 = 7.84.","df = (2 − 1) × (2 − 1) = 1. The upper-tail area is 0.005, well below 0.05, so reject independence. In R, chisq.test() applies a continuity correction to a 2 × 2 table by default and reports a slightly smaller statistic, 6.76 here. Adding correct = FALSE reproduces this hand calculation."],"more":[{"q":"A die is rolled 120 times. The faces 1 to 6 come up 15, 25, 20, 18, 22 and 20 times. Test whether the die is fair.","r":"> qchisq(0.95, df = 5)\n[1] 11.0705","steps":["Under H₀ every face has probability 1/6, so each expected count is 120 ÷ 6 = 20.","Differences from 20 are −5, 5, 0, −2, 2 and 0. Their squares add to 25 + 25 + 0 + 4 + 4 + 0 = 58.","Every expected count is 20, so χ² = 58 ÷ 20 = 2.9, with 6 − 1 = 5 df.","The 5% cutoff is 11.07. Since 2.9 is far below it, the rolls are consistent with a fair die."]}]},{"terms":[["Coefficient","The change in the predicted response for a one-unit increase in a predictor, holding the other predictors fixed."],["Standard error of a coefficient","How much the estimated coefficient would vary from sample to sample. Estimate ÷ Std. Error gives the t value."],["Residual standard error","The typical size of a residual, in the units of the response."],["Multicollinearity","Multicollinearity means that some predictors move closely together. The separate effect of each one is then hard to pin down, and the standard errors of their coefficients grow."],["Small-coefficient shortcut","For a log response, a small coefficient b means a change of roughly b × 100% per unit, so 0.068 is about 7%. For a large coefficient use exp(b): a coefficient of 1.63 means multiplying by 5.1."]],"q":"In a regression output, one predictor has Estimate 2.4 and Std. Error 0.8, with 20 residual degrees of freedom. Is it significant at the 5% level, and what is a 95% confidence interval for its coefficient?","r":"> qt(0.975, df = 20)\n[1] 2.085963","steps":["t = 2.4 ÷ 0.8 = 3.0.","The two-sided 5% cutoff on 20 df is 2.086. Since 3.0 is larger, the coefficient differs significantly from zero when the other predictors are in the model.","Interval: 2.4 ± 2.086 × 0.8 = [0.73, 4.07]. It excludes zero, in agreement with the test."],"more":[{"q":"A regression of log salary on years of experience and other predictors gives a coefficient of 0.08 for experience. Interpret it on the salary scale, for one extra year and for five extra years.","r":"> exp(c(0.08, 0.40))\n[1] 1.083287 1.491825","steps":["The coefficient is a change in log salary: one extra year adds 0.08 to the predicted log salary, holding the other predictors fixed.","Adding on the log scale is multiplying on the original scale. exp(0.08) = 1.083, so predicted salary is about 8.3% higher per extra year.","For five years the log changes by 5 × 0.08 = 0.40, and exp(0.40) = 1.49: about 49% higher, not 5 × 8.3%.","Before trusting such a model, read the residual plot twice: a curved band means the straight-line form is wrong, and a band that widens means the error variance is not constant."]}],"scope":"Scope. The slides do not expect the standard error of a coefficient to be worked out by hand: read it from the R output. They write the residual standard error as σ with a hat and estimated coefficients as b with a hat."},{"terms":[["Nested models","Two models where the smaller one is the larger one with some coefficients set to zero."],["F statistic","The drop in residual sum of squares per added term, divided by the residual variance of the larger model. Large values favour the larger model."],["Adjusted R²","A version of R² that penalises extra predictors, so it can fall when a weak predictor is added."],["Backward and forward selection","Backward selection removes one term at a time, and forward selection adds one term at a time. The model is refitted after each step."],["anova, drop1 and add1","R functions for comparing nested linear models. anova(small, large) gives the F-test for two nested models. The slides work this test out by hand. drop1(model, test = \"F\") gives the F-test for removing each term, one at a time. add1(model, scope = ..., test = \"F\") gives the F-test for adding each candidate term listed in scope, one at a time."]],"q":"A reduced model has residual sum of squares 500 on 27 df. A full model with three more predictors has 380 on 24 df. Are the three extra predictors worth keeping at the 5% level?","r":"> qf(0.95, df1 = 3, df2 = 24)\n[1] 3.008787","steps":["The three predictors reduce the residual sum of squares by 500 − 380 = 120, or 40 per predictor.","The full model’s residual variance is 380 ÷ 24 = 15.83.","F = 40 ÷ 15.83 = 2.53 on 3 and 24 df.","The 5% cutoff is 3.01. Since 2.53 is smaller, the three predictors together do not improve the fit significantly, and the reduced model is kept."],"more":[{"q":"A model with three predictors is fitted to 40 observations and has R² = 0.600. The p-values of the three terms are 0.001, 0.40 and 0.03. After the weakest term is removed and the model refitted, R² = 0.592. Carry out the backward step and compare adjusted R².","steps":["The largest p-value is 0.40, above 0.05, so that term is removed. Only one term is removed at a time, and the model is then refitted.","Adjusted R² before: 1 − (1 − 0.600) × 39 ÷ 36 = 0.567.","Adjusted R² after: 1 − (1 − 0.592) × 39 ÷ 37 = 0.570.","R² fell slightly, as it must when a term is removed, but adjusted R² rose. The simpler model is preferred. The remaining p-values must be read from the refitted model, not from the original output."]}],"scope":"Scope. The slides do not expect the F statistic or the adjusted R² formula to be recalled from memory. Be able to state the hypotheses, read F, its degrees of freedom and p-value from output, and interpret them. Questions here that need a formula are labelled, and the formulas are in the Formulas tab. The slides write the numerator degrees of freedom as p − q, the difference in the number of predictors between the two models."},{"terms":[["Odds","Probability of the event divided by probability of no event. A probability of 0.75 is odds of 3. Odds of 1.5 are read as “3 to 2”. Odds above 1 mean the event is more likely than not, and probability = odds ÷ (1 + odds)."],["Log-odds (logit)","The natural logarithm of the odds. Logistic regression models this as a straight-line function of the predictors."],["Odds ratio","The factor by which the odds are multiplied when a predictor rises by one unit. It equals exp of that predictor’s coefficient."],["Link and response scales","The link scale is log-odds, which predict() returns by default. The response scale is probability, returned with type = \"response\"."],["Classification","Turning a fitted probability into a predicted category. With a threshold of 0.5, predict the category coded 1 when the probability is above 0.5, which is the same as log-odds above 0."],["Z-test for a coefficient","The test of a single logistic regression coefficient, also called a Wald test: Estimate ÷ Std. Error, compared with the standard normal distribution."],["Deviance","A measure, based on the likelihood, of how far a fitted model is from the data. Smaller is better. The null deviance belongs to the model with only an intercept, and the residual deviance belongs to the fitted model."],["Grouped data","When each row is a group and not one individual, the response is given as two columns, successes and failures, as in cbind(successes, failures)."]],"q":"A fitted model has log-odds = −3 + 0.8x. Find the probability at x = 3 and at x = 4, and interpret the coefficient 0.8.","r":"> exp(c(-0.6, 0.2, 0.8))\n[1] 0.5488116 1.2214028 2.2255409","steps":["At x = 3 the log-odds are −3 + 2.4 = −0.6. The odds are exp(−0.6) = 0.549, and the probability is 0.549 ÷ 1.549 = 0.354.","At x = 4 the log-odds are 0.2. The odds are 1.221, and the probability is 1.221 ÷ 2.221 = 0.550.","The odds were multiplied by 1.221 ÷ 0.549 = 2.23, which is exp(0.8). Every one-unit increase in x multiplies the odds by 2.23.","The probability rose by about 0.20 here. The size of that rise depends on the starting point, but the odds ratio does not."]}];
function appendGuide(parent,week){
  const guide=guides[week-1];if(!guide)return;
  if(guide.scope){const scope=document.createElement('p');scope.className='scope-note';formatText(scope,guide.scope);parent.append(scope)}
  const terms=document.createElement('section');terms.className='guide';
  const termsTitle=document.createElement('h3');termsTitle.textContent='Key terms';
  const list=document.createElement('dl');
  for(const [term,meaning] of guide.terms){const dt=document.createElement('dt');dt.textContent=term;const dd=document.createElement('dd');formatText(dd,meaning);list.append(dt,dd)}
  terms.append(termsTitle,list);parent.append(terms);
  const examples=[guide,...(guide.more||[])];
  examples.forEach((item,i)=>{
    const example=document.createElement('section');example.className='guide worked';
    const title=document.createElement('h3');title.textContent=examples.length>1?'Worked example '+(i+1):'Worked example';
    const task=document.createElement('p');task.className='task';formatText(task,item.q);
    example.append(title,task);
    if(item.r)appendConsole(example,item.r);
    const steps=document.createElement('ol');
    for(const step of item.steps){const li=document.createElement('li');formatText(li,step);steps.append(li)}
    example.append(steps);parent.append(example);
  });
}

ifference for each unit and test those.</td><td>Paired t-test on the differences</td><td><math class=\"ref-math\" displaystyle=\"true\"><mfrac><mrow><mover><mi>d</mi><mo>¯</mo></mover></mrow><mrow><msub><mi>s</mi><mi>d</mi></msub><mo>/</mo><msqrt><mrow><mi>n</mi></mrow></msqrt></mrow></mfrac></math><span class=\"ref-dist\">t with n − 1 df; d̄ is the mean difference</span></td></tr>\n<tr><td>Do two separate groups have the same mean?</td><td>Two unrelated groups, and the question gives both population SDs σ₁ and σ₂.</td><td>Two-sample Z-test</td><td><math class=\"ref-math\" displaystyle=\"true\"><mfrac><mrow><msub><mover><mi>x</mi><mo>¯</mo></mover><mn>1</mn></msub><mo>−</mo><msub><mover><mi>x</mi><mo>¯</mo></mover><mn>2</mn></msub></mrow><mrow><msqrt><mrow><mfrac><mrow><msubsup><mi>σ</mi><mn>1</mn><mn>2</mn></msubsup></mrow><mrow><msub><mi>n</mi><mn>1</mn></msub></mrow></mfrac><mo>+</mo><mfrac><mrow><msubsup><mi>σ</mi><mn>2</mn><mn>2</mn></msubsup></mrow><mrow><msub><mi>n</mi><mn>2</mn></msub></mrow></mfrac></mrow></msqrt></mrow></mfrac></math><span class=\"ref-dist\">normal</span></td></tr>\n<tr><td>Do two separate groups have the same mean?</td><td>Two unrelated groups with only sample SDs, and the two spreads are treated as equal (<code>var.equal = TRUE</code>).</td><td>Classical (pooled) t-test</td><td><math class=\"ref-math\" displaystyle=\"true\"><mfrac><mrow><msub><mover><mi>x</mi><mo>¯</mo></mover><mn>1</mn></msub><mo>−</mo><msub><mover><mi>x</mi><mo>¯</mo></mover><mn>2</mn></msub></mrow><mrow><msub><mi>s</mi><mi>p</mi></msub><msqrt><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mi>n</mi><mn>1</mn></msub></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mi>n</mi><mn>2</mn></msub></mrow></mfrac></mrow></msqrt></mrow></mfrac></math><span class=\"ref-dist\">t with n₁ + n₂ − 2 df</span></td></tr>\n<tr><td>Do two separate groups have the same mean?</td><td>Two unrelated groups with only sample SDs, and the spreads may differ. This is what <cod // A week's formula sheet: plain section headings, the notation as a list, and each displayed formula on a named row.
function formatSheet(week){
  let html=tidy(formulaSheets[week-1]),count=0;
  for(const [from,to] of Object.entries(sheetHeadings[week]||{}))html=html.replace('<strong>'+from+'</strong>','<strong>'+to+'</strong>');
  html=html.replace(/<p><strong>Notation\.<\/strong>([\s\S]*?)<\/p>/,(whole,body)=>{
    const sentences=[''];
    for(const piece of body.split(/(<math[\s\S]*?<\/math>)/)){
      if(piece.startsWith('<math')){sentences[sentences.length-1]+=piece;continue}
      piece.split(/(?<=\.)\s+/).forEach((part,i)=>{if(i)sentences.push('');sentences[sentences.length-1]+=part});
    }
    return '<div class="notation"><p><strong>Notation</strong></p><ul>'+sentences.filter(s=>s.trim()).map(s=>'<li>'+s.trim()+'</li>').join('')+'</ul></div>';
  });
  return html.replace(/(?:<br\s*\/?>\s*)?(<math display="block"(?:(?!<\/math>)[\s\S])*<\/math>)/g,(whole,math)=>'<span class="frow"><span class="fname">'+(formulaNames[week-1][count++]||'')+'</span>'+math+'</span>');
}

// Distribution functions used by the interactive demos. Checked against R.
const statMath=(()=>{
 const erf=x=>{const s=x<0?-1:1,a=Math.abs(x),t=1/(1+.3275911*a);return s*(1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-a*a))};
 const Phi=z=>.5*(1+erf(z/Math.SQRT2));
 const lg=x=>{const c=[.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];x-=1;let a=c[0];const t=x+7.5;for(let i=1;i<9;i++)a+=c[i]/(x+i);return .5*Math.log(2*Math.PI)+(x+.5)*Math.log(t)-t+Math.log(a)};
 const simpson=(f,a,b,n)=>{const h=(b-a)/n;let s=f(a)+f(b);for(let i=1;i<n;i++)s+=f(a+i*h)*(i%2?4:2);return s*h/3};
 const bisect=(f,lo,hi)=>{for(let i=0;i<60;i++){const m=(lo+hi)/2;if(f(m)<0)lo=m;else hi=m}return (lo+hi)/2};
 const tPdf=(x,v)=>Math.exp(lg((v+1)/2)-lg(v/2))/Math.sqrt(v*Math.PI)*Math.pow(1+x*x/v,-(v+1)/2);
 const tCdf=(x,v)=>.5+Math.sign(x)*simpson(t=>tPdf(t,v),0,Math.abs(x),Math.max(400,Math.ceil(Math.abs(x)*60)*2));
 const tQ=(p,v)=>bisect(x=>tCdf(x,v)-p,0,80);
 const chiPdf=(x,k)=>x<=0?0:Math.exp((k/2-1)*Math.log(x)-x/2-(k/2)*Math.LN2-lg(k/2));
 const chiCdf=(x,k)=>x<=0?0:k===1?2*Phi(Math.sqrt(x))-1:k===2?1-Math.exp(-x/2):simpson(u=>chiPdf(u*u,k)*2*u,0,Math.sqrt(x),600);   // integrating over the square root keeps the integrand smooth at zero
 const chiQ=(p,k)=>bisect(x=>chiCdf(x,k)-p,0,90);
 return {Phi,tPdf,tCdf,tQ,chiPdf,chiCdf,chiQ};

 const correlation=()=>{

  const u=rng(5),n=80,xs=[],es=[];for(let i=0;i<n;i++){xs.push(gauss(u));es.push(gauss(u))}

  let means=[],shown=M,timer=null;
  const simulate=()=>{const b=boxes[which.sel.value],cum=[];b.p.reduce((s,q,i)=>cum[i]=s+q,0);means=[];
   for(let i=0;i<M;i++){let s=0;for(let j=0;j<n.v;j++){const r=Math.random();let k=0;while(r>cum[k]&&k<cum.length-1)k++;s+=b.v[k]}means.push(s/n.v)}};
  const render=()=>{
   n.show();const b=boxes[which.sel.value],mu=b.v.reduce((s,v,i)=>s+v*b.p[i],0),sd=Math.sqrt(b.v.reduce((s,v,i)=>s+b.p[i]*(v-mu)**2,0)),se=sd/Math.sqrt(n.v);
   const lo=Math.min(...b.v),hi=Math.max(...b.v),span=hi-lo,pad=span*.07,w=span/14;
   const left=panel({X:0,W:180,H:260,x:[lo-2*w,hi+2*w],y:[0,Math.max(...b.p)*1.15],xt:[lo,hi],noY:true,title:'The box',xl:'Ticket value'});
   let s=left.s+b.v.map((v,i)=>'<rect class="fill" x="'+left.px(v-w*.45).toFixed(1)+'" y="'+left.py(b.p[i]).toFixed(1)+'" width="'+(left.px(v+w*.45)-left.px(v-w*.45)).toFixed(1)+'" height="'+(left.base-left.py(b.p[i])).toFixed(1)+'"/>').join('');
   const bins=40,x0=lo-pad,bw=(span+2*pad)/bins,count=new Array(bins).fill(0),used=Math.max(1,shown);
   for(let i=0;i<shown;i++){const k=Math.min(bins-1,Math.max(0,Math.floor((means[i]-x0)/bw)));count[k]++}
   const dens=count.map(c=>c/(used*bw)),peak=1/(se*Math.sqrt(2*Math.PI)),top=Math.max(peak,...dens)*1.12;
   const right=panel({X:180,W:380,H:260,x:[x0,x0+bins*bw],y:[0,top],xt:Math.min(mu-lo,hi-mu)>span*.12?[lo,Math.round(mu*100)/100,hi]:[lo,hi],noY:true,title:'Averages of '+n.v+(n.v===1?' draw':' draws'),xl:'Sample average'});
   s+=right.s+dens.map((v,i)=>v?'<rect class="fill" x="'+right.px(x0+i*bw).toFixed(1)+'" y="'+right.py(v).toFixed(1)+'" width="'+(right.px(x0+(i+1)*bw)-right.px(x0+i*bw)).toFixed(1)+'" height="'+(right.base-right.py(v)).toFixed(1)+'"/>':'').join('')
    +line(right,seq(x0,x0+bins*bw,160).map(x=>[x,dnorm(x,mu,se)]),'ln alt');
   draw(d.stage,svg(560,260,'The box, and the distribution of the sample average',s));
   d.read.innerHTML='The box has mean '+mu.toFixed(2)+' and SD '+sd.toFixed(2)+'. For n = '+n.v+' the average has expected value '+mu.toFixed(2)+' and SE '+sd.toFixed(2)+' ÷ √'+n.v+' = <strong>'+se.toFixed(3)+'</strong>. The line is the normal curve with that mean and SE; the bars are '+shown.toLocaleString('en')+' simulated averages.'+(n.v<10&&which.sel.value!=='die'?' With so few draws the averages still show the shape of the box.':'');
  };
  const settle=()=>{if(timer)clearInterval(timer);simulate();shown=M;render()};
  d.controls.append(which.wrap,n.wrap,button('Draw new samples',()=>{if(timer)clearInterval(timer);simulate();if(!stepped()){shown=M;render();return}shown=0;timer=setInterval(()=>{shown=Math.min(M,shown+250);render();if(shown>=M)clearInterval(timer)},60)}));
  n.input.oninput=settle;which.sel.onchange=settle;simulate();render();return d.box;
 };

 const lawOfAverages=()=>{
  const d=frame('Try it: the law of averages','Toss a fair coin more and more times. The proportion of heads settles near one half, while the number of heads drifts further from half the tosses.');
  let heads=[0],timer=null;   // heads[i] is the number of heads in the first i tosses
  const render=()=>{
   const n=heads.length-1,xmax=Math.max(100,n),stride=Math.max(1,Math.floor(n/300)),a=[],b=[];
   for(let i=1;i<=n;i+=stride){a.push([i,heads[i]/i]);b.push([i,heads[i]-i/2])}
   if(n){a.push([n,heads[n]/n]);b.push([n,heads[n]-n/2])}
   const dev=Math.ceil(Math.max(10,...b.map(q=>Math.abs(q[1])))*1.15);
   const p1=panel({X:0,W:280,H:230,x:[0,xmax],y:[0,1],xt:[0,xmax],yt:[0,.5,1],title:'Proportion of heads',xl:'Tosses'}),p2=panel({X:280,W:280,H:230,x:[0,xmax],y:[-dev,dev],xt:[0,xmax],yt:[-dev,0,dev],title:'Heads minus half the tosses',xl:'Tosses'});
   draw(d.stage,svg(560,230,'Running proportion of heads, and running difference from half',p1.s+L(p1.px(0),p1.py(.5),p1.px(xmax),p1.py(.5),'rule')+(a.length>1?line(p1,a):'')+p2.s+L(p2.px(0),p2.py(0),p2.px(xmax),p2.py(0),'rule')+(b.length>1?line(p2,b,'ln alt'):'')));
   d.read.innerHTML=n?'After '+n.toLocaleString('en')+' tosses: '+heads[n].toLocaleString('en')+' heads, a proportion of <strong>'+(heads[n]/n).toFixed(3)+'</strong>, which is '+(heads[n]-n/2>=0?'+':'−')+Math.abs(heads[n]-n/2)+' from half the tosses. For this many tosses the SE of the proportion is '+(.5/Math.sqrt(n)).toFixed(3)+' and the SE of the count is '+(.5*Math.sqrt(n)).toFixed(1)+'.':'No tosses yet. Press a button to begin.';
  };
  const add=m=>{
   const some=()=>{for(let i=0;i<m/10;i++)if(heads.length<=50000)heads.push(heads[heads.length-1]+(Math.random()<.5?1:0))};
   if(timer)clearInterval(timer);
   if(!stepped()){for(let k=0;k<10;k++)some();render();return}
   let k=0;timer=setInterval(()=>{some();render();if(++k>=10)clearInterval(timer)},55);
  };
  d.controls.append(button('Toss 10',()=>add(10)),button('Toss 100',()=>add(100)),button('Toss 1,000',()=>add(1000)),button('Start again',()=>{if(timer)clearInterval(timer);heads=[0];render()}));
  render();return d.box;
 };

 const coverage=()=>{
  const d=frame('Try it: what the confidence level means','Each line is a confidence interval from a new sample of a population with mean 0 and SD 1. The population mean stays where it is; the intervals move. Count how many miss it.');
  const level=choice('Confidence level',[['1.645','90%'],['1.96','95%'],['2.576','99%']],'1.96'),n=slider('Sample size n',5,100,5,25,v=>String(v));
  let all=[],hits=0,timer=null;
  const half=()=>parseFloat(level.sel.value)/Math.sqrt(n.v);
  const one=()=>{let s=0;for(let i=0;i<12;i++)s+=Math.random();const m=(s-6)/Math.sqrt(n.v);all.push(m);if(Math.abs(m)<=half())hits++};   // the sum of 12 uniform draws, less 6, is very close to a standard normal value
  const render=()=>{
   n.show();const h=half(),last=all.slice(-40),p=panel({W:560,H:300,x:[-1.6,1.6],y:[0,41],xt:[-1.5,-1,-0.5,0,0.5,1,1.5],noY:true,xl:'Interval for the population mean'});
   let s=p.s+L(p.px(0),p.base,p.px(0),p.py(41),'mark');
   last.forEach((m,i)=>{const miss=Math.abs(m)>h;s+=L(p.px(Math.max(-1.6,m-h)),p.py(i+1),p.px(Math.min(1.6,m+h)),p.py(i+1),'seg'+(miss?' miss':''))+(Math.abs(m)<1.6?dot(p,m,i+1,miss?'pt hi':'pt',2.2):'')});
   draw(d.stage,svg(560,300,'Confidence intervals from repeated samples',s));
   d.read.innerHTML=all.length?'Intervals drawn: '+all.length.toLocaleString('en')+'. Containing the population mean: '+hits.toLocaleString('en')+', which is <strong>'+(100*hits/all.length).toFixed(1)+'%</strong>. Each interval is the sample mean ± '+level.sel.value+' × 1 ÷ √'+n.v+' = ± '+h.toFixed(3)+'. The chart shows the latest '+last.length+'.':'No samples yet. Each interval will be the sample mean ± '+h.toFixed(3)+'.';
  };
  const reset=()=>{if(timer)clearInterval(timer);all=[];hits=0;render()};
  d.controls.append(level.wrap,n.wrap,button('Draw 20 samples',()=>{if(timer)clearInterval(timer);if(!stepped()){for(let i=0;i<20;i++)one();render();return}let k=0;timer=setInterval(()=>{one();render();if(++k>=20)clearInterval(timer)},60)}),button('Draw 1,000',()=>{if(timer)clearInterval(timer);for(let i=0;i<1000;i++)one();render()}));
  n.input.oninput=reset;level.sel.onchange=reset;render();return d.box;
 };

 const tVsNormal=()=>{
  const d=frame('Try it: the t curve against the normal curve','Lower the degrees of freedom and watch the tails thicken. The two shaded tails each hold 2.5% of the t curve.');
  const df=slider('Degrees of freedom',1,30,1,4,v=>String(v));d.controls.append(df.wrap);
  const update=()=>{
   df.show();const v=df.v,q=tQ(.975,v),tp=x=>tPdf(x,v),p=panel({W:560,H:250,x:[-5,5],y:[0,.42],xt:[-4,-2,0,2,4],yt:[0,.1,.2,.3,.4],xl:'Standardised statistic',yl:'Density'});
   draw(d.stage,svg(560,250,'t curve and standard normal curve',p.s+(q<5?area(p,seq(-5,-q,40).map(x=>[x,tp(x)]),0)+area(p,seq(q,5,40).map(x=>[x,tp(x)]),0):'')+line(p,seq(-5,5,160).map(x=>[x,dnorm(x)]))+line(p,seq(-5,5,160).map(x=>[x,tp(x)]),'ln alt')+legend(p.px(1.7),p.py(.4),[['ln','Standard normal'],['ln alt','t with '+v+' df']])));
   d.read.innerHTML='<code>qt(0.975, df = '+v+')</code> = <strong>'+q.toFixed(3)+'</strong>, against 1.960 for the normal curve.'+(q>=5?' That cutoff is beyond the edge of this chart.':'')+' Under this t curve '+(200*(1-tCdf(1.96,v))).toFixed(1)+'% of the area lies beyond ±1.96, against 5.0% under the normal curve.'+(v>=25?' With this many degrees of freedom the two curves are almost the same.':'');
  };
  df.input.oninput=update;update();return d.box;
 };

 const chiSquared=()=>{
  const d=frame('Try it: the chi-squared curve','Change the degrees of freedom. The curve starts at zero and leans to the right, and only its upper tail is used in the test. The dashed curve is a normal curve with the same mean and SD, for comparison.');
  const df=slider('Degrees of freedom',1,15,1,3,v=>String(v));d.controls.append(df.wrap);
  const update=()=>{
   df.show();const k=df.v,q=chiQ(.95,k),hi=Math.max(12,Math.ceil(k+4*Math.sqrt(2*k))),step=hi<=16?2:hi<=30?5:10,ticks=[];for(let t=0;t<=hi;t+=step)ticks.push(t);
   const top=k<=2?.5:chiPdf(k-2,k)*1.25,f=x=>Math.min(top,chiPdf(x,k)),p=panel({W:560,H:250,x:[0,hi],y:[0,top],xt:ticks,noY:true,xl:'Value of the statistic'});
   draw(d.stage,svg(560,250,'Chi-squared curve with its upper 5% shaded',p.s+area(p,seq(q,hi,40).map(x=>[x,f(x)]),0)+dashed(p,seq(0,hi,120).map(x=>[x,Math.min(top,dnorm(x,k,Math.sqrt(2*k)))]))+line(p,seq(.02,hi,220).map(x=>[x,f(x)]))+legend(p.px(hi*.55),p.py(top*.95),[['ln','Chi-squared, '+k+' df'],['rule','Normal, same mean and SD']])));
   d.read.innerHTML='<code>qchisq(0.95, df = '+k+')</code> = <strong>'+q.toFixed(3)+'</strong>: a statistic above this is significant at the 5% level. The mean of the curve equals its degrees of freedom, '+k+'. '+(k<6?'The curve is strongly skewed to the right, quite unlike the normal curve.':'With more degrees of freedom it moves closer to the normal curve, but it is still skewed to the right.');
  };
  df.input.oninput=update;update();return d.box;
 };

 const logistic=()=>{
  const d=frame('Try it: from log-odds to probability','Change the intercept and the slope, then slide x. Each one-unit step multiplies the odds by the same factor, yet changes the probability by different amounts.');
  const a=slider('Intercept',-6,6,.1,-3,v=>v.toFixed(1)),b=slider('Slope b',-2,2,.05,.8,v=>v.toFixed(2)),x=slider('x',0,9,.1,3,v=>v.toFixed(1));
  d.controls.append(a.wrap,b.wrap,x.wrap);
  const update=()=>{
   a.show();b.show();x.show();const f=t=>1/(1+Math.exp(-(a.v+b.v*t))),x0=x.v,p0=f(x0),p1=f(x0+1),lo=a.v+b.v*x0;
   const p=panel({W:560,H:250,x:[0,10],y:[0,1.05],xt:[0,2,4,6,8,10],yt:[0,.25,.5,.75,1],xl:'x',yl:'Probability'});
   draw(d.stage,svg(560,250,'Logistic curve with two marked points one unit apart',p.s+line(p,seq(0,10,100).map(t=>[t,f(t)]))+L(p.px(x0),p.base,p.px(x0),p.py(p0),'rule')+L(p.px(x0+1),p.base,p.px(x0+1),p.py(p1),'rule')+dot(p,x0,p0,'pt hi')+dot(p,x0+1,p1,'pt hi')));
   d.read.innerHTML='At x = '+x0.toFixed(1)+': log-odds '+lo.toFixed(2)+', odds '+Math.exp(lo).toFixed(3)+', probability <strong>'+p0.toFixed(3)+'</strong>. One unit further, the odds are multiplied by exp('+b.v.toFixed(2)+') = <strong>'+Math.exp(b.v).toFixed(2)+'</strong> and the probability becomes '+p1.toFixed(3)+', a change of '+(p1-p0>=0?'+':'−')+Math.abs(p1-p0).toFixed(3)+'.';
  };
  for(const s of [a,b,x])s.input.oninput=update;update();return d.box;
 };

const chooserExamples=[["A shop claims half of its customers prefer brand A. In a sample of 100, 38 do.","p̂ = 0.38, so z = (0.38 − 0.50) ÷ √(0.5 × 0.5 ÷ 100) = −0.12 ÷ 0.05 = −2.40.","Two-sided p = 2 × pnorm(−2.40) ≈ 0.016. That is below 0.05, so the data do not support a 50% share."],["A machine should fill bags to a mean of 50 g, and its SD is known to be 5 g. A sample of 25 bags has mean 52 g.","z = (52 − 50) ÷ (5 ÷ √25) = 2 ÷ 1 = 2.00.","Two-sided p = 2 × pnorm(−2.00) ≈ 0.046. That is just below 0.05, so there is some evidence the mean is not 50 g."],["A maker claims its batteries last 40 hours on average; testers suspect less. For 16 batteries the mean life is 36.5 hours with sample SD 6.","t = (36.5 − 40) ÷ (6 ÷ √16) = −3.5 ÷ 1.5 = −2.33, with 15 df.","Lower-tail p = pt(−2.33, 15) ≈ 0.017. The data support a mean life below 40 hours."],["Ten runners are timed before and after a training block. The ten improvements have mean 1.8 s and SD 2.4 s.","t = 1.8 ÷ (2.4 ÷ √10) = 1.8 ÷ 0.759 = 2.37, with 9 df.","Two-sided p ≈ 0.042. There is evidence that the mean time changed."],["Two factories make the same part, with known SDs 6 and 8. Samples of 36 and 64 parts have means 75 and 72.","SE = √(6² ÷ 36 + 8² ÷ 64) = √2 = 1.414, so z = (75 − 72) ÷ 1.414 = 2.12.","Two-sided p ≈ 0.034. There is evidence that the two means differ."],["Group 1: n = 12, mean 30, SD 4. Group 2: n = 10, mean 25, SD 5. The spreads are treated as equal.","s<sub>p</sub> = √((11 × 4² + 9 × 5²) ÷ 20) = 4.48, SE = 4.48 × √(1/12 + 1/10) = 1.92, so t = 5 ÷ 1.92 = 2.61, with 20 df.","Two-sided p ≈ 0.017. There is evidence that the two means differ."],["The same two groups (n = 12, mean 30, SD 4 and n = 10, mean 25, SD 5), without assuming equal spreads.","SE = √(4² ÷ 12 + 5² ÷ 10) = 1.96, so t = 5 ÷ 1.96 = 2.55. R reports about 17.2 df.","Two-sided p ≈ 0.020. The conclusion matches the pooled test here, with slightly fewer degrees of freedom."],["A die is rolled 120 times and shows 25, 17, 15, 23, 24, 16 for faces 1 to 6. Is it fair?","A fair die gives E = 120 ÷ 6 = 20 for every face, so the statistic is (25 + 9 + 25 + 9 + 16 + 16) ÷ 20 = 5.00, with 6 − 1 = 5 df.","p = pchisq(5.00, 5, lower.tail = FALSE) ≈ 0.42. The counts are consistent with a fair die."],["70 students choose lunch options A, B, C in counts 30, 25, 15; 80 staff choose 20, 25, 35. Does the choice depend on the group?","The first expected count is 70 × 50 ÷ 150 = 23.3, and so on for each cell. Adding (O − E)² ÷ E over the six cells gives 9.38, with (2 − 1)(3 − 1) = 2 df.","p ≈ 0.009. There is strong evidence that lunch choice and group are related."],["In a model with three predictors fitted to 30 observations, one row reads Estimate 2.4, Std. Error 0.8.","t = 2.4 ÷ 0.8 = 3.00, with 30 − 3 − 1 = 26 df.","Two-sided p ≈ 0.006. This predictor is useful even with the other two in the model."],["A small model has RSS 520. Adding two predictors gives a full model with RSS 400 on 40 residual df.","F = ((520 − 400) ÷ 2) ÷ (400 ÷ 40) = 60 ÷ 10 = 6.00, on 2 and 40 df.","p = pf(6.00, 2, 40, lower.tail = FALSE) ≈ 0.005. The two predictors are useful together."],["In a logistic model for passing a test, the row for hours studied reads Estimate 0.90, Std. Error 0.36.","z = 0.90 ÷ 0.36 = 2.50.","Two-sided p ≈ 0.012. Each extra hour multiplies the odds of passing by e<sup>0.90</sup> ≈ 2.46."]];
function buildChooser(){
  const box=$('chooser');if(!box||!box.append)return;
  const rows=references.slice(0,references.indexOf('</table>')).split('<tr>').slice(2).map(r=>r.split('<td>').slice(1).map(c=>c.split('</td>')[0]));
  const el=(tag,cls,text)=>{const e=document.createElement(tag);e.className=cls;if(text!==undefined)e.textContent=text;return e};
  const distClass={Z:'z',t:'t','χ²':'c',F:'f'},distName={Z:'normal curve',t:'t curve','χ²':'chi-squared curve',F:'F curve'};
  const items=[],leaves=[];let chosen=null;
  const detail=el('div','ch-result');
  const line=(label,html)=>{const d=el('div','ch-line');d.append(el('span','ch-label',label));const v=el('div','ch-value');v.innerHTML=html;d.append(v);return d};
  const show=()=>{
    box.className='chooser'+(chosen?' picked':'');
    for(const it of items)it.li.className=it.base+(chosen&&chosen.chain.includes(it.li)?' on':'');
    detail.remove?.();detail.replaceChildren();
    if(chosen){
      const row=rows[chosen.r],note=chooserNotes[chosen.r];
      const head=el('div','ch-head');head.append(el('span','ch-use','Use'),el('strong','ch-name',row[2].replace(/<[^>]+>/g,'')));
      const close=el('button','ch-close','×');close.type='button';close.setAttribute('aria-label','Close');close.onclick=()=>{chosen=null;show()};head.append(close);
      detail.append(head,line('When',row[1]),line('Null hypothesis','H₀: '+note[0]),line('Statistic',row[3]),line('Symbols',note[1]));
      const sample=chooserExamples[chosen.r],worked=line('Example','<p>'+sample[0]+'</p><p class="ch-calc">'+sample[1]+'</p><p>'+sample[2]+'</p>');worked.className='ch-line ch-example';
      detail.append(worked,line('In R',note[2]));
      if(chosen.r<9)detail.append(line('Careful','With a small or strongly skewed sample, or small expected counts, switch to a bootstrap or simulation of the same statistic.'));
      // directly under the branch group that holds the chosen test
      chosen.chain[0].append(detail);
      detail.scrollIntoView?.({block:'nearest',behavior:'smooth'});
    }
    const trs=$('refs').querySelectorAll?.('.ref-cards tr');
    if(trs)trs.forEach((tr,k)=>tr.classList?.toggle('ch-hit',!!chosen&&k===chosen.r+1));
  };
  const branch=(node,chain)=>{
    const leaf=node.r!==undefined,base=leaf?'ft-leaf':'ft-branch',li=el('li',base),mine=[...chain,li];
    items.push({li,base});
    if(leaf){
      const b=el('button','ft-test');b.type='button';
      const words=el('span','ft-words');
      if(node.c)words.append(el('span','ft-cond',node.c));
      words.append(el('strong','',rows[node.r][2].replace(/<[^>]+>/g,'')));
      const badge=el('span','ft-dist ft-'+distClass[node.d],node.d);badge.title='Compared with the '+distName[node.d];
      b.append(words,badge);
      const me={chain:mine,r:node.r};leaves.push(me);
      b.onclick=()=>{chosen=chosen===me?null:me;show()};
      li.append(b);
    }else{
      const n=el('div','ft-node');
      if(node.icon){const pic=el('span','ft-pic');pic.innerHTML='<svg viewBox="0 0 44 30" width="44" height="30" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+chooserIcons[node.icon]+'</svg>';n.append(pic)}
      const words=el('span','ft-words');words.append(el('strong','',node.l));if(node.s)words.append(el('span','ch-sub',node.s));
      if(node.e)words.append(el('span','ft-eg','e.g. '+node.e));
      n.append(words);
      const ul=el('ul','');for(const k of node.o)ul.append(branch(k,mine));
      li.append(n,ul);
    }
    return li;
  };
  box.replaceChildren();
  box.append(el('p','ch-title','Which test? Follow the branches'),el('p','ch-q',chooserTree.q));
  const tree=el('ul','ft');for(const k of chooserTree.o)tree.append(branch(k,[]));
  const legend=el('p','ft-legend','The tag on each test is the curve its statistic is compared with: ');
  Object.keys(distClass).forEach((d,k)=>{if(k)legend.append(' · ');legend.append(el('span','ft-dist ft-'+distClass[d],d),' '+distName[d])});
  box.append(tree,legend);
  show();
  // a click anywhere outside the open panel, or Escape, closes it
  document.addEventListener?.('click',e=>{if(!chosen)return;const t=e.target;if(detail.contains?.(t)||t.closest?.('.ft-test'))return;chosen=null;show()});
  document.addEventListener?.('keydown',e=>{if(chosen&&e.key==='Escape'){chosen=null;show()}});
}

const paper = [
[1,"Histogram density","A histogram has class intervals [0, 2), [2, 5) and [5, 10). Their density heights are 0.10, 0.15 and 0.07 respectively. Which interval contains the median?",["[0, 2)","[2, 5)","[5, 10)","The sample size is required."],1,"Use the area of each bar because the vertical scale is density. The first interval contains 20% of the observations. The first two together contain 65%, so the 50th percentile lies in the second interval."],
[2,"Combining groups","A tutorial of 12 students has a mean mark of 72. A second tutorial of 18 students has a mean mark of 82. What is the mean mark for the two tutorials combined?",["76","77","78","80"],2,"Recover the total marks in each tutorial by multiplying its mean by its size. The combined total is 864 + 1476 = 2340 marks for 30 students, giving a mean of 78."],
[3,"Normal probabilities","Scores follow a normal distribution with mean 60 and standard deviation 8. In R, pnorm(0.5) gives 0.6915 and pnorm(1.5) gives 0.9332. Approximately what proportion of scores lie between 56 and 72?",["0.2417","0.6247","0.6915","0.9332"],1,"The standardised endpoints are −0.5 and 1.5. In pnorm(c(0.5, 1.5)), c() supplies two scores and R prints their left-tail areas in that order. By symmetry the area below −0.5 is 1 − 0.6914625. Subtract this from the second output, 0.9331928, to obtain approximately 0.6247."],
[4,"Least-squares prediction","For a sample of students, study time has mean 10 hours and standard deviation 2 hours. Marks have mean 70 and standard deviation 8. The sample correlation is 0.60. Using the least-squares line, what mark is predicted for 13 hours?",["71.8","77.2","82.0","94.0"],1,"For regression of mark on hours, multiply the correlation by the ratio of the mark SD to the hours SD. The slope is 2.4 marks per hour. The line passes through (10, 70), so three additional hours give a fitted mark of 77.2."],
[5,"Conditional probability","A factory obtains 30% of its components from supplier A and the rest from supplier B. Defect rates are 4% for A and 1% for B. A component selected at random is defective. What is the probability that it came from A?",["0.30","0.40","0.63","0.80"],2,"Condition on the defective components. Per 1,000 components, expect 12 defective components from A and 7 from B. The required proportion is 12 out of 19, approximately 0.63."],
[6,"Box model","A ticket is drawn 64 times with replacement from a box containing the numbers 0, 0, 0 and 4. Each ticket is equally likely. What are the expected value and standard error of the sum?",["64 and 8","64 and 13.86","64 and 24","16 and 13.86"],1,"A single draw has mean 1 and variance 3. Replacement makes the draws independent. The expected sum is 64 and its variance is 64 times 3, giving a standard error of approximately 13.86."],
[7,"Sampling distribution","Independent waiting times have mean 12 minutes and standard deviation 6 minutes. For 144 customers, use a normal approximation to estimate the probability that the sample mean exceeds 13 minutes. In R, pnorm(2) gives 0.9772.",["0.0228","0.1587","0.4772","0.9772"],0,"The central limit theorem applies to the sample mean. Its standard error is 6 divided by 12, or 0.5 minutes. A mean of 13 is two standard errors above 12. The output of pnorm(2), 0.9772499, is the area below this cutoff. Subtract it from 1 to obtain the upper-tail probability of about 0.0228."],

[9,"One-sided test","An instrument should dispense 50 mL on average. Its population standard deviation is known to be 4 mL. A random sample of 64 fills has mean 49 mL. For a test against underfilling, which conclusion follows at the 5% level?",["There is evidence that the mean fill is below 50 mL.","There is insufficient evidence because 0.0456 exceeds 0.05.","The probability that the mean equals 50 mL is 0.0228.","At least 95% of individual fills are below 50 mL."],0,"Use the known population SD to obtain a standard error of 0.5 mL. The observed mean is two standard errors below 50. Underfilling specifies the lower tail. The output of pnorm(-2), about 0.0228, already gives the probability of a result this low or lower under the null. Use it directly as the one-sided p-value. Reject the null hypothesis at the 5% level."],
[10,"Inference for a mean","A random sample of 16 measurements from a normal population has mean 24 and sample standard deviation 4. For 15 degrees of freedom, qt(0.975, 15) gives 2.131. Which is a 95% confidence interval for the population mean?",["[16.00, 32.00]","[22.04, 25.96]","[21.87, 26.13]","[23.47, 24.53]"],2,"The population standard deviation is estimated from the sample, so use a t interval with 15 degrees of freedom. qt(0.975, df = 15) returns the t value with 2.5% of the area above it, leaving 95% between the two symmetric cutoffs. The standard error is 4 divided by the square root of 16, or 1. The margin is therefore 2.13145 × 1, giving endpoints 21.87 and 26.13."],
[11,"Paired observations","Ten patients are measured before and after treatment. The within-patient differences (after minus before) are approximately normal, with mean −3 and standard deviation 5. Patients are independent. Which statistic tests whether the population mean change is zero?",["t = −1.90 on 9 df","t = −0.60 on 9 df","t = −1.90 on 18 df","t = −6.00 on 19 df"],0,"Each patient contributes one difference. Apply a one-sample t test to the ten differences. Their standard error is 5 divided by the square root of 10, approximately 1.58. Dividing −3 by 1.58 gives −1.90 with 9 degrees of freedom."],

function examPool(){return [...paper.map((p,i)=>({key:'p'+i,week:p[0]})),...deck.filter(c=>c.g==='Exam-format questions'&&!c.scope).map(c=>({key:'d:'+c.id,week:c.w}))]}
function examQuestion(key){
 if(key[0]==='p'){const i=Number(key.slice(1)),[week,topic,stem,options,correct,solution]=paper[i],snippet=mockConsole[i];return {week,topic,stem:snippet?stem.replace(snippet[0],''):stem,r:snippet?.[1],options,correct,solution}}

 return c&&{week:c.w,topic:c.t,stem:c.q,r:c.r,fig:c.fig,tbl:c.tbl,options:c.o,correct:c.o.indexOf(c.answer),solution:[c.why,c.explanationNote].filter(Boolean).join(' ')};
}
// One question from each of the 15 weeks and one more from anywhere, in random order.
function newPaper(){
 const pool=examPool(),any=list=>list[Math.floor(Math.random()*list.length)],chosen=[];

 chosen.push(any(pool.filter(x=>!chosen.includes(x))));
 for(let i=chosen.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[chosen[i],chosen[j]]=[chosen[j],chosen[i]]}
 return {items:chosen.map(x=>x.key),answers:{},pos:0,submitted:false,started:Date.now()};
}
function showTime(){

 }

// Two animation frames in a row mean the browser is really painting; only then are animations switched on.

// Drifting linked particles behind the page. Skipped for reduced motion and on narrow screens, paused while the tab is hidden.
(()=>{
 const canvas=$('bg');
 if(!canvas.getContext||window.matchMedia('(prefers-reduced-motion: reduce)').matches||window.matchMedia('(max-width: 720px)').matches)return;
 const ctx=canvas.getContext('2d'),reach=130,pointer={x:-999,y:-999};
 let dots=[],width=0,height=0,tone='82,142,137';
 function size(){
  const ratio=window.devicePixelRatio||1;width=window.innerWidth;height=window.innerHeight;
  canvas.width=width*ratio;canvas.height=height*ratio;ctx.setTransform(ratio,0,0,ratio,0,0);
  const count=Math.min(80,Math.round(width*height/16000));
  dots=Array.from({length:count},()=>({x:Math.random()*width,y:Math.random()*height,dx:(Math.random()-.5)*.5,dy:(Math.random()-.5)*.5,r:1+Math.random()*1.6}));
 }
 function link(a,b,limit,strength){
  const gap=Math.hypot(a.x-b.x,a.y-b.y);if(gap>=limit)return;
  ctx.strokeStyle='rgba('+tone+','+(strength*(1-gap/limit)).toFixed(3)+')';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
 }
 function frame(){
  if(!document.hidden){
   tone=document.documentElement.dataset.theme==='dark'?'240,150,70':'82,142,137';
   ctx.clearRect(0,0,width,height);ctx.lineWidth=1;
   for(const d of dots){d.x+=d.dx;d.y+=d.dy;if(d.x<0||d.x>width)d.dx=-d.dx;if(d.y<0||d.y>height)d.dy=-d.dy}
   dots.forEach((d,i)=>{
    for(let j=i+1;j<dots.length;j++)link(d,dots[j],reach,.32);
    link(d,pointer,reach*1.4,.5);
    ctx.fillStyle='rgba('+tone+',.42)';ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fill();
   });
  }
  requestAnimationFrame(frame);
 }

 window.addEventListener('pointermove',e=>{pointer.x=e.clientX;pointer.y=e.clientY});
 size();frame();
})();
