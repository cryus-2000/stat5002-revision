nationNote":"To halve the margin, halve the standard error. Four times as much independent data doubles the square root of the sample size.","wrong":["Sixteen times the data would cut the margin to a quarter.","Fewer observations widen the interval.",null,"Doubling n shrinks the margin only by a factor of √2."]},{"id":81,"w":8,"g":"Concepts","t":"Missing data and inference","q":"Removing missing responses always gives an unbiased estimate of the target mean.","o":["True","False"],"answer":"False","pairs":[],"why":"If the probability of responding depends on the missing outcome, respondents can systematically differ from the target population.","explanationNote":"A narrow interval calculated from respondents can still centre on the wrong population value if the missing observations systematically differ."},{"id":82,"w":8,"g":"Concepts","t":"Interval endpoints in R","q":"Which expression returns both endpoints for estimate m with standard error se and positive cutoff z?","o":["m+c(0,1)*z*se","c(m-z,m+z)*se","m+c(-1,1)*z*se","m/z+c(-se,se)"],"answer":"m+c(-1,1)*z*se","pairs":[],"why":"Subtract and add the same margin z×se around m.","explanationNote":"Both endpoints must be the same distance from the estimated mean when using this symmetric normal interval.","wrong":["This returns m and the upper endpoint only.","This multiplies the estimate by the SE as well.",null,"The cutoff multiplies the SE. It does not divide the estimate."]},{"id":83,"w":8,"g":"Concepts","t":"Wilson commands","q":"An investigator uses a Wilson interval for a success proportion from n independent trials. In binom.confint(x,n,methods='wilson'), what does x denote?","o":["Sample proportion","Number of successes","Confidence level","Number of failures"],"answer":"Number of successes","pairs":[],"why":"The binomial model needs success and trial counts to determine both the fraction and its precision.","explanationNote":"The same success fraction based on 10 or 1,000 observations has different uncertainty. Passing counts preserves that distinction.","wrong":["The function needs counts. A proportion alone hides the sample size.",null,"The confidence level is set with the conf.level argument.","The first argument counts successes. Failures are n − x."]},{"id":84,"w":8,"g":"Concepts","t":"Compatible values","q":"A two-sided 95% Wilson interval is [.41,.58]. Which candidate survives the corresponding 5% score test?","o":[".50",".39",".60",".40"],"answer":".50","pairs":[],"why":"The interval contains exactly those candidate proportions that the score test does not reject at that level.","explanationNote":"If a proposed proportion is outside this interval, the corresponding two-sided test rejects it at the matching significance level.","wrong":[null,".39 is below the lower endpoint, .41.",".60 is above the upper endpoint, .58.",".40 is just below the lower endpoint, .41."]},{"id":85,"w":8,"g":"Concepts","t":"Simulated coverage","q":"Which calculation estimates coverage across simulated intervals with endpoints L and U and true proportion p?","o":["mean(L<=p | p<=U)","mean(U-L)","mean(L<=p & p<=U)","mean(L==p)"],"answer":"mean(L<=p & p<=U)","pairs":[],"why":"Each logical comparison flags an interval containing p. Averaging those flags estimates the coverage probability.","explanationNote":"Across 1,000 repetitions, 950 intervals containing the true value would give simulated coverage of 0.95.","wrong":["| means OR, which is true for almost every interval.","This is the average width of the intervals.",null,"This asks whether the lower endpoint equals p exactly, which almost never happens."]},{"id":86,"w":8,"g":"Concepts","t":"Effective n","q":"A vector has 100 entries including 12 missing. Which n belongs in the SE of the observed-data mean?","o":["12","87","88","100"],"answer":"88","pairs":[],"why":"Only 88 measurements go into the mean, so the SE of that mean is also based on 88.","explanationNote":"A missing entry gives no value to average and no deviation from the mean. Counting it would make the estimated uncertainty too small.","wrong":["12 is the number of missing entries.","87 is the degrees of freedom, n − 1, not the sample size.",null,"100 includes entries with no observed value."]},{"id":87,"w":8,"g":"Concepts","t":"Mean CI in R","q":"For a two-sided 99% interval for a mean with known SD, which R cutoff should be used?","o":["pnorm(.995)","qnorm(.995)","qnorm(.005)","qnorm(.99)"],"answer":"qnorm(.995)","pairs":[],"why":"Half of the excluded 1% goes into each tail, so the upper cumulative probability is .995.","explanationNote":"For a 99% two-sided interval, 0.5% remains in each tail. The upper critical value therefore has 99.5% of the distribution below it.","wrong":["pnorm returns an area, and a cutoff is needed.",null,"qnorm(.005) is the negative cutoff.","qnorm(.99) leaves 1% in each tail and gives a 98% interval."]},{"id":88,"w":8,"g":"Concepts","t":"Wilson centre","q":"Here x counts successes in n trials and z is the positive normal critical value for the confidence level. For z>0 the Wilson centre is always exactly x/n.","o":["True","False"],"answer":"False","pairs":[],"why":"The centre of the Wilson interval is (p̂+z²/(2n))/(1+z²/n), which pulls the centre towards one half. The half-width is z√[p̂(1−p̂)/n+z²/(4n²)]/(1+z²/n).","explanationNote":"This adjustment matters most in small samples or when the sample proportion is near zero or one. For example, zero observed successes still allows positive population probabilities.","scope":"beyond"},{"id":89,"w":9,"g":"Concepts","t":"Intervals and tests","q":"A two-sided 95% interval excludes the null value. What follows for the matching two-sided test?","o":["Reject at 1% automatically","Reject at 5%","Accept the null at 5%","The null value is certainly false"],"answer":"Reject at 5%","pairs":[],"why":"The interval contains the null values that the matching test would not reject, so a value outside it is rejected.","explanationNote":"To check a particular null value, see whether it lies between the endpoints of the corresponding interval.","wrong":["Rejection at 1% would need the 99% interval to exclude the value as well.",null,"The interval excludes the null value, which is evidence against it.","A test gives evidence, not certainty."]},{"id":90,"w":9,"g":"Concepts","t":"HATPC","q":"Match the test step to the work required.","o":["Standardise the departure","Interpret evidence in context","Check the design and model","State population claims","Find the relevant null tail"],"answer":null,"pairs":[["Hypotheses","State population claims"],["Assumptions","Check the design and model"],["Test statistic","Standardise the departure"],["p-value","Find the relevant null tail"],["Conclusion","Interpret evidence in context"]],"why":"The five steps are always done in this order. The hypotheses come first, so the alternative, and with it the tail, is fixed before the data are examined.","explanationNote":"Decide what would count as evidence against the claim. A decrease points to the lower tail, while any change requires both tails.","pw":["H₀ and H₁ are statements about the population parameter, not about the sample.","For example, the observations are independent and the sample is large enough for the normal curve.","It is (observed − expected under H₀) ÷ SE.","It is the chance, under H₀, of a statistic at least as extreme in the direction of H₁.","Say what the evidence means for the original question."]},{"id":91,"w":9,"g":"Concepts","t":"Defect rate","q":"The historical defect probability p₀ is the null benchmark. Take n independent items. To test whether the defect rate rose above p₀, which tail and SE do you use?","o":["Right tail and √(p₀(1−p₀))","Right tail and √(p₀(1−p₀)/n)","Left tail and √(p₀(1−p₀)/n)","Two tails and the observed proportion SE"],"answer":"Right tail and √(p₀(1−p₀)/n)","pairs":[],"why":"A rise means p>p₀, which points to the right tail. The SE uses p₀ because the distribution of the statistic is worked out assuming the null is true.","explanationNote":"Use the benchmark defect rate to work out how unusual this sample would be if the process had stayed at that benchmark.","wrong":["This leaves out the division by n.",null,"A rise in the defect rate shows up as a large sample proportion, in the right tail.","The alternative has a direction, and the SE is calculated under the null value."]},{"id":92,"w":10,"g":"Concepts","t":"One-sample t","q":"Use s for the sample SD and df for the reference distribution’s degrees of freedom. For 16 independent normal observations with unknown SD, which SE and df test a mean?","o":["s and 15","s/4 and 16","s/4 and 15","s/16 and 16"],"answer":"s/4 and 15","pairs":[],"why":"Estimating the mean costs one degree of freedom. The SE of the sample mean is estimated by s/√n.","explanationNote":"The population SD is unknown. Replacing it with the sample SD adds uncertainty, and the t distribution allows for that.","wrong":["s is the SD of single observations. The mean has SE s ÷ √16.","The SE is right, but the df are n − 1 = 15.",null,"The SE divides by √n = 4, and the df are n − 1 = 15."]},{"id":93,"w":10,"g":"Concepts","t":"t tails","q":"Here t is the observed standardised departure from the null and df is its degrees of freedom. Given an observed t and df, which R expression gives the two-sided p-value?","o":["2*pt(-abs(t),df)","pt(abs(t),df)","pt(-abs(t),df)","2*dt(t,df)"],"answer":"2*pt(-abs(t),df)","pairs":[],"why":"pt(-abs(t),df) is the area in the left tail below −abs(t). The t distribution is symmetric, so doubling that area counts both tails.","explanationNote":"With a two-sided alternative a large negative result and an equally large positive result are both evidence against the null.","wrong":[null,"This is the area below |t|, which is close to 1 for a large statistic.","This is one tail only.","dt gives the height of the density, not a tail area."]},{"id":94,"w":10,"g":"Concepts","t":"Bootstrap t","q":"You are constructing a studentised bootstrap distribution for a population mean using resamples of the observed data. Which pivot belongs to a bootstrap resample?","o":["Original mean minus null value, divided by original SE","Resample mean minus original mean, divided by resample SE","Resample mean minus itself, divided by original SE","Resample mean minus null value, divided by resample SE"],"answer":"Resample mean minus original mean, divided by resample SE","pairs":[],"why":"In the bootstrap the observed sample plays the role of the population. Each resample draws n observations from it with replacement, so the pivot is centred on the original sample mean.","explanationNote":"Drawing with replacement allows one observed value to appear several times in a bootstrap sample, which mimics the variation you would see from taking a fresh sample.","wrong":["That is the observed statistic, calculated once from the real sample.",null,"A quantity minus itself is always zero.","Within the bootstrap the role of the true mean is played by the original sample mean, so centre there."]},{"id":95,"w":11,"g":"Concepts","t":"Two independent means","q":"Match each design assumption to a method.","o":["Pooled t","Welch t","Two-sample Z"],"answer":null,"pairs":[["Known population variances","Two-sample Z"],["Unknown common variance","Pooled t"],["Unknown separate variances","Welch t"]],"why":"All three compare a mean difference. The assumptions decide how the standard error of that difference is estimated and which reference distribution is used.","explanationNote":"Use a Z test for known population SDs. When the SDs are estimated, pool them only if the two population variances can be assumed equal. Otherwise use Welch, which estimates each group’s contribution to the SE separately.","pw":["The SE needs no estimate, so the normal curve applies.","Both samples estimate the same variance, so they are pooled.","Each group’s variance is estimated on its own."]},{"id":96,"w":11,"g":"Concepts","t":"Difference direction","q":"The mean of group X is compared with the mean of an independent group Y, and the null of equal means is tested two-sided. Changing the difference from X−Y to Y−X changes the sign of t but leaves the two-sided p-value unchanged.","o":["True","False"],"answer":"True","pairs":[],"why":"Reversing the order changes the sign of the numerator, while the SE stays positive, so t changes sign but not size. The two-sided p-value depends only on the size of t.","explanationNote":"Swapping the group labels reverses which group has the larger mean. A two-sided test still sees the same distance from zero."},{"id":97,"w":11,"g":"Concepts","t":"Simulating differences","q":"To simulate the sampling variability of two independent sample means, what should each repeat produce?","o":["One sample split at random into two halves","Two independently drawn samples and the difference of their means","One draw reused in both groups","One paired difference from arbitrary rows"],"answer":"Two independently drawn samples and the difference of their means","pairs":[],"why":"Each repeat must draw both groups independently, so that the sampling variability of both means is included.","explanationNote":"If one sample mean were held fixed, the simulation would miss the variation that comes from drawing that group again.","wrong":["That uses one population twice and ignores the second group’s own distribution and sample size.",null,"Reusing one draw makes the two groups identical, so their difference is always zero.","Rows from independent groups have no natural pairing, so such a difference has no meaning."]},{"id":98,"w":11,"g":"Concepts","t":"Paired observations","q":"Twenty people are tested before and after. How many independent differences enter the paired test?","o":["19","10","40","20"],"answer":"20","pairs":[],"why":"Compute one change per person. The one-sample test on 20 differences has 19 degrees of freedom.","explanationNote":"Pairing removes the need to compare different people at baseline. The independent units are the people, and each person supplies one change.","wrong":["19 is the degrees of freedom, not the number of differences.","Each person gives one difference, and there are twenty people.","40 counts every measurement, but each person contributes one difference.",null]},{"id":99,"w":12,"g":"Concepts","t":"Pearson contributions","q":"A cell has observed count 15 and expected count 10. What does it contribute to χ²?","o":["2.5","5","1.67","25"],"answer":"2.5","pairs":[],"why":"The contribution is (15−10)²/10. Dividing by the expected count puts cells of different sizes on a comparable scale.","explanationNote":"The observed count is 5 above the expected count. Squaring gives 25, and dividing by 10 gives 2.5, which is this cell’s share of the test statistic.","wrong":[null,"5 is the difference before squaring and dividing.","1.67 divides by the observed count, 15.","25 is the squared difference. It still has to be divided by the expected count."]},{"id":100,"w":12,"g":"Concepts","t":"Goodness of fit","q":"With five fully specified category probabilities, which df and tail apply to Pearson's test?","o":["4, right tail","5, right tail","4, left tail","3, right tail"],"answer":"4, right tail","pairs":[],"why":"The total count fixes the last cell once the other four are known. Large discrepancies make χ² larger, so the evidence against the null is in the right tail.","explanationNote":"After the first four counts are chosen, subtracting their total from the sample size determines the fifth. That gives four free counts.","wrong":[null,"With five categories there are four free counts.","Large discrepancies give large statistics, so the evidence is in the right tail.","Only the total is fixed, which removes one degree of freedom, not two."]},{"id":101,"w":12,"g":"Concepts","t":"Testing a die","q":"Which input belongs in a chi-square goodness-of-fit test for a fair six-sided die?","o":["The proportion of rolls that are sixes","Counts for all six faces, including zeros","The average of the rolls","The six largest rolls"],"answer":"Counts for all six faces, including zeros","pairs":[],"why":"The test compares the six observed counts with their expected counts, which are n/6 for each face.","explanationNote":"A fair die assigns one sixth of the probability to each face. Observed counts far from those expected counts are evidence against fairness.","wrong":["This tests one face and ignores how the other five are distributed.",null,"The average loses the count for each face.","The test compares counts for every face, not selected rolls."]},{"id":102,"w":12,"g":"Concepts","t":"Independence in tables","q":"For a 3×4 table, what are the df for testing independence?","o":["11","7","12","6"],"answer":"6","pairs":[],"why":"The row and column proportions are estimated from the table, so the degrees of freedom are (3−1)(4−1). Expected counts are row total × column total / grand total.","explanationNote":"Under independence the column proportions should be the same in every row. Multiply each row total by the overall column proportions to get that row’s expected counts.","wrong":["11 would be the df for 12 categories with fully specified probabilities.","7 adds the numbers of rows and columns.","12 is the number of cells.",null]},{"id":103,"w":13,"g":"Concepts","t":"Fitted values and R²","q":"Let y be the observed response, ŷ the fitted value, and ȳ the sample mean. SSE and SST denote residual and total sums of squares. For a regression with an intercept, which pair is correct?","o":["Residual=y−ȳ; R²=1−SST/SSE","Residual=y−ŷ; R²=1−SSE/SST","Residual=y−ŷ; R²=SSE/SST","Residual=ŷ−y; R²=SSE/SST"],"answer":"Residual=y−ŷ; R²=1−SSE/SST","pairs":[],"why":"SSE measures variation left around the fitted line. SST measures variation around the sample mean.","explanationNote":"Compare the error left after fitting the model with the error from always predicting the mean. The fraction of that error which the model removes is the share of sample variation it explains.","wrong":["y − ȳ is a deviation from the mean, and the ratio is upside down.",null,"The residual is right, but SSE/SST is the unexplained share.","A residual is observed minus fitted, and SSE/SST is the unexplained share."]},{"id":104,"w":13,"g":"Concepts","t":"Slope precision","q":"Keeping residual SD fixed, spreading the predictor values further apart makes the ordinary simple-regression slope more precise.","o":["True","False"],"answer":"True","pairs":[],"why":"SE(b̂₁)=residual SD / √Σ(xᵢ−x̄)². A wider spread of predictor values makes the denominator larger, so the SE is smaller.","explanationNote":"If all predictor values are nearly identical, many different slopes can fit the cloud almost equally well. More spread helps distinguish those slopes."},{"id":105,"w":13,"g":"Concepts","t":"Model diagnostics","q":"Match each diagnostic to the assumption it helps assess.","o":["Error distribution","Independence","Mean shape and variance"],"answer":null,"pairs":[["Residuals versus fitted","Mean shape and variance"],["Normal Q–Q plot","Error distribution"],["Sampling design","Independence"]],"why":"Look for curvature or changing spread in the first plot and systematic departures from a straight line in the second.","explanationNote":"In a Q–Q plot, see how closely the points follow the reference line. For independence, check how the observations were collected, including whether anyone was measured repeatedly.","pw":["A bend shows the wrong form for the mean, and a fan shape shows unequal variance.","It compares the residuals with what a normal distribution would give.","Independence depends on how the data were collected, and no plot can show it."]},{"id":106,"w":13,"g":"Concepts","t":"Conditional slopes","q":"At a fixed temperature, compare days whose wind speeds differ by d mph. The fitted model for the natural logarithm of ozone concentration is shown below. How should we interpret the wind coefficient b on the original ozone scale?","o":["Holding Temp fixed, increasing Wind by d multiplies the back-transformed fit by exp(bd)","Wind explains b percent of sample variation","Increasing Wind by d adds bd units of ozone","Holding Temp fixed, increasing Wind by d multiplies the back-transformed fit by bd"],"answer":"Holding Temp fixed, increasing Wind by d multiplies the back-transformed fit by exp(bd)","pairs":[],"why":"The change bd is on the log scale. Exponentiating gives a ratio on the original scale. If the predictors are strongly correlated with each other, the SE of the slope can be inflated.","equation":"\\widehat{\\log(\\mathrm{Ozone})}=a+c\\,\\mathrm{Temp}+b\\,\\mathrm{Wind}","definition":"Here a (fitted intercept) is the intercept, c is the temperature coefficient, and b is the wind coefficient per mph.","copy":"At a fixed temperature, compare days whose wind speeds differ by d mph. The fitted model for the natural logarithm of ozone concentration is shown below. How should we interpret the wind coefficient b on the original ozone scale? Fitted log(Ozone) = a + c × Temp + b × Wind. Here a is the intercept, c is the temperature coefficient, and b is the wind coefficient per mph.","explanationNote":"Hold the remaining predictors fixed. A ratio of 0.90 on the original scale means a fitted concentration 10% lower.","wrong":[null,"A coefficient is a rate of change, not a share of variation.","The change bd is on the log scale. On the original scale it is a multiplying factor.","The factor is exp(bd), not bd."]},{"id":107,"w":14,"g":"Concepts","t":"Nested models","q":"Which denominator belongs in a partial F-test comparing nested models fitted to the same data?","o":["Total sum of squares divided by n − 1","Full-model RSS divided by full-model residual df","Reduced-model RSS divided by its df","Difference in the two R² values"],"answer":"Full-model RSS divided by full-model residual df","pairs":[],"why":"The partial F-test compares the RSS saved per extra parameter with the residual variance estimated from the full model. Adjusted R² also takes the residual degrees of freedom into account.","explanationNote":"The smaller model is obtained by setting the extra coefficients to zero. A large F means those terms remove a lot of error compared with the noise left in the full model.","wrong":["That is the variance of the response, which ignores every predictor.",null,"The reduced model’s residuals still contain the effect being tested.","A difference in R² is not an estimate of the residual variance."],"scope":"formula"},{"id":108,"w":14,"g":"Concepts","t":"Stepwise selection","q":"In a backward F-test procedure at 5%, the largest deletion p-value is .72. What is the next step?","o":["Remove that term and refit","Stop, because a p-value is above .05","Remove the term with the smallest p","Remove every term with p>.05 at once"],"answer":"Remove that term and refit","pairs":[],"why":"A large deletion p-value gives little evidence that the term improves fit given the others. The next tests must use the refitted model.","explanationNote":"After a term leaves the model, the remaining predictors adjust for a different set of variables. So the p-values of the remaining predictors can change.","wrong":[null,"A large p-value is the reason to remove a term, not to stop.","The smallest p-value marks the term with the strongest case for staying.","Removing several terms at once ignores how the other tests change after each removal."]},{"id":109,"w":15,"g":"Concepts","t":"Odds and logit","q":"Let p be the probability of success and η the fitted log-odds. Match each quantity to its formula.","o":["p/(1−p)","log(p/(1−p))","1/(1+exp(−η))"],"answer":null,"pairs":[["Odds","p/(1−p)"],["Logit","log(p/(1−p))"],["Inverse logit","1/(1+exp(−η))"]],"why":"Logistic regression models log-odds linearly. The inverse transformation keeps the fitted probability between zero and one.","explanationNote":"Odds compare the chance of the event with the chance of its complement. Odds of 3 to 1 correspond to a probability of three quarters.","pw":["The chance of success divided by the chance of failure.","The natural log of the odds.","It turns log-odds back into a probability between 0 and 1."]},{"id":110,"w":15,"g":"Concepts","t":"Logistic slope","q":"Let b be the coefficient for predictor x in a model of the log-odds of an event. In a logistic model, increasing x by d at fixed other predictors multiplies which quantity by exp(bd)?","o":["Log-odds","Probability","The response itself","Odds"],"answer":"Odds","pairs":[],"why":"Increasing x by d adds bd to the log-odds. Exponentiating turns that addition into multiplying the odds by exp(bd).","explanationNote":"An odds ratio of 2 doubles the odds. To find the new probability you also need the initial odds.","wrong":["The log-odds change by adding bd, not by multiplying.","The change in probability depends on the starting probability.","A binary response is 0 or 1. The model describes its odds.",null]},{"id":111,"w":15,"g":"Concepts","t":"Grouped binomial data","q":"Which response specifies 8 successes in 20 trials to a grouped binomial glm?","o":["cbind(8,12)","cbind(8,20)","cbind(12,8)","cbind(20,8)"],"answer":"cbind(8,12)","pairs":[],"why":"The two columns are successes and failures. predict(...,type='response') returns the fitted success probability.","explanationNote":"For a group of 20 with 7 successes, the input counts are 7 and 13. The model fits the probability that an individual trial succeeds.","wrong":[null,"The second column is failures, not trials.","This swaps the columns and treats the 12 failures as successes.","The first column must be the number of successes."]},{"id":112,"w":15,"g":"Concepts","t":"Wald inference","q":"A logistic slope estimate is .30 with SE .10. What is its Wald z for a zero slope?","o":["30",".33","3",".03"],"answer":"3","pairs":[],"why":"Divide the estimate by its SE. A two-sided p-value uses both normal tails. The null deviance describes the intercept-only model, and the residual deviance describes the fitted model.","explanationNote":"If the true coefficient is zero, the ratio says how many standard errors the estimate lies from zero. A value far from zero in either direction is evidence against a zero coefficient.","wrong":["30 uses .01 as the SE.",".33 is the SE divided by the estimate.",null,".03 multiplies the estimate by its SE."]},{"id":"match-procedures","w":11,"g":"Concepts","t":"Choosing among the tests","q":"Match each study to the procedure that fits it.","o":["One-sample Z-test for a proportion","One-sample t-test","Two-sample Z-test","Two-sample t-test","Paired t-test","Chi-squared test of independence"],"answer":null,"pairs":[["A claimed 30% success rate is checked against 400 yes/no outcomes","One-sample Z-test for a proportion"],["Eight skewed-looking measurements, SD unknown, compared with a target mean","One-sample t-test"],["Two factories with population SDs known from long records","Two-sample Z-test"],["Two separate groups of patients, SDs estimated from the samples","Two-sample t-test"],["The same athletes timed before and after a training block","Paired t-test"],["Smoking status and exercise level recorded for each of 300 adults","Chi-squared test of independence"]],"why":"Start with the type of data, then the design, then whether the SD is known. Counts in categories lead to chi-squared or proportion tests. Measurements lead to Z or t tests, with pairing decided by whether the same units are measured twice.","explanationNote":"With only eight skewed observations the t-test’s normality assumption is doubtful, but among these procedures it is still the one that matches the design. A bootstrap check would be a sensible addition.","pw":["One group of yes/no outcomes is compared with a claimed proportion.","One group of measurements, with the SD estimated from the sample.","Two separate groups, with both population SDs known.","Two separate groups, with the SDs estimated from the samples.","The same units are measured twice, so the differences are analysed.","Two categorical variables are recorded on the same people."]},{"id":"match-r-idioms","w":14,"g":"Concepts","t":"R commands for tables and models","q":"Here fit, reduced and full are fitted linear models, O is a table of observed counts, and x is a numeric vector with group labels g. Match each command to what it does.","o":["Totals within each group","Expected counts under independence","Refits the model without one predictor","F-test comparing two nested models","F-test for dropping each term in turn"],"answer":null,"pairs":[["tapply(x,g,sum)","Totals within each group"],["outer(rowSums(O),colSums(O))/sum(O)","Expected counts under independence"],["update(fit,.~.-x)","Refits the model without one predictor"],["anova(reduced,full)","F-test comparing two nested models"],["drop1(fit,test=\"F\")","F-test for dropping each term in turn"]],"why":"tapply applies a function within groups. outer multiplies every row total by every column total, and dividing by the grand total gives the expected counts. update changes a model formula, anova compares two given models, and drop1 tests each term of one model.","explanationNote":"add1 is the mirror image of drop1: it tests each candidate term that could be added to the current model.","pw":["It splits x by the labels in g and applies sum to each group.","It works out row total × column total ÷ grand total for every cell at once.","The formula .~.-x means the same model with x removed.","It compares the residual sums of squares of the two models.","It removes each term in turn and tests the change."]},{"id":"tf-forward-backward","w":14,"g":"Concepts","t":"Forward and backward selection","q":"Applied to the same data with the same significance level, forward and backward selection always end with the same model.","o":["True","False"],"answer":"False","pairs":[],"why":"The two procedures test terms in different company. Backward selection judges each term given all the others. Forward selection judges it given only the terms already chosen. With correlated predictors these can lead to different final models.","explanationNote":"Neither result is guaranteed to be the best possible model. Selection is a guide, to be combined with knowledge of the subject and a check of the assumptions."},{"id":113,"w":1,"g":"Calculations","t":"Crash rates","q":"District B reports 15 crashes over 5,000 trips. How many crashes per thousand trips?","o":["7.5","0.3","0.003","3"],"answer":"3","pairs":[],"why":"Divide 15 by 5,000 trips and multiply by 1,000.","explanationNote":"There are three crashes per thousand trips. Giving the rate with its denominator makes comparisons between regions meaningful.","wrong":["7.5 would be the rate per 2,500 trips.","0.3 is the rate per hundred trips.","0.003 is the rate per single trip.",null]},{"id":114,"w":2,"g":"Calculations","t":"Weighted mean","q":"A class of 20 averages 60 and a class of 30 averages 80. Find the combined mean.","o":["68","72","140","70"],"answer":"72","pairs":[],"why":"The combined total is 20×60+30×80=3600. Divide by 50 students.","explanationNote":"A class of 30 contributes more individual marks than a class of 20. That is why the combined mean of 72 is closer to 80 than to 60.","wrong":["68 swaps the two class sizes.",null,"140 adds the two averages.","70 is the unweighted average of 60 and 80."]},{"id":115,"w":3,"g":"Calculations","t":"Normal quantile","q":"X ~ N(50,8²) and qnorm(.90)=1.2816. Find its 90th percentile.","o":["51.28","39.75","60.25","58"],"answer":"60.25","pairs":[],"why":"Convert the standard score back to the original units: 50+8×1.2816.","explanationNote":"qnorm(0.90) returns the standard normal 90th percentile, 1.281552. To express that position in the original units, move 1.281552 standard deviations above 50. This gives 50 + 8 × 1.281552 ≈ 60.25.","wrong":["51.28 adds 1.2816 without multiplying by the SD.","39.75 subtracts, which gives the 10th percentile.",null,"58 adds one SD, which is about the 84th percentile."]},{"id":116,"w":4,"g":"Calculations","t":"Regression residual","q":"Predict response y from predictor x. Bars denote sample means, sx and sy are sample SDs, and r is the sample correlation. r=.6, x̄=10, sx=2, ȳ=30 and sy=5. At x=12 the observed y is 36. Find the residual.","o":["33","−3","6","3"],"answer":"3","pairs":[],"why":"Slope=.6×5/2=1.5. The fitted value is 30+1.5×2=33, giving residual 36−33.","explanationNote":"The residual is positive three because the observed response is three units above its prediction.","wrong":["33 is the fitted value.","The observed value is above the fitted one, so the residual is positive.","6 compares the observation with the mean of y, not with its fitted value.",null]},{"id":117,"w":5,"g":"Calculations","t":"Without replacement","q":"Draw two tickets from four red and six blue without replacement. Find P(exactly one red).","o":[".533",".240",".267",".480"],"answer":".533","pairs":[],"why":"Add the red-blue and blue-red paths: 2×(4/10)×(6/9).","explanationNote":"Both orders count as success here. In either order the second draw has nine possible tickets because the first ticket stays out.","wrong":[null,".240 is one order, with the first ticket replaced.",".267 counts only one of the two orders.",".480 treats the draws as made with replacement."]},{"id":118,"w":6,"g":"Calculations","t":"SE of a total","q":"An independent draw pays 0 or 10 with equal probability. What is the SE of the total of 36 draws?","o":["30","180","6","5"],"answer":"30","pairs":[],"why":"Each draw has SD 5. Because the draws are independent, the SE of the total is √36×5.","explanationNote":"The answer is 30 in the units of the total. Multiplying the SD by 36 would be right only if all 36 draws moved up and down together.","wrong":[null,"180 multiplies the SD by 36. The SE grows with √36.","6 is √36, still to be multiplied by the SD of one draw.","5 is the SD of a single draw."]},{"id":119,"w":7,"g":"Calculations","t":"CLT right tail","q":"Independent purchases have mean 20 and SD 12. For 144 purchases use a normal approximation. Given pnorm(2)=.97725, find P(sample mean > 22).","o":[".977",".023",".159",".046"],"answer":".023","pairs":[],"why":"SE=12/√144=1. The threshold is two SEs above the mean, so take 1−.97725.","explanationNote":"pnorm(2) returns the probability to the left of 2 under a standard normal distribution. The question asks for the probability above 2, so subtract the printed 0.9772499 from 1 to obtain about 0.02275.","wrong":[".977 is the area below the cutoff.",null,".159 is the tail beyond one SE, but the cutoff is two SEs away.",".046 counts both tails."]},{"id":120,"w":8,"g":"Calculations","t":"Mean interval","q":"For a population mean interval, σ is the known population SD, n the sample size, x̄ the sample mean and z* the positive critical value. Known σ=12, n=64 and x̄=40. Using z*=1.96, find the lower 95% endpoint.","o":["39.63","37.06","42.94","38.50"],"answer":"37.06","pairs":[],"why":"Subtract the margin: 40−1.96×12/8.","explanationNote":"The margin is 2.94, so the lower endpoint is 37.06. The divisor 8 is the square root of the sample size.","wrong":["39.63 divides the SD by n = 64 where √n = 8 is needed.",null,"42.94 is the upper endpoint.","38.50 subtracts one SE without the cutoff 1.96."]},{"id":121,"w":9,"g":"Calculations","t":"Proportion Z","q":"Let p be the population proportion in agreement and H₀ the null hypothesis. Of 200 people, 112 agree. Test H₀:p=.5. What is the observed Z?","o":[".85","0.06","−1.70","1.70"],"answer":"1.70","pairs":[],"why":"The null SE is √(.5×.5/200). Divide .56−.50 by that SE.","explanationNote":"The observed fraction is 0.06 above the null rate, which is about 1.70 standard errors. The SE uses the null rate because the test asks what happens if the null holds.","wrong":[".85 comes from an SE twice the correct size.","0.06 is the difference in proportions, before dividing by the SE.","The sample proportion is above .5, so Z is positive.",null]},{"id":122,"w":10,"g":"Calculations","t":"Bootstrap interval","q":"The sample mean is 12 and its SE is .8. The bootstrap-t quantiles are −1.6 and 2.3. Find the lower endpoint.","o":["10.16","13.28","9.70","10.72"],"answer":"10.16","pairs":[],"why":"The bootstrap-t interval uses the quantiles in reverse. The lower endpoint subtracts the upper quantile times the SE, 12−2.3×.8.","explanationNote":"A large positive pivot means the sample mean lies above the population mean. Subtracting that overshoot from the sample mean gives the lower endpoint, 10.16.","wrong":[null,"13.28 is the upper endpoint.","9.70 subtracts the quantile without multiplying it by the SE.","10.72 subtracts 1.6, the size of the lower quantile, times the SE."]},{"id":123,"w":11,"g":"Calculations","t":"Paired change","q":"For 25 paired changes, mean(after−before)=−3 and SD=6. The null is that the average change is zero. Find t.","o":["−2.5","−.5","2.5","−12.5"],"answer":"−2.5","pairs":[],"why":"Use one difference per person. The SE is 6/5 and t=−3/(6/5).","explanationNote":"The mean change is 2.5 standard errors below zero. The sign reflects the order of subtraction, after minus before.","wrong":[null,"−.5 divides by the SD of the differences, not by their SE.","The mean change is negative, so t is negative.","−12.5 divides the SD by n = 25 where √n = 5 is needed."]},{"id":124,"w":12,"g":"Calculations","t":"Expected counts","q":"A cell has row total 40, column total 30, grand total 100 and observed count 18. Find its contribution to χ².","o":["2","3","6","12"],"answer":"3","pairs":[],"why":"Under independence the expected count is E=40×30/100=12. The contribution is (18−12)²/12.","explanationNote":"The observed count is six above the expected count. Squaring gives 36, and dividing by 12 gives a contribution of 3.","wrong":["2 divides by the observed count, 18.",null,"6 is the difference between observed and expected.","12 is the expected count."],"tbl":{"cap":"The cell and its totals","head":["","column 1","other columns","row total"],"rows":[["row 1",18,"·",40],["other rows","·","·","·"],["column total",30,"·",100]],"total":true,"mark":[0,1]}},{"id":125,"w":13,"g":"Calculations","t":"Log response","q":"A regression predicts the natural logarithm of ozone concentration from temperature and wind speed. The estimated wind coefficient is −0.060 per mph. At fixed temperature, by what percentage does the back-transformed fit decrease when wind speed rises by 2 mph?","o":["11.31%","6.00%","88.69%","12.00%"],"answer":"11.31%","pairs":[],"why":"Compute the ratio exp(−.06×2)=.88692. The reduction is 100×(1−.88692)%.","explanationNote":"exp(-0.12) raises e to the change in the fitted log concentration. The output 0.88692 is the ratio of the new fitted concentration to the old one. So the new fit is 88.692% of the original, a decrease of 11.31%.","wrong":[null,"6% is the change per mph on the log scale.","88.69% is what remains, not the decrease.","12% treats the change on the log scale as a percentage. Exponentiate first."]},{"id":126,"w":14,"g":"Calculations","t":"Partial F","q":"Two nested regression models predict the same response. RSS means residual sum of squares and df denotes residual degrees of freedom. The reduced model has residual df 48 and RSS 250. The full model, fitted to the same data, has residual df 46 and RSS 184. Find F.","o":["4.125","8.25","33","16.50"],"answer":"8.25","pairs":[],"why":"The RSS saved per new term is (250−184)/2=33. Divide this by the MSE of the full model, 184/46=4.","explanationNote":"The extra terms save 8.25 times as much squared error per added coefficient as the full model leaves per residual degree of freedom.","wrong":["4.125 divides the saving by 4, but only 2 terms were added.",null,"33 is the saving per added term, before dividing by the residual variance of the full model.","16.5 does not divide the saving of 66 by the two added terms."],"scope":"formula"},{"id":127,"w":15,"g":"Calculations","t":"Odds to probability","q":"An increase in x doubles the odds at fixed other predictors. If the original probability was .20, what is the new probability?","o":[".500",".400",".333",".250"],"answer":".333","pairs":[],"why":"Original odds=.20/.80=.25. Doubling gives odds of .5, and the probability is then .5/(1+.5).","explanationNote":"Odds of one to two mean one success for every two failures, so the new event probability is one third.","wrong":[".5 is the new odds, not the probability.",".4 doubles the probability. It is the odds that double.",null,".25 is the original odds."]},{"id":"extension-0","w":1,"g":"Exam-style extensions","t":"Unequal bin widths","q":"An audit has bins [0,2), [2,6), [6,10) containing 18, 24 and 8 observations. Which density bar is tallest, and which bin contains the median?","o":["Second bar; first bin","Second bar; second bin","First bar; second bin","First bar; first bin"],"answer":"First bar; second bin","pairs":[],"why":"Density is relative frequency divided by bin width. Heights are .18, .12 and .04. The cumulative counts are 18 and 42, so ranks 25 and 26 are in the second bin.","explanationNote":"The first bar is tallest because its observations are concentrated in a narrow interval. The median lies in the second bin because the first bin accounts for only 18 of 50 observations.","wrong":["Both parts are wrong: the first bar is taller, and the median is in the second bin.","The second bar holds the most observations but is twice as wide, so it is lower.",null,"The first bin holds only 18 of the 50 observations, short of the halfway rank."]},{"id":"extension-1","w":1,"g":"Exam-style extensions","t":"Unknown category codes","q":"A registry uses −9 for unknown age. Of 100 records, 20 have age −9 and 24 valid records are under 25. Which report describes the observed ages accurately?","o":["24% of records with known age are under 25","20% of records are under 25","44% of all patients are known to be under 25","30% of records with known age are under 25"],"answer":"30% of records with known age are under 25","pairs":[],"why":"The comparison age < 25 silently includes the −9 codes. Remove the −9 codes first, then divide 24 by the 80 known ages. Saying anything beyond those 80 records needs an assumption about why the other ages are missing.","explanationNote":"Among the records with a known age, 24 out of 80 means 30%. The records with unknown ages cannot tell us whether those people were under 25.","wrong":["24% divides by all 100 records, including those of unknown age.","20 is the number of records with unknown age.","44% counts the −9 codes as ages under 25.",null]},{"id":"extension-2","w":2,"g":"Exam-style extensions","t":"Threshold and whisker","q":"Q1=10 and Q3=18. The four largest observations are 24, 28, 31 and 42. Using the lecture definition, what is the upper threshold of the boxplot?","o":["28","30","42","31"],"answer":"30","pairs":[],"why":"IQR = 8, so Q3 + 1.5 × IQR = 30. The upper threshold is the smaller of this value and the maximum, 42, so it is 30. The observations 31 and 42 lie beyond it and are drawn as separate points.","explanationNote":"When R draws the boxplot, the whisker stops at the largest observation that is not beyond the threshold, which is 28 here. If the maximum had been 27, the threshold would be 27 and there would be no separate points.","wrong":["28 is where R ends the whisker, the largest observation inside the threshold. The threshold itself is 30.",null,"42 is the maximum. The threshold is the smaller of the maximum and Q3 + 1.5 × IQR.","31 is the smallest of the points drawn separately."]},{"id":"extension-3","w":2,"g":"Exam-style extensions","t":"Which averaging operation?","q":"A complete box has tickets 1, 1 and 4. Which pair gives the population SD and R's sd() respectively?","o":["1.732 and 1.414","1.414 and 1.732","2.000 and 3.000","1.414 and 1.414"],"answer":"1.414 and 1.732","pairs":[],"why":"The mean is 2 and the squared deviations sum to 6. Divide by 3 for the complete box or by 2 for the sample variance, then take a square root.","explanationNote":"Using all three tickets gives a variance of 2. Treating them as a sample gives a variance of 3. The two SDs are the square roots of 2 and 3.","wrong":["These are in the wrong order. Dividing by n gives the smaller value.",null,"These are the two variances. Take square roots.","The two values differ because their divisors differ."]},{"id":"extension-4","w":3,"g":"Exam-style extensions","t":"Two percentiles, two parameters","q":"A normal distribution has 10th and 90th percentiles 42 and 58. R gives qnorm(.90)=1.282. Which mean and SD fit?","o":["50 and 16.00","50 and 8.00","50 and 12.48","50 and 6.24"],"answer":"50 and 6.24","pairs":[],"why":"By symmetry the mean is halfway between the percentiles. The distance from the mean to the 90th percentile is 8, which equals 1.282 SDs.","explanationNote":"qnorm(0.90) gives 1.281552, so the 90th percentile is that many standard deviations above the mean. Symmetry puts the mean midway between 42 and 58, at 50. Divide the gap of 8 by 1.281552 to obtain a standard deviation of about 6.24.","wrong":["16 is the distance between the two percentiles.","8 is the distance to the 90th percentile, which equals 1.282 SDs.","12.48 divides the full width of 16 by 1.282. The distance from the mean is 8.",null]},{"id":"extension-5","w":3,"g":"Exam-style extensions","t":"Interval area from R","q":"A score has mean 70 and SD 8 under a normal model. R gives pnorm(.5)=.6915 and pnorm(1)=.8413. Estimate the proportion between 62 and 74.","o":[".1498",".8413",".6826",".5328"],"answer":".5328","pairs":[],"why":"The endpoints standardise to −1 and .5. By symmetry the area below −1 is 1 − .8413 = .1587. Subtract this from .6915.","explanationNote":"In pnorm(c(0.5, 1)), c() supplies two scores in order. The first result, 0.6914625, is the area below 0.5. The second, 0.8413447, is the area below 1, so by symmetry the area below −1 is 0.1586553. The area between the required endpoints is about 0.5328.","wrong":[".1498 is the difference of the two printed areas, the proportion between z = .5 and z = 1.",".8413 is the area below z = 1.",".6826 is the area within one SD on both sides of the mean.",null]},{"id":"extension-6","w":4,"g":"Exam-style extensions","t":"Recovering a correlation","q":"An intercept-only model has RSS 100; a simple regression with an intercept has RSS 36 and a negative slope. What is Pearson's r?","o":["−.80","+.80","−.36","−.64"],"answer":"−.80","pairs":[],"why":"The fit explains .64 of the variation. With one predictor and an intercept, R² is the square of r. Take the square root and use the slope for its sign.","explanationNote":"The magnitude is 0.80. A negative slope means the points tend downwards from left to right, so the correlation is −0.80.","wrong":[null,"The slope is negative, so r is negative.","−.36 is the unexplained share with a sign attached.","−.64 is R² with a sign attached. r is its square root."]},{"id":"extension-7","w":4,"g":"Exam-style extensions","t":"When zero correlation misleads","q":"For x = −2, −1, 0, 1, 2, y is respectively 4, 1, 0, 1, 4. A colleague reports r=0. Which reading fits?","o":["A straight line with a steep negative slope","A strong curved relationship with zero linear correlation","Independent variables because r=0","A weak positive linear relationship"],"answer":"A strong curved relationship with zero linear correlation","pairs":[],"why":"Each positive x and its negative have the same y value, so their contributions to the covariance cancel. The scatter still follows a parabola exactly.","explanationNote":"Here knowing x determines y exactly. Zero correlation misses this relationship because it measures linear association.","wrong":["The points fall and then rise, so no single line describes them.",null,"y is determined exactly by x, the opposite of independence.","r = 0 means no linear trend at all."]},{"id":"extension-8","w":5,"g":"Exam-style extensions","t":"Conditioning on a positive result","q":"A fault occurs in 2% of items. A test flags 90% of faulty and 4% of sound items. Among flagged items, roughly what proportion are faulty?","o":["2.0%","31.5%","90.0%","1.8%"],"answer":"31.5%","pairs":[],"why":"Per 10,000 items, 180 faulty and 392 sound items are flagged. Only flagged items count, so the denominator is 572. Divide 180 by 572.","explanationNote":"A positive test changes which items are being considered. Only about 31.5% of flagged items are faulty because sound items are much more common initially.","wrong":["2% is the fault rate before any testing.",null,"90% is the chance that a faulty item is flagged, the reverse condition.","1.8% is the share of all items that are both faulty and flagged."]},{"id":"extension-9","w":5,"g":"Exam-style extensions","t":"Independent trials with unequal faces","q":"On a biased die, P(6)=.20 and P(1)=.10. Three independent rolls are made. What is the probability of exactly two sixes and one one, in any order?","o":[".004",".024",".012",".096"],"answer":".012","pairs":[],"why":"Any one order has probability .2 times .2 times .1. The one can come first, second or third, and these three orders are disjoint, so their probabilities add.","explanationNote":"Three times 0.004 gives 0.012. Counting just one order would leave out the other two orders that give two sixes and one one.","wrong":[".004 is one particular order.",".024 counts six orders, but the two sixes are interchangeable, leaving three.",null,".096 counts too many orders. Only three are distinct."]},{"id":"extension-10","w":6,"g":"Exam-style extensions","t":"Weighted payoff box","q":"An independent play pays −1 with probability .8 or 4 with probability .2. Over 100 plays, find the expected total and its SE.","o":["100 and 20","0 and 20","−80 and 20","0 and 2"],"answer":"0 and 20","pairs":[],"why":"The weighted mean is zero. The single-play variance is .8 times 1 plus .2 times 16, giving 4. Multiply the single-play SD of 2 by the square root of 100.","explanationNote":"The expected total is zero and its standard error is 20. A game that breaks even on average can still produce substantial wins or losses.","wrong":["The expected value of one play is zero, so the expected total is zero.",null,"−80 counts only the losses.","2 is the SD of one play. Multiply by √100."]},{"id":"extension-11","w":6,"g":"Exam-style extensions","t":"Continuity correction in a tail","q":"A fair coin is tossed 100 times. Use a normal approximation with a continuity correction to find the chance of at least 60 heads. Given pnorm(1.9)=.9713 and pnorm(2)=.9772, which answer follows?","o":[".0228",".9713",".0287",".0179"],"answer":".0287","pairs":[],"why":"The count has mean 50 and SD 5. Include the bar for 60 by starting at 59.5, giving z=1.9. The required area is in the right tail.","explanationNote":"pnorm(c(1.9, 2)) gives left-tail probabilities in the same order as the two scores. The corrected cutoff is 1.9, so use the first value, 0.9712834. At least 60 heads is the upper tail, with probability approximately 0.02872.","wrong":[".0228 starts at 60 and leaves out half of the bar for 60.",".9713 is the area below the cutoff.",null,".0179 starts at 60.5 and leaves out the whole bar for 60."],"scope":"beyond"},{"id":"extension-12","w":7,"g":"Exam-style extensions","t":"Rare-event approximation","q":"A batch contains 200 independent opportunities for an error, each with probability .001. Why can the CLT approximation for the count perform poorly?","o":["The outcomes are not binary","Independence prevents a normal approximation","The expected count is 200, so the curve is too narrow","The expected count is only .2 and the distribution has a large mass at zero"],"answer":"The expected count is only .2 and the distribution has a large mass at zero","pairs":[],"why":"The count cannot go below zero, and a few small whole numbers carry most of the probability. A large number of trials does not by itself make the sampling distribution nearly symmetric.","explanationNote":"The expected count is only 0.2. Even with 200 trials most samples will contain no errors, so the distribution is too lopsided for a good normal approximation.","wrong":["Each opportunity either has an error or does not.","Independence is a requirement of the approximation, not an obstacle.","The expected count is 200 × .001 = .2.",null]},{"id":"extension-13","w":7,"g":"Exam-style extensions","t":"Loss probability versus expected loss","q":"Each independent game has mean net profit −.2 and SD 2. For 100 games, use the CLT and pnorm(1)=.8413. Estimate the chance of a positive total.","o":[".0228",".5000",".8413",".1587"],"answer":".1587","pairs":[],"why":"The total has mean −20 and SE 20. Breaking even is one SE above the expected total, so a profit is the upper tail beyond that point.","explanationNote":"pnorm(1) gives 0.8413447, the area below one standard error above the expected total. That area is the chance of breaking even or losing under the continuous approximation. The remaining area, about 0.1587, is the chance of a profit.","wrong":[".0228 is the tail beyond two SEs. Breaking even is one SE above the mean.","A half would require an expected profit of zero.",".8413 is the chance of a loss or of breaking even.",null]},{"id":"extension-14","w":8,"g":"Exam-style extensions","t":"Planning an audit","q":"The population SD is 15. Find the smallest n giving a two-sided 95% mean interval with total width at most 5, using 1.96.","o":["138","35","12","139"],"answer":"139","pairs":[],"why":"The half-width is 2.5. Squaring 1.96 times 15 divided by 2.5 gives 138.30, so round up to meet the margin.","explanationNote":"A sample of 138 falls just short of the required precision. The smallest acceptable whole number is 139.","wrong":["138 gives a width slightly above 5. Round up.","35 uses the full width, 5, as the margin.","12 forgets to square 1.96 × 15 ÷ 2.5.",null]},{"id":"extension-15","w":8,"g":"Exam-style extensions","t":"Wilson at the boundary","q":"In 20 independent trials there are no successes. A Wilson 95% interval is approximately [0,.161]. Which conclusion is justified?","o":["The observed sample proportion could have been .161 in this dataset","The population success rate is exactly zero","A population rate of .10 is compatible with these observations","The interval shows that the sample was not random"],"answer":"A population rate of .10 is compatible with these observations","pairs":[],"why":"The observed fraction is exactly zero, but a small positive population probability can still produce no observed successes. The score test does not reject .10, so it stays in the interval.","explanationNote":"A true success chance of 0.10 lies inside the reported interval. Twenty unsuccessful trials are compatible with that value at this confidence level.","wrong":["The observed proportion is fixed at 0. The interval is about the population rate.","Zero successes in 20 trials cannot rule out a small positive rate.",null,"An interval cannot assess how the sample was drawn."]},{"id":"extension-16","w":9,"g":"Exam-style extensions","t":"Discrete rejection threshold","q":"Here p is the per-item probability of an alarm event and n is the number of independent items. An alarm tests p=.10 versus p>.10 using n=100 and critical z=1.645. Ignore continuity correction. What is the smallest count that triggers the alarm?","o":["16","17","15","14"],"answer":"15","pairs":[],"why":"Under the null the count has mean 10 and SD 3. The continuous cutoff is 14.935. The first integer above that cutoff is 15.","explanationNote":"The alarm depends on a count. Fourteen alarms fall below the cutoff and fifteen exceed it, so the smallest triggering count is fifteen.","wrong":["15 already exceeds the cutoff 14.935, and the question asks for the smallest such count.","17 is the threshold for a 1% test, with cutoff 2.326.",null,"14 is below the cutoff 14.935."]},{"id":"extension-17","w":9,"g":"Exam-style extensions","t":"Significance at two levels","q":"From a known-SD mean test, z=−2.40 and pnorm(−2.40)=.0082. For a two-sided alternative, which decision is correct?","o":["Reject at both 5% and 1%","Reject at 1% but not at 5%","Retain at both levels","Reject at 5% but not at 1%"],"answer":"Reject at 5% but not at 1%","pairs":[],"why":"Double the lower-tail area to get .0164. It falls between .01 and .05. The matching 99% interval therefore includes the null value, while the 95% interval excludes it.","explanationNote":"pnorm(-2.40) gives the lower-tail probability 0.008197536. A two-sided test also counts positive scores that are just as extreme. By symmetry the p-value is double the lower-tail area, about 0.0164, which is small enough to reject at 5% but above the 1% threshold.","wrong":["The two-sided p-value, .0164, is above .01.","Any result significant at 1% is also significant at 5%.","The two-sided p-value, .0164, is below .05.",null]},{"id":"extension-18","w":10,"g":"Exam-style extensions","t":"Studentised bootstrap tail","q":"The observed t is −2.1. Among 5,000 null bootstrap pivots, 145 are at most −2.1 and 65 are at least +2.1. Using the lecture's absolute-statistic rule, find the two-sided p-value.","o":[".029",".058",".013",".042"],"answer":".042","pairs":[],"why":"Count the pivots in both tails that are at least as extreme as the observed one: 145 + 65 = 210 of 5,000. Doubling the lower-tail fraction assumes symmetric tails, which these bootstrap results do not have.","explanationNote":"The simulated two-sided p-value is 0.042. Each simulated statistic counts once if its distance from zero is at least 2.1.","wrong":[".029 counts only the lower tail.",".058 doubles the lower tail, which assumes the two tails are equal.",".013 counts only the upper tail.",null]},{"id":"extension-19","w":10,"g":"Exam-style extensions","t":"Checking a small-sample t model","q":"Nine independent observations have a strongly right-skewed Q–Q plot with one extreme upper point. Which assessment of the one-sample t interval is defensible?","o":["Its nominal coverage is uncertain; inspect the outlier and the sampling model","The Q–Q plot proves the observations are dependent","Using 8 df guarantees exact 95% coverage for any population","The interval is valid because the central limit theorem applies"],"answer":"Its nominal coverage is uncertain; inspect the outlier and the sampling model","pairs":[],"why":"The t interval is exact for small samples only when the population is normal. An extreme value can affect both the mean and its estimated SE. Independence is assessed from the study design.","explanationNote":"With only nine observations an extreme upper point can shift the centre considerably. Because the data depart from normality in this way, treat the usual t interval with caution.","wrong":[null,"A Q–Q plot shows the shape of the distribution. It cannot detect dependence.","The t interval is exact only for a normal population.","Nine observations from a strongly skewed population are too few for that."]},{"id":"extension-20","w":11,"g":"Exam-style extensions","t":"Building the null for Welch simulation","q":"Two independent groups have different spreads. You want a bootstrap test of equal means that keeps each group’s own shape. What should be resampled?","o":["Resample only the group with the larger spread","Resample raw groups without centring, treating their original difference as zero","Centre each group at its own mean, then resample separately with replacement","Pool raw observations and always draw the same pairs"],"answer":"Centre each group at its own mean, then resample separately with replacement","pairs":[],"why":"Subtracting each group’s own mean from its observations gives two sets of values with the same mean, so the null of equal means holds for them. Resampling each group separately keeps its shape, size and spread. Recompute the Welch SE for every resample.","explanationNote":"Equal means under the null still allow different spreads. Combining both samples into one pool would give both groups the same distribution, and so the same spread.","wrong":["Both sample means vary, so both groups must be resampled.","Uncentred groups keep their observed difference, so equal means are not imposed.",null,"Pooling forces both groups to share one distribution, including the same spread."]},{"id":"extension-21","w":11,"g":"Exam-style extensions","t":"Paired confidence interval","q":"Twelve independent pairs have mean change 2.4 and SD of the changes 3.0. R gives qt(.975,11)=2.201. Which 95% interval fits?","o":["[1.05,3.75]","[0.70,4.10]","[0.49,4.31]","[−4.20,9.00]"],"answer":"[0.49,4.31]","pairs":[],"why":"Use the SD of the twelve differences. The SE is about .866 and the margin is 1.906. The endpoints are changes on the original measurement scale.","explanationNote":"qt(0.975, df = 11) returns the point with 97.5% of the t distribution below it. Twelve paired differences give 11 degrees of freedom. Leaving 2.5% in each tail gives the central 95%. Multiply 2.200985 by the standard error of about 0.866, then subtract and add the margin to 2.4 to get [0.49, 4.31].","wrong":["Its margin, 1.35, is too small. The SE .866 times 2.201 gives 1.91.","This uses the normal cutoff 1.96 where the t cutoff is needed.",null,"This multiplies the cutoff by the SD, 3.0, without dividing by √12."]},{"id":"extension-22","w":12,"g":"Exam-style extensions","t":"Estimating null parameters","q":"Counts are grouped into six categories. One distribution parameter is estimated from the same counts under the null. Under the usual regularity conditions, how many goodness-of-fit df remain?","o":["6","5","3","4"],"answer":"4","pairs":[],"why":"The fixed total removes one degree of freedom. Estimating one parameter removes another, which leaves 6 − 1 − 1 = 4.","explanationNote":"Six category counts give five free counts once the total is fixed. Estimating the additional parameter leaves four degrees of freedom for the test.","wrong":["6 is the number of categories.","5 allows for the fixed total but not for the estimated parameter.","Only one parameter was estimated, so only one further degree of freedom is lost.",null]},{"id":"extension-23","w":12,"g":"Exam-style extensions","t":"Reconciling R with hand calculations","q":"Here tab stores the four observed counts. For a 2 by 2 table, R's default chisq.test gives a smaller statistic than a hand Pearson calculation. Which call reproduces the uncorrected Pearson test?","o":["chisq.test(tab, correct=FALSE)","chisq.test(tab/100)","chisq.test(tab, correct=TRUE)","fisher.test(tab)"],"answer":"chisq.test(tab, correct=FALSE)","pairs":[],"why":"For a 2 by 2 table, R applies a continuity correction by default. It can shrink the absolute differences between observed and expected counts, which makes the statistic smaller. Keep the original counts and switch the correction off.","explanationNote":"Use chisq.test(tab, correct=FALSE). The two results differ only because of the correction. The observations are the same.","wrong":[null,"The test needs counts. Rescaling them changes the statistic.","correct=TRUE is the default, which produced the smaller statistic.","Fisher’s exact test is a different procedure and reports no Pearson statistic."]},{"id":"extension-24","w":12,"g":"Exam-style extensions","t":"Simulating a null table","q":"Here tab is the observed contingency table, in which each unit is counted in one cell. For the lecture's independence test using chisq.test(tab,simulate.p.value=TRUE), what is held fixed in simulated tables?","o":["Only the grand total","Every observed cell count","Both observed margins","Only the largest observed count"],"answer":"Both observed margins","pairs":[],"why":"The simulated null tables preserve observed row and column totals. For a goodness-of-fit test with specified probabilities, simulation instead draws counts from those probabilities.","explanationNote":"Fixing the margins keeps the same numbers in each row group and column group. The simulation varies how those groups overlap inside the table.","wrong":["R’s simulation for a table keeps both sets of marginal totals fixed, not just the grand total.","If every cell were fixed, all simulated tables would be identical.",null,"Fixing one count does not define the null distribution."]},{"id":"extension-25","w":13,"g":"Exam-style extensions","t":"Reconstructing the slope interval","q":"An R fit reports a slope .040, Std. Error .018, and residual standard error .40 on 40 df. Use qt(.975,40)=2.021. Which slope interval follows?","o":["[.0036,.0764]","[.0047,.0753]","[.022,.058]","[−.7684,.8484]"],"answer":"[.0036,.0764]","pairs":[],"why":"Use the coefficient's SE of .018. Multiplying it by 2.021 gives a margin of .0364. The residual SD of .40 describes how the responses scatter around the fit, so it is not used here.","explanationNote":"Read Estimate and Std. Error from the slope row. qt(0.975, df = 40) supplies the positive critical value for a central 95% interval with 40 residual degrees of freedom. Using the displayed rounded value gives 0.040 ± 2.021 × 0.018, or approximately [0.0036, 0.0764].","wrong":[null,"This uses the normal cutoff 1.96 where the t cutoff 2.021 is needed.","This is the estimate plus or minus one SE, without the t cutoff.","This uses the residual standard error, .40, in place of the SE of the slope."]},{"id":"extension-26","w":13,"g":"Exam-style extensions","t":"Collinearity in R output","q":"The response is log ozone concentration. Temp measures temperature and Radiation measures solar radiation. The reported t tests whether the temperature slope is zero after adjusting for radiation. A model has R²=.82, cor(Temp,Radiation)=.98 and t=1.25 for Temp. Use a two-sided cutoff of 2. Which conclusion fits all three values?","o":["Both predictors have statistically significant coefficients because the model explains 82% of the variation.","The model explains 82% of the variation in log ozone concentration. At the stated significance level, there is insufficient evidence that the temperature coefficient differs from zero after adjustment for solar radiation.","Temperature should be removed because it explains none of the variation in log ozone concentration.","The temperature test establishes that temperature and log ozone concentration are uncorrelated before adjustment for solar radiation."],"answer":"The model explains 82% of the variation in log ozone concentration. At the stated significance level, there is insufficient evidence that the temperature coefficient differs from zero after adjustment for solar radiation.","pairs":[],"why":"Compare the absolute temperature test statistic, 1.25, with the critical value, 2. We fail to reject the hypothesis of a zero temperature coefficient. The two predictors together explain 82% of the sample variation in log ozone concentration. The two predictors have a correlation of 0.98, so at a given level of radiation there is little variation in temperature. This can increase the standard error of the temperature coefficient.","explanationNote":"Two predictors can predict the response well together while the data contain little information to separate their individual contributions.","wrong":["R² describes the model as a whole. It does not make each coefficient significant.",null,"A non-significant adjusted coefficient does not show that a predictor explains nothing on its own.","The t test concerns temperature after adjusting for radiation. It says nothing about the unadjusted correlation."]},{"id":"extension-27","w":14,"g":"Exam-style extensions","t":"Overall versus partial hypotheses","q":"The full model contains wind, temperature and radiation. The reduced model retains wind. Which null does anova(reduced,full) test?","o":["Temperature and radiation slopes are equal","Both temperature and radiation slopes are zero given wind","All three slopes are zero","The wind slope is zero given temperature and radiation"],"answer":"Both temperature and radiation slopes are zero given wind","pairs":[],"why":"The null sets to zero exactly those coefficients that the reduced model leaves out. Under the alternative, one or both of the added terms help.","explanationNote":"The null says that both temperature and radiation have zero slopes after accounting for wind. Wind remains in both models and is not one of the tested additions.","wrong":["The test sets the added slopes to zero. It does not compare them with each other.",null,"Wind is in both models, so its slope is not being tested.","Wind is not one of the terms that differ between the two models."]},{"id":"extension-28","w":14,"g":"Exam-style extensions","t":"Reading adjusted R-squared","q":"On the same observations, adding a predictor changes R² from .650 to .651 and adjusted R² from .630 to .622. What follows?","o":["The added predictor is statistically significant","RSS increased","RSS fell, but the improvement did not offset the extra parameter in adjusted R²","The new model must predict better on unseen observations"],"answer":"RSS fell, but the improvement did not offset the extra parameter in adjusted R²","pairs":[],"why":"Adding a coefficient can lower the RSS on the data used to fit the model. Adjusted R² penalises the loss of residual degrees of freedom. Neither summary directly measures how well the model predicts new data.","explanationNote":"The small increase in ordinary R² shows slightly better fit to these data. The fall in adjusted R² says that this gain was too small to make up for the penalty for the extra parameter.","wrong":["A fall in adjusted R² points the other way.","R² rose, so the residual sum of squares fell.",null,"Neither R² nor adjusted R² measures performance on new data."]},{"id":"extension-29","w":14,"g":"Exam-style extensions","t":"Forward selection after refitting","q":"A and B are candidate predictors. Each reported p-value tests the new predictor given the terms already selected. At a 5% entry level, add1 reports p=.018 for A and .041 for B. After adding the first term and refitting, the other has p=.11. What is the selected model?","o":["B only","Neither A nor B","A only","A and B"],"answer":"A only","pairs":[],"why":"A enters first because both p-values are below .05 and its p-value is the smaller. The decision about B then uses the test made after A is in the model, where .11 exceeds .05.","explanationNote":"Start with A, refit, and stop there. The earlier evidence for B was calculated before adjustment for A.","wrong":["A has the smaller p-value and enters first.","A qualifies at the first step with p = .018.",null,"After A is added, the p-value for B is .11, above the entry level."]},{"id":"extension-30","w":14,"g":"Exam-style extensions","t":"When one extra term is tested","q":"Nested least-squares models differ by one slope. Its t statistic in the full fit is −2.4. What partial F compares them?","o":["5.76","2.40","4.80","−5.76"],"answer":"5.76","pairs":[],"why":"With one numerator degree of freedom the partial F is the square of the t statistic for that coefficient. The upper-tail F test gives the same p-value as the two-sided t test.","explanationNote":"Squaring −2.4 gives 5.76. Squaring removes the sign, because the F comparison asks only whether including the slope improves the fit, whichever direction the slope goes.","wrong":[null,"F is the square of t, not its size.","4.80 doubles the size of t. F is its square.","An F statistic is never negative."],"scope":"formula"},{"id":"extension-31","w":15,"g":"Exam-style extensions","t":"Link versus response prediction","q":"Here fit models the chance that the response equals 1, and newdata supplies predictor values for one new case. predict(fit,newdata) from a binomial logit glm gives −1.3863. What does type='response' return approximately?","o":[".80",".25",".20","−1.39"],"answer":".20","pairs":[],"why":"Exponentiating the linear predictor gives odds of .25. Dividing the odds by one plus the odds gives the probability of the event, .20.","explanationNote":"exp(-1.3863) converts the fitted log-odds to odds, approximately 0.25. That is one expected success per four failures. On the response scale this is one success out of five, so predict(..., type=\"response\") returns approximately 0.20.","wrong":[".80 is the probability of the other outcome.",".25 is the odds.",null,"That is the log-odds, which type='response' converts to a probability."]},{"id":"extension-32","w":15,"g":"Exam-style extensions","t":"Comparing deviance","q":"For the same grouped binomial observations R gives null deviance 74 and residual deviance 46. Which reading is justified?","o":["The model explains 28% of the variation","The fitted predictors reduce deviance by 28 relative to an intercept-only model","The model correctly classifies 28 additional cases","Its probability predictions are 46% accurate"],"answer":"The fitted predictors reduce deviance by 28 relative to an intercept-only model","pairs":[],"why":"Deviance uses the likelihood to measure how far the model is from the data. A reduction means the model fits these data better. It is not a count of correct classifications.","explanationNote":"fit$null.deviance extracts the intercept-only deviance. deviance(fit) returns the deviance of the fitted model. c() displays both with the supplied names. Read 74 under null and 46 under residual. The drop of 28 measures improvement in fit on these data. Testing its significance also requires the difference in model degrees of freedom.","wrong":["Deviance is not a percentage of variation.",null,"Deviance is not a count of classified cases.","Deviance is not a percentage."]},{"id":"extension-33","w":15,"g":"Exam-style extensions","t":"Odds ratio over several units","q":"A logistic slope is .035 per year at fixed glucose and BMI. Which describes a ten-year difference?","o":["Estimated odds are 41.9% higher","Estimated odds are 35% higher","Estimated probability rises by 41.9 percentage points","Estimated odds rise by 3.5% over ten years"],"answer":"Estimated odds are 41.9% higher","pairs":[],"why":"Multiply the slope by ten on the log-odds scale, then exponentiate. To find the change in probability you would also need the starting probability.","explanationNote":"exp(0.35) converts the ten-year change in fitted log-odds to an odds ratio. The printed 1.41907 means the estimated odds are 1.41907 times as large at fixed glucose and BMI, or about 41.9% higher.","wrong":[null,"35% multiplies the slope by ten without exponentiating.","The factor 1.419 applies to the odds. The change in probability depends on the starting value.","3.5% is roughly the change per year, not over ten years."]},{"id":"exam-1-1","w":1,"g":"Exam-format questions","t":"Median from a frequency histogram","q":"The histogram below shows a distribution on a frequency scale, with class intervals [0, 2), [2, 5), [5, 9) and [9, 15). The number above each bar is its frequency. Which class interval contains the median?","fig":{"type":"hist","breaks":[0,2,5,9,15],"heights":[4,9,8,3],"ylab":"Frequency","xlab":"Value","labels":true},"o":["[0, 2)","[2, 5)","[5, 9)","[9, 15)"],"answer":"[2, 5)","pairs":[],"why":"There are 4 + 9 + 8 + 3 = 24 observations, so the median lies between the 12th and 13th values. Cumulative counts are 4 after the first interval and 13 after the second. Both middle values fall in [2, 5).","explanationNote":"On a frequency scale the heights are counts, so add them directly. The widest interval, [9, 15), holds only 3 observations, and width plays no part in finding the median here."},{"id":"exam-1-2","w":1,"g":"Exam-format questions","t":"Proportion from a density histogram","q":"The histogram below is drawn on the density scale. The bar heights are 0.05 on [0, 4), 0.10 on [4, 10) and 0.02 on [10, 20). What percentage of the observations lie below 7?","fig":{"type":"hist","breaks":[0,4,10,20],"heights":[0.05,0.1,0.02],"ylab":"Density","xlab":"Value","labels":true},"o":["50%","35%","30%","70%"],"answer":"50%","pairs":[],"why":"On the density scale, area is proportion. The first bar has area 0.05 × 4 = 0.20. Below 7, the second bar contributes a strip of width 3 and height 0.10, area 0.30. Together that is 0.50.","explanationNote":"A quick check that the scale is density: the three areas, 0.20, 0.60 and 0.20, add to 1. The answer 30% counts the strip of the second bar and leaves out the first bar."},{"id":"exam-1-3","w":1,"g":"Exam-format questions","t":"Comparing groups in a two-way table","q":"A survey of 400 cyclists who had an accident records helmet use and whether they were injured. Select the correct statement.","r":"            Injured  Not injured  Total\nHelmet           30          270    300\nNo helmet        20           80    100\nTotal            50          350    400","o":["The injury rate is the same in both groups, 12.5%.","Most injured cyclists wore a helmet, so helmets increase the risk of injury.","30% of helmet wearers were injured.","The injury rate is lower among helmet wearers (10%) than among non-wearers (20%)."],"answer":"The injury rate is lower among helmet wearers (10%) than among non-wearers (20%).","pairs":[],"why":"To compare risk between groups, work out the rate within each group. Among helmet wearers 30 ÷ 300 = 10% were injured. Among non-wearers 20 ÷ 100 = 20% were injured.","explanationNote":"It is true that 30 of the 50 injured wore helmets, but that is because three times as many cyclists wore one. The value 12.5% is the overall rate, 50 ÷ 400, which hides the difference between the groups."},{"id":"exam-1-4","w":1,"g":"Exam-format questions","t":"Reading a boxplot","q":"The boxplot below summarises delivery times in minutes. The quartiles are 20, 26 and 36, the whiskers end at 8 and 55, and one point is drawn separately at 68. Select the correct statement.","fig":{"type":"box","min":8,"q1":20,"med":26,"q3":36,"max":55,"out":[68],"xlab":"Delivery time (minutes)"},"o":["The mean delivery time is 26 minutes.","Half of the deliveries took between 8 and 55 minutes.","The IQR is 16, and any value above 60 is drawn as a separate point.","The distribution is left-skewed, because the median is closer to the lower quartile."],"answer":"The IQR is 16, and any value above 60 is drawn as a separate point.","pairs":[],"why":"IQR = 36 − 20 = 16. The upper threshold is Q3 + 1.5 × IQR = 36 + 24 = 60. The whisker stops at 55, the largest value within the threshold, and 68 lies beyond it.","explanationNote":"The middle half lies inside the box, between 20 and 36. The line in the box is the median. A boxplot does not show the mean. A long upper whisker and a high outlier point to right skew."},{"id":"exam-2-1","w":2,"g":"Exam-format questions","t":"Changing units","q":"Daily maximum temperatures in a city have mean 20 °C and SD 5 °C. They are converted to Fahrenheit using F = 32 + 1.8 × C. What are the mean and SD in °F?","o":["68 and 41","68 and 9","36 and 9","68 and 16.2"],"answer":"68 and 9","pairs":[],"why":"The mean follows the formula: 32 + 1.8 × 20 = 68. The SD measures spread, which adding 32 does not change, so only the multiplier applies: 1.8 × 5 = 9.","explanationNote":"The option 41 puts the SD through the whole formula, including the shift of 32. The option 16.2 multiplies by 1.8², which is how the variance changes."},{"id":"exam-2-2","w":2,"g":"Exam-format questions","t":"Outliers from R output","q":"A numeric vector x holds 40 waiting times in minutes. Using the 1.5 × IQR rule, which of the three largest values are drawn as separate points on a boxplot?","r":"> quantile(x, c(0.25, 0.5, 0.75))\n25% 50% 75% \n 12  15  20 \n> tail(sort(x), 3)\n[1] 27 31 34","o":["34 only","None of them","31 and 34","27, 31 and 34"],"answer":"34 only","pairs":[],"why":"IQR = 20 − 12 = 8. The upper threshold is 20 + 1.5 × 8 = 32. Only 34 exceeds it.","explanationNote":"The threshold is measured from the upper quartile, 20. Measuring 1.5 IQRs from the median would give 27 and wrongly flag two values."},{"i
