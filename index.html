const richText={"Box height measures Q3 − Q1. It describes the spread of the middle half of the observations.":"Box height measures <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>Q</mi><mn>3</mn></msub><mo>−</mo><msub><mi>Q</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">Q_3 - Q_1</annotation></semantics></math>. It describes the spread of the middle half of the observations.","A has 100 crashes in 10,000 trips; B has 60 in 3,000. Which has the higher observed rate?":"A has 100 crashes in 10,000 trips; <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>B</mi><annotation encoding=\"application/x-tex\">B</annotation></semantics></math> has 60 in 3,000. Which has the higher observed rate?","B":"<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>B</mi><annotation encoding=\"application/x-tex\">B</annotation></semantics></math>","A data frame d holds one row per observation. Match the command to its purpose.":"A data frame <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>d</mi><annotation encoding=\"application/x-tex\">d</annotation></semantics></math> holds one row per observation. Match the command to its purpose.","dim(d)":"<code>dim(d)</code>","str(d)":"<code>str(d)</code>","head(d)":"<code>head(d)</code>","In R, x stores the labels low, medium and high. Which R expression records the intended severity order?":"In R, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x</mi><annotation encoding=\"application/x-tex\">x</annotation></semantics></math> stores the labels low, medium and high. Which R expression records the intended severity order?","sort(x)":"<code>sort(x)</code>","as.numeric(as.factor(x))":"<code>as.numeric(as.factor(x))</code>","factor(x, levels=c('low','medium','high'), ordered=TRUE)":"<code>factor(x, levels=c(&#x27;low&#x27;,&#x27;medium&#x27;,&#x27;high&#x27;), ordered=TRUE)</code>","The columns region and age contain each person’s region label and age in years. Treat 18 as the minimum adult age. Which expression selects adults in region A?":"The columns region and age contain each person’<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>s</mi><annotation encoding=\"application/x-tex\">s</annotation></semantics></math> region label and age in years. Treat 18 as the minimum adult age. Which expression selects adults in region A?","region!='A' & age>=18":"<code>region!=&#x27;A&#x27; &amp; age&gt;=18</code>","region=='A' & age>=18":"<code>region==&#x27;A&#x27; &amp; age&gt;=18</code>","region=='A' | age>=18":"<code>region==&#x27;A&#x27; | age&gt;=18</code>","What does prop.table(table(x)) give for a categorical vector without missing values?":"What does <code>prop.table(table(x))</code> give for a categorical vector without missing values?","With bins [0,5) and [5,10), where does 5 belong?":"With bins <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo form=\"prefix\" stretchy=\"false\">[</mo><mn>0</mn><mo>,</mo><mn>5</mn><mo form=\"postfix\" stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">[0,5)</annotation></semantics></math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo form=\"prefix\" stretchy=\"false\">[</mo><mn>5</mn><mo>,</mo><mn>10</mn><mo form=\"postfix\" stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">[5,10)</annotation></semantics></math>, where does 5 belong?","The data frame d records speed (numeric) and region (a group label) for each trip. Which command compares the speed distribution across regions?":"The data frame <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>d</mi><annotation encoding=\"application/x-tex\">d</annotation></semantics></math> records speed (numeric) and region (a group label) for each trip. Which command compares the speed distribution across regions?","hist(d$region)":"<code>hist(d$region)</code>","boxplot(speed ~ region, data=d)":"<code>boxplot(speed ~ region, data=d)</code>","boxplot(region ~ speed, data=d)":"<code>boxplot(region ~ speed, data=d)</code>","Each student's mark carries one vote, so class means must be weighted by class sizes.":"Each student&#x27;<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>s</mi><annotation encoding=\"application/x-tex\">s</annotation></semantics></math> mark carries one vote, so class means must be weighted by class sizes.","Divide squared deviations by N":"Divide squared deviations by <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>N</mi><annotation encoding=\"application/x-tex\">N</annotation></semantics></math>","Divide squared deviations by n−1":"Divide squared deviations by <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mo>−</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">n-1</annotation></semantics></math>","If X has mean 3 and SD 4, what are the mean and SD of 5−2X?":"If <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>X</mi><annotation encoding=\"application/x-tex\">X</annotation></semantics></math> has mean 3 and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> 4, what are the mean and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5</mn><mo>−</mo><mn>2</mn><mi>X</mi></mrow><annotation encoding=\"application/x-tex\">5-2X</annotation></semantics></math>?","A score is 68 in a group with mean 80 and SD 6. What is its z-score?":"A score is 68 in a group with mean 80 and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> 6. What is its <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>z</mi><annotation encoding=\"application/x-tex\">z</annotation></semantics></math>-score?","Q3 minus Q1":"<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>Q</mi><mn>3</mn></msub><annotation encoding=\"application/x-tex\">Q_3</annotation></semantics></math> minus <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>Q</mi><mn>1</mn></msub><annotation encoding=\"application/x-tex\">Q_1</annotation></semantics></math>","Q1=10 and Q3=18. Which value exceeds the upper boxplot fence?":"<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>Q</mi><mn>1</mn></msub><mo>=</mo><mn>10</mn></mrow><annotation encoding=\"application/x-tex\">Q_1=10</annotation></semantics></math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>Q</mi><mn>3</mn></msub><mo>=</mo><mn>18</mn></mrow><annotation encoding=\"application/x-tex\">Q_3=18</annotation></semantics></math>. Which value exceeds the upper boxplot fence?","Let x be a numeric vector with no missing entries. Match the R function to its result.":"Let <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x</mi><annotation encoding=\"application/x-tex\">x</annotation></semantics></math> be a numeric vector with no missing entries. Match the R function to its result.","sd(x)":"<code>sd(x)</code>","var(x)":"<code>var(x)</code>","quantile(x,.9)":"<code>quantile(x,.9)</code>","Population SD":"Population <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math>","Which factor converts R's sd(x) to the SD of the complete box containing those n observations?":"Which factor converts R&#x27;<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>s</mi><annotation encoding=\"application/x-tex\">s</annotation></semantics></math> <code>sd(x)</code> to the <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> of the complete box containing those <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n</mi><annotation encoding=\"application/x-tex\">n</annotation></semantics></math> observations?","Keep the same sum of squared deviations but change its divisor from n−1 to n.":"Keep the same sum of squared deviations but change its divisor from <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mo>−</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">n-1</annotation></semantics></math> to <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n</mi><annotation encoding=\"application/x-tex\">n</annotation></semantics></math>.","√(n/(n−1))":"<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msqrt><mfrac><mi>n</mi><mrow><mi>n</mi><mo>−</mo><mn>1</mn></mrow></mfrac></msqrt><annotation encoding=\"application/x-tex\">\\sqrt{\\frac{n}{n-1}}</annotation></semantics></math>","1/√n":"<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mn>1</mn><msqrt><mi>n</mi></msqrt></mfrac><annotation encoding=\"application/x-tex\">\\frac1{\\sqrt n}</annotation></semantics></math>","√((n−1)/n)":"<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msqrt><mfrac><mrow><mi>n</mi><mo>−</mo><mn>1</mn></mrow><mi>n</mi></mfrac></msqrt><annotation encoding=\"application/x-tex\">\\sqrt{\\frac{n-1}{n}}</annotation></semantics></math>","Which expression inside function(x) returns the population SD of its entries?":"Which expression inside <code>function(x)</code> returns the population <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> of its entries?","mean(abs(x-mean(x)))":"<code>mean(abs(x-mean(x)))</code>","sqrt(mean((x-mean(x))^2))":"<code>sqrt(mean((x-mean(x))^2))</code>","sd(x)/sqrt(length(x))":"<code>sd(x)/sqrt(length(x))</code>","For X ~ N(12, 9), using the mean–variance convention, what is the SD?":"For <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>X</mi><mo>∼</mo><mi>𝒩</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mn>12</mn><mo>,</mo><mn>9</mn><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">X\\sim\\mathcal N(12,9)</annotation></semantics></math>, using the mean–variance convention, what is the <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math>?","The second parameter is variance, so take √9.":"The second parameter is variance, so take <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msqrt><mn>9</mn></msqrt><annotation encoding=\"application/x-tex\">\\sqrt 9</annotation></semantics></math>.","X is a measurement with population mean μ and SD σ. The lower and upper cutoffs are a and b. How do you evaluate P(a < X < b) for X ~ N(μ,σ²)?":"<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>X</mi><annotation encoding=\"application/x-tex\">X</annotation></semantics></math> is a measurement with population mean <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>μ</mi><annotation encoding=\"application/x-tex\">\\mu</annotation></semantics></math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>σ</mi><annotation encoding=\"application/x-tex\">\\sigma</annotation></semantics></math>. The lower and upper cutoffs are a and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>b</mi><annotation encoding=\"application/x-tex\">b</annotation></semantics></math>. How do you evaluate <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>a</mi><mo>&lt;</mo><mi>X</mi><mo>&lt;</mo><mi>b</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">P(a&lt;X&lt;b)</annotation></semantics></math> for <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>X</mi><mo>∼</mo><mi>𝒩</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>μ</mi><mo>,</mo><msup><mi>σ</mi><mn>2</mn></msup><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">X\\sim\\mathcal N(\\mu,\\sigma^2)</annotation></semantics></math>?","A normal population has mean 50 and its 90th percentile is 62.82. Use qnorm(.90)=1.282. Find its SD.":"A normal population has mean 50 and its 90th percentile is 62.82. Use <code>qnorm(.90)</code>=1.282. Find its <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math>.","Here z is a standardised score and p a cumulative probability. Match each R call to its result.":"Here <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>z</mi><annotation encoding=\"application/x-tex\">z</annotation></semantics></math> is a standardised score and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>p</mi><annotation encoding=\"application/x-tex\">p</annotation></semantics></math> a cumulative probability. Match each R call to its result.","pnorm(z)":"<code>pnorm(z)</code>","qnorm(p)":"<code>qnorm(p)</code>","dnorm(z)":"<code>dnorm(z)</code>","For a standard normal Z, which expression gives P(Z>1.4)?":"For a standard normal <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>Z</mi><annotation encoding=\"application/x-tex\">Z</annotation></semantics></math>, which expression gives <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>Z</mi><mo>&gt;</mo><mn>1.4</mn><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">P(Z&gt;1.4)</annotation></semantics></math>?","1-pnorm(1.4)":"1-<code>pnorm(1.4)</code>","qnorm(1.4)":"<code>qnorm(1.4)</code>","dnorm(1.4)":"<code>dnorm(1.4)</code>","qnorm(.975)":"<code>qnorm(.975)</code>","pnorm(.975)":"<code>pnorm(.975)</code>","qnorm(.95)":"<code>qnorm(.95)</code>","For x=c(2,3), what does sum(x^2) return?":"For <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x</mi><annotation encoding=\"application/x-tex\">x</annotation></semantics></math>=<code>c(2,3)</code>, what does <code>sum(x^2)</code> return?","For x=c(2,5,8), what does mean(x>4) return?":"For <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x</mi><annotation encoding=\"application/x-tex\">x</annotation></semantics></math>=<code>c(2,5,8)</code>, what does <code>mean(x&gt;4)</code> return?","2/3":"<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mn>2</mn><mn>3</mn></mfrac><annotation encoding=\"application/x-tex\">\\frac{2}{3}</annotation></semantics></math>","mean(x==NA)":"<code>mean(x==NA)</code>","mean(x,na.rm=TRUE)":"<code>mean(x,na.rm=TRUE)</code>","sum(x,na.rm=TRUE)/length(x)":"<code>sum(x,na.rm=TRUE)/length(x)</code>","Changing height from metres to centimetres changes Pearson's r.":"Changing height from metres to centimetres changes Pearson&#x27;<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>s</mi><annotation encoding=\"application/x-tex\">s</annotation></semantics></math> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>r</mi><annotation encoding=\"application/x-tex\">r</annotation></semantics></math>.","SD line":"<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> line","Let x be study hours and y an exam score. The sample correlation is r, and sx and sy are the respective sample standard deviations. With r=.5, sy=6 and sx=2, what are the SD-line and regression slopes respectively?":"Let <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x</mi><annotation encoding=\"application/x-tex\">x</annotation></semantics></math> be study hours and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>y</mi><annotation encoding=\"application/x-tex\">y</annotation></semantics></math> an exam score. The sample correlation is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>r</mi><annotation encoding=\"application/x-tex\">r</annotation></semantics></math>, and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>s</mi><mi>x</mi></msub><annotation encoding=\"application/x-tex\">s_x</annotation></semantics></math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>s</mi><mi>y</mi></msub><annotation encoding=\"application/x-tex\">s_y</annotation></semantics></math> are the respective sample standard deviations. With <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi><mo>=</mo><mn>0.5</mn></mrow><annotation encoding=\"application/x-tex\">r=0.5</annotation></semantics></math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>s</mi><mi>y</mi></msub><mo>=</mo><mn>6</mn></mrow><annotation encoding=\"application/x-tex\">s_y=6</annotation></semantics></math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>s</mi><mi>x</mi></msub><mo>=</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">s_x=2</annotation></semantics></math>, what are the <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math>-line and regression slopes respectively?","For positive r the SD line has slope sy/sx. The regression slope multiplies this by r.":"For positive <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>r</mi><annotation encoding=\"application/x-tex\">r</annotation></semantics></math> the <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> line has slope <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><msub><mi>s</mi><mi>y</mi></msub><msub><mi>s</mi><mi>x</mi></msub></mfrac><annotation encoding=\"application/x-tex\">\\frac{s_y}{s_x}</annotation></semantics></math>. The regression slope multiplies this by <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>r</mi><annotation encoding=\"application/x-tex\">r</annotation></semantics></math>.","Let x be study hours and y an exam score. Here r is their sample correlation and sx and sy are their sample standard deviations. If r=.5, sx=2 and sy=6, what is the slope when predicting x from y?":"Let <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x</mi><annotation encoding=\"application/x-tex\">x</annotation></semantics></math> be study hours and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>y</mi><annotation encoding=\"application/x-tex\">y</annotation></semantics></math> an exam score. Here <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>r</mi><annotation encoding=\"application/x-tex\">r</annotation></semantics></math> is their sample correlation and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>s</mi><mi>x</mi></msub><annotation encoding=\"application/x-tex\">s_x</annotation></semantics></math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>s</mi><mi>y</mi></msub><annotation encoding=\"application/x-tex\">s_y</annotation></semantics></math> are their sample standard deviations. If <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi><mo>=</mo><mn>0.5</mn></mrow><annotation encoding=\"application/x-tex\">r=0.5</annotation></semantics></math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>s</mi><mi>x</mi></msub><mo>=</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">s_x=2</annotation></semantics></math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>s</mi><mi>y</mi></msub><mo>=</mo><mn>6</mn></mrow><annotation encoding=\"application/x-tex\">s_y=6</annotation></semantics></math>, what is the slope when predicting <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x</mi><annotation encoding=\"application/x-tex\">x</annotation></semantics></math> from <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>y</mi><annotation encoding=\"application/x-tex\">y</annotation></semantics></math>?","1/6":"<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mn>1</mn><mn>6</mn></mfrac><annotation encoding=\"application/x-tex\">\\frac{1}{6}</annotation></semantics></math>","SST is the sum of squared deviations about the sample mean; SSE is the residual sum of squares about the fitted line. SST=200 and SSE=50. What is R² for a model with an intercept?":"<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">T</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SST}</annotation></semantics></math> is the sum of squared deviations about the sample mean; <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SSE}</annotation></semantics></math> is the residual sum of squares about the fitted line. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>S</mi><mi>S</mi><mi>T</mi><mo>=</mo><mn>200</mn></mrow><annotation encoding=\"application/x-tex\">SST=200</annotation></semantics></math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>S</mi><mi>S</mi><mi>E</mi><mo>=</mo><mn>50</mn></mrow><annotation encoding=\"application/x-tex\">SSE=50</annotation></semantics></math>. What is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msup><mi>R</mi><mn>2</mn></msup><annotation encoding=\"application/x-tex\">R^2</annotation></semantics></math> for a model with an intercept?","Relative to predicting the sample mean, the model removes (200−50)/200 of the squared error.":"Relative to predicting the sample mean, the model removes <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mrow><mn>200</mn><mo>−</mo><mn>50</mn></mrow><mn>200</mn></mfrac><annotation encoding=\"application/x-tex\">\\frac{200-50}{200}</annotation></semantics></math> of the squared error.","The object fit is a linear model estimated using lm(). Match the R expression to its output.":"The object fit is a linear model estimated using <code>lm()</code>. Match the R expression to its output.","fitted(fit)":"<code>fitted(fit)</code>","resid(fit)":"<code>resid(fit)</code>","summary(fit)$r.squared":"<code>summary(fit)$r.squared</code>","If A and B are disjoint with probabilities .3 and .4, what is P(A or B)?":"If A and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>B</mi><annotation encoding=\"application/x-tex\">B</annotation></semantics></math> are disjoint with probabilities 0.3 and 0.4, what is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>A</mi><mo>∪</mo><mi>B</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">P(A\\cup B)</annotation></semantics></math>?","A and B are events that can overlap. P(A)=.4, P(B)=.5 and P(A and B)=.1. Find P(A or B).":"A and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>B</mi><annotation encoding=\"application/x-tex\">B</annotation></semantics></math> are events that can overlap. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>A</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mo>=</mo><mn>0.4</mn></mrow><annotation encoding=\"application/x-tex\">P(A)=0.4</annotation></semantics></math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>B</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mo>=</mo><mn>0.5</mn></mrow><annotation encoding=\"application/x-tex\">P(B)=0.5</annotation></semantics></math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>A</mi><mo>∩</mo><mi>B</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mo>=</mo><mn>0.1</mn></mrow><annotation encoding=\"application/x-tex\">P(A\\cap B)=0.1</annotation></semantics></math>. Find <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>A</mi><mo>∪</mo><mi>B</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">P(A\\cup B)</annotation></semantics></math>.","The intersection was counted twice in .4+.5, so subtract .1 once.":"The intersection was counted twice in <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>.4</mn><mo>+</mo><mn>.5</mn></mrow><annotation encoding=\"application/x-tex\">.4+.5</annotation></semantics></math>, so subtract 0.1 once.","Three independent attempts succeed with probability .2 each. Find P(at least one success).":"Three independent attempts succeed with probability 0.2 each. Find <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mtext mathvariant=\"normal\">at least one success</mtext><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">P(\\text{at least one success})</annotation></semantics></math>.","Use the complement: 1−.8³=.488.":"Use the complement: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mo>−</mo><msup><mn>.8</mn><mn>3</mn></msup><mo>=</mo><mn>.488</mn></mrow><annotation encoding=\"application/x-tex\">1-.8^3=.488</annotation></semantics></math>.","A box has four red and six blue tickets. After drawing one red without replacement, what is P(red next)?":"A box has four red and six blue tickets. After drawing one red without replacement, what is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mtext mathvariant=\"normal\">red next</mtext><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">P(\\text{red next})</annotation></semantics></math>?","4/9":"<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mn>4</mn><mn>9</mn></mfrac><annotation encoding=\"application/x-tex\">\\frac{4}{9}</annotation></semantics></math>","3/9":"<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mn>3</mn><mn>9</mn></mfrac><annotation encoding=\"application/x-tex\">\\frac{3}{9}</annotation></semantics></math>","4/10":"<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mn>4</mn><mn>10</mn></mfrac><annotation encoding=\"application/x-tex\">\\frac{4}{10}</annotation></semantics></math>","Weight each conditional probability by its group share: .25×.20+.75×.04.":"Weight each conditional probability by its group share: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>.25</mn><mo>×</mo><mn>.20</mn><mo>+</mo><mn>.75</mn><mo>×</mo><mn>.04</mn></mrow><annotation encoding=\"application/x-tex\">.25\\times .20+.75\\times .04</annotation></semantics></math>.","What does replace=TRUE allow in sample()?":"What does replace=TRUE allow in <code>sample()</code>?","sum(sample(1:6,2))":"<code>sum(sample(1:6,2))</code>","sum(sample(1:6,2,replace=TRUE))":"<code>sum(sample(1:6,2,replace=TRUE))</code>","sample(2:12,1)":"<code>sample(2:12,1)</code>","Single-draw SE":"Single-draw <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SE}</annotation></semantics></math>","Independent quantities have SDs 3 and 4. What is the SD of their sum?":"Independent quantities have SDs 3 and 4. What is the <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> of their sum?","Add variances and take the square root: √(9+16).":"Add variances and take the square root: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msqrt><mrow><mn>9</mn><mo>+</mo><mn>16</mn></mrow></msqrt><annotation encoding=\"application/x-tex\">\\sqrt{9+16}</annotation></semantics></math>.","For n independent draws with box SD σ, match each statistic to its SE.":"For <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n</mi><annotation encoding=\"application/x-tex\">n</annotation></semantics></math> independent draws with box <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>σ</mi><annotation encoding=\"application/x-tex\">\\sigma</annotation></semantics></math>, match each statistic to its <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SE}</annotation></semantics></math>.","σ":"<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>σ</mi><annotation encoding=\"application/x-tex\">\\sigma</annotation></semantics></math>","√n × σ":"<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msqrt><mi>n</mi></msqrt><mspace width=\"0.167em\"></mspace><mi>σ</mi></mrow><annotation encoding=\"application/x-tex\">\\sqrt{n}\\,\\sigma</annotation></semantics></math>","σ/√n":"<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mi>σ</mi><msqrt><mi>n</mi></msqrt></mfrac><annotation encoding=\"application/x-tex\">\\frac{\\sigma}{\\sqrt n}</annotation></semantics></math>","If X takes only 0 and 1 with P(X=1)=p, why is Var(X)=p(1−p)?":"If <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>X</mi><annotation encoding=\"application/x-tex\">X</annotation></semantics></math> takes only 0 and 1 with <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>X</mi><mo>=</mo><mn>1</mn><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mo>=</mo><mi>p</mi></mrow><annotation encoding=\"application/x-tex\">P(X=1)=p</annotation></semantics></math>, why is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>Var</mo><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>X</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mo>=</mo><mi>p</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mn>1</mn><mo>−</mo><mi>p</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\\operatorname{Var}(X)=p(1-p)</annotation></semantics></math>?","X²=X, so E(X²)−E(X)²=p−p²":"<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>X</mi><mn>2</mn></msup><mo>=</mo><mi>X</mi></mrow><annotation encoding=\"application/x-tex\">X^2=X</annotation></semantics></math>, so <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><msup><mi>X</mi><mn>2</mn></msup><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mo>−</mo><mi>E</mi><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>X</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mn>2</mn></msup><mo>=</mo><mi>p</mi><mo>−</mo><msup><mi>p</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">E(X^2)-E(X)^2=p-p^2</annotation></semantics></math>","SD is always p":"<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> is always <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>p</mi><annotation encoding=\"application/x-tex\">p</annotation></semantics></math>","Which command enumerates the sums of every ordered pair of tickets from a box b?":"Which command enumerates the sums of every ordered pair of tickets from a box <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>b</mi><annotation encoding=\"application/x-tex\">b</annotation></semantics></math>?","sum(b)":"<code>sum(b)</code>","b+b":"<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>b</mi><annotation encoding=\"application/x-tex\">b</annotation></semantics></math>+<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>b</mi><annotation encoding=\"application/x-tex\">b</annotation></semantics></math>","outer(b,b,'+')":"<code>outer(b,b,&#x27;+&#x27;)</code>","Suppose each independent trial has the same success probability p. As independent trials accumulate, the success proportion tends towards p even though the typical absolute count error grows.":"Suppose each independent trial has the same success probability <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>p</mi><annotation encoding=\"application/x-tex\">p</annotation></semantics></math>. As independent trials accumulate, the success proportion tends towards <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>p</mi><annotation encoding=\"application/x-tex\">p</annotation></semantics></math> even though the typical absolute count error grows.","The population mean is μ, its SD is σ and n is the sample size. With μ=40, σ=10 and n=25 independent draws, what z corresponds to a sample mean of 44?":"The population mean is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>μ</mi><annotation encoding=\"application/x-tex\">\\mu</annotation></semantics></math>, its <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotati o><mfrac><mrow><mn>44</mn><mo>−</mo><mn>40</mn></mrow><mn>2</mn></mfrac></mrow><annotation encoding=\"application/x-tex\">z=\\frac{44-40}{2}</annotation></semantics></math>.","cumsum(win)/seq_along(win)":"<code>cumsum(win)/seq_along(win)</code>","sum(win)/length(win)":"<code>sum(win)/length(win)</code>","cumsum(win)/length(win)":"<code>cumsum(win)/length(win)</code>","A total multiplies the mean by n and the SD by √n.":"A total multiplies the mean by <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n</mi><annotation encoding=\"application/x-tex\">n</annotation></semantics></math> and the <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> by <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msqrt><mi>n</mi></msqrt><annotation encoding=\"application/x-tex\">\\sqrt n</annotation></semantics></math>.","Mean 300, SD 20":"Mean 300, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> 20","Mean 300, SD 200":"Mean 300, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> 200","Mean 3, SD .2":"Mean 3, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> 0.2","If the sample count has SE 6 in 100 trials, what is the SE of its proportion?":"If ng=\"application/x-tex\">p</annotation></semantics></math> values fit?","Known population SD":"Known population <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math>","Write σ for the known population SD and n for the number of independent observations. For a normal population with known SD, what is the 95% margin for its mean?":"Write <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>σ</mi><annotation encoding=\"application/x-tex\">\\sigma</annotation></semantics></math> for the known population <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n</mi><annotation encoding=\"application/x-tex\">n</annotation></semantics></math> for the number of independent observations. For a normal population with known <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math>, what is the 95% margin for its mean?","A mean averages n independent observations, so its sampling SD is σ/√n.":"A mean averages <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n</mi><annotation encoding=\"application/x-tex\">n</annotation></semantics></math> independent observations, so its sampling <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\  what are the df for testing independence?":"For a <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3</mn><mo>×</mo><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">3\\times 4</annotation></semantics></math> table, what are the <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">f</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{df}</annotation></semantics></math> for testing independence?","Fitted values and R²":"Fitted values and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msup><mi>R</mi><mn>2</mn></msup><annotation encoding=\"application/x-tex\">R^2</annotation></semantics></math>","Let y be the observed response, ŷ the fitted value, and ȳ the sample mean. SSE and SST denote residual and total sums of squares. For a regression with an intercept, which pair is correct?":"Let <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>y</mi><annotation encoding=\"application/x-tex\">y</annotation></semantics></math> be the observed response, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mover><mi>y</mi><mo accent=\"true\">̂</mo></mover><annotation encoding=\"application/x-tex\">\\hat y</annotation></semantics></math> the fitted value, and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mover><mi>y</mi><mo accent=\"true\">‾</mo></mover><annotation encoding=\"application/x-tex\">\\bar y</annotation></semantics></math> the sample mean. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SSE}</annotation></semantics></math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">T</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SST}</annotation></semantics></math> denote residual and total sums of squares. For a regression with an intercept, which pair is correct?","SSE measures variation left around the fitted line. SST measures variation around the sample mean.":"<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SSE}</annotation></semantics></math> measures variation left around the fitted line. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">T</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SST}</annotation></semantics></math> measures variation around the sample mean.","Residual=y−ȳ; R²=1−SST/SSE":"<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>e</mi><mo>=</mo><mi>y</mi><mo>−</mo><mover><mi>y</mi><mo accent=\"true\">‾</mo></mover></mrow><annotation encoding=\"application/x-tex\">e=y-\\bar y</annotation></semantics></math>; <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>R</mi><mn>2</mn></msup><mo>=</mo><mn>1</mn><mo>−</mo><mfrac><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">T</mi></mrow><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">R^2=1-\\frac{\\mathrm{SST}}{\\mathrm{SSE}}</annotation></semantics></math>","Residual=y−ŷ; R²=1−SSE/SST":"<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>e</mi><mo>=</mo><mi>y</mi><mo>−</mo><mover><mi>y</mi><mo accent=\"true\">̂</mo></mover></mrow><annotation encoding=\"application/x-tex\">e=y-\\hat y</annotation></semantics></math>; <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>R</mi><mn>2</mn></msup><mo>=</mo><mn>1</mn><mo>−</mo><mfrac><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">T</mi></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">R^2=1-\\frac{\\mathrm{SSE}}{\\mathrm{SST}}</annotation></semantics></math>","Residual=ŷ−y; R²=SSE/SST":"<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>e</mi><mo>=</mo><mover><mi>y</mi><mo accent=\"true\">̂</mo></mover><mo>−</mo><mi>y</mi></mrow><annotation encoding=\"application/x-tex\">e=\\hat y-y</annotation></semantics></math>; <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>R</mi><mn>2</mn></msup><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">T</mi></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">R^2=\\frac{\\mathrm{SSE}}{\\mathrm{SST}}</annotation></semantics></math>","Keeping residual SD fixed, spreading the predictor values further apart makes the ordinary simple-regression slope more precise.":"Keeping residual <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> fixed, spreading the predictor values further apart makes the ordinary simple-regression slope more precise.","At a fixed temperature, compare days whose wind speeds differ by d mph. The fitted model for the natural logarithm of ozone concentration is shown below. How should we interpret the wind coefficient b on the original ozone scale?":"At a fixed temperature, compare days whose wind speeds differ by <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>d</mi><annotation encoding=\"application/x-tex\">d</annotation></semantics></math> mph. The fitted model for the natural logarithm of ozone concentration is shown below. How should we interpret the wind coefficient <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>b</mi><annotation encoding=\"application/x-tex\">b</annotation></semantics></math> on the original ozone scale?","Holding Temp fixed, increasing Wind by d multiplies the back-transformed fit by exp(bd)":"Holding Temp fixed, increasing Wind by <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>d</mi><annotation encoding=\"application/x-tex\">d</annotation></semantics></math> multiplies the back-transformed fit by <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>exp</mo><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>b</mi><mi>d</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\\exp(bd)</annotation></semantics></math>","Wind explains b percent of sample variation":"Wind explains <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>b</mi><annotation encoding=\"application/x-tex\">b</annotation></semantics></math> percent of sample variation","Increasing Wind by d adds bd units of ozone":"Increasing Wind by <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>d</mi><annotation encoding=\"application/x-tex\">d</annotation></semantics></math> adds <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>b</mi><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">bd</annotation></semantics></math> units of ozone","Here a (fitted intercept) is the intercept, c is the temperature coefficient, and b is the wind coefficient per mph.":"Here <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>a</mi><annotation encoding=\"application/x-tex\">a</annotation></semantics></math> is the intercept, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>c</mi><annotation encoding=\"application/x-tex\">c</annotation></semantics></math> is the temperature coefficient, and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>b</mi><annotation encoding=\"application/x-tex\">b</annotation></semantics></math> is the wind coefficient per mph.","Which denominator belongs in a partial F-test comparing nested models fitted to the same data?":"Which denominator belongs in a partial <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>F</mi><annotation encoding=\"application/x-tex\">F</annotation></semantics></math>-test comparing nested models fitted to the same data?","Full-model RSS divided by full-model residual df":"Full-model <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{RSS}</annotation></semantics></math> divided by full-model residual <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">f</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{df}</annotation></semantics></math>","Reduced-model RSS divided by its df":"Reduced-model <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{RSS}</annotation></semantics></math> divided by its <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">f</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{df}</annotation></semantics></math>","Difference in the two R² values":"Difference in the two <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msup><mi>R</mi><mn>2</mn></msup><annotation encoding=\"application/x-tex\">R^2</annotation></semantics></math> values","In a backward F-test procedure at 5%, the largest deletion p-value is .72. What is the next step?":"In a backward <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>F</mi><annotation encoding=\"application/x-tex\">F</annotation></semantics></math>-test procedure at 5%, the largest deletion <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>p</mi><annotation encoding=\"application/x-tex\">p</annotation></semantics></math>-value is 0.72. What is the next step?","A large deletion p-value gives little evidence that the term improves fit given the others. The next tests must use the refitted model.":"A large deletion <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>p</mi><annotation encoding=\"application/x-tex\">p</annotation></semantics></math>-value gives little evidence that the term improves fit given the others. The next tests must use the refitted model.","Remove the term with the smallest p":"Remove the term with the smallest <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>p</mi><annotation encoding=\"application/x-tex\">p</annotation></semantics></math>","Remove every term with p>.05 at once":"Remove every term with <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>&gt;</mo><mn>0.05</mn></mrow><annotation encoding=\"application/x-tex\">p&gt;0.05</annotation></semantics></math> at once","Let p be the probability of success and η the fitted log-odds. Match each quantity to its formula.":"Let <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>p</mi><annotation encoding=\"application/x-tex\">p</annotation></semantics></math> be the probability of success and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>η</mi><annotation encoding=\"application/x-tex\">\\eta</annotation></semantics></math> the fitted log-odds. Match each quantity to its formula.","p/(1−p)":"<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mi>p</mi><mrow><mn>1</mn><mo>−</mo><mi>p</mi></mrow></mfrac><annotation encoding=\"application/x-tex\">\\frac{p}{1-p}</annotation></semantics></math>","log(p/(1−p))":"<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>log</mo><mspace width=\"-0.167em\"></mspace><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mfrac><mi>p</mi><mrow><mn>1</mn><mo>−</mo><mi>p</mi></mrow></mfrac><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\\log\\!\\left(\\frac{p}{1-p}\\right)</annotation></semantics></math>","1/(1+exp(−η))":"<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mn>1</mn><mrow><mn>1</mn><mo>+</mo><mo>exp</mo><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>−</mi><mi>η</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow></mfrac><annotation encoding=\"application/x-tex\">\\frac{1}{1+\\exp(-\\eta)}</annotation></semantics></math>","Let b be the coefficient for predictor x in a model of the log-odds of an event. In a logistic model, increasing x by d at fixed other predictors multiplies which quantity by exp(bd)?":"Let <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>b</mi><annotation encoding=\"application/x-tex\">b</annotation></semantics></math> be the coefficient for predictor <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x</mi><annotation encoding=\"application/x-tex\">x</annotation></semantics></math> in a model of the log-odds of an event. In a logistic model, increasing <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x</mi><annotation encoding=\"application/x-tex\">x</annotation></semantics></math> by <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>d</mi><annotation encoding=\"application/x-tex\">d</annotation></semantics></math> at fixed other predictors multiplies which quantity by <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>exp</mo><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>b</mi><mi>d</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\\exp(bd)</annotation></semantics></math>?","The two columns are successes and failures. predict(...,type='response') returns the fitted success probability.":"The two columns are successes and failures. <code>predict(...,type=&#x27;response&#x27;)</code> returns the fitted success probability.","cbind(8,12)":"<code>cbind(8,12)</code>","cbind(8,20)":"<code>cbind(8,20)</code>","cbind(12,8)":"<code>cbind(12,8)</code>","A logistic slope estimate is .30 with SE .10. What is its Wald z for a zero slope?":"A logistic slope estimate is 0.30 with <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SE}</annotation></semantics></math> 0.10. What is its Wald <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>z</mi><annotation encoding=\"application/x-tex\">z</annotation></semantics></math> for a zero slope?","District B reports 15 crashes over 5,000 trips. How many crashes per thousand trips?":"District <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>B</mi><annotation encoding=\"application/x-tex\">B</annotation></semantics></math> reports 15 crashes over 5,000 trips. How many crashes per thousand trips?","The combined total is 20×60+30×80=3600. Divide by 50 students.":"The combined total is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>20</mn><mo>×</mo><mn>60</mn><mo>+</mo><mn>30</mn><mo>×</mo><mn>80</mn><mo>=</mo><mn>3600</mn></mrow><annotation encoding=\"application/x-tex\">20\\times 60+30\\times 80=3600</annotation></semantics></math>. Divide by 50 students.","X ~ N(50,8²) and qnorm(.90)=1.2816. Find its 90th percentile.":"<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>X</mi><mo>∼</mo><mi>𝒩</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mn>50</mn><mo>,</mo><msup><mn>8</mn><mn>2</mn></msup><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">X\\sim\\mathcal N(50,8^2)</annotation></semantics></math> and <code>qnorm(.90)</code>=1.2816. Find its 90th percentile.","Predict response y from predictor x. Bars denote sample means, sx and sy are sample SDs, and r is the sample correlation. r=.6, x̄=10, sx=2, ȳ=30 and sy=5. At x=12 the observed y is 36. Find the residual.":"Predict response <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>y</mi><annotation encoding=\"application/x-tex\">y</annotation></semantics></math> from predictor <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x</mi><annotation encoding=\"application/x-tex\">x</annotation></semantics></math>. Bars denote sample means, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>s</mi><mi>x</mi></msub><annotation encoding=\"application/x-tex\">s_x</annotation></semantics></math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>s</mi><mi>y</mi></msub><annotation encoding=\"application/x-tex\">s_y</annotation></semantics></math> are sample SDs, and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>r</mi><annotation encoding=\"application/x-tex\">r</annotation></semantics></math> is the sample correlation. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi><mo>=</mo><mn>0.6</mn></mrow><annotation encoding=\"application/x-tex\">r=0.6</annotation></semantics></math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover><mi>x</mi><mo accent=\"true\">‾</mo></mover><mo>=</mo><mn>10</mn></mrow><annotation encoding=\"application/x-tex\">\\bar x=10</annotation></semantics></math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>s</mi><mi>x</mi></msub><mo>=</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">s_x=2</annotation></semantics></math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover><mi>y</mi><mo accent=\"true\">‾</mo></mover><mo>=</mo><mn>30</mn></mrow><annotation encoding=\"application/x-tex\">\\bar y=30</annotation></semantics></math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>s</mi><mi>y</mi></msub><mo>=</mo><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">s_y=5</annotation></semantics></math>. At <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi><mo>=</mo><mn>12</mn></mrow><annotation encoding=\"application/x-tex\">x=12</annotation></semantics></math> the observed <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>y</mi><annotation encoding=\"application/x-tex\">y</annotation></semantics></math> is 36. Find the residual.","Slope=.6×5/2=1.5. The fitted value is 30+1.5×2=33, giving residual 36−33.":"<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mover><mi>b</mi><mo accent=\"true\">̂</mo></mover><mn>1</mn></msub><mo>=</mo><mn>0.6</mn><mfrac><mn>5</mn><mn>2</mn></mfrac><mo>=</mo><mn>1.5</mn></mrow><annotation encoding=\"application/x-tex\">\\hat b_1=0.6\\frac{5}{2}=1.5</annotation></semantics></math>. The fitted value is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>30</mn><mo>+</mo><mn>1.5</mn><mo>×</mo><mn>2</mn><mo>=</mo><mn>33</mn></mrow><annotation encoding=\"application/x-tex\">30+1.5\\times 2=33</annotation></semantics></math>, giving residual <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>36</mn><mo>−</mo><mn>33</mn></mrow><annotation encoding=\"application/x-tex\">36-33</annotation></semantics></math>.","Draw two tickets from four red and six blue without replacement. Find P(exactly one red).":"Draw two tickets from four red and six blue without replacement. Find <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mtext mathvariant=\"normal\">exactly one red</mtext><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">P(\\text{exactly one red})</annotation></semantics></math>.","Add the red-blue and blue-red paths: 2×(4/10)×(6/9).":"Add the red-blue and blue-red paths: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mo>×</mo><mfrac><mn>4</mn><mn>10</mn></mfrac><mo>×</mo><mfrac><mn>6</mn><mn>9</mn></mfrac></mrow><annotation encoding=\"application/x-tex\">2\\times\\frac4{10}\\times\\frac6{9}</annotation></semantics></math>.","SE of a total":"<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SE}</annotation></semantics></math> of a total","An independent draw pays 0 or 10 with equal probability. What is the SE of the total of 36 draws?":"An independent draw pays 0 or 10 with equal probability. What is the <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SE}</annotation></semantics></math> of the total of 36 draws?","Independent purchases have mean 20 and SD 12. For 144 purchases use a normal approximation. Given pnorm(2)=.97725, find P(sample mean > 22).":"Independent purchases have mean 20 and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> 12. For 144 purchases use a normal approximation. Given <code>pnorm(2)</code>=0.97725, find <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mover><mi>X</mi><mo accent=\"true\">‾</mo></mover><mo>&gt;</mo><mn>22</mn><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">P(\\bar X&gt;22)</annotation></semantics></math>.","SE=12/√144=1. The threshold is two SEs above the mean, so take 1−.97725.":"<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow><mo>=</mo><mfrac><mn>12</mn><msqrt><mn>144</mn></msqrt></mfrac><mo>=</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SE}=\\frac{12}{\\sqrt{144}}=1</annotation></semantics></math>. The threshold is two SEs above the mean, so take <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mo>−</mo><mn>.97725</mn></mrow><annotation encoding=\"application/x-tex\">1-.97725</annotation></semantics></math>.","For a population mean interval, σ is the known population SD, n the sample size, x̄ the sample mean and z* the positive critical value. Known σ=12, n=64 and x̄=40. Using z*=1.96, find the lower 95% endpoint.":"For a population mean interval, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>σ</mi><annotation encoding=\"application/x-tex\">\\sigma</annotation></semantics></math> is the known population <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n</mi><annotation encoding=\"application/x-tex\">n</annotation></semantics></math> the sample size, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mover><mi>x</mi><mo accent=\"true\">‾</mo></mover><annotation encoding=\"application/x-tex\">\\bar x</annotation></semantics></math> the sample mean and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msup><mi>z</mi><mo>*</mo></msup><annotation encoding=\"application/x-tex\">z^*</annotation></semantics></math> the positive critical value. Known <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>σ</mi><mo>=</mo><mn>12</mn></mrow><annotation encoding=\"application/x-tex\">\\sigma =12</annotation></semantics></math>, <math display=\"inline\" xmlns=\"http: es pnorm(.5)=.6915 and pnorm(1)=.8413. Estimate the proportion between 62 and 74.":"A score has mean 70 and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> 8 under a normal model. R gives <code>pnorm(.5)</code>=0.6915 and <code>pnorm(1)</code>=0.8413. Estimate the proportion between 62 and 74.","An intercept-only model has RSS 100; a simple regression with an intercept has RSS 36 and a negative slope. What is Pearson's r?":"An intercept-only model has <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{RSS}</annotation></semantics></math> 100; a simple regression with an intercept has <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{RSS}</annotation></semantics></math> 36 and a negative slope. What is Pearson&#x27;<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>s</mi><annotation encoding=\"application/x-tex\">s</annotation></semantics></math> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>r</mi><annotation encoding=\"application/x-tex\">r</annotation></semantics></math>?","The fit explains .64 of the variation. With one predictor and an intercept, R² is the square of r. Take the square root and use the slope for its sign.":"The fit explains 0.64 of the variation. With one predictor and an intercept, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msup><mi>R</mi><mn>2</mn></msup><annotation encoding=\"application/x-tex\">R^2</annotation></semantics></math> is the square of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>r</mi><annotation encoding=\"application/x-tex\">r</annotation></semantics></math>. Take the square root and use the slope for its sign.","For x = −2, −1, 0, 1, 2, y is respectively 4, 1, 0, 1, 4. A colleague reports r=0. Which reading fits?":"For <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x</mi><annotation encoding=\"application/x-tex\">x</annotation></semantics></math> = −2, −1, 0, 1, 2, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>y</mi><annotation encoding=\"application/x-tex\">y</annotation></semantics></math> is respectively 4, 1, 0, 1, 4. A colleague reports <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">r=0</annotation></semantics></math>. Which reading fits?","Independent variables because r=0":"Independent variables because <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">r=0</annotation></semantics></math>","On a biased die, P(6)=.20 and P(1)=.10. Three independent rolls are made. What is the probability of exactly two sixes and one one, in any order?":"On a biased die, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mn>6</mn><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mo>=</mo><mn>0.20</mn></mrow><annotation encoding=\"application/x-tex\">P(6)=0.20</annotation></semantics></math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mn>1</mn><mo form=\"postfix\"
