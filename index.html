the number of late payments in the previous year (Late). Parts of the output are masked by #####.","bgr":"> fit = glm(Default ~ Income + Late, family = binomial, data = loans)\n> summary(fit)\n\nCoefficients:\n            Estimate Std. Error z value Pr(>|z|)\n(Intercept)   -1.200      0.500   #####    #####\nIncome        -0.030      0.010   #####    #####\nLate           0.700      0.200   #####    #####","model":"log(p ÷ (1 − p)) = −1.2 − 0.03 × Income + 0.7 × Late, where p is the probability that the loan defaults."},{"id":"written-10-2","w":15,"g":"Extended-answer practice","t":"Loan defaults 2 · Testing a coefficient","q":"After adjusting for income, is the number of late payments a significant predictor of default at the 5% level?","o":["Yes. z = 3.50, which is larger than 1.96.","Yes. z = 0.29, and the estimate 0.7 is positive.","No. z = 3.50 is compared with a t distribution on 497 df and falls short.","No. The estimate 0.7 is smaller than 1.96."],"answer":"Yes. z = 3.50, which is larger than 1.96.","pairs":[],"why":"The Wald statistic is Estimate ÷ Std. Error = 0.700 ÷ 0.200 = 3.50. For a two-sided test at 5% compare its size with 1.96.","explanationNote":"Logistic regression output reports z values, which are referred to the normal distribution. The estimate is never compared with 1.96 directly.","bg":"A lender models whether a loan defaults (1 = default, 0 = repaid) for 500 loans, using the borrower’s income (Income, in thousands of dollars) and the number of late payments in the previous year (Late). Parts of the output are masked by #####.","bgr":"> fit = glm(Default ~ Income + Late, family = binomial, data = loans)\n> summary(fit)\n\nCoefficients:\n            Estimate Std. Error z value Pr(>|z|)\n(Intercept)   -1.200      0.500   #####    #####\nIncome        -0.030      0.010   #####    #####\nLate           0.700      0.200   #####    #####","model":"H₀: the coefficient of Late is 0. H₁: it is not 0. Z = 0.700 ÷ 0.200 = 3.50. Since 3.50 > 1.96, reject H₀ at the 5% level: after adjusting for income, the number of late payments is a significant predictor of default."},{"id":"written-10-3","w":15,"g":"Extended-answer practice","t":"Loan defaults 3 · Odds ratio","q":"Interpret the coefficient of Late.","o":["Each additional late payment increases the odds of default by 0.70.","Each additional late payment increases the probability of default by 0.70, holding income fixed.","Each additional late payment multiplies the probability of default by about 2.0.","Each additional late payment multiplies the odds of default by about 2.0, holding income fixed."],"answer":"Each additional late payment multiplies the odds of default by about 2.0, holding income fixed.","pairs":[],"why":"The coefficient is added to the log-odds, so the odds are multiplied by exp(0.7) = 2.01. The phrase “holding income fixed” matters because income is also in the model.","explanationNote":"The effect on the probability is not a fixed amount or a fixed multiple. It depends on where the borrower starts.","bg":"A lender models whether a loan defaults (1 = default, 0 = repaid) for 500 loans, using the borrower’s income (Income, in thousands of dollars) and the number of late payments in the previous year (Late). Parts of the output are masked by #####.","bgr":"> fit = glm(Default ~ Income + Late, family = binomial, data = loans)\n> summary(fit)\n\nCoefficients:\n            Estimate Std. Error z value Pr(>|z|)\n(Intercept)   -1.200      0.500   #####    #####\nIncome        -0.030      0.010   #####    #####\nLate           0.700      0.200   #####    #####\n\n> exp(c(-1, 0.7, -0.3))\n[1] 0.3678794 2.0137527 0.7408182","model":"exp(0.7) = 2.01. For borrowers with the same income, each additional late payment is associated with about double the odds of default."},{"id":"written-10-4","w":15,"g":"Extended-answer practice","t":"Loan defaults 4 · Predicted probability","q":"Estimate the probability of default for a borrower with an income of $40,000 and two late payments.","o":["0.731","0.368","0.269","−1.000"],"answer":"0.269","pairs":[],"why":"Log-odds = −1.2 − 0.03 × 40 + 0.7 × 2 = −1.2 − 1.2 + 1.4 = −1.0. Odds = exp(−1) = 0.368. Probability = 0.368 ÷ 1.368 = 0.269.","explanationNote":"Income is in thousands of dollars, so $40,000 enters as 40. The value 0.368 is the odds and −1 is the log-odds.","bg":"A lender models whether a loan defaults (1 = default, 0 = repaid) for 500 loans, using the borrower’s income (Income, in thousands of dollars) and the number of late payments in the previous year (Late). Parts of the output are masked by #####.","bgr":"> fit = glm(Default ~ Income + Late, family = binomial, data = loans)\n> summary(fit)\n\nCoefficients:\n            Estimate Std. Error z value Pr(>|z|)\n(Intercept)   -1.200      0.500   #####    #####\nIncome        -0.030      0.010   #####    #####\nLate           0.700      0.200   #####    #####\n\n> exp(c(-1, 0.7, -0.3))\n[1] 0.3678794 2.0137527 0.7408182","model":"Log-odds = −1.2 − 0.03(40) + 0.7(2) = −1.0. Odds = exp(−1) = 0.368. Probability of default = 0.368 ÷ (1 + 0.368) = 0.269. With a threshold of 0.5, this borrower would be classified as not defaulting."},{"id":"written-10-5","w":15,"g":"Extended-answer practice","t":"Loan defaults 5 · A ten-unit change","q":"Compare two borrowers with the same number of late payments whose incomes differ by $10,000. How do their odds of default compare?","o":["The borrower with the higher income has odds about 3% lower.","The borrower with the higher income has odds about 26% lower.","The borrower with the higher income has odds about 30% lower.","The borrower with the higher income has a probability of default 0.30 lower."],"answer":"The borrower with the higher income has odds about 26% lower.","pairs":[],"why":"A $10,000 difference is 10 units of Income. The log-odds change by 10 × (−0.03) = −0.3, and exp(−0.3) = 0.741. The odds are multiplied by 0.741, a reduction of about 26%.","explanationNote":"About 3% is the change for one unit, $1,000. The value 30% reads −0.3 on the log scale as a percentage without exponentiating.","bg":"A lender models whether a loan defaults (1 = default, 0 = repaid) for 500 loans, using the borrower’s income (Income, in thousands of dollars) and the number of late payments in the previous year (Late). Parts of the output are masked by #####.","bgr":"> fit = glm(Default ~ Income + Late, family = binomial, data = loans)\n> summary(fit)\n\nCoefficients:\n            Estimate Std. Error z value Pr(>|z|)\n(Intercept)   -1.200      0.500   #####    #####\nIncome        -0.030      0.010   #####    #####\nLate           0.700      0.200   #####    #####\n\n> exp(c(-1, 0.7, -0.3))\n[1] 0.3678794 2.0137527 0.7408182","model":"Ten units of Income change the log-odds by −0.3, so the odds are multiplied by exp(−0.3) = 0.741. With the same number of late payments, the borrower earning $10,000 more has odds of default about 26% lower."}]</script><script>

const lessons=[{"title":"Start with the observational unit","body":"<p>Before you draw any graph, ask what one row of the data stands for. A row might be a person, a single visit, or a count for a whole group. Once you know that, you know what to divide by. For example, a region with more accidents is not necessarily more dangerous: if it also has many more journeys, its accident <strong>rate</strong> (accidents per journey) can be lower.</p>\n<p>A histogram on the density scale shows proportions as <strong>areas</strong>, not heights. The height of bin <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>j</mi><annotation encoding=\"application/x-tex\">j</annotation></semantics></math> is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>h</mi><mi>j</mi></msub><mo>=</mo><mfrac><msub><mi>n</mi><mi>j</mi></msub><mrow><mi>n</mi><msub><mi>w</mi><mi>j</mi></msub></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">h_j=\\frac{n_j}{n w_j}</annotation></semantics></math>, so a bin that is 5 wide and 0.04 high holds <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5</mn><mo>×</mo><mn>0.04</mn><mo>=</mo><mn>0.20</mn></mrow><annotation encoding=\"application/x-tex\">5\\times 0.04=0.20</annotation></semantics></math>, or 20% of the sample. To find the median, add up the areas from the left until you reach one half. When you compare two categorical variables, compare proportions within each group, not raw counts.</p>\n","caption":"On the density scale, proportions are read as areas. The vertical marker sits in the bin that contains the median."},{"title":"Centre, spread and units","body":"<p>The mean and the median both describe the centre, but in different ways. The mean is the balance point of the data, and the median is the middle value once the data are sorted. One very large value pulls the mean towards it and leaves the median where it was. So for a skewed distribution, report the median and the IQR, and look at the extreme values one by one.</p>\n<p>The SD measures spread: the population <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> is the root-mean-square distance from the mean. For a sample we divide by <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mo>−</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">n-1</annotation></semantics></math>, so <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>s</mi><mn>2</mn></msup><mo>=</mo><mfrac><mrow><mo>∑</mo><msup><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>x</mi><mi>i</mi></msub><mo>−</mo><mover><mi>x</mi><mo accent=\"true\">‾</mo></mover><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mn>2</mn></msup></mrow><mrow><mi>n</mi><mo>−</mo><mn>1</mn></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">s^2=\\frac{\\sum (x_i-\\bar x)^2}{n-1}</annotation></semantics></math>. If every value is changed to <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Y</mi><mo>=</mo><mi>a</mi><mo>+</mo><mi>b</mi><mi>X</mi></mrow><annotation encoding=\"application/x-tex\">Y=a+bX</annotation></semantics></math>, as in a change of units, the mean becomes <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>+</mo><mi>b</mi><mover><mi>x</mi><mo accent=\"true\">‾</mo></mover></mrow><annotation encoding=\"application/x-tex\">a+b\\bar x</annotation></semantics></math> and the <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> becomes <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\" form=\"prefix\">|</mo><mi>b</mi><mo stretchy=\"false\" form=\"postfix\">|</mo><msub><mi>s</mi><mi>x</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\lvert b\\rvert s_x</annotation></semantics></math>. Adding <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>a</mi><annotation encoding=\"application/x-tex\">a</annotation></semantics></math> moves the data without changing the spread. In a boxplot, the box runs from <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>Q</mi><mn>1</mn></msub><annotation encoding=\"application/x-tex\">Q_1</annotation></semantics></math> to <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>Q</mi><mn>3</mn></msub><annotation encoding=\"application/x-tex\">Q_3</annotation></semantics></math>, and each whisker stops at the most extreme observation that is still inside the fence.</p>\n","caption":"The box spans the middle half. Dots beyond the whisker are individual observations."},{"title":"From a measurement to an area","body":"<p>The normal curve lets us turn a cutoff into a probability. First convert the value to standard units, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>z</mi><mo>=</mo><mfrac><mrow><mi>x</mi><mo>−</mo><mi>μ</mi></mrow><mi>σ</mi></mfrac></mrow><annotation encoding=\"application/x-tex\">z=\\frac{x-\\mu}{\\sigma}</annotation></semantics></math>, which says how many SDs it lies above or below the mean. The area under the curve to the left of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>z</mi><annotation encoding=\"application/x-tex\">z</annotation></semantics></math> is the chance of falling below that value. For the chance of landing between two values, subtract the two left-hand areas. For the chance of being above a value, subtract its left-hand area from 1.</p>\n<p>A percentile works the other way round: start from an area and find the value, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>x</mi><mi>p</mi></msub><mo>=</mo><mi>μ</mi><mo>+</mo><msub><mi>z</mi><mi>p</mi></msub><mi>σ</mi></mrow><annotation encoding=\"application/x-tex\">x_p=\\mu+z_p\\sigma</annotation></semantics></math>. The 90th percentile, for example, is always 1.282 SDs above the mean, so shifting the mean shifts every percentile by the same amount. In R, <strong>pnorm takes a value and returns an area</strong>, <strong>qnorm takes an area and returns a value</strong>, and dnorm gives the height of the curve.</p>\n","caption":"The shaded area is the probability of a score between the two marked values."},{"title":"From association to prediction","body":"<p>The correlation coefficient <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>r</mi><annotation encoding=\"application/x-tex\">r</annotation></semantics></math> measures how closely the points follow a straight line, and in which direction. Always plot the data first, because <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>r</mi><annotation encoding=\"application/x-tex\">r</annotation></semantics></math> only sees straight-line patterns: a clear <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>U</mi><annotation encoding=\"application/x-tex\">U</annotation></semantics></math>-shaped relationship can have a correlation of zero. The regression line passes through the point of averages <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mover><mi>x</mi><mo accent=\"true\">‾</mo></mover><mo>,</mo><mover><mi>y</mi><mo accent=\"true\">‾</mo></mover><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><annotation encoding=\"application/x-tex\">(\\bar x,\\bar y)</annotation></semantics></math> and has slope <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi><mfrac><msub><mi>s</mi><mi>y</mi></msub><msub><mi>s</mi><mi>x</mi></msub></mfrac></mrow><annotation encoding=\"application/x-tex\">r \\frac{s_y}{s_x}</annotation></semantics></math>.</p>\n<p>A residual is the vertical gap between an observation and the line, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>e</mi><mi>i</mi></msub><mo>=</mo><msub><mi>y</mi><mi>i</mi></msub><mo>−</mo><msub><mover><mi>y</mi><mo accent=\"true\">̂</mo></mover><mi>i</mi></msub></mrow><annotation encoding=\"application/x-tex\">e_i=y_i-\\hat y_i</annotation></semantics></math>. The least-squares line is the one that makes the sum of squared residuals as small as possible. To judge the line, compare it with simply predicting the mean every time: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>R</mi><mn>2</mn></msup><mo>=</mo><mn>1</mn><mo>−</mo><mfrac><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">T</mi></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">R^2=1-\\frac{\\mathrm{SSE}}{\\mathrm{SST}}</annotation></semantics></math> is the proportion of the variation that the line explains. With one predictor, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msup><mi>R</mi><mn>2</mn></msup><annotation encoding=\"application/x-tex\">R^2</annotation></semantics></math> equals <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msup><mi>r</mi><mn>2</mn></msup><annotation encoding=\"application/x-tex\">r^2</annotation></semantics></math>, and the sign of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>r</mi><annotation encoding=\"application/x-tex\">r</annotation></semantics></math> is the sign of the slope.</p>\n","caption":"In a symmetric curve the rising half and the falling half cancel, so the correlation can be zero."},{"title":"Choose the right denominator","body":"<p>A conditional probability looks only at the cases where the condition holds: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>A</mi><mo>∣</mo><mi>B</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mfrac><mrow><mi>P</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>A</mi><mo>∩</mo><mi>B</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><mrow><mi>P</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>B</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">P(A\\mid B)=\\frac{P(A\\cap B)}{P(B)}</annotation></semantics></math>. The main step is choosing the denominator. Take a screening test. For the chance that an item is faulty <strong>given that it was flagged</strong>, the denominator is all the flagged items, both the correctly flagged and the falsely flagged ones.</p> <p>On a tree diagram, multiply the probabilities along a path, then add the paths that lead to the event. When drawing without replacement, the box changes after each draw, so update the probabilities as you go. To check an answer by simulation, copy the real drawing rule in R, record TRUE or FALSE for the event on each run, and take the mean.</p>","caption":"Once we condition on being flagged, only the flagged items go in the denominator."},{"title":"What varies when you draw again?","body":"<p>A box model describes a chance process as drawing tickets from a box. The numbers on the tickets are the possible outcomes, and the share of each kind of ticket is its probability. The average of the box is the expected value of one draw, and the <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> of the box tells us how far a draw typically lands from that average. What we observe is the expected value plus a chance error.</p>\n<p>For the sum of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n</mi><annotation encoding=\"application/x-tex\">n</annotation></semantics></math> independent draws, the expected value is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mi>μ</mi></mrow><annotation encoding=\"application/x-tex\">n\\mu</annotation></semantics></math> and the <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SE}</annotation></semantics></math> is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msqrt><mi>n</mi></msqrt><mspace width=\"0.167em\"></mspace><mi>σ</mi></mrow><annotation encoding=\"application/x-tex\">\\sqrt n\\,\\sigma</annotation></semantics></math>. For the sample mean, divide both by <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n</mi><annotation encoding=\"application/x-tex\">n</annotation></semantics></math>. When we count successes, the box holds only 0s and 1s, so <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>σ</mi><mo>=</mo><msqrt><mrow><mi>p</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>1</mn><mo>−</mo><mi>p</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow></msqrt></mrow><annotation encoding=\"application/x-tex\">\\sigma=\\sqrt{p(1-p)}</annotation></semantics></math>. Counts are whole numbers, so when a normal curve is used to approximate them, include the whole bar at the boundary.</p>\n","caption":"When the game is played many times independently, the total payoff varies. This is the distribution of those totals."},{"title":"Which distribution becomes normal?","body":"<p>Imagine taking a whole sample, writing down its mean, and then repeating this many times. The law of averages, also called the law of large numbers, says that the sample mean settles closer to the population mean as the sample size grows. The central limit theorem is about shape: the distribution of those sample means looks more and more like a normal curve, even when the individual observations are skewed.</p> <p>This is why we can use <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Z</mi><mo>=</mo><mfrac><mrow><mover><mi>X</mi><mo accent=\"true\">‾</mo></mover><mo>−</mo><mi>μ</mi></mrow><mfrac><mi>σ</mi><msqrt><mi>n</mi></msqrt></mfrac></mfrac></mrow><annotation encoding=\"application/x-tex\">Z=\\frac{\\bar X-\\mu}{\\frac{\\sigma}{\\sqrt n}}</annotation></semantics></math> for independent draws, as long as the sample is large enough for the approximation to be reasonable. For a total instead of a mean, multiply both the centre and the <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SE}</annotation></semantics></math> by <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n</mi><annotation encoding=\"application/x-tex\">n</annotation></semantics></math>. For a rare event, check that the expected numbers of successes and failures are both large enough before trusting the normal curve.</p>","caption":"Every panel draws its samples from the same exponential distribution. Only the sample size changes."},{"title":"Predicting data or estimating a parameter?","body":"<p>There are two different questions here. A prediction interval starts from a known parameter and asks which sample results would be unsurprising. A confidence interval goes the other way: we have observed a sample, and we ask which parameter values are consistent with it. The Wilson interval for a proportion is built by exactly this reversal.</p>\n<p>When the population <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> is known, the interval for a mean is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover><mi>x</mi><mo accent=\"true\">‾</mo></mover><mo>±</mo><msup><mi>z</mi><mo>*</mo></msup><mfrac><mi>σ</mi><msqrt><mi>n</mi></msqrt></mfrac></mrow><annotation encoding=\"application/x-tex\">\\bar x\\pm z^*\\frac{\\sigma}{\\sqrt n}</annotation></semantics></math>. A two-sided 95% interval leaves 2.5% in each tail, so <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msup><mi>z</mi><mo>*</mo></msup><annotation encoding=\"application/x-tex\">z^*</annotation></semantics></math> is the 0.975 quantile, about 1.96. <strong>The margin of error is half the width of the interval.</strong> The 95% describes the method: if the study were repeated many times, about 95% of the intervals would cover the true value, provided the assumptions hold.</p>\n","caption":"Each segment is one interval. The vertical line marks the fixed population mean."},{"title":"How unusual is the observed result?","body":"<p>A test starts with a claim about a population parameter, the null hypothesis, and an alternative that says which direction counts as evidence against it. We then ask how far the data are from what the null predicts, in standard units. For a proportion, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Z</mi><mo>=</mo><mfrac><mrow><mover><mi>p</mi><mo accent=\"true\">̂</mo></mover><mo>−</mo><msub><mi>p</mi><mn>0</mn></msub></mrow><msqrt><mfrac><mrow><msub><mi>p</mi><mn>0</mn></msub><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>1</mn><mo>−</mo><msub><mi>p</mi><mn>0</mn></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><mi>n</mi></mfrac></msqrt></mfrac></mrow><annotation encoding=\"application/x-tex\">Z=\\frac{\\hat p-p_0}{\\sqrt{\\frac{p_0(1-p_0)}{n}}}</annotation></semantics></math>; notice that the <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SE}</annotation></semantics></math> uses the null value <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>p</mi><mn>0</mn></msub><annotation encoding=\"application/x-tex\">p_0</annotation></semantics></math>. For a mean with known <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math>, divide by the <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SE}</annotation></semantics></math> of the mean, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><mi>σ</mi><msqrt><mi>n</mi></msqrt></mfrac><annotation encoding=\"application/x-tex\">\\frac{\\sigma}{\\sqrt n}</annotation></semantics></math>.</p>\n<p>The <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>p</mi><annotation encoding=\"application/x-tex\">p</annotation></semantics></math>-value is the chance, if the null is true, of a statistic at least as extreme as the one observed, in the direction of the alternative. A small <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>p</mi><annotation encoding=\"application/x-tex\">p</annotation></semantics></math>-value means the data would be surprising under the null, and we compare it with the significance level chosen in advance. Counts are whole numbers, so a rejection boundary such as 14.3 means \"reject at 15 or more\".</p>\n","caption":"The shaded upper tail fixes the smallest whole-number count at which the test rejects."},{"title":"What changes when the SD is estimated?","body":"<p>Usually we do not know the population <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> and replace it with the sample <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>s</mi><annotation encoding=\"application/x-tex\">s</annotation></semantics></math>. This adds extra uncertainty, so the statistic no longer follows the normal curve. For independent observations from a normal population, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi><mo>=</mo><mfrac><mrow><mover><mi>X</mi><mo accent=\"true\">‾</mo></mover><mo>−</mo><msub><mi>μ</mi><mn>0</mn></msub></mrow><mfrac><mi>s</mi><msqrt><mi>n</mi></msqrt></mfrac></mfrac></mrow><annotation encoding=\"application/x-tex\">T=\\frac{\\bar X-\\mu_0}{\\frac{s}{\\sqrt n}}</annotation></semantics></math> follows a <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>t</mi><annotation encoding=\"application/x-tex\">t</annotation></semantics></math> distribution with <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mo>−</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">n-1</annotation></semantics></math> degrees of freedom when the null is true. The <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>t</mi><annotation encoding=\"application/x-tex\">t</annotation></semantics></math> curve has heavier tails than the normal curve, and the difference matters most for small samples.</p>\n<p>The bootstrap-<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>t</mi><annotation encoding=\"application/x-tex\">t</annotation></semantics></math> replaces the <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>t</mi><annotation encoding=\"application/x-tex\">t</annotation></semantics></math> curve with one built from the data. Resample the observations with replacement many times, and each time compute the studentised statistic, centred on the original sample mean. If the lower and upper quantiles of these values are <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>L</mi><annotation encoding=\"application/x-tex\">L</annotation></semantics></math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>U</mi><annotation encoding=\"application/x-tex\">U</annotation></semantics></math>, the interval is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mover><mi>x</mi><mo accent=\"true\">‾</mo></mover><mo>−</mo><mi>U</mi><mover><mrow><mi>S</mi><mi>E</mi></mrow><mo accent=\"true\">̂</mo></mover><mo>,</mo><mover><mi>x</mi><mo accent=\"true\">‾</mo></mover><mo>−</mo><mi>L</mi><mover><mrow><mi>S</mi><mi>E</mi></mrow><mo accent=\"true\">̂</mo></mover><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><annotation encoding=\"application/x-tex\">[\\bar x-U\\widehat{SE},\\bar x-L\\widehat{SE}]</annotation></semantics></math>. Notice that the upper quantile gives the lower end.</p>\n","caption":"At the same standardised distance, a t distribution with few degrees of freedom has heavier tails."},{"title":"Let the study design choose the SE","body":"<p>The design of the study decides which <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SE}</annotation></semantics></math> to use. For two independent groups, the variance of the difference in means is the sum of the two variances. The Welch test uses <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msqrt><mrow><mfrac><msubsup><mi>s</mi><mn>1</mn><mn>2</mn></msubsup><msub><mi>n</mi><mn>1</mn></msub></mfrac><mo>+</mo><mfrac><msubsup><mi>s</mi><mn>2</mn><mn>2</mn></msubsup><msub><mi>n</mi><mn>2</mn></msub></mfrac></mrow></msqrt><annotation encoding=\"application/x-tex\">\\sqrt{\\frac{s_1^2}{n_1}+\\frac{s_2^2}{n_2}}</annotation></semantics></math> and does not assume equal spreads. The pooled (classical) test assumes the two populations have the same variance, and combines the two sample variances, weighted by their degrees of freedom.</p>\n<p>For paired data, such as before and after measurements on the same people, take one difference per person and run a one-sample <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>t</mi><annotation encoding=\"application/x-tex\">t</annotation></semantics></math> test on the differences. Check which way the subtraction goes before choosing the tail. With a small paired sample, it is the <strong>differences</strong> that should look roughly normal, not the two original columns.</p>\n","caption":"Each segment joins two measurements from the same person."},{"title":"Compare observed counts with expected counts","body":"<p>Chi-squared tests compare the observed counts with the counts a null hypothesis expects. A goodness-of-fit test has one categorical variable and a set of claimed proportions, so <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><mi>i</mi></msub><mo>=</mo><mi>n</mi><msub><mi>p</mi><mi>i</mi></msub></mrow><annotation encoding=\"application/x-tex\">E_i=np_i</annotation></semantics></math>. A test of independence classifies each unit by two variables, and the expected count in a cell is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><mrow><mi>i</mi><mi>j</mi></mrow></msub><mo>=</mo><mfrac><mrow><msub><mi>R</mi><mi>i</mi></msub><msub><mi>C</mi><mi>j</mi></msub></mrow><mi>N</mi></mfrac></mrow><annotation encoding=\"application/x-tex\">E_{ij}=\\frac{R_i C_j}{N}</annotation></semantics></math>: row total times column total, divided by the grand total.</p> <p>The statistic adds up <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac><msup><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>O</mi><mo>−</mo><mi>E</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mn>2</mn></msup><mi>E</mi></mfrac><annotation encoding=\"application/x-tex\">\\frac{(O-E)^2}{E}</annotation></semantics></math> over all the cells. Every term is zero or positive, so large values are evidence against the null and we always use the right tail. The degrees of freedom are <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi><mo>−</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">k-1</annotation></semantics></math> for goodness of fit, less one more for each parameter estimated from the data, and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>r</mi><mo>−</mo><mn>1</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>c</mi><mo>−</mo><mn>1</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">(r-1)(c-1)</annotation></semantics></math> for a table. The observations must be independent, and the chi-squared curve is only a good approximation when the expected counts are not too small. If they are small, simulate the null distribution.</p>","caption":"The week with the largest contribution is the main reason the counts differ from what the null expects."},{"title":"Read the slope and check the model","body":"<p>In multiple regression, a slope tells us how the fitted response changes when that predictor goes up by one unit <strong>while the other predictors stay fixed</strong>. If the response is on a log scale, a change of <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>d</mi><annotation encoding=\"application/x-tex\">d</annotation></semantics></math> units multiplies the fitted value on the original scale by <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>exp</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>b</mi><mi>d</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\\exp(bd)</annotation></semantics></math>. To test a slope, divide the estimate by its standard error and use a <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>t</mi><annotation encoding=\"application/x-tex\">t</annotation></semantics></math> distribution with <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mo>−</mo><mi>p</mi><mo>−</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">n-p-1</annotation></semantics></math> degrees of freedom.</p>\n<p>Then check the assumptions. Read a residual plot twice: once for a curve through the middle of the points, which means the straight-line form is wrong, and once for a fan shape, which means the spread is not constant. A Q–Q plot checks whether the residuals look normal. Independence cannot be read from a plot, so think about how the data were collected. Finally, when predictors are strongly related to each other, the model can fit well overall while the individual slopes are estimated imprecisely.</p>\n","caption":"In the residual plot, look at the centre of the band and at its width separately. The Q–Q reference line is about the distribution of the residuals. Repeated visits from one person belong to the same sampling unit."},{"title":"Does the added term improve fit?","body":"<p>To decide whether extra predictors are worth adding, fit a reduced model and a full model to the same data. The reduced model is <strong>nested</strong> in the full one if you get it by setting some of the full model's coefficients to zero. The partial <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>F</mi><annotation encoding=\"application/x-tex\">F</annotation></semantics></math> test asks whether the drop in the residual sum of squares is large compared with the noise left in the full model.</p>\n<p>The statistic is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>F</mi><mo>=</mo><mfrac><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi></mrow><mi>R</mi></msub><mo>−</mo><msub><mrow><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi></mrow><mi>F</mi></msub></mrow><mi>q</mi></mfrac><mfrac><msub><mrow><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi></mrow><mi>F</mi></msub><mrow><mi>d</mi><msub><mi>f</mi><mi>F</mi></msub></mrow></mfrac></mfrac></mrow><annotation encoding=\"application/x-tex\">F=\\frac{\\frac{\\mathrm{RSS}_R-\\mathrm{RSS}_F}{q}}{\\frac{\\mathrm{RSS}_F}{df_F}}</annotation></semantics></math>, where <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>q</mi><annotation encoding=\"application/x-tex\">q</annotation></semantics></math> is the number of coefficients being tested. The overall <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>F</mi><annotation encoding=\"application/x-tex\">F</annotation></semantics></math> test in a summary is the special case where the reduced model has only an intercept. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msup><mi>R</mi><mn>2</mn></msup><annotation encoding=\"application/x-tex\">R^2</annotation></semantics></math> never goes down when a term is added, so it cannot choose between models; adjusted <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msup><mi>R</mi><mn>2</mn></msup><annotation encoding=\"application/x-tex\">R^2</annotation></semantics></math> can go down. Forward and backward selection add or remove one term at a time, refit, and then look at the new <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>p</mi><annotation encoding=\"application/x-tex\">p</annotation></semantics></math>-values.</p>\n","caption":"When one term is added, the two measures of fit can move in opposite directions."},{"title":"From a linear predictor to a probability","body":"<p>For a yes/no response we model a probability, which has to stay between 0 and 1. Logistic regression does this by making the <strong>log-odds</strong> a linear function of the predictors: <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>η</mi><mo>=</mo><mo>log</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mfrac><mi>p</mi><mrow><mn>1</mn><mo>−</mo><mi>p</mi></mrow></mfrac><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\\eta=\\log(\\frac{p}{1-p})</annotation></semantics></math>. To get back to a probability, use <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>=</mo><mfrac><mn>1</mn><mrow><mn>1</mn><mo>+</mo><msup><mi>e</mi><mrow><mi>−</mi><mi>η</mi></mrow></msup></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">p=\\frac{1}{1+e^{-\\eta}}</annotation></semantics></math>. In R, <code>predict</code> gives <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>η</mi><annotation encoding=\"application/x-tex\">\\eta</annotation></semantics></math> by default; add <code>type = \"response\"</code> to get the probability of the category coded 1.</p>\n<p>With the other variables held fixed, increasing a predictor by <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>d</mi><annotation encoding=\"application/x-tex\">d</annotation></semantics></math> units multiplies the <strong>odds</strong> by <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msup><mi>e</mi><mrow><mi>b</mi><mi>d</mi></mrow></msup><annotation encoding=\"application/x-tex\">e^{bd}</annotation></semantics></math>. The change in probability is not constant: it depends on where you start. A single coefficient is tested with a Wald <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>z</mi><annotation encoding=\"application/x-tex\">z</annotation></semantics></math> statistic, the estimate divided by its standard error. Deviance measures how well the model fits, using the likelihood. It is not the same thing as the percentage of cases classified correctly.</p>\n","caption":"The same change on the logit scale produces different probability changes at different starting points."}];// A weekly illustration is attached to a question only when it is drawn from that question's own numbers.
// questionFigures: shown under the stem. solutionFigures: shown in the feedback, because the picture gives the answer away.

const formulaSheets=["<p><strong>Notation.</strong> Each observation belongs to a group <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>j</mi><annotation encoding=\"application/x-tex\">j</annotation></semantics></math>. The sample size is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n</mi><annotation encoding=\"application/x-tex\">n</annotation></semantics></math>, the number of observations in a group is <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>n</mi><mi>j</mi></msub><annotation encoding=\"application/x-tex\">n_j</annotation></semantics></math>, and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>p</mi><mi>j</mi></msub><annotation encoding=\"application/x-tex\">p_j</annotation></semantics></math> is the proportion of the sample in that group. A histogram bin runs from <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>a</mi><mi>j</mi></msub><annotation encoding=\"application/x-tex\">a_j</annotation></semantics></math> to <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>b</mi><mi>j</mi></msub><annotation encoding=\"application/x-tex\">b_j</annotation></semantics></math> with width <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>w</mi><mi>j</mi></msub><annotation encoding=\"application/x-tex\">w_j</annotation></semantics></math>, height <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>h</mi><mi>j</mi></msub><annotation encoding=\"application/x-tex\">h_j</annotation></semantics></math> and area <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>P</mi><mi>j</mi></msub><annotation encoding=\"application/x-tex\">P_j</annotation></semantics></math>. In a table, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>n</mi><mrow><mi>i</mi><mi>j</mi></mrow></msub><annotation encoding=\"application/x-tex\">n_{ij}</annotation></semantics></math> is the count in cell (<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>i</mi><annotation encoding=\"application/x-tex\">i</annotation></semantics></math>,<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>j</mi><annotation encoding=\"application/x-tex\">j</annotation></semantics></math>) and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>n</mi><mrow><mi>i</mi><mo>+</mo></mrow></msub><annotation encoding=\"application/x-tex\">n_{i+}</annotation></semantics></math> is the total of row <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>i</mi><annotation encoding=\"application/x-tex\">i</annotation></semantics></math>. A rate takes <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>C</mi><annotation encoding=\"application/x-tex\">C</annotation></semantics></math> events in <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>E</mi><annotation encoding=\"application/x-tex\">E</annotation></semantics></math> units of exposure and expresses them per <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>k</mi><annotation encoding=\"application/x-tex\">k</annotation></semantics></math> units.</p> <p><strong>Frequency and exposure</strong><br/> <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>p</mi><mi>j</mi></msub><mo>=</mo><mfrac><msub><mi>n</mi><mi>j</mi></msub><mi>n</mi></mfrac></mrow><annotation encoding=\"application/x-tex\">p_j=\\frac{n_j}{n}</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>%</mi><mo>=</mo><mn>100</mn><msub><mi>p</mi><mi>j</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\%=100p_j</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mtext mathvariant=\"normal\">rate per </mtext><mspace width=\"0.333em\"></mspace></mrow><mi>k</mi><mo>=</mo><mfrac><mrow><mi>k</mi><mi>C</mi></mrow><mi>E</mi></mfrac></mrow><annotation encoding=\"application/x-tex\">\\text{rate per }k=\\frac{kC}{E}</annotation></semantics></math>. Divide by the exposure of the group you are comparing.</p> <p><strong>Conditional shares</strong><br/> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>p</mi><mrow><mi>j</mi><mo>∣</mo><mi>i</mi></mrow></msub><mo>=</mo><mfrac><msub><mi>n</mi><mrow><mi>i</mi><mi>j</mi></mrow></msub><msub><mi>n</mi><mrow><mi>i</mi><mo>+</mo></mrow></msub></mfrac></mrow><annotation encoding=\"application/x-tex\">p_{j\\mid i}=\\frac{n_{ij}}{n_{i+}}</annotation></semantics></math>. For column percentages, divide by the column total instead.</p> <p><strong>Density histogram</strong><br/> <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>w</mi><mi>j</mi></msub><mo>=</mo><msub><mi>b</mi><mi>j</mi></msub><mo>−</mo><msub><mi>a</mi><mi>j</mi></msub></mrow><annotation encoding=\"application/x-tex\">w_j=b_j-a_j</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>h</mi><mi>j</mi></msub><mo>=</mo><mfrac><msub><mi>n</mi><mi>j</mi></msub><mrow><mi>n</mi><msub><mi>w</mi><mi>j</mi></msub></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">h_j=\\frac{n_j}{nw_j}</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>P</mi><mi>j</mi></msub><mo>=</mo><msub><mi>h</mi><mi>j</mi></msub><msub><mi>w</mi><mi>j</mi></msub></mrow><annotation encoding=\"application/x-tex\">P_j=h_jw_j</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><munder><mo>∑</mo><mi>j</mi></munder><msub><mi>h</mi><mi>j</mi></msub><msub><mi>w</mi><mi>j</mi></msub><mo>=</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">\\sum_jh_jw_j=1</annotation></semantics></math>. To find a quantile, add up the areas from the left until you reach the required proportion.</p>","<p><strong>Notation.</strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>x</mi><mi>i</mi></msub><annotation encoding=\"application/x-tex\">x_i</annotation></semantics></math> is measurement <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>i</mi><annotation encoding=\"application/x-tex\">i</annotation></semantics></math>. A bar denotes a sample mean, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>μ</mi><annotation encoding=\"application/x-tex\">\\mu</annotation></semantics></math> a population mean, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>s</mi><annotation encoding=\"application/x-tex\">s</annotation></semantics></math> a sample <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>σ</mi><annotation encoding=\"application/x-tex\">\\sigma</annotation></semantics></math> a population <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math>. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>N</mi><annotation encoding=\"application/x-tex\">N</annotation></semantics></math> is the number of observations in the population and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n</mi><annotation encoding=\"application/x-tex\">n</annotation></semantics></math> is the number in the sample. For grouped means, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>j</mi><annotation encoding=\"application/x-tex\">j</annotation></semantics></math> labels the groups. In a change of units a is the shift and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>b</mi><annotation encoding=\"application/x-tex\">b</annotation></semantics></math> the multiplier. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>Q</mi><mn>1</mn></msub><annotation encoding=\"application/x-tex\">Q_1</annotation></semantics></math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>Q</mi><mn>3</mn></msub><annotation encoding=\"application/x-tex\">Q_3</annotation></semantics></math> are the lower and upper quartiles.</p> <p><strong>Location</strong><br/> <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover><mi>x</mi><mo accent=\"true\">‾</mo></mover><mo>=</mo><mfrac><mrow><munder><mo>∑</mo><mi>i</mi></munder><msub><mi>x</mi><mi>i</mi></msub></mrow><mi>n</mi></mfrac></mrow><annotation encoding=\"application/x-tex\">\\bar x=\\frac{\\sum_i x_i}{n}</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mover><mi>x</mi><mo accent=\"true\">‾</mo></mover><mrow><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">b</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">d</mi></mrow></msub><mo>=</mo><mfrac><mrow><munder><mo>∑</mo><mi>j</mi></munder><msub><mi>n</mi><mi>j</mi></msub><msub><mover><mi>x</mi><mo accent=\"true\">‾</mo></mover><mi>j</mi></msub></mrow><mrow><munder><mo>∑</mo><mi>j</mi></munder><msub><mi>n</mi><mi>j</mi></msub></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">\\bar x_{\\mathrm{combined}}=\\frac{\\sum_j n_j\\bar x_j}{\\sum_j n_j}</annotation></semantics></math>. For the median, sort the values first. When <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n</mi><annotation encoding=\"application/x-tex\">n</annotation></semantics></math> is even, average the two middle values.</p> <p><strong>Spread</strong><br/> <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>RMS</mo><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>x</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mo>=</mo><msqrt><mfrac><mrow><munder><mo>∑</mo><mi>i</mi></munder><msubsup><mi>x</mi><mi>i</mi><mn>2</mn></msubsup></mrow><mi>n</mi></mfrac></msqrt></mrow><annotation encoding=\"application/x-tex\">\\operatorname{RMS}(x)=\\sqrt{\\frac{\\sum_i x_i^2}{n}}</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>σ</mi><mn>2</mn></msup><mo>=</mo><mfrac><mrow><munder><mo>∑</mo><mi>i</mi></munder><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><msub><mi>x</mi><mi>i</mi></msub><mo>−</mo><mi>μ</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mn>2</mn></msup></mrow><mi>N</mi></mfrac><mo>=</mo><mi>E</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><msup><mi>X</mi><mn>2</mn></msup><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mo>−</mo><msup><mi>μ</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">\\sigma^2=\\frac{\\sum_i(x_i-\\mu)^2}{N}=E(X^2)-\\mu^2</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>s</mi><mn>2</mn></msup><mo>=</mo><mfrac><mrow><munder><mo>∑</mo><mi>i</mi></munder><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><msub><mi>x</mi><mi>i</mi></msub><mo>−</mo><mover><mi>x</mi><mo accent=\"true\">‾</mo></mover><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mn>2</mn></msup></mrow><mrow><mi>n</mi><mo>−</mo><mn>1</mn></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">s^2=\\frac{\\sum_i(x_i-\\bar x)^2}{n-1}</annotation></semantics></math>. The <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> is the square root of the variance. When the observed values are the whole box, multiply R’<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>s</mi><annotation encoding=\"application/x-tex\">s</annotation></semantics></math> sd by <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msqrt><mfrac><mrow><mi>n</mi><mo>−</mo><mn>1</mn></mrow><mi>n</mi></mfrac></msqrt><annotation encoding=\"application/x-tex\">\\sqrt{\\frac{n-1}{n}}</annotation></semantics></math> to get the population version, because sd returns the sample version.</p> <p><strong>Rescaling</strong><br/> <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y</mi><mo>=</mo><mi>a</mi><mo>+</mo><mi>b</mi><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">y=a+bx</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover><mi>y</mi><mo accent=\"true\">‾</mo></mover><mo>=</mo><mi>a</mi><mo>+</mo><mi>b</mi><mover><mi>x</mi><mo accent=\"true\">‾</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\bar y=a+b\\bar x</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>s</mi><mi>y</mi></msub><mo>=</mo><mrow><mo form=\"prefix\" stretchy=\"true\">|</mo><mi>b</mi><mo form=\"postfix\" stretchy=\"true\">|</mo></mrow><msub><mi>s</mi><mi>x</mi></msub></mrow><annotation encoding=\"application/x-tex\">s_y=|b|s_x</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>z</mi><mi>i</mi></msub><mo>=</mo><mfrac><mrow><msub><mi>x</mi><mi>i</mi></msub><mo>−</mo><mover><mi>x</mi><mo accent=\"true\">‾</mo></mover></mrow><msub><mi>s</mi><mi>x</mi></msub></mfrac></mrow><annotation encoding=\"application/x-tex\">z_i=\\frac{x_i-\\bar x}{s_x}</annotation></semantics></math>.</p> <p><strong>Rank-based spread</strong><br/> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi><mi>Q</mi><mi>R</mi><mo>=</mo><msub><mi>Q</mi><mn>3</mn></msub><mo>−</mo><msub><mi>Q</mi><mn>1</mn></msub><mo>,</mo><mspace width=\"1.0em\"></mspace><mi>R</mi><mo>=</mo><msub><mi>x</mi><mo>max</mo></msub><mo>−</mo><msub><mi>x</mi><mo>min</mo></msub></mrow><annotation encoding=\"application/x-tex\">IQR=Q_3-Q_1,\\quad R=x_{\\max}-x_{\\min}</annotation></semantics></math>. The fences are <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>Q</mi><mn>1</mn></msub><mo>−</mo><mn>1.5</mn><mi>I</mi><mi>Q</mi><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">Q_1-1.5IQR</annotation></semantics></math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>Q</mi><mn>3</mn></msub><mo>+</mo><mn>1.5</mn><mi>I</mi><mi>Q</mi><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">Q_3+1.5IQR</annotation></semantics></math>. Each whisker ends at the most extreme observed value that is still inside the fences.</p>","<p><strong>Notation.</strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>X</mi><annotation encoding=\"application/x-tex\">X</annotation></semantics></math> is the original measurement, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>μ</mi><annotation encoding=\"application/x-tex\">\\mu</annotation></semantics></math> its population mean and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>σ</mi><annotation encoding=\"application/x-tex\">\\sigma</annotation></semantics></math> its <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math>. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>Z</mi><annotation encoding=\"application/x-tex\">Z</annotation></semantics></math> is the measurement in standard units, f is the density, and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>Φ</mi><annotation encoding=\"application/x-tex\">\\Phi</annotation></semantics></math> is the area under the standard normal curve to the left of a value. A subscript <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>p</mi><annotation encoding=\"application/x-tex\">p</annotation></semantics></math> on <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x</mi><annotation encoding=\"application/x-tex\">x</annotation></semantics></math> or <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>z</mi><annotation encoding=\"application/x-tex\">z</annotation></semantics></math> marks the <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>p</mi><annotation encoding=\"application/x-tex\">p</annotation></semantics></math> quantile, the value with that proportion below it. The two ends of an interval are a and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>b</mi><annotation encoding=\"application/x-tex\">b</annotation></semantics></math>.</p> <p><strong>Normal model</strong><br/> <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>X</mi><mo>∼</mo><mi>N</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>μ</mi><mo>,</mo><msup><mi>σ</mi><mn>2</mn></msup><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">X\\sim N(\\mu,\\sigma^2)</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Z</mi><mo>=</mo><mfrac><mrow><mi>X</mi><mo>−</mo><mi>μ</mi></mrow><mi>σ</mi></mfrac></mrow><annotation encoding=\"application/x-tex\">Z=\\frac{X-\\mu}{\\sigma}</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>x</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mo>=</mo><mfrac><mn>1</mn><mrow><mi>σ</mi><msqrt><mrow><mn>2</mn><mi>π</mi></mrow></msqrt></mrow></mfrac><msup><mi>e</mi><mrow><mi>−</mi><mfrac><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>x</mi><mo>−</mo><mi>μ</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mn>2</mn></msup><mrow><mn>2</mn><msup><mi>σ</mi><mn>2</mn></msup></mrow></mfrac></mrow></msup></mrow><annotation encoding=\"application/x-tex\">f(x)=\\frac{1}{\\sigma\\sqrt{2\\pi}}e^{-\\frac{(x-\\mu)^2}{2\\sigma^2}}</annotation></semantics></math>. The height of the curve is the density. A probability is an area under the curve.</p> <p><strong>Areas and symmetry</strong><br/> <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>a</mi><mo>&lt;</mo><mi>X</mi><mo>&lt;</mo><mi>b</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mo>=</mo><mi>Φ</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><msub><mi>z</mi><mi>b</mi></msub><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mo>−</mo><mi>Φ</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><msub><mi>z</mi><mi>a</mi></msub><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">P(a&lt;X&lt;b)=\\Phi(z_b)-\\Phi(z_a)</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>Z</mi><mo>&gt;</mo><mi>z</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mo>=</mo><mn>1</mn><mo>−</mo><mi>Φ</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>z</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mo>=</mo><mi>Φ</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>−</mi><mi>z</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">P(Z&gt;z)=1-\\Phi(z)=\\Phi(-z)</annotation></semantics></math>. About 68%, 95% and 99.7% of the area lies within 1, 2 and 3 SDs of the mean.</p> <p><strong>Quantiles</strong><br/> <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>x</mi><mi>p</mi></msub><mo>=</mo><mi>μ</mi><mo>+</mo><mi>σ</mi><msup><mi>Φ</mi><mrow><mi>−</mi><mn>1</mn></mrow></msup><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>p</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">x_p=\\mu+\\sigma\\Phi^{-1}(p)</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>σ</mi><mo>=</mo><mfrac><mrow><msub><mi>x</mi><mi>q</mi></msub><mo>−</mo><msub><mi>x</mi><mi>p</mi></msub></mrow><mrow><msub><mi>z</mi><mi>q</mi></msub><mo>−</mo><msub><mi>z</mi><mi>p</mi></msub></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">\\sigma=\\frac{x_q-x_p}{z_q-z_p}</annotation></semantics></math>. In R, pnorm turns a value into an area and qnorm turns an area into a cutoff.</p>","<p><strong>Notation.</strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x</mi><annotation encoding=\"application/x-tex\">x</annotation></semantics></math> is the predictor and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>y</mi><annotation encoding=\"application/x-tex\">y</annotation></semantics></math> the response; bars denote their sample means. The sample SDs are <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>s</mi><mi>x</mi></msub><annotation encoding=\"application/x-tex\">s_x</annotation></semantics></math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>s</mi><mi>y</mi></msub><annotation encoding=\"application/x-tex\">s_y</annotation></semantics></math>, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>r</mi><annotation encoding=\"application/x-tex\">r</annotation></semantics></math> is the Pearson correlation coefficient, a is the intercept and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>b</mi><annotation encoding=\"application/x-tex\">b</annotation></semantics></math> is the slope. A hat denotes a fitted value. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SSE}</annotation></semantics></math> is the residual sum of squares and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">T</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SST}</annotation></semantics></math> is the total sum of squares about the mean.</p> <p><strong>Correlation</strong><br/> <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi><mo>=</mo><mfrac><mrow><munder><mo>∑</mo><mi>i</mi></munder><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><msub><mi>x</mi><mi>i</mi></msub><mo>−</mo><mover><mi>x</mi><mo accent=\"true\">‾</mo></mover><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><msub><mi>y</mi><mi>i</mi></msub><mo>−</mo><mover><mi>y</mi><mo accent=\"true\">‾</mo></mover><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><msqrt><mrow><munder><mo>∑</mo><mi>i</mi></munder><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><msub><mi>x</mi><mi>i</mi></msub><mo>−</mo><mover><mi>x</mi><mo accent=\"true\">‾</mo></mover><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mn>2</mn></msup><munder><mo>∑</mo><mi>i</mi></munder><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><msub><mi>y</mi><mi>i</mi></msub><mo>−</mo><mover><mi>y</mi><mo accent=\"true\">‾</mo></mover><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mn>2</mn></msup></mrow></msqrt></mfrac></mrow><annotation encoding=\"application/x-tex\">r=\\frac{\\sum_i(x_i-\\bar x)(y_i-\\bar y)}{\\sqrt{\\sum_i(x_i-\\bar x)^2\\sum_i(y_i-\\bar y)^2}}</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>−</mi><mn>1</mn><mo>≤</mo><mi>r</mi><mo>≤</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">-1\\le r\\le1</annotation></semantics></math>.</p> <p><strong>Fitted lines</strong><br/> <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>b</mi><mo>=</mo><mi>r</mi><mfrac><msub><mi>s</mi><mi>y</mi></msub><msub><mi>s</mi><mi>x</mi></msub></mfrac></mrow><annotation encoding=\"application/x-tex\">b=r \\frac{s_y}{s_x}</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>=</mo><mover><mi>y</mi><mo accent=\"true\">‾</mo></mover><mo>−</mo><mi>b</mi><mover><mi>x</mi><mo accent=\"true\">‾</mo></mover></mrow><annotation encoding=\"application/x-tex\">a=\\bar y-b\\bar x</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover><mi>y</mi><mo accent=\"true\">̂</mo></mover><mo>=</mo><mi>a</mi><mo>+</mo><mi>b</mi><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">\\hat y=a+bx</annotation></semantics></math>. When <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>r</mi><annotation encoding=\"application/x-tex\">r</annotation></semantics></math> is not zero, the <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></mrow><annotation encoding=\"application/x-tex\">\\mathrm{SD}</annotation></semantics></math> line has slope <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>sign</mo><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>r</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mfrac><msub><mi>s</mi><mi>y</mi></msub><msub><mi>s</mi><mi>x</mi></msub></mfrac></mrow><annotation encoding=\"application/x-tex\">\\operatorname{sign}(r)\\frac{s_y}{s_x}</annotation></semantics></math>. If the two variables swap roles, the regression slope becomes <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi><mfrac><msub><mi>s</mi><mi>x</mi></msub><msub><mi>s</mi><mi>y</mi></msub></mfrac></mrow><annotation encoding=\"application/x-tex\">r \\frac{s_x}{s_y}</annotation></semantics></math>.</p> <p><strong>Fit quality</strong><br/> <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>e</mi><mi>i</mi></msub><mo>=</mo><msub><mi>y</mi><mi>i</mi></msub><mo>−</mo><msub><mover><mi>y</mi><mo accent=\"true\">̂</mo></mover><mi>i</mi></msub></mrow><annotation encoding=\"application/x-tex\">e_i=y_i-\\hat y_i</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>S</mi><mi>S</mi><mi>E</mi><mo>=</mo><mo>∑</mo><msubsup><mi>e</mi><mi>i</mi><mn>2</mn></msubsup></mrow><annotation encoding=\"application/x-tex\">SSE=\\sum e_i^2</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>S</mi><mi>S</mi><mi>T</mi><mo>=</mo><mo>∑</mo><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><msub><mi>y</mi><mi>i</mi></msub><mo>−</mo><mover><mi>y</mi><mo accent=\"true\">‾</mo></mover><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">SST=\\sum(y_i-\\bar y)^2</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>R</mi><mn>2</mn></msup><mo>=</mo><mn>1</mn><mo>−</mo><mfrac><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">E</mi></mrow><mrow><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">T</mi></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">R^2=1-\\frac{\\mathrm{SSE}}{\\mathrm{SST}}</annotation></semantics></math>. When the line has an intercept, the residuals add to zero. With one predictor, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>R</mi><mn>2</mn></msup><mo>=</mo><msup><mi>r</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">R^2=r^2</annotation></semantics></math>.</p>","<p><strong>Notation.</strong> A and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>B</mi><annotation encoding=\"application/x-tex\">B</annotation></semantics></math> denote events. A superscript <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>c</mi><annotation encoding=\"application/x-tex\">c</annotation></semantics></math> denotes the complement. An intersection means that both events happen, a union means that at least one of them happens, and a vertical bar means “given”. The <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>B</mi><mi>j</mi></msub><annotation encoding=\"application/x-tex\">B_j</annotation></semantics></math> are groups that do not overlap and together cover the whole population. In repeated trials, <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>n</mi><annotation encoding=\"application/x-tex\">n</annotation></semantics></math> is the number of trials and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>p</mi><annotation encoding=\"application/x-tex\">p</annotation></semantics></math> is the chance of success on each trial.</p> <p><strong>Event algebra</strong><br/> <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><msup><mi>A</mi><mi>c</mi></msup><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mo>=</mo><mn>1</mn><mo>−</mo><mi>P</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>A</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mo>,</mo><mspace width=\"1.0em\"></mspace><mi>P</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>A</mi><mo>∪</mo><mi>B</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mo>=</mo><mi>P</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>A</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mo>+</mo><mi>P</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>B</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mo>−</mo><mi>P</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>A</mi><mo>∩</mo><mi>B</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">P(A^c)=1-P(A),\\quad P(A\\cup B)=P(A)+P(B)-P(A\\cap B)</annotation></semantics></math>.</p> <p><strong>Conditional paths</strong><br/> <math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>A</mi><mo>∣</mo><mi>B</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mo>=</mo><mfrac><mrow><mi>P</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>A</mi><mo>∩</mo><mi>B</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><mrow><mi>P</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>B</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">P(A\\mid B)=\\frac{P(A\\cap B)}{P(B)}</annotation></semantics></math><math display=\"block\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>A</mi><mo>∩</mo><mi>B</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mo>=</mo><mi>P</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>A</mi><mo>∣</mo><mi>B</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mi>P</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>B</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">P(A\\cap B)=P(A\\mid B)P(B)</annotation></semantics></math>. If the events are independent, the probability that both happen is the product of their separate probabilities. Mutually exclusive events cannot both happen.</p> <p><strong>Combining paths</strong><br/> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>A</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mo>=</mo><msub><mo>∑</mo><mi>j</mi></msub><mi>P</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mi>A</mi><mo>∣</mo><msub><mi>B</mi><mi>j</mi></msub><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mi>P</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><msub><mi>B</mi><mi>j</mi></msub><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">P(A)=\\sum_jP(A\\mid B_j)P(B_j)</annotation></semantics></math> This holds when the groups do not overlap and together cover every case. For independent trials <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mtext mathvariant=\"normal\">at least one</mtext><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mo>=</mo><mn>1</mn><mo>−</mo><msup><mrow><mo form=\"prefix\" stretchy=\"true\">(</mo><mn>1</mn><mo>−</mo><mi>p</mi><mo form=\"postfix\" stretchy=\"true\">)</mo></mrow><mi>n</mi></msup></mrow><annotation encoding=\"application/x-tex\">P(\\text{at least one})=1-(1-p)^n</annotation></semantics></math>. A simulation estimates a probability by the fraction of runs in which the event happens.</p>","<p><strong>Notation.</strong> <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>x</mi><mi>j</mi></msub><annotation encoding=\"application/x-tex\">x_j</annotation></semantics></math> is the value on a ticket and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>p</mi><mi>j</mi></msub><annotation encoding=\"application/x-tex\">p_j</annotation></semantics></math> is the chance of drawing it. <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>μ</mi><annotation encoding=\"application/x-tex\">\\mu</annotation></semantics></math> and <math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>σ</mi><annotation encoding=\"application/x-tex\">\\sigma</annotation></semantics></math> are the mean and <math display=\"inline\" xmlns=\"http://www.w3.org/19
